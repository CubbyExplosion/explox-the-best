<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explox — Connect Four</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  body { background:#0a0a1a; overflow:hidden; font-family:Arial,sans-serif; color:#fff; height:100vh; }

  .screen {
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    background:linear-gradient(135deg,#1a1a2e,#0f3460);
    padding:24px; z-index:50;
  }
  .screen h1 { font-size:2.1em; color:#e94560; letter-spacing:2px; margin-bottom:8px; text-shadow:0 0 20px #e94560; }
  .screen p { color:#aaa; margin-bottom:20px; font-size:0.95em; max-width:420px; line-height:1.55; }

  .actionBtn {
    padding:14px 38px; font-size:16px; font-weight:bold; min-height:44px;
    background:#e94560; border:none; border-radius:12px; color:#fff;
    cursor:pointer; letter-spacing:1px; box-shadow:0 0 16px #e9456066;
    margin:6px; transition:transform 0.1s;
  }
  .actionBtn:hover, .actionBtn:active { transform:scale(1.05); }
  .backBtn {
    padding:10px 26px; font-size:13px; background:transparent; min-height:44px;
    border:1px solid #555; border-radius:8px; color:#888; cursor:pointer;
    box-shadow:none; margin-top:14px;
  }
  .backBtn:hover, .backBtn:active { border-color:#e94560; color:#fff; }

  #gameScreen { position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:flex-start; padding:14px; }
  #statusText { font-size:18px; margin:10px 0 14px; min-height:26px; color:#fff; font-weight:bold; }

  #boardWrap { background:#16213e; border:2px solid #e94560; border-radius:14px; padding:10px; }
  #board {
    display:grid; position:relative;
    grid-template-columns:repeat(7, minmax(34px, 56px));
    grid-template-rows:repeat(6, minmax(34px, 56px));
    gap:4px;
  }
  .slot {
    background:#0d1730; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    position:relative; overflow:visible; cursor:pointer;
  }
  .col-hover { background:#1c2a4a; }
  .disc {
    width:86%; height:86%; border-radius:50%;
    box-shadow:inset 0 -4px 8px rgba(0,0,0,0.35), 0 0 6px rgba(0,0,0,0.5);
  }
  .disc.p1 { background:radial-gradient(circle at 35% 30%, #ff7a90, #e94560); }
  .disc.p2 { background:radial-gradient(circle at 35% 30%, #ffe680, #FFD700); }
  .disc.fall { animation:dropIn 0.45s cubic-bezier(.5,0,.75,0); }
  @keyframes dropIn { from { transform:translateY(-320px); } to { transform:translateY(0); } }
  .slot.win .disc { box-shadow:0 0 14px 4px #00e676, inset 0 -4px 8px rgba(0,0,0,0.35); }

  #resultTitle.win  { color:#00e676; text-shadow:0 0 20px #00e676; }
  #resultTitle.lose { color:#ff4444; text-shadow:0 0 20px #ff4444; }
  #resultTitle.draw { color:#FFD700; text-shadow:0 0 20px #FFD700; }
  #sipLine { color:#FFD700; font-size:1.3em; font-weight:bold; margin:8px 0; min-height:1.3em; }
</style>
</head>
<body>

<!-- START -->
<div id="startScreen" class="screen">
  <h1>🔴🟡 CONNECT FOUR</h1>
  <p>Drop discs into a column to stack them. Get 4 in a row — horizontal, vertical, or diagonal — before the AI does. Beat it to earn S.I.P.!</p>
  <button class="actionBtn" onclick="startGame()">▶ Start Game</button>
  <button class="backBtn" onclick="history.back()">← Back to City</button>
</div>

<!-- GAME -->
<div id="gameScreen">
  <div id="statusText">Your turn — tap a column</div>
  <div id="boardWrap"><div id="board"></div></div>
</div>

<!-- END -->
<div id="endScreen" class="screen" style="display:none">
  <h1 id="resultTitle">RESULT</h1>
  <div id="sipLine"></div>
  <div>
    <button class="actionBtn" onclick="startGame()">🔄 Play Again</button>
  </div>
  <button class="backBtn" onclick="history.back()">← Back to City</button>
</div>

<script>
// ── S.I.P. BRIDGE ──────────────────────────────────────────────────────────
function awardSip(amount) {
  try {
    const user = localStorage.getItem('explox_current_user');
    if(!user) return;
    const data = JSON.parse(localStorage.getItem('explox_user_' + user) || '{}');
    data.sip = (data.sip || 0) + amount;
    localStorage.setItem('explox_user_' + user, JSON.stringify(data));
  } catch(e) {}
}
const SIP_REWARD = 80;

// ── BOARD MODEL ───────────────────────────────────────────────────────────
const ROWS = 6, COLS = 7;
const PLAYER = 'P1', AI = 'P2';
let grid; // grid[row][col] = null | 'P1' | 'P2'   row 0 = top
let gameOver = false;
let playerTurn = true;
let busy = false; // true while a disc is animating / AI "thinking"

function newGrid() {
  const g = [];
  for(let r=0;r<ROWS;r++) g.push(Array(COLS).fill(null));
  return g;
}

function validCols(g) {
  const cols = [];
  for(let c=0;c<COLS;c++) if(g[0][c]===null) cols.push(c);
  return cols;
}

// drops `piece` into column c of grid g; returns the row it landed on, or -1 if full
function dropPiece(g, c, piece) {
  for(let r=ROWS-1;r>=0;r--) {
    if(g[r][c]===null) { g[r][c]=piece; return r; }
  }
  return -1;
}

function checkWin(g, piece) {
  // horizontal
  for(let r=0;r<ROWS;r++)
    for(let c=0;c<=COLS-4;c++)
      if(g[r][c]===piece && g[r][c+1]===piece && g[r][c+2]===piece && g[r][c+3]===piece)
        return [[r,c],[r,c+1],[r,c+2],[r,c+3]];
  // vertical
  for(let c=0;c<COLS;c++)
    for(let r=0;r<=ROWS-4;r++)
      if(g[r][c]===piece && g[r+1][c]===piece && g[r+2][c]===piece && g[r+3][c]===piece)
        return [[r,c],[r+1,c],[r+2,c],[r+3,c]];
  // diagonal down-right
  for(let r=0;r<=ROWS-4;r++)
    for(let c=0;c<=COLS-4;c++)
      if(g[r][c]===piece && g[r+1][c+1]===piece && g[r+2][c+2]===piece && g[r+3][c+3]===piece)
        return [[r,c],[r+1,c+1],[r+2,c+2],[r+3,c+3]];
  // diagonal up-right
  for(let r=3;r<ROWS;r++)
    for(let c=0;c<=COLS-4;c++)
      if(g[r][c]===piece && g[r-1][c+1]===piece && g[r-2][c+2]===piece && g[r-3][c+3]===piece)
        return [[r,c],[r-1,c+1],[r-2,c+2],[r-3,c+3]];
  return null;
}

function isFull(g) { return validCols(g).length === 0; }

// ── AI ────────────────────────────────────────────────────────────────────
function scoreWindow(window, piece) {
  const opp = piece === PLAYER ? AI : PLAYER;
  let score = 0;
  const pc = window.filter(x=>x===piece).length;
  const ec = window.filter(x=>x===null).length;
  const oc = window.filter(x=>x===opp).length;
  if(pc===4) score += 100;
  else if(pc===3 && ec===1) score += 5;
  else if(pc===2 && ec===2) score += 2;
  if(oc===3 && ec===1) score -= 4;
  return score;
}

function evaluate(g, piece) {
  let score = 0;
  // center column preference
  const centerCol = [];
  for(let r=0;r<ROWS;r++) centerCol.push(g[r][Math.floor(COLS/2)]);
  score += centerCol.filter(x=>x===piece).length * 3;
  // horizontal
  for(let r=0;r<ROWS;r++)
    for(let c=0;c<=COLS-4;c++)
      score += scoreWindow([g[r][c],g[r][c+1],g[r][c+2],g[r][c+3]], piece);
  // vertical
  for(let c=0;c<COLS;c++)
    for(let r=0;r<=ROWS-4;r++)
      score += scoreWindow([g[r][c],g[r+1][c],g[r+2][c],g[r+3][c]], piece);
  // diagonal down-right
  for(let r=0;r<=ROWS-4;r++)
    for(let c=0;c<=COLS-4;c++)
      score += scoreWindow([g[r][c],g[r+1][c+1],g[r+2][c+2],g[r+3][c+3]], piece);
  // diagonal up-right
  for(let r=3;r<ROWS;r++)
    for(let c=0;c<=COLS-4;c++)
      score += scoreWindow([g[r][c],g[r-1][c+1],g[r-2][c+2],g[r-3][c+3]], piece);
  return score;
}

function minimax(g, depth, alpha, beta, maximizing) {
  const cols = validCols(g);
  const aiWin = checkWin(g, AI);
  const plWin = checkWin(g, PLAYER);
  if(aiWin) return { col:null, score: 10000000 + depth };
  if(plWin) return { col:null, score: -10000000 - depth };
  if(cols.length===0 || depth===0) return { col:null, score: evaluate(g, AI) };

  if(maximizing) {
    let best = -Infinity, bestCol = cols[Math.floor(Math.random()*cols.length)];
    for(const c of cols) {
      const r = dropPiece(g, c, AI);
      const { score } = minimax(g, depth-1, alpha, beta, false);
      g[r][c] = null;
      if(score > best) { best = score; bestCol = c; }
      alpha = Math.max(alpha, best);
      if(alpha >= beta) break;
    }
    return { col:bestCol, score:best };
  } else {
    let best = Infinity, bestCol = cols[Math.floor(Math.random()*cols.length)];
    for(const c of cols) {
      const r = dropPiece(g, c, PLAYER);
      const { score } = minimax(g, depth-1, alpha, beta, true);
      g[r][c] = null;
      if(score < best) { best = score; bestCol = c; }
      beta = Math.min(beta, best);
      if(alpha >= beta) break;
    }
    return { col:bestCol, score:best };
  }
}

function aiChooseCol() {
  const cols = validCols(grid);
  // 1. immediate win
  for(const c of cols) {
    const r = dropPiece(grid, c, AI);
    const win = checkWin(grid, AI);
    grid[r][c] = null;
    if(win) return c;
  }
  // 2. block player's immediate win
  for(const c of cols) {
    const r = dropPiece(grid, c, PLAYER);
    const win = checkWin(grid, PLAYER);
    grid[r][c] = null;
    if(win) return c;
  }
  // 3. minimax with heuristic (depth 4 — strong but keeps the browser snappy)
  const { col } = minimax(grid, 4, -Infinity, Infinity, true);
  return col;
}

// ── RENDER ────────────────────────────────────────────────────────────────
function buildBoardDOM() {
  const el = document.getElementById('board');
  el.innerHTML = '';
  for(let r=0;r<ROWS;r++) {
    for(let c=0;c<COLS;c++) {
      const slot = document.createElement('div');
      slot.className = 'slot';
      slot.dataset.row = r;
      slot.dataset.col = c;
      slot.onclick = () => columnClick(c);
      el.appendChild(slot);
    }
  }
}

function slotEl(r,c) { return document.querySelector(`.slot[data-row="${r}"][data-col="${c}"]`); }

function placeDiscDOM(r, c, piece, animate) {
  const slot = slotEl(r,c);
  const disc = document.createElement('div');
  disc.className = 'disc ' + (piece===PLAYER ? 'p1' : 'p2') + (animate ? ' fall' : '');
  slot.appendChild(disc);
}

function highlightWin(cells) {
  cells.forEach(([r,c]) => { const s = slotEl(r,c); if(s) s.classList.add('win'); });
}

// ── FLOW ──────────────────────────────────────────────────────────────────
function startGame() {
  grid = newGrid();
  gameOver = false;
  playerTurn = true;
  busy = false;
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('endScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'flex';
  document.getElementById('statusText').textContent = 'Your turn — tap a column';
  buildBoardDOM();
}

function columnClick(c) {
  if(gameOver || !playerTurn || busy) return;
  const r = dropPiece(grid, c, PLAYER);
  if(r === -1) return; // column full
  placeDiscDOM(r, c, PLAYER, true);
  const win = checkWin(grid, PLAYER);
  if(win) { finishGame('win', win); return; }
  if(isFull(grid)) { finishGame('draw', null); return; }

  playerTurn = false;
  busy = true;
  document.getElementById('statusText').textContent = 'AI is thinking...';
  setTimeout(() => {
    const aiCol = aiChooseCol();
    const ar = dropPiece(grid, aiCol, AI);
    placeDiscDOM(ar, aiCol, AI, true);
    const win2 = checkWin(grid, AI);
    if(win2) { finishGame('lose', win2); return; }
    if(isFull(grid)) { finishGame('draw', null); return; }
    playerTurn = true;
    busy = false;
    document.getElementById('statusText').textContent = 'Your turn — tap a column';
  }, 500);
}

function finishGame(result, winCells) {
  gameOver = true;
  busy = false;
  if(winCells) highlightWin(winCells);
  const title = document.getElementById('resultTitle');
  title.classList.remove('win','lose','draw');
  let sipWon = 0;
  if(result === 'win') {
    title.textContent = '🏆 YOU WIN!'; title.classList.add('win');
    sipWon = SIP_REWARD; awardSip(sipWon);
  } else if(result === 'lose') {
    title.textContent = '💀 YOU LOSE'; title.classList.add('lose');
  } else {
    title.textContent = '🤝 DRAW'; title.classList.add('draw');
  }
  document.getElementById('sipLine').textContent = sipWon > 0 ? ('+' + sipWon + ' S.I.P.') : '';
  setTimeout(() => {
    document.getElementById('gameScreen').style.display = 'none';
    document.getElementById('endScreen').style.display = 'flex';
  }, 900);
}
</script>
</body>
</html>
