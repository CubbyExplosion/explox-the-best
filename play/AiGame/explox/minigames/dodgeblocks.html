<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explox — Dodge Blocks</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a1a; overflow:hidden; font-family:Arial,sans-serif; }
  canvas { display:block; touch-action:none; }
  #ui {
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; z-index:10;
    pointer-events:none;
  }
  #startScreen, #overScreen {
    background:rgba(10,10,26,0.92); border:2px solid #e94560;
    border-radius:18px; padding:30px 34px; text-align:center;
    max-width:360px; width:88%;
    pointer-events:auto;
  }
  #startScreen h1 { color:#e94560; font-size:1.9em; margin-bottom:8px; }
  #startScreen p { color:#aaa; margin-bottom:18px; font-size:0.92em; line-height:1.5; }
  #bestLine { color:#FFD700; font-weight:bold; margin-bottom:16px; }
  .bigBtn {
    padding:14px 40px; border:2px solid #e94560; border-radius:12px;
    background:#16213e; color:#fff; font-size:1.1em; cursor:pointer;
    transition:all 0.15s; min-height:48px; font-weight:bold;
  }
  .bigBtn:hover { background:#e94560; }
  .backBtn {
    display:block; margin:16px auto 0; padding:9px 24px; font-size:13px;
    background:transparent; border:1px solid #555; border-radius:8px;
    color:#888; cursor:pointer; min-height:40px;
  }
  .backBtn:hover { border-color:#e94560; color:#fff; }
  #overScreen { display:none; }
  #overScreen h1 { color:#ff4444; font-size:1.7em; margin-bottom:10px; }
  .scoreLine { color:#fff; font-size:1.2em; margin:6px 0; }
  .scoreLine b { color:#FFD700; }
  #newBest { color:#00e676; font-weight:bold; margin:6px 0 4px; display:none; }
  #sipEarned { color:#FFD700; font-size:1.25em; font-weight:bold; margin:10px 0 4px; }
  #savedNote { color:#666; font-size:11px; margin-bottom:16px; }

  #hud {
    position:fixed; top:14px; left:50%; transform:translateX(-50%);
    display:none; z-index:5; pointer-events:none;
    color:#FFD700; font-size:26px; font-weight:bold; text-shadow:0 0 8px rgba(0,0,0,0.6);
  }

  #touchControls { display:none; }
  @media (pointer: coarse) { #touchControls { display:block; } }
  .touchBtn {
    position:fixed; bottom:26px; width:70px; height:70px; border-radius:50%;
    background:rgba(255,255,255,0.12); border:2px solid rgba(255,255,255,0.4);
    color:#fff; font-size:28px; font-weight:bold; display:flex;
    align-items:center; justify-content:center; z-index:25;
    touch-action:none; user-select:none; pointer-events:auto;
  }
  #btnLeft { left:24px; }
  #btnRight { right:24px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">0.0s</div>
<div id="touchControls">
  <div class="touchBtn" id="btnLeft">◀️</div>
  <div class="touchBtn" id="btnRight">▶️</div>
</div>
<div id="ui">
  <div id="startScreen">
    <h1>🟥 DODGE BLOCKS</h1>
    <p>Move with ◀️▶️ / A-D / arrow keys, or drag. Survive the falling blocks as long as you can — they fall faster and more often the longer you last!</p>
    <div id="bestLine">🏆 Best: 0.0s</div>
    <button class="bigBtn" onclick="startGame()">▶ Start</button>
    <button class="backBtn" onclick="history.back()">← Back to City</button>
  </div>
  <div id="overScreen">
    <h1>💥 CRUSHED</h1>
    <div class="scoreLine">Survived: <b id="finalTime">0.0s</b></div>
    <div id="newBest">🌟 New Best!</div>
    <div class="scoreLine" style="font-size:0.85em;color:#aaa;">Best: <span id="finalBest">0.0s</span></div>
    <div id="sipEarned">+0 S.I.P.</div>
    <div id="savedNote">Saved to your Explox account!</div>
    <button class="bigBtn" onclick="startGame()">🔄 Play Again</button>
    <button class="backBtn" onclick="history.back()">← Back to City</button>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

// ── S.I.P. bridge (verbatim) ──────────────────────────────────────────────
function awardSip(amount) {
  try {
    const user = localStorage.getItem('explox_current_user');
    if(!user) return;
    const data = JSON.parse(localStorage.getItem('explox_user_' + user) || '{}');
    data.sip = (data.sip || 0) + amount;
    localStorage.setItem('explox_user_' + user, JSON.stringify(data));
  } catch(e) {}
}

// ── best time persistence ───────────────────────────────────────────────
const BEST_FIELD = 'dodgeblocks_best';
function loadBest() {
  try {
    const user = localStorage.getItem('explox_current_user');
    if(user) { const d = JSON.parse(localStorage.getItem('explox_user_'+user) || '{}'); return d[BEST_FIELD] || 0; }
    return parseFloat(localStorage.getItem(BEST_FIELD) || '0') || 0;
  } catch(e) { return 0; }
}
function saveBest(v) {
  try {
    const user = localStorage.getItem('explox_current_user');
    if(user) { const d = JSON.parse(localStorage.getItem('explox_user_'+user) || '{}'); d[BEST_FIELD] = v; localStorage.setItem('explox_user_'+user, JSON.stringify(d)); }
    else localStorage.setItem(BEST_FIELD, String(v));
  } catch(e) {}
}

// ── constants ──────────────────────────────────────────────────────────────
const PLAYER_W = 38, PLAYER_H = 38;
const PLAYER_SPEED = 7.5;
const PLAYER_BOTTOM_MARGIN = 34;

let running = false, player, blocks, elapsed = 0, spawnTimer = 0, animId, lastT = 0;
let keyLeft=false, keyRight=false, dragX=null;

function showScreen(id) {
  document.getElementById('startScreen').style.display = id==='start' ? 'block' : 'none';
  document.getElementById('overScreen').style.display   = id==='over'  ? 'block' : 'none';
  document.getElementById('hud').style.display           = id==='game'  ? 'block' : 'none';
}
function refreshBestLine() { document.getElementById('bestLine').textContent = '🏆 Best: ' + loadBest().toFixed(1) + 's'; }

function startGame() {
  player = { x: canvas.width/2 - PLAYER_W/2, y: canvas.height - PLAYER_BOTTOM_MARGIN - PLAYER_H, w: PLAYER_W, h: PLAYER_H };
  blocks = [];
  elapsed = 0; spawnTimer = 0;
  running = true;
  showScreen('game');
  lastT = 0;
  if (animId) cancelAnimationFrame(animId);
  animId = requestAnimationFrame(loop);
}

// ── difficulty curve — real, driven by elapsed survival time ────────────────
function spawnIntervalMs(t) { return Math.max(220, 850 - t * 16); }
function blockSpeed(t) { return Math.min(11, 2.6 + t * 0.16); }

document.addEventListener('keydown', e => {
  if (e.code==='ArrowLeft'||e.code==='KeyA') keyLeft = true;
  if (e.code==='ArrowRight'||e.code==='KeyD') keyRight = true;
});
document.addEventListener('keyup', e => {
  if (e.code==='ArrowLeft'||e.code==='KeyA') keyLeft = false;
  if (e.code==='ArrowRight'||e.code==='KeyD') keyRight = false;
});
canvas.addEventListener('pointerdown', e => { dragX = e.clientX; });
canvas.addEventListener('pointermove', e => { if (dragX !== null) dragX = e.clientX; });
window.addEventListener('pointerup', () => { dragX = null; });

function bindHold(el, onDown, onUp) {
  if (!el) return;
  el.addEventListener('touchstart', e => { e.preventDefault(); onDown(); }, {passive:false});
  el.addEventListener('touchend',   e => { e.preventDefault(); onUp(); }, {passive:false});
  el.addEventListener('touchcancel',e => { e.preventDefault(); onUp(); }, {passive:false});
  el.addEventListener('mousedown', onDown);
  el.addEventListener('mouseup', onUp);
  el.addEventListener('mouseleave', onUp);
}
bindHold(document.getElementById('btnLeft'),  ()=>keyLeft=true,  ()=>keyLeft=false);
bindHold(document.getElementById('btnRight'), ()=>keyRight=true, ()=>keyRight=false);

function spawnBlock() {
  const w = 26 + Math.random()*40;
  const x = Math.random() * (canvas.width - w);
  blocks.push({ x, y:-40, w, h: 26 + Math.random()*20 });
}

function overlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function loop(t) {
  if (!running) return;
  const dt = lastT ? Math.min((t-lastT)/16.67, 2.5) : 1;
  lastT = t;
  elapsed += dt * 16.67/1000;

  // player movement
  if (dragX !== null) {
    player.x += Math.max(-PLAYER_SPEED*dt, Math.min(PLAYER_SPEED*dt, dragX - (player.x+PLAYER_W/2)));
  }
  if (keyLeft) player.x -= PLAYER_SPEED*dt;
  if (keyRight) player.x += PLAYER_SPEED*dt;
  player.x = Math.max(0, Math.min(canvas.width - PLAYER_W, player.x));

  // spawn
  spawnTimer -= dt*16.67;
  if (spawnTimer <= 0) {
    spawnBlock();
    spawnTimer = spawnIntervalMs(elapsed) * (0.7 + Math.random()*0.6);
  }

  // move blocks + real AABB collision + cleanup
  const speed = blockSpeed(elapsed);
  for (const b of blocks) b.y += speed * dt;
  blocks = blocks.filter(b => b.y < canvas.height + 60);

  for (const b of blocks) {
    if (overlap(player, b)) { die(); return; }
  }

  draw(speed);
  document.getElementById('hud').textContent = elapsed.toFixed(1) + 's';
  animId = requestAnimationFrame(loop);
}

function draw(speed) {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0a0a1a'); bg.addColorStop(1,'#150f2e');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  // floor line
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.beginPath(); ctx.moveTo(0, H-14); ctx.lineTo(W, H-14); ctx.stroke();

  // blocks
  for (const b of blocks) {
    ctx.fillStyle = '#e94560';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = '#ff8888'; ctx.lineWidth = 2;
    ctx.strokeRect(b.x+1, b.y+1, b.w-2, b.h-2);
  }

  // player
  ctx.fillStyle = '#00c8ff';
  ctx.beginPath();
  ctx.roundRect(player.x, player.y, PLAYER_W, PLAYER_H, 8);
  ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.arc(player.x+13, player.y+15, 3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(player.x+25, player.y+15, 3, 0, Math.PI*2); ctx.fill();
}

function die() {
  running = false;
  if (animId) cancelAnimationFrame(animId);

  const best = loadBest();
  const isNew = elapsed > best;
  if (isNew) saveBest(elapsed);

  const sip = Math.max(15, Math.min(200, Math.round(elapsed * 6) + 15));
  awardSip(sip);

  document.getElementById('finalTime').textContent = elapsed.toFixed(1) + 's';
  document.getElementById('finalBest').textContent = (isNew ? elapsed : best).toFixed(1) + 's';
  document.getElementById('newBest').style.display = isNew ? 'block' : 'none';
  document.getElementById('sipEarned').textContent = '+' + sip + ' S.I.P.';
  draw(blockSpeed(elapsed));
  showScreen('over');
}

refreshBestLine();
(function() { ctx.fillStyle = '#0a0a1a'; ctx.fillRect(0,0,canvas.width,canvas.height); })();
</script>
</body>
</html>
