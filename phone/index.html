<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>S.I.P. Phone</title>
<style>
:root{--text:#fff;--accent:#ffcd30}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--text);font:16px system-ui,"Segoe UI",sans-serif;user-select:none}
#phone{position:fixed;inset:0;display:flex;flex-direction:column;background:linear-gradient(160deg,#2a1a5a,#1a2a6a 55%,#1a3a5a);overflow:hidden}
#status{height:30px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:13px;font-weight:700;z-index:50}
#home{flex:1;position:relative;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;z-index:0}
#shade{position:absolute;inset:0;background:linear-gradient(180deg,#0a0e2099 0%,#0a0e2033 30%,#0a0e2066 100%);z-index:1}
#grid{position:absolute;inset:0;padding:22px 18px 10px;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:min-content;gap:16px 8px;align-content:start;z-index:2}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.app .ico{width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:31px;background:linear-gradient(145deg,#ffffff30,#ffffff12);box-shadow:0 4px 12px #0006;border:1px solid #ffffff33}
.app .lbl{font-size:11.5px;text-align:center;line-height:1.1;text-shadow:0 1px 4px #000}
.app:active .ico{transform:scale(.9);transition:.08s}
#dock{flex:0 0 auto;margin:8px 12px 14px;padding:10px;background:#ffffff1f;backdrop-filter:blur(8px);border-radius:24px;display:flex;justify-content:space-around;border:1px solid #ffffff33;z-index:2}
#dock .app .lbl{display:none}
#app{position:fixed;inset:0;display:none;flex-direction:column;background:#0b0e1a;z-index:200}
#appbar{height:46px;flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:0 10px;background:#141a33}
#appbar .nm{flex:1;font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#appbar button{border:0;background:#ffffff18;color:#fff;border-radius:10px;padding:8px 12px;font-size:15px;cursor:pointer}
#appframe{flex:1;border:0;width:100%;background:#000}
#navbar{height:40px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:#0b0e1a}
#homebtn{width:120px;height:6px;border-radius:4px;background:#ffffff66;cursor:pointer}
#lock{position:fixed;inset:0;z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;background:#120c3a;overflow:hidden}
#lockpat{position:absolute;inset:0;opacity:.10;z-index:0}
#lockin{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;width:100%;height:100%;padding-top:6vh}
#lock .lt{font-size:50px;font-weight:800;font-variant-numeric:tabular-nums}
#lock .ld{font-size:15px;opacity:.85;margin-bottom:10px}
#lock img.lg{width:54px;margin-bottom:4px}
#msg{font-size:15px;font-weight:700;min-height:22px;margin:6px 0}
#dots{display:flex;gap:16px;margin:6px 0 12px}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid #ffffffaa}
.dot.on{background:var(--accent);border-color:var(--accent)}
#pad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:2px}
.key{width:64px;height:64px;border-radius:50%;background:#ffffff1c;border:1px solid #ffffff2e;color:#fff;font-size:25px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center}
.key:active{background:#ffffff3a}
.key.wide{font-size:14px}
.shake{animation:sh .4s}
@keyframes sh{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
#dots{flex-wrap:wrap;justify-content:center;max-width:280px}
.dot{width:14px;height:14px}
#forgot{font-size:13px;opacity:.75;margin-top:10px;cursor:pointer;text-decoration:underline}
.key.ok{background:#2ea06b;border-color:#2ea06b}.key.ok:active{background:#38c884}
#settings{position:fixed;inset:0;display:none;flex-direction:column;background:#10152e;z-index:300}
#setbar{height:46px;flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:0 12px;background:#141a33;font-weight:700}
#setbar button{border:0;background:#ffffff18;color:#fff;border-radius:10px;padding:8px 12px;font-size:15px;cursor:pointer}
#setbody{flex:1;overflow:auto;padding:16px}
#setbody h3{margin:8px 2px 10px;font-size:15px;color:#9fb0ff}
#walls{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.wp{aspect-ratio:9/16;border-radius:14px;cursor:pointer;position:relative;overflow:hidden;border:2px solid #ffffff20;display:flex;align-items:flex-end}
.wp.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.wp span{width:100%;background:#000a;font-size:11px;padding:4px 6px;text-align:center}
.wp .chk{position:absolute;top:6px;right:6px;font-size:16px;display:none}
.wp.sel .chk{display:block}
.setbtn{background:#2e7bd6;border:0;color:#fff;padding:12px 16px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px}
</style></head><body>

 <div id="status"><span id="stime">9:41</span><span>S.I.P. &nbsp;📶 🔋</span></div>

const WALLS=[{n:'Hero vs Boss',boss:1}];
const names=['Sunset','Ocean','Space','Candy','Forest','Lava','Rainbow','Gold','Mint','Berry','Sky','Peach','Grape','Fire','Ice','Night','Lime','Rose','Aqua','Plum'];
for(let i=1;i<100;i++){const h1=(i*37)%360,h2=(h1+40+ (i*13)%120)%360;const style=i%3;let css;
 if(style===0)css='linear-gradient(160deg,hsl('+h1+' 70% 45%),hsl('+h2+' 75% 25%))';
 else if(style===1)css='radial-gradient(circle at 50% 25%,hsl('+h1+' 80% 55%),hsl('+h2+' 70% 20%))';
 else css='linear-gradient(135deg,hsl('+h1+' 65% 40%),hsl('+((h1+180)%360)+' 60% 35%),hsl('+h2+' 70% 22%))';
 WALLS.push({n:names[(i-1)%names.length]+' '+Math.ceil(i/names.length),css});}
let curWall=0;try{curWall=Math.min(WALLS.length-1,Math.max(0,parseInt(localStorage.getItem('sip_phone_wall')||'0',10)||0));}catch(e){}
function applyWall(i){curWall=i;try{localStorage.setItem('sip_phone_wall',String(i));}catch(e){}const w=WALLS[i];const sc=document.getElementById('scene'),home=document.getElementById('home');
 if(w.boss){sc.style.display='';home.style.background='';}else{sc.style.display='none';home.style.background=w.css;}}
applyWall(curWall);

function drawPattern(){const c=document.getElementById('lockpat');const dpr=window.devicePixelRatio||1;c.width=innerWidth*dpr;c.height=innerHeight*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);x.clearRect(0,0,innerWidth,innerHeight);x.font='700 26px system-ui';x.fillStyle='#ffffff';const sx=90,sy=70;for(let r=0;r*sy<innerHeight+sy;r++){for(let col=0;col*sx<innerWidth+sx;col++){const ox=(r%2)*sx/2;x.save();x.translate(col*sx+ox,r*sy);x.rotate(-0.35);x.fillText('S.I.P.',0,0);x.restore();}}}
drawPattern();addEventListener('resize',drawPattern);
/* ===== passcode ===== */
let PASS='',entry='',confirmPass='',mode='enter';
try{PASS=localStorage.getItem('sip_phone_pass')||'';}catch(e){}
if(!PASS)mode='set';
const msg=document.getElementById('msg'),dotsEl=document.getElementById('dots'),pad=document.getElementById('pad');
function renderDots(){dotsEl.innerHTML='';const n=Math.max(entry.length,0);for(let i=0;i<n;i++){const d=document.createElement('div');d.className='dot on';dotsEl.appendChild(d);}}
function setMsg(){msg.textContent=mode==='set'?'Make a passcode (4 to 10 digits)':mode==='confirm'?'Type it again, then ✓':'Enter passcode, then ✓';}
function unlock(){document.getElementById('lock').style.display='none';}
function shake(){const el=document.getElementById('lockin');el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),400);}
function press(k){
 if(k==='del'){entry=entry.slice(0,-1);renderDots();return;}
 if(entry.length>=10)return;entry+=k;renderDots();
}
function submit(){
 if(entry.length<4){msg.textContent='Use at least 4 digits';shake();return;}
 if(mode==='set'){confirmPass=entry;entry='';mode='confirm';setMsg();renderDots();}
 else if(mode==='confirm'){if(entry===confirmPass){try{localStorage.setItem('sip_phone_pass',entry);}catch(e){}PASS=entry;unlock();}else{msg.textContent='Did not match, start again';entry='';confirmPass='';mode='set';renderDots();shake();}}
 else{if(entry===PASS){unlock();}else{msg.textContent='Wrong passcode';entry='';renderDots();shake();}}
}
['1','2','3','4','5','6','7','8','9'].forEach(n=>{const b=document.createElement('button');b.className='key';b.textContent=n;b.onclick=()=>press(n);pad.appendChild(b);});
const del=document.createElement('button');del.className='key';del.textContent='⌫';del.onclick=()=>press('del');pad.appendChild(del);
