<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Inbox (private)</title>
<style>
  body { margin:0; font-family:system-ui, Arial, sans-serif; background:#0e1424; color:#eef2ff; line-height:1.5; }
  .wrap { max-width:760px; margin:0 auto; padding:20px 16px 60px; }
  h1 { margin:0 0 4px; } .muted { color:#a6b1d6; font-size:.9rem; }
  input[type=password] { padding:11px 12px; border-radius:10px; border:1px solid #ffffff26; background:#18213a; color:#fff; font:inherit; width:min(320px, 100%); }
  button { border:0; border-radius:10px; padding:10px 16px; font-weight:700; cursor:pointer; background:#ffb020; color:#111; font:inherit; font-weight:700; }
  button.del { background:#ff6b6b; color:#fff; padding:6px 12px; font-size:.85rem; }
  .msg { background:#18213a; border:1px solid #ffffff14; border-radius:14px; padding:14px; margin:14px 0; }
  .meta { display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; color:#a6b1d6; font-size:.85rem; margin-bottom:6px; }
  .text { white-space:pre-wrap; word-break:break-word; }
  .ph { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .ph img { max-width:100%; max-height:260px; border-radius:10px; cursor:zoom-in; border:1px solid #ffffff26; }
  #err { color:#ff6b6b; font-weight:700; min-height:1.4em; }
</style>
</head>
<body><div class="wrap">
  <h1>📥 Private inbox</h1>
  <p class="muted">Only you can open this. Enter your owner key (the CONTACT_OWNER_KEY you set on the server).</p>
  <div id="login"><input type="password" id="key" placeholder="Owner key" autocomplete="current-password"> <button id="go">Open</button><div id="err"></div></div>
  <div id="box" hidden>
    <p><button id="refresh">↻ Refresh</button> <button id="lock" class="del">🔒 Lock</button> <span class="muted" id="count"></span></p>
    <div id="list"></div>
  </div>
</div>
<script>
const API = 'https://explox-server.onrender.com';
const $ = id => document.getElementById(id);
let KEY = '';
async function post(path, body) {
  const r = await fetch(API + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  return { status: r.status, json: await r.json().catch(() => ({})) };
}
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }   // textContent only: visitor text is never run as HTML
async function load() {
  $('err').textContent = 'Loading… (the server may take a minute to wake up)';
  try {
    const { status, json } = await post('/api/contact/inbox', { key: KEY });
    if (!json.ok) { $('err').textContent = json.error || 'Could not open the inbox.'; if (status === 403) KEY = ''; return false; }
    $('err').textContent = ''; $('login').hidden = true; $('box').hidden = false;
    const list = $('list'); list.innerHTML = ''; $('count').textContent = json.messages.length + ' message' + (json.messages.length === 1 ? '' : 's');
    if (!json.messages.length) list.append(el('p', 'muted', 'No messages yet.'));
    json.messages.forEach(m => {
      const card = el('div', 'msg'), meta = el('div', 'meta');
      meta.append(el('span', '', (m.name || 'Anonymous') + (m.reply ? ' · reply: ' + m.reply : '')), el('span', '', new Date(m.at).toLocaleString()));
      card.append(meta, el('div', 'text', m.message));
      if (m.photos && m.photos.length) {
        const ph = el('div', 'ph');
        m.photos.forEach(src => { if (!/^data:image\/(jpeg|png|webp|gif);base64,/.test(src)) return; const im = new Image(); im.src = src; im.alt = 'photo'; im.onclick = () => window.open().document.write('<img src="' + src + '" style="max-width:100%">'); ph.append(im); });
        card.append(ph);
      }
      (m.replies || []).forEach(rp => { const r = el('div', 'text', '↩ You (' + new Date(rp.at).toLocaleString() + '): ' + rp.text); r.style.cssText = 'background:#0e1424; border-left:3px solid #3ddc84; padding:8px 10px; margin-top:8px; border-radius:8px;'; card.append(r); });
      const box = el('div'); box.style.cssText = 'margin-top:10px; display:grid; gap:6px;';
      const ta = document.createElement('textarea'); ta.placeholder = 'Write a reply…'; ta.maxLength = 2000; ta.style.cssText = 'width:100%; min-height:70px; padding:10px; border-radius:10px; border:1px solid #ffffff26; background:#0e1424; color:#fff; font:inherit; box-sizing:border-box;';
      const note = el('div', 'muted', m.hasTicket === false ? '' : 'The sender can read your reply on the website with their private code (messages sent before this feature have no code).');
      const sb = el('button', '', '↩ Send reply'); sb.style.justifySelf = 'start';
      sb.onclick = async () => { const text = ta.value.trim(); if (!text) return; sb.disabled = true; const { json } = await post('/api/contact/reply', { key: KEY, id: m.id, text }); if (json.ok) load(); else { alert(json.error || 'Could not send the reply.'); sb.disabled = false; } };
      box.append(ta, sb, note); card.append(box);
      const d = el('button', 'del', '🗑 Delete'); d.style.marginTop = '10px';
      d.onclick = async () => { if (!confirm('Delete this message for good?')) return; await post('/api/contact/delete', { key: KEY, id: m.id }); load(); };
      card.append(d); list.append(card);
    });
    return true;
  } catch (e) { $('err').textContent = 'Could not reach the server. Try again in a minute.'; return false; }
}
$('go').onclick = () => { KEY = $('key').value; $('key').value = ''; if (KEY) load(); };
$('key').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });
$('refresh').onclick = load;
$('lock').onclick = () => { KEY = ''; $('box').hidden = true; $('login').hidden = false; $('list').innerHTML = ''; };
</script></body></html>
