<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EXGUN — My Explox Tesla Tank (3D model)</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<style>
:root{--bg:#10152e;--text:#eef2ff;--accent:#ffcd30}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px system-ui,"Segoe UI",sans-serif;overflow:hidden;user-select:none}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column}
#top{padding:10px 14px;text-align:center}
#top h1{margin:0;font-size:18px}#top .m{font-size:12px;color:#9fb0ff}
canvas{flex:1;width:100%;display:block;touch-action:none;cursor:grab}
#bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px}
button{background:var(--accent);color:#1a1a1a;border:0;border-radius:10px;padding:10px 16px;font-weight:800;cursor:pointer}
button.alt{background:#2e7bd6;color:#fff}
</style></head><body>
<div id="wrap">
 <div id="top"><h1>⚡ My Explox Tesla Tank</h1><div class="m">Drag to spin · scroll to zoom · open socket on top — drop in your own Explox figure (print it 2.5 cm wide × 6 cm tall). Tank prints 185 mm long, 115 mm wide, 106 mm tall.</div></div>
 <canvas id="cv"></canvas>
 <div id="bar">
  <button id="spin">⏸ Pause spin</button>
  <button class="alt" id="dl">⬇ Download 3D model (STL)</button>
 </div>
</div>
<script>
const cv=document.getElementById('cv'),cx=cv.getContext('2d');
// colours
const HULL='#5a6b45', CAMO2='#3a4630', TRACK='#1c1c1f', STEEL='#55595e', DARK='#14141c',
      COPPER='#b5632a', INSUL='#24242a', ORB='#9fe0ff', SKIN='#f0c9b0', SHIRT='#2f6fd6',
      EYE='#1a1a1a', HAT='#d8352e', LAMP='#fff2c0';
// geometry stores
const boxes=[];                                 // [cx,cy,cz,w,h,d,col]
const cyls=[];                                  // {x,y,z,r,h,axis,col}
const cones=[];                                 // {cx,cy,cz,r,h,seg,col}
function B(x,y,z,w,h,d,c){boxes.push([x,y,z,w,h,d,c]);}
function C(x,y,z,r,h,axis,c){cyls.push({x,y,z,r,h,axis,col:c});}
function CONE(cx,cy,cz,r,h,c){cones.push({cx,cy,cz,r,h,seg:16,col:c});}

// ───────── build the tank (y up, flat bottom at y=0 so it stands & prints) ─────────
// tracks (ground contact) + road wheels
[-1,1].forEach(s=>{
  B(s*2.25,0.65,0, 1.1,1.3,7.6, TRACK);                            // track block
  B(s*2.25,1.4,0, 1.25,0.25,6.6, STEEL);                           // fender over the track
  for(let i=0;i<6;i++) C(s*2.25,0.6,-2.6+i*1.04, 0.56,1.12,'x', STEEL);   // road wheels
  C(s*2.25,0.8,3.5,0.6,1.12,'x',DARK); C(s*2.25,0.8,-3.5,0.6,1.12,'x',DARK);  // drive sprockets
  B(s*1.0,1.5,3.35, 0.4,0.4,0.1, LAMP);                            // head-lamp
});
// hull
B(0,1.55,0, 4.0,1.4,6.4, HULL);                                    // main hull
B(0,2.15,2.6, 3.6,0.7,1.5, HULL);                                  // front glacis block
for(let i=0;i<5;i++) B(0,2.3,-3.1+i*0.3, 3.2,0.06,0.14, STEEL);    // rear engine grille slats
B(1.3,2.35,-2.3, 0.9,0.5,1.0, CAMO2); B(-1.3,2.35,-2.3, 0.7,0.45,0.9, CAMO2);  // stowage bins

// ───────── turret (sits on the hull) ─────────
B(0,3.05,-0.2, 3.0,1.1,3.2, HULL);                                 // turret body
B(0,3.75,-0.2, 2.2,0.4,2.0, HULL);                                 // turret roof
B(0,3.05,1.5, 1.5,0.95,0.7, STEEL);                                // gun mantlet
C(-0.9,4.1,-0.2,0.5,0.35,'y',DARK); C(-0.9,4.5,-0.2,0.08,0.6,'y',DARK);   // commander cupola + antenna
B(0,3.1,-1.8, 2.2,0.5,0.7, CAMO2);                                 // turret rear stowage
// gun barrel + muzzle brake
C(0,3.05,3.1,0.22,3.2,'z',DARK); C(0,3.05,4.85,0.3,0.55,'z',STEEL);

// ───────── ⚡ twin tesla coils (rear of turret) ─────────
[-1,1].forEach(s=>{
  C(s*0.95,3.6,-1.5, 0.3,0.3,'y', INSUL);                          // base insulator
  C(s*0.95,4.2,-1.5, 0.22,1.0,'y', COPPER);                        // copper coil
  C(s*0.95,4.8,-1.5, 0.34,0.16,'y', INSUL);                        // top plate
  C(s*0.95,5.1,-1.5, 0.3,0.38,'y', ORB);                           // spark ball
});

// ───────── 🕳️ open SOCKET to drop your own Explox character into ─────────
// Exported scale: 1 unit = 20 mm.  Inner opening 1.35 u = 27 mm wide (fits a 25 mm / 2.5 cm figure
// with clearance).  Floor at y≈3.2, rim at y≈4.5, so the well is ~26 mm deep and holds the figure's feet.
const SKX=0, SKZ=0.2;                                              // socket centre on the turret
B(SKX,3.25,SKZ, 1.75,0.2,1.75, DARK);                             // socket floor
[[0,0.775,1.75,0.2],[0,-0.775,1.75,0.2],[0.775,0,0.2,1.35],[-0.775,0,0.2,1.35]].forEach(w=>
  B(SKX+w[0],3.85,SKZ+w[1], w[2],1.3,w[3], DARK));                // four socket walls (open top)
[[0,0.95,2.05,0.3],[0,-0.95,2.05,0.3],[0.95,0,0.3,1.4],[-0.95,0,0.3,1.4]].forEach(r=>
  B(SKX+r[0],4.55,SKZ+r[1], r[2],0.14,r[3], STEEL));              // open rim frame around the hole (top stays clear)

// ───────── render ─────────
let yaw=Math.PI*0.85,pitch=-0.12,zoom=0.72,spin=true,W,H;
function resize(){W=cv.width=cv.clientWidth*devicePixelRatio;H=cv.height=cv.clientHeight*devicePixelRatio;}
addEventListener('resize',resize);resize();
function rot(p){let[x,y,z]=p;let co=Math.cos(yaw),si=Math.sin(yaw);let x1=x*co+z*si,z1=-x*si+z*co;let cp=Math.cos(pitch),sp=Math.sin(pitch);let y1=y*cp-z1*sp,z2=y*sp+z1*cp;return[x1,y1,z2];}
function proj(p){const f=560*zoom*devicePixelRatio;const d=14;const s=f/(d+p[2]);return[W/2+p[0]*s, H/2 - (p[1]-2.9)*s, p[2]];}
function shade(c,f){const r=parseInt(c.slice(1,3),16),g=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16);const k=Math.max(0,Math.min(1,f));return'rgb('+(r*k|0)+','+(g*k|0)+','+(b*k|0)+')';}
const LP=[0.4,0.9,0.5], LL=Math.hypot(...LP);
function norm(a,b,c){const u=[b[0]-a[0],b[1]-a[1],b[2]-a[2]],v=[c[0]-a[0],c[1]-a[1],c[2]-a[2]];let n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]];const l=Math.hypot(...n)||1;return[n[0]/l,n[1]/l,n[2]/l];}
function litOf(n){return 0.5+0.5*Math.max(0,(n[0]*LP[0]+n[1]*LP[1]+n[2]*LP[2])/LL);}
function cylVerts(s){const seg=16,top=[],bot=[],r=s.r,h=s.h,ax=s.axis||'y';
 for(let i=0;i<seg;i++){const a=i/seg*2*Math.PI,dx=Math.cos(a)*r,dy=Math.sin(a)*r;
  if(ax==='y'){bot.push([s.x+dx,s.y-h/2,s.z+dy]);top.push([s.x+dx,s.y+h/2,s.z+dy]);}
  else if(ax==='x'){bot.push([s.x-h/2,s.y+dx,s.z+dy]);top.push([s.x+h/2,s.y+dx,s.z+dy]);}
  else{bot.push([s.x+dx,s.y+dy,s.z-h/2]);top.push([s.x+dx,s.y+dy,s.z+h/2]);}}
 let cB,cT; if(ax==='y'){cB=[s.x,s.y-h/2,s.z];cT=[s.x,s.y+h/2,s.z];}
 else if(ax==='x'){cB=[s.x-h/2,s.y,s.z];cT=[s.x+h/2,s.y,s.z];}
 else{cB=[s.x,s.y,s.z-h/2];cT=[s.x,s.y,s.z+h/2];}
 return{top,bot,cB,cT,seg};}
function pushPoly(F,pts,col){F.push({pts,col,lit:litOf(norm(pts[0],pts[1],pts[2]))});}
function faces(){
 const F=[];
 for(const bx of boxes){const[Cx,Cy,Cz,w,h,d,col]=bx;const hx=w/2,hy=h/2,hz=d/2;
  const v=[[Cx-hx,Cy-hy,Cz-hz],[Cx+hx,Cy-hy,Cz-hz],[Cx+hx,Cy+hy,Cz-hz],[Cx-hx,Cy+hy,Cz-hz],[Cx-hx,Cy-hy,Cz+hz],[Cx+hx,Cy-hy,Cz+hz],[Cx+hx,Cy+hy,Cz+hz],[Cx-hx,Cy+hy,Cz+hz]];
  const fc=[[0,1,2,3,[0,0,-1]],[5,4,7,6,[0,0,1]],[4,0,3,7,[-1,0,0]],[1,5,6,2,[1,0,0]],[3,2,6,7,[0,1,0]],[4,5,1,0,[0,-1,0]]];
  for(const f of fc){const n=f[4];F.push({pts:[v[f[0]],v[f[1]],v[f[2]],v[f[3]]],col,lit:litOf(n)});}}
 for(const s of cyls){const g=cylVerts(s);for(let i=0;i<g.seg;i++){const j=(i+1)%g.seg;pushPoly(F,[g.bot[i],g.bot[j],g.top[j],g.top[i]],s.col);}pushPoly(F,g.top.slice(),s.col);pushPoly(F,g.bot.slice().reverse(),s.col);}
 for(const k of cones){const apex=[k.cx,k.cy+k.h,k.cz];for(let i=0;i<k.seg;i++){const a0=i/k.seg*2*Math.PI,a1=(i+1)/k.seg*2*Math.PI;const p0=[k.cx+Math.cos(a0)*k.r,k.cy,k.cz+Math.sin(a0)*k.r],p1=[k.cx+Math.cos(a1)*k.r,k.cy,k.cz+Math.sin(a1)*k.r];pushPoly(F,[apex,p0,p1],k.col);}}
 return F;
}
function draw(){
 cx.clearRect(0,0,W,H);
 const F=faces().map(f=>{const r=f.pts.map(rot);const pr=r.map(proj);const z=r.reduce((s,p)=>s+p[2],0)/r.length;return{pr,z,col:f.col,lit:f.lit};});
 F.sort((a,b)=>b.z-a.z);
 for(const f of F){cx.beginPath();cx.moveTo(f.pr[0][0],f.pr[0][1]);for(let i=1;i<f.pr.length;i++)cx.lineTo(f.pr[i][0],f.pr[i][1]);cx.closePath();cx.fillStyle=shade(f.col,f.lit);cx.fill();}
}
function loop(){if(spin)yaw+=0.012;draw();requestAnimationFrame(loop);}
loop();
let drag=false,lx,ly;
cv.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;spin=false;document.getElementById('spin').textContent='▶ Spin';cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-lx)*0.01;pitch=Math.max(-1.2,Math.min(1.2,pitch+(e.clientY-ly)*0.01));lx=e.clientX;ly=e.clientY;});
cv.addEventListener('pointerup',()=>drag=false);
cv.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(0.3,Math.min(3,zoom*(e.deltaY<0?1.1:0.9)));},{passive:false});
document.getElementById('spin').onclick=function(){spin=!spin;this.textContent=spin?'⏸ Pause spin':'▶ Spin';};

// ───────── STL export (binary, watertight) ─────────
function buildSTL(){
 const tris=[];
 function tri(a,b,c){const u=[b[0]-a[0],b[1]-a[1],b[2]-a[2]],v=[c[0]-a[0],c[1]-a[1],c[2]-a[2]];let n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]];const l=Math.hypot(...n)||1;n=[n[0]/l,n[1]/l,n[2]/l];tris.push([n,a,b,c]);}
 function quad(a,b,c,d){tri(a,b,c);tri(a,c,d);}
 for(const bx of boxes){const[Cx,Cy,Cz,w,h,d]=bx;const hx=w/2,hy=h/2,hz=d/2;
  const v=[[Cx-hx,Cy-hy,Cz-hz],[Cx+hx,Cy-hy,Cz-hz],[Cx+hx,Cy+hy,Cz-hz],[Cx-hx,Cy+hy,Cz-hz],[Cx-hx,Cy-hy,Cz+hz],[Cx+hx,Cy-hy,Cz+hz],[Cx+hx,Cy+hy,Cz+hz],[Cx-hx,Cy+hy,Cz+hz]];
  quad(v[0],v[3],v[2],v[1]);quad(v[4],v[5],v[6],v[7]);quad(v[0],v[4],v[7],v[3]);quad(v[1],v[2],v[6],v[5]);quad(v[3],v[7],v[6],v[2]);quad(v[0],v[1],v[5],v[4]);}
 for(const s of cyls){const g=cylVerts(s);for(let i=0;i<g.seg;i++){const j=(i+1)%g.seg;quad(g.bot[i],g.bot[j],g.top[j],g.top[i]);tri(g.cT,g.top[i],g.top[j]);tri(g.cB,g.bot[j],g.bot[i]);}}
 for(const k of cones){const apex=[k.cx,k.cy+k.h,k.cz],cp=[];for(let i=0;i<k.seg;i++){const a=i/k.seg*2*Math.PI;cp.push([k.cx+Math.cos(a)*k.r,k.cy,k.cz+Math.sin(a)*k.r]);}for(let i=0;i<k.seg;i++){const p0=cp[i],p1=cp[(i+1)%k.seg];tri(apex,p0,p1);tri([k.cx,k.cy,k.cz],p1,p0);}}
 const buf=new ArrayBuffer(84+tris.length*50);const dv=new DataView(buf);let o=84;dv.setUint32(80,tris.length,true);
 const SC=20;   // 1 model unit = 20 mm  → socket opening 27 mm, tank ~15 cm long, 8 cm wide
 for(const t of tris){const[n,a,b,c]=t;const putN=(p)=>{dv.setFloat32(o,p[0],true);dv.setFloat32(o+4,p[1],true);dv.setFloat32(o+8,p[2],true);o+=12;};const put=(p)=>{dv.setFloat32(o,p[0]*SC,true);dv.setFloat32(o+4,p[1]*SC,true);dv.setFloat32(o+8,p[2]*SC,true);o+=12;};putN(n);put(a);put(b);put(c);dv.setUint16(o,0,true);o+=2;}
 return new Blob([buf],{type:'model/stl'});
}
document.getElementById('dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(buildSTL());a.download='my-explox-tesla-tank.stl';a.click();};
</script></body></html>
