<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A message for Dad</title>
<style>
:root{--bg:#f4f1ea;--text:#22223a;--accent:#2e7bd6;--card:#fff}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:18px system-ui,"Segoe UI",sans-serif;overflow:hidden}
#card{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);width:min(90vw,460px);background:var(--card);border-radius:20px;padding:24px 20px;text-align:center;box-shadow:0 12px 40px #0002}
h1{font-size:24px;margin:4px 0 8px}
p{margin:6px 0 12px;color:#555;font-size:16px}
button{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:12px 22px;font:700 18px system-ui;cursor:pointer}
#run{position:fixed;transition:left .18s ease,top .18s ease;z-index:5}
#give{background:#e6e3dc;color:#333;font-size:14px;padding:8px 14px;margin-top:10px}
#msg{min-height:24px;font-weight:700;color:#c0392b}
#win{display:none;position:fixed;inset:0;background:#1b1140;color:#fff;text-align:center;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#win h1{font-size:40px;color:#ffcd30;margin:0 0 8px}
#win p{color:#ddd;font-size:18px;max-width:520px}
.c{position:fixed;top:-20px;width:10px;height:14px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style></head><body>
<div id="card">
 <h1>📬 A special message for Dad</h1>
 <p>Someone left you a surprise. Click the button below to open it.</p>
 <div id="msg"></div>
 <div style="height:56px"></div>
 <button id="give">I give up 🏳️</button>
</div>
<button id="run">Open the message</button>
<div id="win">
 <h1>GOTCHA, DAD! 😄</h1>
 <p id="wt">That was for the pop-up prank. The S.I.P. team always gets even!</p>
 <p style="font-size:15px;color:#bbb">Love you. Now come check out our games 👇</p>
 <a href="../toolbox/" style="display:inline-block;margin-top:12px;background:#ffcd30;color:#1a1a1a;padding:12px 22px;border-radius:12px;font-weight:800;text-decoration:none">Open the S.I.P. Toolbox</a>
</div>
<script>
const run=document.getElementById('run'),card=document.getElementById('card'),msg=document.getElementById('msg');
const taunts=['Too slow! 😜','Nope!','Almost...','Try again!','So close!','Hehe 🏃','Catch me!','Not today!','One more try...','Okay okay... maybe next time!'];
let dodges=0;const MAX=12;
function place(){const r=card.getBoundingClientRect();run.style.left=(r.left+r.width/2-run.offsetWidth/2)+'px';run.style.top=(r.top+r.height-110)+'px';}
place();addEventListener('resize',()=>{if(dodges===0)place();});
function dodge(){if(dodges>=MAX)return;dodges++;const w=innerWidth-run.offsetWidth-16,h=innerHeight-run.offsetHeight-16;run.style.left=(8+Math.random()*w)+'px';run.style.top=(8+Math.random()*h)+'px';msg.textContent=taunts[(dodges-1)%taunts.length];if(dodges>=MAX){msg.textContent='Fine, you win... click it! 🙄';}}
run.addEventListener('pointerenter',dodge);
run.addEventListener('pointerdown',e=>{if(dodges<MAX){e.preventDefault();dodge();}});
run.addEventListener('click',()=>{if(dodges>=MAX)win(false);});
document.getElementById('give').onclick=()=>win(true);
let ac=null;
function laugh(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime+.05;for(let i=0;i<5;i++){const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.setValueAtTime(330-i*20,t+i*.2);o.frequency.exponentialRampToValueAtTime(240-i*15,t+i*.2+.15);g.gain.setValueAtTime(.0001,t+i*.2);g.gain.exponentialRampToValueAtTime(.03,t+i*.2+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.2+.17);o.connect(g);g.connect(ac.destination);o.start(t+i*.2);o.stop(t+i*.2+.19);}}catch(e){}}
function win(gaveUp){run.remove();card.remove();const w=document.getElementById('win');w.style.display='flex';
 if(gaveUp)document.getElementById('wt').textContent='You gave up! That was for the pop-up prank. The S.I.P. team always gets even!';
 laugh();const cols=['#ffcd30','#ff7ab6','#7df','#9f7','#ff9a3b','#c8f'];
 for(let i=0;i<120;i++){const c=document.createElement('div');c.className='c';c.style.left=Math.random()*100+'vw';c.style.background=cols[i%cols.length];c.style.animationDuration=(2.5+Math.random()*3)+'s';c.style.animationDelay=(Math.random()*1.5)+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),7500);}}
</script></body></html>
