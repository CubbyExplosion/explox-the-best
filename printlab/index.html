<title>S.I.P. Print Lab</title>
<style>
:root{--bg:#0f1426;--panel:#1a2140;--panel2:#232c55;--text:#eef2ff;--muted:#9aa7d6;--accent:#ffcd30;--good:#58d68d;--bad:#ff7b7b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,"Segoe UI",sans-serif}
header{padding:16px;background:var(--panel);display:flex;gap:12px;align-items:center}header h1{margin:0;font-size:22px}header small{color:var(--muted)}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;max-width:860px;margin:0 auto}nav button{background:var(--panel2);color:var(--text);border:2px solid transparent;border-radius:10px;padding:8px 14px;cursor:pointer;font-size:15px}nav button.on{border-color:var(--accent)}
main{max-width:860px;margin:0 auto;padding:0 12px 40px}.card{background:var(--panel);border-radius:14px;padding:14px;margin-bottom:12px}
input,select,textarea{background:var(--panel2);color:var(--text);border:1px solid #ffffff30;border-radius:8px;padding:10px;font:inherit;max-width:100%}
.b{background:var(--accent);color:#1a1a1a;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}.b.alt{background:var(--panel2);color:var(--text)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.muted{color:var(--muted)}.chip{background:var(--panel2);border-radius:20px;padding:5px 12px;font-size:14px;cursor:pointer;border:0;color:var(--text)}
.ans h3{margin:0 0 4px;color:var(--accent)}.ans{background:var(--panel2);border-radius:12px;padding:12px;margin:8px 0}.warn{background:#4a2b1a;border-radius:10px;padding:10px;margin:8px 0}
details{background:var(--panel2);border-radius:10px;padding:10px 12px;margin:8px 0}summary{cursor:pointer;font-weight:700}
.opt{display:block;width:100%;text-align:left;margin:6px 0;background:var(--panel2);color:var(--text);border:2px solid transparent;border-radius:10px;padding:10px;cursor:pointer;font:inherit}.opt.good{border-color:var(--good)}.opt.bad{border-color:var(--bad)}
.msg{padding:10px 12px;border-radius:12px;margin:8px 0;max-width:90%}.me{background:#3b4a8f;margin-left:auto}.ai{background:var(--panel2)}

<script>
const $ = (s, r) => (r || document).querySelector(s);
// ---------------- KNOWLEDGE BASE (3D printing) ----------------
// [title, keywords, answer]
const KB = [
 ['What is 3D printing?', 'what is 3d printing printer how does work fdm additive', 'A 3D printer builds an object one thin layer at a time from a digital model. The most common kind is FDM: it melts a plastic string (filament) and squeezes it out of a hot nozzle, drawing each layer on top of the last. It is called "additive" because it adds material, unlike carving which cuts material away.'],
 ['History of 3D printing', 'history invented who first hull stratasys reprap 1984 crump', 'Chuck Hull invented stereolithography (the first 3D printing method, using light and liquid resin) in 1984. Scott Crump patented FDM, the melted-plastic method, in 1989 and started Stratasys. The RepRap project (2005) made printers that could print their own parts, which started the cheap home 3D printer boom.'],
 ['PLA filament', 'pla filament plastic best beginner temperature easy', 'PLA is the easiest filament and the best to start with. It prints at about 190-220 °C with a bed at about 50-60 °C. It is made from plants (like corn starch), smells a little sweet, rarely warps, but goes soft in a hot car (around 55-60 °C) and is a bit brittle.'],
 ['PETG filament', 'petg filament strong waterproof temperature', 'PETG is stronger and a little bendier than PLA and handles heat and water better. It prints at about 230-250 °C with a bed at 70-80 °C. It likes to string (make thin hairs), so use less cooling and tune retraction.'],
 ['ABS and ASA filament', 'abs asa filament enclosure fumes warp strong heat', 'ABS and ASA are tough and heat-resistant (like LEGO bricks). They print at about 230-260 °C with a bed at 90-110 °C, warp easily and give off fumes, so they need an enclosure and good ventilation. Not recommended for beginners.'],
 ['TPU filament', 'tpu flexible rubber filament bendy', 'TPU is a rubbery, flexible filament used for phone cases, tires and grips. Print it slowly (20-30 mm/s) at about 220-240 °C. A direct-drive extruder makes it much easier.'],
 ['Layer height', 'layer height resolution quality 0.2 detail speed', 'Layer height is how thick each layer is. 0.2 mm is the normal balance. 0.12 mm gives smoother detail but takes much longer. 0.28 mm is a fast draft. With a 0.4 mm nozzle, keep layers between 25% and 75% of the nozzle width (0.1 to 0.3 mm).'],
 ['Infill', 'infill percent inside strength gyroid grid light', 'Infill is the pattern printed inside the object. 10-20% is enough for most models, and 30-50% for parts that must be strong. More infill uses more plastic and time. Gyroid and cubic patterns are strong in every direction. Walls (perimeters) add more strength than infill, so use 3 walls for tough parts.'],
 ['Supports', 'support supports overhang bridge 45 degrees tree', 'Supports are temporary structures that hold up parts that hang in the air. Overhangs steeper than about 45-60° from vertical usually need them. Tree supports use less plastic and leave fewer marks. You can avoid supports by turning the model so a flat face lies on the bed or by splitting it into parts.'],
 ['Bed adhesion', 'bed adhesion stick brim raft skirt first layer peel', 'If prints do not stick, clean the bed with isopropyl alcohol (or dish soap), level the bed, make the first layer a little squished, and raise the bed temperature slightly. A brim (a wide flat ring around the part) helps tall or thin models. A raft prints a base under the part. A skirt is just a test outline around it.'],
 ['Bed leveling and first layer', 'level leveling bed first layer z offset squish', 'The first layer is the most important. The nozzle should be close enough that the line is slightly flattened and touches the next line with no gaps, but not so close that it scratches the bed. Many printers level automatically; you can still adjust the Z offset. Level a cold bed first, then check it hot.'],
 ['Stringing', 'stringing strings hairs oozing retraction wet', 'Thin hairs between parts are stringing. Fixes: print a little cooler (5-10 °C), turn on or increase retraction, move the nozzle faster between parts, and dry your filament, because wet filament oozes and pops.'],
 ['Warping', 'warping warp corners lifting curl', 'Plastic shrinks as it cools, so corners can lift. Use a warmer bed, a brim, no draughts, a clean bed and, for ABS, an enclosure. Models with big flat bottoms warp the most; rounding the corners helps.'],
 ['Under-extrusion', 'under extrusion underextrusion gaps thin clog clicking missing', 'If layers look thin, gappy or the extruder clicks: check for a clog, print a little hotter, slow down, check the filament is not tangled, make sure the filament is dry, and check the nozzle is not too close to the bed. A cold pull or a new nozzle fixes most clogs.'],
 ['Elephant foot', 'elephant foot first layer bulge bottom wider', 'If the bottom edge flares out, the nozzle is too close or the bed is too hot. Raise the Z offset a little, lower the bed temperature by 5 °C, or use a small chamfer on the model base.'],
 ['Layer shifting', 'layer shift shifting skipped misaligned belt', 'If the print suddenly moves sideways partway, check the belts are tight, the pulleys are tight, the speed is not too fast, and the nozzle did not hit a curled edge. Also check the motors are not overheating.'],
 ['Wet filament', 'wet moisture dry filament popping humid storage silica', 'Many filaments soak up water from the air and then pop, string and print rough. Dry them at about 45-55 °C (PLA) in a filament dryer or food dehydrator, and store spools in a box or bag with silica gel.'],
 ['File types: STL, 3MF, G-code', 'stl 3mf gcode g-code file format obj export', 'STL is the usual model file: just a shape made of triangles. 3MF also stores units, colors and settings. G-code is the list of step-by-step moves your printer follows; the slicer program makes it from the STL.'],
 ['Slicers', 'slicer software cura prusaslicer orca bambu studio', 'A slicer cuts a 3D model into layers and makes the G-code. Free and popular ones are Cura, PrusaSlicer, OrcaSlicer and Bambu Studio. You set layer height, infill, supports and speed in the slicer.'],
 ['Making your own models', 'cad design model tinkercad blender fusion make create software', 'Tinkercad (free, in a web browser) is the easiest place to start by joining simple shapes. Fusion (free for personal use) and FreeCAD are for exact mechanical parts. Blender is great for shapes and characters; use its 3D-Print Toolbox or export STL and check the model is "watertight" (no holes).'],
 ['Design rules for printable parts', 'design rules wall thickness tolerance clearance hole fit orientation overhang', 'Keep walls at least 1.2 mm thick (3 lines of a 0.4 mm nozzle). Leave 0.2-0.4 mm gaps between parts that must fit or move. Holes print slightly smaller than designed, so make them about 0.2 mm bigger. Print with the strong direction in mind: layers are the weak point, so parts snap along layer lines. Add a flat base so it sticks.'],
 ['Nozzle size', 'nozzle size 0.4 0.6 0.2 diameter brass hardened', 'The standard nozzle is 0.4 mm. A 0.2 mm nozzle gives fine detail but is slow and clogs; 0.6 mm prints big things much faster. Brass nozzles are fine for normal filament, but glow-in-the-dark, carbon-fiber and glitter filaments wear them out, so use a hardened steel nozzle for those.'],
 ['Types of printers', 'cartesian corexy delta bed slinger types of printers kinds', 'Bed-slingers move the bed back and forth (Ender 3, Prusa MK4, Bambu A1). CoreXY printers keep the bed moving only up and down, so they print faster and more steadily (Bambu X1/P1, Voron). Delta printers have three arms and are tall and round. Resin printers use a light screen and liquid resin.'],
 ['Resin printing', 'resin sla msla lcd liquid uv wash cure gloves', 'Resin printers cure liquid with UV light and make very detailed small models. The resin is a skin and eye irritant and smells strong, so you need gloves, ventilation and washing with isopropyl alcohol. Most people suggest starting with FDM first.'],
 ['Safety', 'safety safe hot burn fire fume supervise child kids', 'The nozzle runs at 200 °C or more and the bed at 60 °C or more, so never touch them while printing. Have an adult nearby, put the printer on a hard non-flammable surface, never leave it running when you are asleep or away, use smoke alarms, and ventilate the room, especially for ABS and resin. Keep hair, sleeves and cables away from moving parts.'],
 ['Cost of printing', 'cost price cheap how much money spool filament electricity', 'A 1 kg spool of PLA is about $15-25 (RM 55-90). A small model of 20 g costs about 40 cents in plastic. A good beginner printer is about $150-300. Electricity for a printer is only a few cents per hour.'],
 ['Print time', 'print time long how long hours speed faster', 'Print time depends on the size, layer height, infill and speed. A small keychain takes 20-40 minutes, a phone stand 1-3 hours, a big helmet-size model 20-60 hours. Making layers thicker, using fewer walls and less infill, and a bigger nozzle all speed it up.'],
 ['Calibration and test prints', 'calibration test benchy cube temperature tower calibrate', 'Print a calibration cube (check the size is right), a temperature tower (find the best temperature) and the 3DBenchy boat (tests overhangs, bridges and details). Tune one thing at a time and write down what changed.'],
 ['Maintenance', 'maintenance clean nozzle lubricate rods belts care', 'Clean the bed regularly, wipe dust off the rods, add a drop of light machine oil or grease to rods and lead screws every few months, check the belts and screws are tight, and replace the nozzle when it clogs or wears (every few months of heavy use). Keep the cooling fans dust-free.'],
 ['Post-processing', 'post processing sanding paint smoothing finish acetone primer', 'Remove supports with flush cutters, sand with 120 to 400 grit paper, fill gaps with filler primer, then paint with acrylic paint. Acetone smoothing works on ABS and ASA only, not PLA. Always do it in a ventilated place with an adult.'],
 ['Multi-color printing', 'multi color colour multicolor ams filament change two colors', 'You can add color by pausing the print and swapping filament at a chosen layer, by using a multi-material system such as Bambu AMS, or by painting afterwards. Changing color with a pause is free and good for beginners.'],

  const local = (q) => { const r = search(q); return r.length ? r.map((e, i) => (i ? '<hr style="border-color:#ffffff22">' : '') + '<b>' + esc(e[0]) + '</b><br>' + esc(e[2])).join('') : 'I do not know that one yet. In basic mode I know about <b>3D printing: filaments, settings, problems, design, safety and costs</b>. Try one of those, or press <b>Imagine</b> to brainstorm.<br><span class="muted">For other questions ask a parent or teacher. (A parent can turn on the smart helper.)</span>'; };
  const ask = async (text) => { const q = (text || $('#q', el).value).trim(); if (!q) return; $('#q', el).value = ''; add('me', esc(q)); history.push({ role: 'user', content: q }); history = history.slice(-10);
    if (!AI_ON) { const h = local(q); add('ai', toneWrap(h)); speak(h.replace(/<[^>]+>/g, ' ')); history.push({ role: 'assistant', content: h.replace(/<[^>]+>/g, ' ').slice(0, 800) }); return; }
    const wait = add('ai', '<span class="muted">Thinking…</span>');
    try { const r = await fetch(API + '/chat', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ messages: history, style: aiMode }) }); const j = await r.json(); if (j.ok) { wait.innerHTML = toneWrap(fmt(j.reply)); history.push({ role: 'assistant', content: j.reply }); speak(j.reply); } else { wait.innerHTML = esc(j.error || 'The helper could not answer.') + '<hr style="border-color:#ffffff22">' + toneWrap(local(q)); } }
    catch (e) { wait.innerHTML = 'I could not reach the smart helper, so here is what I know offline:<hr style="border-color:#ffffff22">' + toneWrap(local(q)); } };
  const psel = $('#pmode', el); MODES.forEach((m) => psel.add(new Option(m[1], m[0]))); psel.value = aiMode; psel.onchange = () => { aiMode = psel.value; try { localStorage.setItem('pl_mode', aiMode); } catch (e) { } const m = MODES.find((x) => x[0] === aiMode); add('ai', 'Mood changed to <b>' + esc(m[1]) + '</b>! ' + esc(m[2][0])); };
  $('#go', el).onclick = () => ask(); $('#q', el).onkeydown = (e) => { if (e.key === 'Enter') ask(); };
  $('#spk', el).onclick = () => { speakOn = !speakOn; $('#spk', el).textContent = speakOn ? '🔊 Voice: on' : '🔇 Voice: off'; if (!speakOn && 'speechSynthesis' in window) speechSynthesis.cancel(); else speak('Voice is on.'); };
  $('#mic', el).onclick = () => { const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR) { add('ai', 'Your browser cannot listen to speech. You can still type, and turn on Voice to hear my answers.'); return; }
    if (!sessionStorage.getItem('mic_ok')) { if (!confirm('To listen, your browser may send what you say to the browser company (for example Google or Microsoft) to turn it into words. Ask a parent first. Is it OK to use the microphone?')) return; sessionStorage.setItem('mic_ok', '1'); }
    const rec = new SR(); rec.lang = 'en-US'; rec.interimResults = false; $('#mic', el).textContent = '🎤 Listening…'; rec.onresult = (e) => { const s = e.results[0][0].transcript; ask(s); }; rec.onerror = () => { add('ai', 'I could not hear that. Try again or type it.'); }; rec.onend = () => { $('#mic', el).textContent = '🎤 Talk'; }; try { rec.start(); } catch (e) { $('#mic', el).textContent = '🎤 Talk'; } };
  ['What filament should I start with?', 'Why does my print not stick?', 'Help me invent a toy to print', 'How do I make my own model?', 'Is it safe?', 'How much does it cost?'].forEach((tx) => { const bt = document.createElement('button'); bt.className = 'chip'; bt.textContent = tx; bt.onclick = () => ask(tx); $('#chips', el).appendChild(bt); });
  if (!chat.children.length) add('ai', 'Hi! I am the Print Lab helper. Ask me something, tap a question below, or press <b>🎤 Talk</b> and speak.');
});

// ---- Imagine
reg('imagine', '✨ Imagine', (el) => {
  el.innerHTML = '<div class="card"><div class="muted" style="margin-bottom:8px">Let us dream up something to make! Pick a theme and a kind of object, or describe your own idea.</div><div class="row"><select id="th"></select><select id="ty"></select><button class="b" id="go">Give me ideas</button></div><div id="out"></div></div><div class="card"><b>Tell me your idea</b><div class="row"><input id="idea" placeholder="a tank that opens up" style="flex:1;min-width:200px"><button class="b alt" id="go2">Help me plan it</button></div><div id="out2"></div></div>';
  const TH = ['Explox character', 'A tank', 'S.I.P. coin', 'Space', 'Dragons', 'Robots', 'Ocean', 'Castle', 'Dinosaurs', 'Racing cars'];
  const TY = { 'Keychain': ['small, about 4 cm, with a 4 mm hole', 'Easy', '20-40 min'], 'Desk figure': ['about 8 cm tall on a flat base', 'Easy', '1-3 hours'], 'Phone stand': ['holds a phone at 60° with a lip', 'Easy', '1-2 hours'], 'Board-game piece': ['about 3 cm with a flat base', 'Easy', '30-60 min'], 'Pen holder': ['hollow cup with 2 mm walls', 'Medium', '2-4 hours'], 'Moving toy': ['parts printed with 0.3 mm gaps so they move', 'Hard', '3-6 hours'], 'Display model': ['detailed model in several parts to paint', 'Hard', '6-20 hours'] };
  Object.keys(TY).forEach((k) => $('#ty', el).add(new Option(k, k))); TH.forEach((k) => $('#th', el).add(new Option(k, k)));
  const TW = ['with a glowing look (print in glow filament)', 'in two colors (pause the print to swap)', 'with a secret hidden compartment', 'that stacks with others to make a set', 'with your initials on the base', 'in a rare golden color', 'as a limited "boss" version'];
  $('#go', el).onclick = () => { const th = $('#th', el).value, ty = $('#ty', el).value, d = TY[ty]; const pick = () => TW[Math.floor(Math.random() * TW.length)]; let h = ''; for (let i = 0; i < 4; i++) { h += '<div class="ans"><h3>' + esc(th + ' ' + ty.toLowerCase()) + ' ' + esc(pick()) + '</h3><div class="muted">' + esc(d[0]) + ' · Difficulty: ' + d[1] + ' · About ' + d[2] + '</div></div>'; } $('#out', el).innerHTML = h + '<div class="muted">Tip: add a flat base and keep thin parts at least 1.5 mm thick.</div>'; };
  $('#go2', el).onclick = () => { const t = $('#idea', el).value.trim(); if (!t) return; const l = t.toLowerCase(); const Q = []; Q.push('Big question: how big should it be? Small things (under 10 cm) print fast and cost little.');
    if (/mov|open|hinge|wheel|spin|turn|articul/.test(l)) Q.push('Moving parts: leave 0.3 mm gaps between parts and print them in the position they will sit in. Hinges are easiest as "print-in-place" pins.');
    if (/tank|car|truck|vehicle|plane/.test(l)) Q.push('Vehicles: print the body in one piece with a flat bottom and add separate wheels or tracks so they can be turned in the slicer.');
    if (/person|character|figure|hero|man|woman|robot|animal|dragon/.test(l)) Q.push('Characters: blocky designs print best. Make arms and legs at least 5 mm thick, and give the feet a wide base so it stands.');
    if (/color|colour|paint|glow/.test(l)) Q.push('Colors: swap filament at a layer, use paint after printing, or try glow-in-the-dark filament (needs a hardened nozzle).');
    if (/hang|wall|key|chain|hook/.test(l)) Q.push('Hanging: add a loop or hole at least 4 mm wide and 3 mm thick around it so it does not snap.');
    if (/strong|tough|hold|use|tool/.test(l)) Q.push('Strength: use PETG, 3 walls, 30%+ infill and print so the layers do not run across the thin part.');
    Q.push('Next steps: 1) sketch it on paper, 2) build it in Tinkercad or Blender, 3) export STL, 4) slice it, 5) print a small test first.'); Q.push('What would make it more fun: a name, a number, a hidden message, or making it part of a collection?');
    $('#out2', el).innerHTML = '<div class="ans"><h3>Your idea: ' + esc(t) + '</h3><ul style="margin:6px 0;padding-left:20px">' + Q.map((x) => '<li>' + esc(x) + '</li>').join('') + '</ul></div>'; };
});

// ---- Learn
reg('learn', '📚 Learn', (el) => {
  const L = [['Lesson 1: What you need', 'A printer, filament (PLA is best to start), a computer with a slicer, and an adult nearby. A flat, hard table and good ventilation help.'], ['Lesson 2: Getting a model', 'Download a free STL, or make your own in Tinkercad or Blender. Check it has a flat bottom and no thin walls.'], ['Lesson 3: Slicing', 'Open the STL in the slicer. Pick PLA, 0.2 mm layers, 15% infill and supports only if needed. Press Slice, then save the G-code.'], ['Lesson 4: The first layer', 'Clean the bed, level it, and watch the first 5 minutes. A good first layer is flat, shiny and joined without gaps.'], ['Lesson 5: When it is done', 'Let the bed cool. The model often pops off by itself. Remove supports with cutters and sand if you like.'], ['Lesson 6: Fixing problems', 'Stringing: lower temperature. Not sticking: clean and level. Gaps: check for clogs. Use the Ask tab for more.'], ['Lesson 7: Designing', 'Keep walls 1.2 mm or thicker, add 0.2-0.4 mm gaps for fitting parts, and print with strong directions in mind.'], ['Lesson 8: Going further', 'Try new filaments, multi-color prints, painting and bigger projects. Print something for a friend.']];
  el.innerHTML = '<div class="card"><b>A step-by-step course</b><div id="ls"></div></div><div class="card"><b>Glossary</b><div id="gl"></div></div>';
  L.forEach((x) => { const d = document.createElement('details'); d.innerHTML = '<summary>' + x[0] + '</summary><p></p>'; $('p', d).textContent = x[1]; $('#ls', el).appendChild(d); });
  Object.keys(GLOSS).forEach((k) => { const d = document.createElement('div'); d.style.margin = '6px 0'; d.innerHTML = '<b></b>: <span class="muted"></span>'; $('b', d).textContent = k; $('span', d).textContent = GLOSS[k]; $('#gl', el).appendChild(d); });
});

// ---- Quiz
reg('quiz', '🧠 Quiz', (el) => {
  let i = 0, sc = 0, order = QUIZ.map((_, k) => k).sort(() => Math.random() - 0.5);
  const draw = () => { if (i >= order.length) { el.innerHTML = '<div class="card"><h2>Done! ' + sc + ' / ' + order.length + '</h2><p class="muted">' + (sc >= 10 ? 'You are a 3D printing expert!' : sc >= 6 ? 'Great job! Read the Learn tab to get even better.' : 'Keep learning! Try the Learn and Ask tabs.') + '</p><button class="b" id="again">Play again</button></div>'; $('#again', el).onclick = () => { i = 0; sc = 0; order.sort(() => Math.random() - 0.5); draw(); }; return; }
    const q = QUIZ[order[i]]; el.innerHTML = '<div class="card"><div class="muted">Question ' + (i + 1) + ' of ' + order.length + ' · Score ' + sc + '</div><h3></h3><div id="o"></div><div id="fb" class="muted"></div></div>'; $('h3', el).textContent = q[0]; let done = false;
    q[1].forEach((t, k) => { const b = document.createElement('button'); b.className = 'opt'; b.textContent = t; b.onclick = () => { if (done) return; done = true; if (k === q[2]) { sc++; b.classList.add('good'); $('#fb', el).textContent = '✅ Correct!'; } else { b.classList.add('bad'); $('#o', el).children[q[2]].classList.add('good'); $('#fb', el).textContent = '❌ Not quite.'; } setTimeout(() => { i++; draw(); }, 1100); }; $('#o', el).appendChild(b); }); };
  draw();
});

// ---- About
reg('about', 'ℹ️ About', (el) => { el.innerHTML = '<div class="card"><h3 style="margin-top:0">About Print Lab</h3><p>Print Lab is a 3D printing helper that works on your own device with no internet needed. The Ask tab looks through ' + KB.length + ' topics about 3D printing. It does not know every fact on earth, and it will say so when it does not know something.</p><p class="muted">In basic mode nothing you type is sent anywhere. If a parent turns on the smart helper, your questions go to an online AI service so it can answer. It costs real money, so a parent decides.</p></div>'; });

Object.keys(TABS).forEach((id) => { const b = document.createElement('button'); b.textContent = TABS[id].label; b.dataset.id = id; b.onclick = () => show(id); $('#nav').appendChild(b); });
{ const want = new URLSearchParams(location.search).get('tab'); show(TABS[want] ? want : 'make'); }
