<title>Come check out - S.I.P.</title>
<style>
:root{--bg:#1b1140;--text:#fff;--gold:#ffcd30;--card:#2b1d66}

#sky{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.b{position:absolute;font-weight:800;white-space:nowrap;opacity:0;animation:rise 6s linear forwards;text-shadow:0 2px 8px #0008}

#pop h1{margin:6px 0 4px;font-size:26px;color:var(--gold)}
#pop .muted{color:#cbbff0;font-size:15px;margin:6px 0 14px}
#greet{font-size:36px;font-weight:900;min-height:46px;margin:8px 0}
button,a.btn{display:block;width:100%;box-sizing:border-box;background:var(--gold);color:#1a1a1a;border:0;border-radius:14px;padding:14px;font:800 20px system-ui;cursor:pointer;margin:8px 0;text-decoration:none}
button.alt{background:#4a3a99;color:#fff;font-size:16px;padding:10px}
img{width:72px;height:72px;border-radius:50%}

 <h1>Come check out!</h1>
 <div id="greet">Hi Dad!</div>
 <div class="muted">A little hello from the S.I.P. team. Tap the button to see our games and tools.</div>
 <a class="btn" id="ok" href="../toolbox/" target="_blank" rel="noopener">OK - open the Toolbox</a>
 <button class="alt" id="mus">🎵 Play shop music + evil laughs (quiet)</button>
</div>
<script>
const G=['Hi','Hello','Hola','Bonjour','Hallo','Ciao','Olá','Hej','Namaste','Salaam','Shalom','Konnichiwa','Annyeong','Ni hao','Merhaba','Privet','Jambo','Aloha','Kia ora','Sawubona','Hei','Szia','Ahoj','Salut','Yassou','Sawasdee','Xin chào','Hello there','Hey','Howdy','Greetings','Yo','Good day','Welcome'];
const colors=['#ffcd30','#ff7ab6','#7df','#9f7','#ff9a3b','#c8f'];
const sky=document.getElementById('sky'),greet=document.getElementById('greet');let n=0;
function bubble(){const d=document.createElement('div');d.className='b';d.textContent=G[Math.floor(Math.random()*G.length)]+'!';d.style.left=(Math.random()*90)+'vw';d.style.top=(10+Math.random()*80)+'vh';d.style.fontSize=(18+Math.random()*30)+'px';d.style.color=colors[Math.floor(Math.random()*colors.length)];sky.appendChild(d);setTimeout(()=>d.remove(),6200);}
setInterval(()=>{if(!document.hidden&&sky.children.length<30)bubble();},350);
setInterval(()=>{n++;greet.textContent=G[n%G.length]+(n%2?' Dad!':'!');},1400);
// shop music: a gentle WebAudio jingle, only starts when the button is tapped, stays quiet
let ac=null,tm=null,on=false;
const M=[523,659,784,659,523,659,784,1047,988,784,659,784,880,784,659,523];
function note(f,t,d){const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.03,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02);}
let cyc=0;
function laugh(){ // cartoon evil laugh: speech voice if available, plus a wobbly low synth "ha ha ha"
 try{if(window.speechSynthesis){const u=new SpeechSynthesisUtterance('Mwa ha ha ha ha!');u.pitch=.3;u.rate=.75;u.volume=.35;speechSynthesis.cancel();speechSynthesis.speak(u);}}catch(e){}
 try{const t=ac.currentTime+.05;for(let i=0;i<5;i++){const o=ac.createOscillator(),g=ac.createGain(),l=ac.createOscillator(),lg=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(190-i*14,t+i*.28);o.frequency.exponentialRampToValueAtTime(120-i*8,t+i*.28+.22);l.frequency.value=14;lg.gain.value=9;l.connect(lg);lg.connect(o.frequency);g.gain.setValueAtTime(.0001,t+i*.28);g.gain.exponentialRampToValueAtTime(.025,t+i*.28+.03);g.gain.exponentialRampToValueAtTime(.0001,t+i*.28+.24);o.connect(g);g.connect(ac.destination);o.start(t+i*.28);l.start(t+i*.28);o.stop(t+i*.28+.26);l.stop(t+i*.28+.26);}}catch(e){}}
function loop(){if(!on)return;const t=ac.currentTime+.05;M.forEach((f,i)=>note(f,t+i*.26,.24));if(cyc++%2===1)setTimeout(()=>{if(on)laugh();},1500);tm=setTimeout(loop,M.length*260);}
document.getElementById('mus').onclick=function(){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();}catch(e){return;}on=!on;this.textContent=on?'⏹ Stop the music':'🎵 Play shop music + evil laughs (quiet)';if(on)loop();else{clearTimeout(tm);try{speechSynthesis.cancel();}catch(e){}}};
document.getElementById('ok').addEventListener('click',()=>{on=false;clearTimeout(tm);try{speechSynthesis.cancel();}catch(e){}});
</script></body></html>
