<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Free Video Editor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23ff4fa3'/><polygon points='38,28 38,72 74,50' fill='white'/></svg>">
<style>
:root{--bg:#10121f;--card:#1a1d33;--card2:#252a4a;--text:#eef0ff;--mut:#9aa0d0;--a:#8e5bff;--b:#ff4fa3;--g:#2ee6a8}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#0c0e1a;border-bottom:1px solid #2a2e55;flex-wrap:wrap}
header h1{margin:0;font-size:20px;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:8px 12px;background:var(--card2);color:var(--text);font-weight:700;display:inline-block}
button.p,.btn.p{background:linear-gradient(90deg,var(--a),var(--b));color:#fff}button.g{background:var(--g);color:#06241a}button.r{background:#e53935;color:#fff}button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;padding:6px 8px;border-radius:8px;border:2px solid #353a6e;background:#12142a;color:var(--text);max-width:100%}
input[type=range]{padding:0;width:100%}input[type=color]{padding:0;width:40px;height:30px}
main{display:grid;grid-template-columns:minmax(300px,1.2fr) minmax(300px,1fr);gap:12px;padding:12px}
@media(max-width:860px){main{grid-template-columns:1fr}}
.panel{background:var(--card);border-radius:14px;padding:12px}.panel h2{margin:0 0 8px;font-size:16px}
canvas{width:100%;background:#000;border-radius:10px;display:block;max-height:62vh;object-fit:contain}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:0 0 auto}.mut{color:var(--mut);font-size:12px}
.clip{background:var(--card2);border-radius:12px;padding:8px;margin:8px 0;border:2px solid transparent}.clip.sel{border-color:var(--a)}
.clip .top{display:flex;gap:8px;align-items:center}.clip img{width:72px;height:44px;object-fit:cover;border-radius:6px;background:#000}
.lbl{display:block;color:var(--mut);font-size:12px;margin-top:6px}
#bar{height:10px;background:#12142a;border-radius:99px;overflow:hidden;margin-top:6px}#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b))}
.tx{background:var(--card2);border-radius:10px;padding:8px;margin:6px 0}
</style></head><body>
<header><h1>🎬 Free Video Editor</h1><span class="mut">No sign-up. Your videos stay on this computer and are never uploaded.</span></header>
<main>
 <section class="panel">
  <h2>Preview</h2><canvas id="cv" width="1280" height="720"></canvas>
  <div class="row" style="margin-top:8px"><button id="play" class="p">▶ Play</button><button id="stop">⏹</button><span id="time" class="mut">0:00 / 0:00</span></div>
  <input type="range" id="seek" min="0" max="1000" value="0" style="margin-top:6px">
  <div class="row" style="margin-top:10px"><label class="mut">Shape</label><select id="aspect"><option value="16:9">Wide 16:9 (normal video)</option><option value="9:16">Tall 9:16 (Shorts)</option><option value="1:1">Square 1:1</option></select>
   <label class="mut">Fit</label><select id="fit"><option value="contain">Show everything</option><option value="cover">Fill the screen</option></select></div>
  <div class="row" style="margin-top:12px"><button id="exp" class="g">💾 Export video</button><span class="mut" id="expMsg">Saves a .webm file you can post in CEX.</span></div><div id="bar"><i id="barI"></i></div>
 </section>
 <section class="panel">
  <h2>Clips</h2>
  <div class="row"><label class="btn p" for="add">➕ Add videos or pictures</label><input id="add" type="file" accept="video/*,image/*" multiple style="display:none"><button id="split">✂️ Split at playhead</button></div>
  <div id="clips"><div class="mut" style="padding:14px">Add a video to start. Drag clips with the arrows to put them in order.</div></div>
  <h2 style="margin-top:14px">Text on screen</h2><button id="addTx">➕ Add text</button><div id="texts"></div>
 </section>
</main>
<script>
'use strict';
var $=function(i){return document.getElementById(i)},cv=$('cv'),cx=cv.getContext('2d');
var medias={},clips=[],texts=[],sel=-1,T=0,playing=false,exporting=false,aud=null,dest=null,raf=0,t0=0,tStart=0,cur=-1;
var FILTERS={none:'none',bright:'brightness(1.3)',dark:'brightness(.7)',contrast:'contrast(1.4)',bw:'grayscale(1)',sepia:'sepia(.9)',vivid:'saturate(1.8)',cool:'hue-rotate(25deg) saturate(1.2)',warm:'sepia(.4) saturate(1.4) hue-rotate(-15deg)'};
function uid(){return 'm'+Math.random().toString(36).slice(2,8)}
function fmt(t){t=Math.max(0,t);var m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+('0'+s).slice(-2)}
function setSize(){var a=$('aspect').value;cv.width=a==='16:9'?1280:720;cv.height=a==='16:9'?720:a==='9:16'?1280:720;draw()}
function clipDur(c){return c.type==='image'?c.imgDur:Math.max(0.05,(c.out-c.in)/c.speed)}
function total(){return clips.reduce(function(a,c){return a+clipDur(c)},0)}
function startOf(i){var s=0;for(var k=0;k<i;k++)s+=clipDur(clips[k]);return s}
function locate(t){var s=0;for(var i=0;i<clips.length;i++){var d=clipDur(clips[i]);if(t<s+d||i===clips.length-1)return {i:i,local:Math.min(d,Math.max(0,t-s))};s+=d}return null}

/* ---------- adding files ---------- */
$('add').onchange=function(){Array.prototype.forEach.call(this.files,addFile);this.value=''};
function addFile(f){var url=URL.createObjectURL(f),id=uid();
 if(f.type.indexOf('image')===0){var im=new Image();im.onload=function(){medias[id]={img:im,url:url};clips.push({m:id,type:'image',name:f.name,imgDur:4,in:0,out:4,speed:1,vol:1,filter:'none',fi:false,fo:false});sel=clips.length-1;render();draw()};im.src=url;return}
 var v=document.createElement('video');v.preload='auto';v.playsInline=true;v.src=url;v.crossOrigin='anonymous';
 v.onloadedmetadata=function(){medias[id]={el:v,url:url,dur:v.duration};clips.push({m:id,type:'video',name:f.name,in:0,out:v.duration,speed:1,vol:1,filter:'none',fi:false,fo:false});sel=clips.length-1;render();seekTo(0)};
 v.onerror=function(){alert('This file could not be opened: '+f.name)}}
function audioSetup(){if(aud)return;aud=new (window.AudioContext||window.webkitAudioContext)();dest=aud.createMediaStreamDestination()}
function gainFor(id){var m=medias[id];if(!m.el)return null;audioSetup();if(!m.gain){try{var s=aud.createMediaElementSource(m.el);m.gain=aud.createGain();s.connect(m.gain);m.gain.connect(dest);m.gain.connect(aud.destination)}catch(e){m.gain=null}}return m.gain}

/* ---------- drawing ---------- */
function draw(){
 var W=cv.width,H=cv.height;cx.filter='none';cx.globalAlpha=1;cx.fillStyle='#000';cx.fillRect(0,0,W,H);
 var L=clips.length?locate(T):null;
 if(L){var c=clips[L.i],m=medias[c.m],src=c.type==='image'?m.img:m.el,sw=c.type==='image'?src.width:src.videoWidth,sh=c.type==='image'?src.height:src.videoHeight;
  if(src&&sw){var r=$('fit').value==='cover'?Math.max(W/sw,H/sh):Math.min(W/sw,H/sh);cx.filter=FILTERS[c.filter]||'none';cx.drawImage(src,(W-sw*r)/2,(H-sh*r)/2,sw*r,sh*r);cx.filter='none'}
  var d=clipDur(c),fade=Math.min(1,d/4);if(c.fi&&L.local<fade){cx.fillStyle='rgba(0,0,0,'+(1-L.local/fade)+')';cx.fillRect(0,0,W,H)}if(c.fo&&d-L.local<fade){cx.fillStyle='rgba(0,0,0,'+(1-(d-L.local)/fade)+')';cx.fillRect(0,0,W,H)}}
 texts.forEach(function(x){if(T>=x.s&&T<=x.e&&x.t){cx.font='900 '+Math.round(x.size*H/720)+'px Arial';cx.textAlign='center';cx.textBaseline='middle';var y=x.pos==='top'?H*.12:x.pos==='mid'?H*.5:H*.88;cx.lineWidth=Math.round(x.size*H/720/6);cx.strokeStyle='#000';cx.lineJoin='round';cx.strokeText(x.t,W/2,y,W*.95);cx.fillStyle=x.col;cx.fillText(x.t,W/2,y,W*.95)}});
 var tt=total();$('time').textContent=fmt(T)+' / '+fmt(tt);$('seek').value=tt?Math.round(T/tt*1000):0}

/* ---------- play / seek ---------- */
function enterClip(i,local){var c=clips[i],m=medias[c.m];cur=i;if(c.type==='video'){var v=m.el,g=gainFor(c.m);if(g)g.gain.value=c.vol;v.muted=false;v.volume=g?1:c.vol;v.playbackRate=c.speed;v.currentTime=c.in+local*c.speed;if(playing){var p=v.play();if(p&&p.catch)p.catch(function(){})}}}
function leaveAll(){Object.keys(medias).forEach(function(k){if(medias[k].el)medias[k].el.pause()})}
function seekTo(t){var tt=total();T=Math.max(0,Math.min(t,tt));var L=locate(T);if(!L){draw();return}leaveAll();var c=clips[L.i];cur=L.i;if(c.type==='video'){var v=medias[c.m].el;v.currentTime=c.in+L.local*c.speed;v.onseeked=function(){draw()}}draw()}
function frame(){if(!playing)return;var now=performance.now(),tt=total();T=tStart+(now-t0)/1000;
 if(T>=tt){T=tt;draw();stopPlay(true);return}
 var L=locate(T);if(L.i!==cur){leaveAll();enterClip(L.i,L.local)}else{var c=clips[L.i];if(c.type==='video'){var v=medias[c.m].el;if(v.paused&&playing){var p=v.play();if(p&&p.catch)p.catch(function(){})}if(v.currentTime>=c.out-0.02){v.pause()}}}
 draw();raf=requestAnimationFrame(frame)}
function startPlay(){if(!clips.length)return;if(T>=total()-0.05)T=0;audioSetup();if(aud.state==='suspended')aud.resume();playing=true;tStart=T;t0=performance.now();var L=locate(T);cur=-1;leaveAll();enterClip(L.i,L.local);$('play').textContent='⏸ Pause';raf=requestAnimationFrame(frame)}
function stopPlay(end){playing=false;cancelAnimationFrame(raf);leaveAll();$('play').textContent='▶ Play';if(end&&exporting)finishExport()}
$('play').onclick=function(){if(playing)stopPlay();else startPlay()};
$('stop').onclick=function(){stopPlay();seekTo(0)};
$('seek').oninput=function(){if(playing)stopPlay();seekTo(+this.value/1000*total())};
$('aspect').onchange=setSize;$('fit').onchange=draw;

/* ---------- clip list ---------- */
function render(){var box=$('clips');if(!clips.length){box.innerHTML='<div class="mut" style="padding:14px">Add a video to start.</div>';draw();return}
 box.innerHTML=clips.map(function(c,i){var m=medias[c.m];var th=c.type==='image'?'<img src="'+m.url+'">':'<div style="width:72px;height:44px;background:#000;border-radius:6px;display:flex;align-items:center;justify-content:center">🎞️</div>';
  return '<div class="clip'+(i===sel?' sel':'')+'" data-i="'+i+'"><div class="top">'+th+'<div style="flex:1;min-width:0"><b style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(i+1)+'. '+c.name.replace(/</g,'&lt;')+'</b><span class="mut">'+fmt(clipDur(c))+' long</span></div>'+
  '<button data-a="up">◀</button><button data-a="dn">▶</button><button data-a="dup">⧉</button><button class="r" data-a="del">🗑</button></div>'+(i===sel?clipTools(c):'')+'</div>'}).join('');
 draw()}
function clipTools(c){var o=Object.keys(FILTERS).map(function(k){return '<option value="'+k+'"'+(c.filter===k?' selected':'')+'>'+({none:'No filter',bright:'Brighter',dark:'Darker',contrast:'More contrast',bw:'Black & white',sepia:'Old film',vivid:'Vivid colors',cool:'Cool',warm:'Warm'}[k])+'</option>'}).join('');
 if(c.type==='image')return '<label class="lbl">Show this picture for '+c.imgDur+' seconds</label><input type="range" min="1" max="20" step="0.5" value="'+c.imgDur+'" data-f="imgDur"><label class="lbl">Filter</label><select data-f="filter">'+o+'</select><label class="lbl"><input type="checkbox" data-f="fi"'+(c.fi?' checked':'')+'> fade in &nbsp; <input type="checkbox" data-f="fo"'+(c.fo?' checked':'')+'> fade out</label>';
 var md=medias[c.m].dur;
 return '<label class="lbl">Start: '+fmt(c.in)+'</label><input type="range" min="0" max="'+md+'" step="0.05" value="'+c.in+'" data-f="in"><label class="lbl">End: '+fmt(c.out)+'</label><input type="range" min="0" max="'+md+'" step="0.05" value="'+c.out+'" data-f="out">'+
  '<label class="lbl">Speed: '+c.speed+'x</label><input type="range" min="0.25" max="3" step="0.25" value="'+c.speed+'" data-f="speed"><label class="lbl">Volume: '+Math.round(c.vol*100)+'%</label><input type="range" min="0" max="1" step="0.05" value="'+c.vol+'" data-f="vol">'+
  '<label class="lbl">Filter</label><select data-f="filter">'+o+'</select><label class="lbl"><input type="checkbox" data-f="fi"'+(c.fi?' checked':'')+'> fade in &nbsp; <input type="checkbox" data-f="fo"'+(c.fo?' checked':'')+'> fade out</label>'}
$('clips').addEventListener('click',function(e){var cl=e.target.closest('.clip');if(!cl)return;var i=+cl.dataset.i,a=e.target.closest('[data-a]');
 if(a){var k=a.dataset.a;if(k==='del'){clips.splice(i,1);sel=Math.min(sel,clips.length-1)}else if(k==='up'&&i>0){var t=clips[i];clips[i]=clips[i-1];clips[i-1]=t;sel=i-1}else if(k==='dn'&&i<clips.length-1){var t2=clips[i];clips[i]=clips[i+1];clips[i+1]=t2;sel=i+1}else if(k==='dup'){clips.splice(i+1,0,JSON.parse(JSON.stringify(clips[i])));sel=i+1}render();seekTo(T);return}
 if(e.target.closest('[data-f]'))return;if(sel!==i){sel=i;render()}seekTo(startOf(i))});
$('clips').addEventListener('input',function(e){var el=e.target.closest('[data-f]');if(!el)return;var cl=el.closest('.clip'),c=clips[+cl.dataset.i],f=el.dataset.f;
 c[f]=el.type==='checkbox'?el.checked:(f==='filter'?el.value:+el.value);
 if(f==='in'&&c.in>c.out-0.1)c.in=c.out-0.1;if(f==='out'&&c.out<c.in+0.1)c.out=c.in+0.1;
 if(f==='imgDur'){c.out=c.imgDur}
 var keep=document.activeElement;render();if(f!=='filter'&&el.type!=='checkbox'){var again=document.querySelector('.clip.sel [data-f="'+f+'"]');if(again)again.focus()}seekTo(Math.min(T,total()))});
$('split').onclick=function(){if(!clips.length)return;var L=locate(T),c=clips[L.i];if(c.type==='image'||L.local<0.1||clipDur(c)-L.local<0.1){alert('Move the playhead into the middle of a video clip first.');return}
 var at=c.in+L.local*c.speed,b=JSON.parse(JSON.stringify(c));c.out=at;b.in=at;clips.splice(L.i+1,0,b);sel=L.i+1;render()};

/* ---------- text ---------- */
$('addTx').onclick=function(){var tt=total()||5;texts.push({t:'My text',s:Math.max(0,T),e:Math.min(tt,T+3)||3,size:64,col:'#ffffff',pos:'bot'});rtx();draw()};
function rtx(){$('texts').innerHTML=texts.map(function(x,i){return '<div class="tx" data-t="'+i+'"><div class="row"><input data-k="t" value="'+x.t.replace(/"/g,'&quot;')+'" maxlength="60" style="flex:1;min-width:120px"><input type="color" data-k="col" value="'+x.col+'"><select data-k="pos"><option value="top"'+(x.pos==='top'?' selected':'')+'>Top</option><option value="mid"'+(x.pos==='mid'?' selected':'')+'>Middle</option><option value="bot"'+(x.pos==='bot'?' selected':'')+'>Bottom</option></select><button class="r" data-del="1">🗑</button></div><div class="row"><span class="mut">from</span><input type="number" step="0.5" min="0" data-k="s" value="'+x.s+'" style="width:70px"><span class="mut">to</span><input type="number" step="0.5" min="0" data-k="e" value="'+x.e+'" style="width:70px"><span class="mut">size</span><input type="range" min="24" max="140" data-k="size" value="'+x.size+'" style="width:110px"></div></div>'}).join('')}
$('texts').addEventListener('input',function(e){var k=e.target.dataset.k,tx=e.target.closest('.tx');if(!k||!tx)return;var x=texts[+tx.dataset.t];x[k]=(k==='t'||k==='col'||k==='pos')?e.target.value:+e.target.value;draw()});
$('texts').addEventListener('click',function(e){if(e.target.dataset.del){texts.splice(+e.target.closest('.tx').dataset.t,1);rtx();draw()}});

/* ---------- export ---------- */
var rec=null,chunks=[];
$('exp').onclick=function(){if(!clips.length){alert('Add a video first.');return}if(playing)stopPlay();
 var mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].filter(function(m){return window.MediaRecorder&&MediaRecorder.isTypeSupported(m)})[0];
 if(!mime){alert('This browser cannot save videos. Try Chrome or Edge.');return}
 audioSetup();if(aud.state==='suspended')aud.resume();
 clips.forEach(function(c){gainFor(c.m)});
 var vs=cv.captureStream(30),mix=new MediaStream(vs.getVideoTracks().concat(dest.stream.getAudioTracks()));
 chunks=[];rec=new MediaRecorder(mix,{mimeType:mime,videoBitsPerSecond:5000000});rec.ondataavailable=function(e){if(e.data.size)chunks.push(e.data)};
 rec.onstop=function(){var b=new Blob(chunks,{type:'video/webm'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='my-video.webm';a.click();$('expMsg').textContent='Done! Saved my-video.webm. Post it in CEX.';$('exp').disabled=false;exporting=false;$('barI').style.width='100%'};
 exporting=true;$('exp').disabled=true;$('expMsg').textContent='Saving... it takes as long as the video is. Keep this page open.';T=0;rec.start(500);startPlay();
 var tick=setInterval(function(){if(!exporting){clearInterval(tick);return}$('barI').style.width=Math.round(T/total()*100)+'%'},300)};
function finishExport(){setTimeout(function(){if(rec&&rec.state!=='inactive')rec.stop()},300)}
render();setSize();
</script></body></html>
