<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CEX</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236a3ab0'/><text x='50' y='66' font-size='46' font-family='Arial' font-weight='900' text-anchor='middle' fill='white'>CEX</text></svg>">
<style>
:root{--bg:#0f1020;--card:#191a33;--card2:#222446;--text:#eef0ff;--mut:#9aa0d0;--a:#8e5bff;--b:#ff4fa3;--g:#2ee6a8}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px system-ui,"Segoe UI",sans-serif}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:var(--card2);color:var(--text);font-weight:700}
button.p{background:linear-gradient(90deg,var(--a),var(--b));color:#fff}button.g{background:var(--g);color:#06241a}button.r{background:#e53935;color:#fff}
input,textarea,select{font:inherit;width:100%;padding:10px;border-radius:10px;border:2px solid #34376a;background:#12132a;color:var(--text)}
textarea{min-height:90px;resize:vertical}label{display:block;margin:10px 0 4px;color:var(--mut);font-size:13px;font-weight:700}
.logo{font-weight:900;letter-spacing:1px;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
#top{display:flex;align-items:center;gap:10px;padding:10px 14px;position:sticky;top:0;background:#0f1020ee;z-index:5;border-bottom:1px solid #26294f}
#top .logo{font-size:26px}#top .sp{flex:1}
#view{max-width:720px;margin:0 auto;padding:12px 12px 90px}
#nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:6px;padding:8px;background:#0f1020f2;border-top:1px solid #26294f;z-index:5}
#nav button{flex:1;max-width:160px;background:transparent;color:var(--mut)}#nav button.on{color:#fff;background:var(--card2)}
.card{background:var(--card);border-radius:16px;margin:12px 0;overflow:hidden}
.card .th{position:relative;aspect-ratio:16/9;background:#000;display:flex;align-items:center;justify-content:center;cursor:pointer}
.card .th img{width:100%;height:100%;object-fit:cover}.badge{position:absolute;left:8px;top:8px;background:#000a;border-radius:8px;padding:3px 8px;font-size:12px;font-weight:800}
.card .in{padding:10px 12px}.card h3{margin:0 0 4px;font-size:17px}.mut{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.sp{justify-content:space-between}
.cm{padding:6px 0;border-top:1px solid #2a2d57;font-size:14px}.cm b{color:#c9b5ff}.pretend{font-size:11px;color:var(--mut);margin-left:6px}
.ov{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:20;padding:12px}.ov.show{display:flex}
.box{background:var(--card);border-radius:18px;padding:16px;max-width:560px;width:100%;max-height:92vh;overflow:auto}
#lock{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:radial-gradient(circle at 30% 20%,#2a1b5c,#0f1020 60%);padding:20px;text-align:center}
#lock .big{font-size:64px}#pin{max-width:260px;text-align:center;font-size:24px;letter-spacing:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.av{font-size:54px}
.tab{display:none}.tab.on{display:block}.chip{display:inline-block;padding:4px 10px;border-radius:99px;background:var(--card2);margin:2px;font-size:13px}
canvas{max-width:100%;border-radius:10px;background:#000}
</style></head><body>
<div id="lock"><div class="big logo">CEX</div><h2 id="lockTitle">Welcome to CEX</h2><div class="mut" id="lockSub"></div>
 <input id="uname" maxlength="16" placeholder="pick a username" autocomplete="off" style="max-width:260px;text-align:center;font-size:20px;display:none"><input id="pin" type="password" inputmode="numeric" maxlength="10" placeholder="passcode"><div id="lockMsg" style="min-height:20px;color:#ff8a8a"></div>
 <button class="p" id="lockGo">Sign in</button><button id="lockForgot" style="background:transparent;color:var(--mut)">Forgot passcode?</button>
 <div class="mut" style="max-width:340px;font-size:12px">CEX is private. It lives only on this computer. There is no chat and no strangers.</div></div>

<div id="app" style="display:none">
 <div id="top"><span class="logo">CEX</span><span class="sp"></span><span id="who" class="mut"></span><button id="logout">Log out</button></div>
 <div id="view">
  <div class="tab on" id="t-home"></div><div class="tab" id="t-create"></div><div class="tab" id="t-shorts"></div><div class="tab" id="t-friends"></div><div class="tab" id="t-lists"></div><div class="tab" id="t-top"></div><div class="tab" id="t-me"></div>
 </div>
 <div id="nav"><button data-t="home" class="on">🏠 Home</button><button data-t="shorts">📱 Shorts</button><button data-t="create">➕ Create</button><button data-t="friends">🧑‍🤝‍🧑 Friends</button><button data-t="lists">📂 Lists</button><button data-t="top">🏆 Top 100</button><button data-t="me">👤 Me</button></div>
</div>

<div class="ov" id="ovLive"><div class="box"><h3 style="margin:0 0 4px" id="lvH">🔴 Pretend live stream</h3><div class="mut" id="lvD">Only YOU can see this. The viewers and the chat are made-up characters. Nothing is sent to anyone, and nobody can join.</div>
 <div id="liveSrc" class="row" style="margin-top:10px"><button class="p" id="lvCam">🎥 Use my camera</button><button id="lvScr">🖥️ Share my screen</button><button id="lvClose">Close</button></div>
 <label class="mut" id="lvMicRow" style="display:block;margin-top:8px"><input type="checkbox" id="lvMic" checked> 🎤 use my microphone (your voice is recorded)</label>
 <div id="liveStage" style="display:none;margin-top:10px"><div style="position:relative"><video id="lvVid" muted playsinline autoplay style="width:100%;border-radius:12px;background:#000;max-height:46vh"></video><span class="badge" style="background:#e53935">🔴 LIVE <span id="lvT">0:00</span></span><span class="badge" id="lvVB" style="left:auto;right:8px">👀 <span id="lvV">1</span> pretend viewers</span></div>
  <div id="lvChat" style="height:140px;overflow:auto;margin-top:8px;background:#12132a;border-radius:10px;padding:8px"></div><div class="row" style="margin-top:8px"><button id="lvHeart">❤️ Send hearts</button><button class="r" id="lvStop">⏹ End stream</button></div></div>
 <div id="liveDone" style="display:none;margin-top:10px"><h3 style="margin:0">Stream ended! 🎉</h3><div class="mut" id="lvStats"></div><label>Title for your video</label><input id="lvTitle" maxlength="80" value="My live stream"><div id="lvTypeRow"><label>Post it as</label><select id="lvType"><option value="video">🎬 Video</option><option value="short">📱 Short (up to 60 seconds)</option></select></div><div class="row" style="margin-top:10px"><button class="g" id="lvSave">💾 Save it in CEX</button><button id="lvDiscard">🗑 Throw it away</button></div></div></div></div>
<div class="ov" id="ovPlay"><div class="box"><div id="playBox"></div><div id="playInfo"></div><div class="row" style="margin-top:10px"><button id="playClose">Close</button></div></div></div>

<script>
'use strict';
var $=function(i){return document.getElementById(i)};
var LS={get:function(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- media store (videos and pictures stay in this browser, on this computer) ---------- */
var db=null;
function openDB(cb){var r=indexedDB.open('cex_media',1);r.onupgradeneeded=function(){r.result.createObjectStore('m')};r.onsuccess=function(){db=r.result;cb()};r.onerror=function(){db=null;cb()}}
function putM(id,blob,cb){if(!db){cb&&cb();return}var t=db.transaction('m','readwrite');t.objectStore('m').put(blob,id);t.oncomplete=function(){cb&&cb()};t.onerror=function(){cb&&cb()}}
function getM(id,cb){if(!db){cb(null);return}var q=db.transaction('m').objectStore('m').get(id);q.onsuccess=function(){cb(q.result||null)};q.onerror=function(){cb(null)}}
function delM(id){if(!db)return;try{db.transaction('m','readwrite').objectStore('m').delete(id)}catch(e){}}
var urlCache={};
function urlOf(id,cb){if(urlCache[id]){cb(urlCache[id]);return}getM(id,function(b){if(!b){cb('');return}urlCache[id]=URL.createObjectURL(b);cb(urlCache[id])})}
function uid(){return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

/* ---------- sign in with a passcode (4-10 digits). It is only a lock on this computer. ---------- */
function hash(s,cb){try{var d=new TextEncoder().encode('cex-salt:'+s);crypto.subtle.digest('SHA-256',d).then(function(h){cb(Array.from(new Uint8Array(h)).map(function(b){return b.toString(16).padStart(2,'0')}).join(''))})}catch(e){cb('x'+s)}}
var acct=LS.get('cex_acct',null);
function showLock(){
 $('uname').style.display=acct?'none':'block';$('lock').style.display='flex';$('app').style.display='none';$('pin').value='';$('lockMsg').textContent='';
 if(acct){$('lockTitle').textContent='Welcome back'+(acct.nick?', '+acct.nick:'')+'!';$('lockSub').textContent='Type your passcode to sign in.';$('lockGo').textContent='Sign in';$('lockForgot').style.display=''}
 else{$('lockTitle').textContent='Make your CEX account';$('lockSub').textContent='Choose a username (letters and numbers, 3 to 16) and a passcode of 4 to 10 numbers. Never use your real name.';$('lockGo').textContent='Create account';$('lockForgot').style.display='none'}}
$('lockGo').onclick=function(){
 var p=$('pin').value.replace(/\D/g,''),un=($('uname').value||'').trim();if(!acct&&!/^[A-Za-z0-9_]{3,16}$/.test(un)){$('lockMsg').textContent='Pick a username with 3 to 16 letters or numbers (no spaces).';return}if(p.length<4){$('lockMsg').textContent='Use 4 to 10 numbers.';return}
 hash(p,function(h){
  if(acct){if(h===acct.h)enter();else{$('lockMsg').textContent='Wrong passcode. Try again.';$('pin').value=''}}
  else{acct={h:h,nick:un,av:'😎',bio:'Welcome to my CEX!'};LS.set('cex_acct',acct);enter()}})};
$('pin').addEventListener('keydown',function(e){if(e.key==='Enter')$('lockGo').click()});
$('lockForgot').onclick=function(){if(confirm('Forgot your passcode? The only way in is to delete your CEX account and all its posts from this computer. Do that?')){localStorage.removeItem('cex_acct');localStorage.removeItem('cex_items');acct=null;items=[];showLock()}};
$('logout').onclick=function(){showLock()};

/* ---------- data ---------- */
var items=LS.get('cex_items',[]);
function saveItems(){LS.set('cex_items',items)}
var FANS=[['PixelFox','🦊'],['StarBlaze','🌟'],['NovaKid','🚀'],['MegaMuffin','🧁'],['TurboTurtle','🐢'],['CosmicCat','🐱'],['BlockBuddy','🧱'],['RainbowRex','🦖']];
var CAST=[['PixelFox','🦊','Draws pixel art and loves arcade games.'],['StarBlaze','🌟','Builds rockets out of bricks.'],['NovaKid','🚀','Space facts every day.'],['MegaMuffin','🧁','Bakes the biggest cupcakes ever.'],['TurboTurtle','🐢','Slow and steady speedrunner.'],['CosmicCat','🐱','Naps on a different planet each week.'],['BlockBuddy','🧱','Makes blocky worlds and mazes.'],['RainbowRex','🦖','A dinosaur who loves rainbows.'],['RoboRita','🤖','Teaches robots to dance.'],['SnowSam','⛄','Builds snowmen in the summer.'],['JellyJet','🪼','Floats around the ocean and tells jokes.'],['PuzzlePanda','🐼','Solves puzzles super fast.']];
var POSTS=['just finished a new level! 🎮','look at my new drawing! 🎨','today I learned a cool fact! 🤓','who wants to see my new project? 👀','happy dance time! 💃','my best score ever! 🏆','it is a great day to make stuff! ☀️','new video coming soon! 🎬','I love this game so much! ❤️','guess what I built today? 🧱'];
var soc=LS.get('cex_social',{fr:{},sub:{}});function saveSoc(){LS.set('cex_social',soc)}
var FANSAY=['This is so cool! 🔥','Best one yet!','I watched this twice 😄','More please!','Wow, nice work! 👏','Love it! ❤️','That was awesome!','Subscribed! ⭐','LOL 😂','Epic! 🎉'];
function ago(t){var s=Math.floor((Date.now()-t)/1000);if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' h ago';return Math.floor(s/86400)+' days ago'}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function dayPost(i){var d=Math.floor(Date.now()/86400000);return POSTS[(d*7+i*3)%POSTS.length]}
function pretendFollowers(){return Math.floor((Date.now()-(LS.get('cex_since',Date.now())))/60000)+items.length*3}
if(!LS.get('cex_since',0))LS.set('cex_since',Date.now());

/* pretend fans drop friendly comments from time to time (they are labelled "pretend") */
setInterval(function(){if($('app').style.display==='none'||!items.length||Math.random()<0.6)return;var it=items[Math.floor(Math.random()*items.length)],f=FANS[Math.floor(Math.random()*FANS.length)];
 it.comments.push({n:f[0],e:f[1],t:FANSAY[Math.floor(Math.random()*FANSAY.length)],p:1,at:Date.now()});it.likes+=Math.floor(Math.random()*3);saveItems();if($('t-home').classList.contains('on'))renderHome()},9000);

/* ---------- views ---------- */
function enter(){$('lock').style.display='none';$('app').style.display='block';$('who').textContent=acct.av+' '+acct.nick;renderHome();renderCreate();renderFriends();renderLists();renderTop();renderMe()}
var navs=document.querySelectorAll('#nav button');
navs.forEach(function(b){b.onclick=function(){navs.forEach(function(x){x.classList.toggle('on',x===b)});document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('on',t.id==='t-'+b.dataset.t)});if(b.dataset.t==='home')renderHome();if(b.dataset.t==='me')renderMe();if(b.dataset.t==='friends')renderFriends();if(b.dataset.t==='lists')renderLists();if(b.dataset.t==='top')renderTop();if(b.dataset.t==='shorts')renderShorts();else stopShorts()}});

function thId(it){return it.thumb||(it.type!=='video'&&it.type!=='short'&&it.media&&it.media[0])||''}
function thumbHTML(it){return '<div class="th" data-open="'+it.id+'"><span class="badge">'+(it.type==='video'?'🎬 Video':it.type==='short'?'📱 Short':it.type==='slides'?'🖼️ Slideshow':'📝 Post')+'</span><img data-img="'+thId(it)+'" alt=""'+(!thId(it)?' style="display:none"':'')+'>'+(!thId(it)?'<div style="font-size:42px;padding:20px;text-align:center">'+esc((it.text||it.title||'').slice(0,90))+'</div>':'')+'</div>'}
function cardHTML(it){
 return '<div class="card" id="c-'+it.id+'">'+thumbHTML(it)+'<div class="in"><h3>'+esc(it.title||'Post')+'</h3>'+(it.type==='post'&&it.text?'<div>'+esc(it.text)+'</div>':'')+'<div class="mut">'+acct.av+' '+esc(acct.nick)+' · '+ago(it.at)+'</div>'+
  '<div class="row" style="margin:8px 0"><button data-like="'+it.id+'"'+(it.liked?' class="p" title="You already liked this"':'')+'>'+(it.liked?'💖':'❤️')+' '+it.likes+'</button><button data-open="'+it.id+'">▶ Open</button><button class="r" data-del="'+it.id+'">🗑</button></div>'+
  '<div>'+it.comments.slice(-4).map(function(c){return '<div class="cm"><b>'+esc(c.e||'😎')+' '+esc(c.n)+'</b>'+(c.p?'<span class="pretend">pretend fan</span>':'')+' '+esc(c.t)+'</div>'}).join('')+'</div>'+
  '<div class="row" style="margin-top:8px"><input data-cin="'+it.id+'" placeholder="Write a comment..." maxlength="140" style="flex:1"><button data-csend="'+it.id+'">Send</button></div></div></div>'}
function fillImgs(root){root.querySelectorAll('img[data-img]').forEach(function(im){var id=im.dataset.img;if(!id)return;urlOf(id,function(u){if(u)im.src=u})})}
function renderHome(){var h=$('t-home');
 var subs=CAST.filter(function(c){return soc.sub[c[0]]});
 var subHTML=subs.length?'<div class="card"><div class="in"><h3>🔔 From the characters you subscribed to</h3>'+subs.slice(0,4).map(function(c){return '<div class="cm">'+c[1]+' <b>'+c[0]+'</b> <span class="pretend">pretend</span> '+dayPost(CAST.indexOf(c))+'</div>'}).join('')+'</div></div>':'';
 h.innerHTML=subHTML+(items.length?items.slice().sort(function(a,b){return b.at-a.at}).map(cardHTML).join(''):'<div class="card"><div class="in" style="text-align:center;padding:30px"><div style="font-size:50px">🎬</div><h3>Your CEX is empty</h3><div class="mut">Tap <b>➕ Create</b> to add your first video, post or slideshow.</div></div></div>');
 fillImgs(h)}
$('t-home').addEventListener('click',function(e){var t=e.target;
 var l=t.closest('[data-like]');if(l){var it=find(l.dataset.like);if(it.liked)return;it.liked=1;it.likes++;saveItems();renderHome();return}
 var d=t.closest('[data-del]');if(d){if(confirm('Delete this from CEX?')){var x=find(d.dataset.del);(x.media||[]).concat(x.thumb?[x.thumb]:[]).forEach(delM);items=items.filter(function(i){return i!==x});saveItems();renderHome()}return}
 var o=t.closest('[data-open]');if(o){openItem(find(o.dataset.open));return}
 var s=t.closest('[data-csend]');if(s){var inp=document.querySelector('[data-cin="'+s.dataset.csend+'"]'),v=inp.value.trim();if(v){find(s.dataset.csend).comments.push({n:acct.nick,e:acct.av,t:v,at:Date.now()});saveItems();renderHome()}}});
function find(id){return items.filter(function(i){return i.id===id})[0]}

function renderFriends(){var f=$('t-friends'),nf=Object.keys(soc.fr).length,ns=Object.keys(soc.sub).length;
 f.innerHTML='<div class="card"><div class="in"><h3>🧑‍🤝‍🧑 Friends and subscriptions</h3><div class="mut">These are made-up characters, not real people. You can friend them and subscribe, but there is no chat.</div><div class="row" style="margin-top:6px"><span class="chip">👫 '+nf+' friends</span><span class="chip">🔔 '+ns+' subscribed</span></div></div></div>'+
  CAST.map(function(c,i){var fr=soc.fr[c[0]],sb=soc.sub[c[0]];return '<div class="card"><div class="in"><div class="row sp"><div class="row"><span class="av" style="font-size:40px">'+c[1]+'</span><div><h3 style="margin:0">'+c[0]+'</h3><div class="mut">'+c[2]+'</div></div></div><div class="row"><button data-fr="'+c[0]+'" class="'+(fr?'g':'')+'">'+(fr?'👫 Friends':'➕ Friend')+'</button><button data-sb="'+c[0]+'" class="'+(sb?'p':'')+'">'+(sb?'🔔 Subscribed':'Subscribe')+'</button></div></div><div class="cm">'+c[1]+' <b>'+c[0]+'</b> <span class="pretend">pretend</span> '+dayPost(i)+'</div></div></div>'}).join('')}
$('t-friends').addEventListener('click',function(e){var a=e.target.closest('[data-fr]'),b=e.target.closest('[data-sb]');if(a){var n=a.dataset.fr;if(soc.fr[n])delete soc.fr[n];else soc.fr[n]=1;saveSoc();renderFriends();renderMe()}if(b){var m=b.dataset.sb;if(soc.sub[m])delete soc.sub[m];else soc.sub[m]=1;saveSoc();renderFriends();renderHome();renderMe()}});
/* ---------- shorts: swipe up through short videos ---------- */
var shortObs=null;
function stopShorts(){if(shortObs){shortObs.disconnect();shortObs=null}document.querySelectorAll('#t-shorts video').forEach(function(v){v.pause()})}
function renderShorts(){var t=$('t-shorts');var list=items.filter(function(i){return i.type==='short'}).sort(function(a,b){return b.at-a.at});
 if(!list.length){t.innerHTML='<div class="card"><div class="in" style="text-align:center;padding:30px"><div style="font-size:50px">📱</div><h3>No Shorts yet</h3><div class="mut">Tap <b>➕ Create</b> then <b>📱 Short</b> to add a short video (up to 60 seconds).</div></div></div>';return}
 t.innerHTML='<div id="shFeed" style="height:calc(100vh - 150px);overflow-y:auto;scroll-snap-type:y mandatory;border-radius:16px">'+list.map(function(it){return '<div class="sh" data-sh="'+it.id+'" style="height:100%;scroll-snap-align:start;position:relative;background:#000;border-radius:16px;overflow:hidden;margin-bottom:8px"><video loop muted playsinline style="width:100%;height:100%;object-fit:cover" data-vid="'+it.media[0]+'"></video>'+
  '<div style="position:absolute;left:0;right:0;bottom:0;padding:14px;background:linear-gradient(transparent,#000c)"><b>'+esc(it.title)+'</b><div class="mut">'+acct.av+' '+esc(acct.nick)+'</div><div class="mut">'+esc(it.text||'')+'</div></div>'+
  '<div style="position:absolute;right:10px;bottom:90px;display:flex;flex-direction:column;gap:10px"><button data-shlike="'+it.id+'" class="'+(it.liked?'p':'')+'">'+(it.liked?'💖':'❤️')+'<br>'+it.likes+'</button><button data-shmute="1">🔇</button></div></div>'}).join('')+'</div><div class="mut" style="text-align:center;margin-top:6px">Swipe or scroll up for the next Short. Tap the video to pause.</div>';
 t.querySelectorAll('video[data-vid]').forEach(function(v){urlOf(v.dataset.vid,function(u){if(u)v.src=u})});
 stopShorts();shortObs=new IntersectionObserver(function(es){es.forEach(function(e){var v=e.target.querySelector('video');if(!v)return;if(e.intersectionRatio>0.7){var pr=v.play();if(pr&&pr.catch)pr.catch(function(){})}else v.pause()})},{root:$('shFeed'),threshold:[0,0.7,1]});
 t.querySelectorAll('.sh').forEach(function(d){shortObs.observe(d)})}
$('t-shorts').addEventListener('click',function(e){var l=e.target.closest('[data-shlike]');if(l){var it=find(l.dataset.shlike);if(!it.liked){it.liked=1;it.likes++;saveItems();l.className='p';l.innerHTML='💖<br>'+it.likes}return}
 if(e.target.closest('[data-shmute]')){var vs=document.querySelectorAll('#t-shorts video'),m=!vs[0].muted;vs.forEach(function(v){v.muted=m});e.target.closest('[data-shmute]').textContent=m?'🔇':'🔊';return}
 var v=e.target.closest('video');if(v){if(v.paused)v.play();else v.pause()}});
/* ---------- play ---------- */
var slideT=null,Q=null;
