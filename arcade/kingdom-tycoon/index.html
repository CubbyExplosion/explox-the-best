<title>Kingdom Tycoon - S.I.P. Arcade</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2d4a2d;font-family:"Trebuchet MS",Verdana,sans-serif;color:#fff;user-select:none;touch-action:none}
canvas#cv{position:fixed;left:0;top:0;touch-action:none;display:block}
.hidden{display:none!important}
#top{position:fixed;left:0;right:0;top:0;display:flex;flex-wrap:wrap;gap:4px;padding:4px;background:linear-gradient(#3b2a1a,#4b3722);border-bottom:3px solid #8a6a3a;z-index:5;align-items:center}
.chip{background:#2a1d10;border:1px solid #8a6a3a;border-radius:8px;padding:3px 7px;font-size:13px;white-space:nowrap}
.chip b{color:#ffe08a}
button{font-family:inherit;cursor:pointer;border:2px solid #8a6a3a;background:#6b4a22;color:#fff;border-radius:8px;padding:5px 9px;font-size:14px}
button:hover{background:#8a6030}button.on{background:#3d8f3d}button:disabled{opacity:.5}
button.red{background:#b73030;border-color:#f6a0a0}
button.big{font-size:18px;padding:10px 18px;background:#2f8f4a;border-color:#a6e6b4}
#ctl{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
#goals{position:fixed;right:6px;top:70px;width:230px;background:rgba(30,20,10,.82);border:2px solid #8a6a3a;border-radius:10px;padding:6px 8px;font-size:12px;z-index:4;max-height:36vh;overflow:auto}
#goals h4{margin:0 0 4px;font-size:13px;color:#ffe08a;cursor:pointer}
#goals div.g{margin:2px 0}#goals .done{color:#9be58f;text-decoration:line-through}
#mini{position:fixed;right:6px;bottom:118px;width:110px;height:110px;border:2px solid #8a6a3a;border-radius:8px;z-index:4;background:#234;cursor:pointer}
#log{position:fixed;left:6px;top:70px;width:min(300px,60vw);z-index:4;pointer-events:none}
#log div{background:rgba(30,20,10,.85);border-left:4px solid #ffe08a;margin-bottom:4px;padding:4px 8px;font-size:13px;border-radius:6px;animation:fi .3s}
#log div.bad{border-color:#ff6b5b}#log div.good{border-color:#7be07b}
@keyframes fi{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
#bar{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(#4b3722,#3b2a1a);border-top:3px solid #8a6a3a;z-index:5;padding:4px}
#tabs{display:flex;gap:4px;margin-bottom:4px;overflow-x:auto}
#tabs button{padding:3px 9px;font-size:13px;white-space:nowrap}
#items{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px}
.bi{min-width:70px;background:#2a1d10;border:2px solid #8a6a3a;border-radius:8px;text-align:center;padding:3px 4px;cursor:pointer;font-size:11px;flex:0 0 auto}
.bi .e{font-size:24px;line-height:28px}.bi.sel{border-color:#7be07b;background:#26441f}.bi.lock{opacity:.45}.bi .c{font-size:10px;color:#ffe08a}.bi .c i{color:#ff8b7b;font-style:normal}
#sel{max-height:46vh;overflow:auto;position:fixed;left:6px;bottom:118px;width:min(260px,70vw);background:rgba(30,20,10,.9);border:2px solid #8a6a3a;border-radius:10px;padding:8px;font-size:13px;z-index:4}
#warnb{position:fixed;left:50%;transform:translateX(-50%);bottom:130px;background:rgba(150,40,20,.93);border:3px solid #ffd27a;border-radius:10px;padding:5px 10px;font-size:13px;font-weight:bold;text-align:center;max-width:90vw;z-index:6;pointer-events:none}
#warhud{position:fixed;left:50%;transform:translateX(-50%);top:70px;background:rgba(70,18,18,.93);border:3px solid #ffb;border-radius:10px;padding:5px 8px;font-size:12px;text-align:center;max-width:96vw;z-index:6}
#offer{position:fixed;left:50%;transform:translateX(-50%);top:70px;background:#3b2a1a;border:3px solid #ffe08a;border-radius:12px;padding:10px 14px;z-index:6;text-align:center;font-size:14px}
#tip{position:fixed;z-index:20;pointer-events:none;background:#1b120a;border:2px solid #ffe08a;border-radius:8px;padding:5px 8px;font-size:12px;max-width:240px;display:none}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:30;display:flex;align-items:center;justify-content:center;touch-action:auto}
.card{background:#3b2a1a;border:4px solid #c9a050;border-radius:14px;padding:14px 18px;max-width:min(95vw,900px);max-height:92vh;overflow:auto;text-align:center}
.card h2{margin:0 0 8px;color:#ffe08a}.card .bt{margin-top:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#title{position:fixed;inset:0;z-index:25;background:radial-gradient(circle at 50% 30%,#6fc95a,#2c6b3a 60%,#143a24);display:flex;flex-direction:column;align-items:center;overflow:auto;padding:10px;touch-action:auto}
#title h1{font-size:clamp(34px,8vw,64px);margin:14px 0 0;color:#ffe08a;text-shadow:0 4px 0 #6b3d10,0 0 18px #000}
#title .sub{letter-spacing:4px;margin-bottom:10px}
#scs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;max-width:900px;width:100%}
.sc{background:rgba(30,20,10,.85);border:3px solid #c9a050;border-radius:12px;padding:10px;cursor:pointer;text-align:left}
.sc:hover{background:rgba(70,45,20,.95)}.sc h3{margin:0 0 4px;color:#ffe08a}.sc p{margin:0;font-size:13px}
.tech{display:inline-block;vertical-align:top;width:150px;margin:3px;padding:5px;border:2px solid #555;border-radius:8px;background:#2a1d10;font-size:11px;text-align:left}
.tech.done{border-color:#7be07b;background:#26441f}.tech.av{border-color:#ffe08a;cursor:pointer}.tech.no{opacity:.5}
.tcol{display:inline-block;vertical-align:top}
</style></head><body>

 <span id="res" style="display:contents"></span>
 <span id="info" style="display:contents"></span>
 <div id="ctl"></div>
</div>
<div id="goals" class="hidden"></div>

function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function genMap(seed){
 const r=mul(seed);T=new Uint8Array(W*H);OCC=new Array(W*H).fill(null);
 const blob=(t,x,y,rad,only)=>{for(let j=-rad-1;j<=rad+1;j++)for(let i=-rad-1;i<=rad+1;i++){const X=x+i,Y=y+j;if(X<0||Y<0||X>=W||Y>=H)continue;const d=Math.hypot(i,j)+r()*1.6;if(d<=rad&&(!only||T[Y*W+X]===0))T[Y*W+X]=t}};
 // water: river on the east + lake south west
 const ph=r()*6,ph2=r()*6;
 for(let y=0;y<H;y++){const rx=45+Math.sin(y*.13+ph)*4+Math.sin(y*.31+ph2)*1.2,wd=1.6+Math.sin(y*.2+ph2)*.6;for(let x=0;x<W;x++)if(Math.abs(x-rx)<wd)T[y*W+x]=1}
 blob(1,6+irnd(0,6),46+irnd(0,4),5);
 const far=(min,max)=>{for(let k=0;k<60;k++){const x=irnd(3,W-4),y=irnd(3,H-4);const d=Math.hypot(x-28,y-28);if(d>=min&&d<=max&&T[y*W+x]===0)return[x,y]}return[irnd(8,14),irnd(8,14)]};
 for(let i=0;i<9;i++){let x,y;if(i<2){const an=r()*6.283+i*3.1,dd=13+r()*2;x=Math.max(5,Math.min(W-6,28+Math.round(Math.cos(an)*dd)));y=Math.max(5,Math.min(H-6,28+Math.round(Math.sin(an)*dd)))}else{[x,y]=far(i<3?12:14,26)}blob(2,x,y,i<2?4:irnd(3,5),1)}
 for(let i=0;i<4;i++){const[x,y]=far(13,24);blob(3,x,y,irnd(2,3),1)}
 for(let i=0;i<3;i++){const[x,y]=far(15,24);blob(3,x,y,3,1);blob(4,x,y,1.6,0)}
 for(let i=0;i<70;i++){const x=irnd(0,W-1),y=irnd(0,H-1);if(T[y*W+x]===0&&r()<.8)T[y*W+x]=2}
 // clear start area
 for(let j=18;j<=37;j++)for(let i=18;i<=37;i++){const k=j*W+i;if(T[k]!==1)T[k]=0}
 // beaches
 for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(T[y*W+x]===0){let w=0;for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const X=x+i,Y=y+j;if(X>=0&&Y>=0&&X<W&&Y<H&&T[Y*W+X]===1)w=1}if(w)T[y*W+x]=5}
 buildMini();
}

// ================= helpers =================
function season(){return Math.floor((S.day-1)/DPS)%4}
function avail(k){if(START.includes(k))return true;for(const id in S.techs)if(TI[id].u.includes(k))return true;return false}
function techFor(k){for(const t of TECH)if(t.u.includes(k))return t;return null}
function bon(k){return(S.bon&&S.bon[k])||0}
function recalcBon(){const b={};for(const t of TECH)if(S.techs[t.id])for(const k in t.b)b[k]=(b[k]||0)+t.b[k];S.bon=b}
function storCap(){let c=250+(cn('castle')?100:0);for(const b of B){if(b.k==='warehouse')c+=150+50*((b.lv||1)-1);else if(b.k==='hall')c+=200+50*((b.lv||1)-1)}return c}
function addRes(r,n){if(r==='gold')S.res.gold+=n;else S.res[r]=Math.min(storCap(),S.res[r]+n)}
function maxhp(k){return D[k].hp*((k==='wall'||k==='gate')?1+bon('wall'):1)*((TW[k]||k==='wall'||k==='gate')?1.25:1)}
function msg(t,cls){const l=$('log'),d=document.createElement('div');d.textContent=t;if(cls)d.className=cls;l.appendChild(d);while(l.children.length>5)l.removeChild(l.firstChild);setTimeout(()=>d.remove(),8000)}

function burst(x,y,ch,n){for(let i=0;i<n;i++)PR.push({x:x*TS,y:y*TS,vx:rnd(-40,40),vy:rnd(-60,-10),life:rnd(.5,1),txt:ch,col:'#ffe066',sz:12,g:1})}

function addB(k,x,y,quiet){const d=D[k],b={id:UID++,k,x,y,w:d.s,h:d.s,hp:maxhp(k),prog:0,n:0,present:0,res:0,st:'',born:quiet?-9999:performance.now(),cd:0,tt:0,lv:(S.hallLv>1&&levelable(k))?S.hallLv:1};B.push(b);for(let j=0;j<d.s;j++)for(let i=0;i<d.s;i++)OCC[(y+j)*W+x+i]=b;S.cnt[k]=(S.cnt[k]||0)+1;if(k==='hall')HALL=b;return b}
function why(k,ax,ay){const d=D[k];if(!avail(k))return'Research '+(techFor(k)?techFor(k).n:'it')+' first';if(d.max&&cn(k)>=d.max)return'Only one allowed';
 for(const r in d.cost)if(S.res[r]<d.cost[r])return'Not enough '+RES[r][1];
 for(let j=0;j<d.s;j++)for(let i=0;i<d.s;i++){const X=ax+i,Y=ay+j;if(X<0||Y<0||X>=W||Y>=H)return'Outside the map';const t=T[Y*W+X];if(!buildable(t))return t===1?'Water in the way':'Clear it first (trees/rocks)';if(OCC[Y*W+X])return'Something is already there'}
 if(d.water){let w=0;for(let j=-1;j<=d.s;j++)for(let i=-1;i<=d.s;i++){const X=ax+i,Y=ay+j;if(X>=0&&Y>=0&&X<W&&Y<H&&T[Y*W+X]===1)w=1}if(!w)return'Must be next to water'}
 return''}
function place(k,ax,ay){const e=why(k,ax,ay);if(e){msg(e,'bad');sfx('err');return false}const d=D[k];for(const r in d.cost)S.res[r]-=d.cost[r];const b=addB(k,ax,ay);sfx('place');if(d.cost.gold)setTimeout(()=>sfx('coin'),150);burst(ax+d.s/2,ay+d.s/2,'✨',3);S.built++;return b}
function removeB(b,refund){if(b.k==='hall')return;b.dead=true;B.splice(B.indexOf(b),1);const d=D[b.k];for(let j=0;j<b.h;j++)for(let i=0;i<b.w;i++)OCC[(b.y+j)*W+b.x+i]=null;S.cnt[b.k]--;
 if(refund)for(const r in d.cost)addRes(r,Math.floor(d.cost[r]*.5));
 if(sel===b){sel=null;updSel()}
 for(const c of C)if(c.job===b)c.job=null;
 recalcHomes();
 if(d.cap){for(let i=C.length-1;i>=0;i--){const c=C[i];if(c.home===b){const h=freeHouse(c.x,c.y);if(h){c.home=h;h.res++}else{C.splice(i,1);ft(c.x,c.y,'moves away','#ccc')}}}}
 for(let i=SO.length-1;i>=0;i--)if(SO[i].home===b){const h=B.find(q=>q!==b&&trainCap(q)>0);if(h)SO[i].home=h;else SO.splice(i,1)}
 for(let i=TK.length-1;i>=0;i--)if(TK[i].home===b){const h=B.find(q=>q.k==='tankfactory'&&q!==b);if(h)TK[i].home=h;else TK.splice(i,1)}
 for(const r of RA)if(r.tg===b)r.tg=null;
 burst(b.x+b.w/2,b.y+b.h/2,'\u{1F4A8}',6)}
function recalcHomes(){for(const b of B)b.res=0;for(const c of C)if(c.home&&!c.home.dead)c.home.res++}
function freeHouse(x,y){let best=null,bd=1e9;for(const b of B){const d=D[b.k];if(d.cap&&b.res<d.cap){const q=Math.hypot(b.x-x,b.y-y);if(q<bd){bd=q;best=b}}}return best}
function nearTile(b,type,rad){let best=null,bd=1e9;const cxm=b.x+b.w/2,cym=b.y+b.h/2;for(let j=Math.floor(cym-rad-1);j<=cym+rad+1;j++)for(let i=Math.floor(cxm-rad-1);i<=cxm+rad+1;i++){if(i<0||j<0||i>=W||j>=H)continue;if(T[j*W+i]===type){const d=Math.hypot(i+.5-cxm,j+.5-cym);if(d<=rad+b.w/2&&d<bd){bd=d;best=j*W+i}}}return best}

function isNight(){return S.tod<.2||S.tod>.85}
function nearRaider(x,y){let m=99;for(const r of RA){const d=Math.hypot(r.x-x,r.y-y);if(d<m)m=d}return m}
function segHit(x0,y0,x1,y1,rx0,ry0,rx1,ry1){let t0=0,t1=1;const dx=x1-x0,dy=y1-y0,p=[-dx,dx,-dy,dy],q=[x0-rx0,rx1-x0,y0-ry0,ry1-y0];for(let i=0;i<4;i++){if(p[i]===0){if(q[i]<0)return false}else{const r=q[i]/p[i];if(p[i]<0){if(r>t1)return false;if(r>t0)t0=r}else{if(r<t0)return false;if(r<t1)t1=r}}}return t1>t0+1e-6}
function detour(x,y,tx,ty){const h=HALL;if(!h)return[tx,ty];const a=h.x+.1,b=h.y+.1,c=h.x+h.w-.1,d=h.y+h.h-.1;if(!segHit(x,y,tx,ty,a,b,c,d))return[tx,ty];const m=.7;let best=null,bd=1e9;
 for(const q of[[a-m,b-m],[c+m,b-m],[a-m,d+m],[c+m,d+m]]){const d1=Math.hypot(q[0]-x,q[1]-y);if(d1<.4)continue;const dd=d1+Math.hypot(tx-q[0],ty-q[1]);if(dd<bd){bd=dd;best=q}}return best||[tx,ty]}
function moveCit(c,dt){
 const danger=RA.length&&nearRaider(c.x,c.y)<7;let tx,ty;c.work=false;
