function tone(f,d,type,v,sl,delay){if(muted)return;try{const a=ac();if(!a)return;const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),t+d);g.gain.setValueAtTime(v||.07,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03)}catch(e){}}
function sfx(n){const now=performance.now();if(lastSfx[n]&&now-lastSfx[n]<(n==='arrow'||n==='hit'?160:40))return;lastSfx[n]=now;

 case'err':tone(160,.18,'sawtooth',.06,-60);break;
 case'coin':tone(900,.07,'square',.04);tone(1300,.12,'square',.04,0,.06);break;
 case'boom':tone(120,.25,'sawtooth',.07,-70);break;
 case'horn':tone(180,.7,'sawtooth',.09,30);tone(240,.7,'sawtooth',.06,30,.05);break;
 case'arrow':tone(900,.08,'triangle',.04,-500);break;
 case'hit':tone(200,.08,'square',.05,-100);break;
 case'event':tone(520,.1,'triangle',.06);tone(660,.1,'triangle',.06,0,.1);tone(780,.16,'triangle',.06,0,.2);break;

 case'win':[523,659,784,1046,784,1046,1318].forEach((f,i)=>tone(f,.2,'triangle',.07,0,i*.12));break;
 case'lose':[400,330,260,180].forEach((f,i)=>tone(f,.3,'sawtooth',.06,0,i*.2));break;

 }}

// ================= map =================
function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function genMap(seed){
 const r=mul(seed);T=new Uint8Array(W*H);OCC=new Array(W*H).fill(null);
 const blob=(t,x,y,rad,only)=>{for(let j=-rad-1;j<=rad+1;j++)for(let i=-rad-1;i<=rad+1;i++){const X=x+i,Y=y+j;if(X<0||Y<0||X>=W||Y>=H)continue;const d=Math.hypot(i,j)+r()*1.6;if(d<=rad&&(!only||T[Y*W+X]===0))T[Y*W+X]=t}};
 // water: river on the east + lake south west
 const ph=r()*6,ph2=r()*6;
 for(let y=0;y<H;y++){const rx=45+Math.sin(y*.13+ph)*4+Math.sin(y*.31+ph2)*1.2,wd=1.6+Math.sin(y*.2+ph2)*.6;for(let x=0;x<W;x++)if(Math.abs(x-rx)<wd)T[y*W+x]=1}
 blob(1,6+irnd(0,6),46+irnd(0,4),5);
 const far=(min,max)=>{for(let k=0;k<60;k++){const x=irnd(3,W-4),y=irnd(3,H-4);const d=Math.hypot(x-28,y-28);if(d>=min&&d<=max&&T[y*W+x]===0)return[x,y]}return[irnd(8,14),irnd(8,14)]};
 for(let i=0;i<9;i++){const[x,y]=far(i<3?7:10,26);blob(2,x,y,irnd(3,5),1)}
 for(let i=0;i<4;i++){const[x,y]=far(8,24);blob(3,x,y,irnd(2,3),1)}
 for(let i=0;i<3;i++){const[x,y]=far(11,24);blob(3,x,y,3,1);blob(4,x,y,1.6,0)}
 for(let i=0;i<70;i++){const x=irnd(0,W-1),y=irnd(0,H-1);if(T[y*W+x]===0&&r()<.8)T[y*W+x]=2}
 // clear start area
 for(let j=-5;j<=5;j++)for(let i=-6;i<=6;i++){const k=(28+j)*W+28+i;if(T[k]!==1)T[k]=0}
 // beaches
 for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(T[y*W+x]===0){let w=0;for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const X=x+i,Y=y+j;if(X>=0&&Y>=0&&X<W&&Y<H&&T[Y*W+X]===1)w=1}if(w)T[y*W+x]=5}
 buildMini();
}
const TC=['#7ac74f','#4aa3df','#3f8f3f','#8a8a8a','#555','#e9d9a0'];
function buildMini(){minibase=document.createElement('canvas');minibase.width=W;minibase.height=H;const g=minibase.getContext('2d');for(let y=0;y<H;y++)for(let x=0;x<W;x++){g.fillStyle=TC[T[y*W+x]];g.fillRect(x,y,1,1)}}

function recalcBon(){const b={};for(const t of TECH)if(S.techs[t.id])for(const k in t.b)b[k]=(b[k]||0)+t.b[k];S.bon=b}
function storCap(){let c=250+(cn('castle')?100:0);for(const b of B)if(b.k==='warehouse')c+=150+50*((b.lv||1)-1);return c}
function addRes(r,n){if(r==='gold')S.res.gold+=n;else S.res[r]=Math.min(storCap(),S.res[r]+n)}

function why(k,ax,ay){const d=D[k];if(!avail(k))return'Research '+(techFor(k)?techFor(k).n:'it')+' first';if(d.max&&cn(k)>=d.max)return'Only one allowed';
 for(const r in d.cost)if(S.res[r]<d.cost[r])return'Not enough '+RES[r][1];
 for(let j=0;j<d.s;j++)for(let i=0;i<d.s;i++){const X=ax+i,Y=ay+j;if(X<0||Y<0||X>=W||Y>=H)return'Outside the map';const t=T[Y*W+X];if(!buildable(t))return t===1?'Water in the way':'Clear it first (trees/rocks)';if(OCC[Y*W+X])return'Something is already there'}
 if(d.water){let w=0;for(let j=-1;j<=d.s;j++)for(let i=-1;i<=d.s;i++){const X=ax+i,Y=ay+j;if(X>=0&&Y>=0&&X<W&&Y<H&&T[Y*W+X]===1)w=1}if(!w)return'Must be next to water'}
 return''}

function removeB(b,refund){b.dead=true;B.splice(B.indexOf(b),1);const d=D[b.k];for(let j=0;j<b.h;j++)for(let i=0;i<b.w;i++)OCC[(b.y+j)*W+b.x+i]=null;S.cnt[b.k]--;

 if(sel===b){sel=null;updSel()}

 recalcHomes();
 if(d.cap){for(let i=C.length-1;i>=0;i--){const c=C[i];if(c.home===b){const h=freeHouse(c.x,c.y);if(h){c.home=h;h.res++}else{C.splice(i,1);ft(c.x,c.y,'moves away','#ccc')}}}}
 for(let i=SO.length-1;i>=0;i--)if(SO[i].home===b){const h=B.find(q=>D[q.k].train);if(h)SO[i].home=h;else SO.splice(i,1)}

function recalcHomes(){for(const b of B)b.res=0;for(const c of C)if(c.home&&!c.home.dead)c.home.res++}
function freeHouse(x,y){let best=null,bd=1e9;for(const b of B){const d=D[b.k];if(d.cap&&b.res<d.cap){const q=Math.hypot(b.x-x,b.y-y);if(q<bd){bd=q;best=b}}}return best}
function nearTile(b,type,rad){let best=null,bd=1e9;const cxm=b.x+b.w/2,cym=b.y+b.h/2;for(let j=Math.floor(cym-rad-1);j<=cym+rad+1;j++)for(let i=Math.floor(cxm-rad-1);i<=cxm+rad+1;i++){if(i<0||j<0||i>=W||j>=H)continue;if(T[j*W+i]===type){const d=Math.hypot(i+.5-cxm,j+.5-cym);if(d<=rad+b.w/2&&d<bd){bd=d;best=j*W+i}}}return best}

 else if(c.job){tx=c.job.x+c.job.w/2;ty=c.job.y+c.job.h+.2;c.mode='job'}
 else{c.mode='idle';c.wt-=dt;if(c.wt<=0){c.wx=c.home.x+rnd(-4,5);c.wy=c.home.y+rnd(-3,5);c.wt=rnd(3,9)}tx=c.wx;ty=c.wy}
 const dx=tx-c.x,dy=ty-c.y,d=Math.hypot(dx,dy);
 if(d>.12){let sp=1.7*dt;const o=OCC[Math.max(0,Math.min(H-1,Math.floor(c.y)))*W+Math.max(0,Math.min(W-1,Math.floor(c.x)))];if(o&&o.k==='road')sp*=1.6;if(S.weather==='storm')sp*=.7;if(danger)sp*=1.4;const st=Math.min(d,sp);c.x+=dx/d*st;c.y+=dy/d*st;c.walk=true}
 else{c.walk=false;if(c.mode==='job')c.work=true}}
function assignJobs(){

 for(const c of C)if(!c.job&&vac.length){let best=-1,bd=1e9;for(let i=0;i<vac.length;i++){const b=vac[i];if(b.n>=jobsOf(b))continue;const pr=(b.k==='farm'||b.k==='orchard'||b.k==='harbor')&&S.res.food<C.length*3?-8:0;const d=Math.hypot(b.x-c.x,b.y-c.y)+pr;if(d<bd){bd=d;best=i}}if(best>=0){c.job=vac[best];c.job.n++}}}

function pickWeather(){const se=season(),r=Math.random();let w='clear';
 if(se===3)w=r<.55?'snow':'clear';else if(se===0)w=r<.3?'rain':'clear';else if(se===1)w=r<.12?'rain':r<.17?'storm':'clear';else w=r<.3?'rain':r<.37?'storm':'clear';
 if(w==='storm'&&S.weather!=='storm'){msg('A thunderstorm rolls in! Work slows down.','bad');sfx('thunder')}

function sec(){
 {const pop=C.length,eat=pop*.75/DAY;if(S.res.food>=eat){S.res.food-=eat;S.starveT=0;S.hungry=0}else{S.res.food=0;S.hungry++;S.starveT=(S.starveT||0)+1;if(S.starveT>=DAY&&pop>2){S.starveT=0;const i=irnd(0,pop-1),c=C[i];ft(c.x,c.y,'left hungry','#f99');C.splice(i,1);msg('A hungry citizen left town. Build more farms!','bad')}}
  let up=0;for(const b of B)if(b.lv>1)up+=2*(b.lv-1);S.res.gold=Math.max(0,S.res.gold+(pop*TAX[S.tax]*(1+bon('tax'))-up)/DAY)}
 recalcHomes();assignJobs();
 const pop=C.length,cap=B.reduce((a,b)=>a+(D[b.k].cap||0),0);S.cap=cap;
 // happiness

 h+=svc*Math.min(1,70/Math.max(pop,1))+Math.min(4,cn('banner')*.5);
 h+=S.res.food<=0?-30:(S.res.food>=pop*3?6:0);h+=TAXH[S.tax];
 let jobs=0;for(const b of B)jobs+=D[b.k].jobs||0;const unemp=C.filter(q=>!q.job).length;if(pop>6&&unemp/pop>.3)h-=6;
 if(S.weather==='storm')h-=3;if(season()===3)h-=2;
 h+=S.mood;S.mood*=.97;if(Math.abs(S.mood)<.2)S.mood=0;S.fear*=.97;h-=S.fear;
 S.target=h;{const tg=Math.max(0,Math.min(100,h));S.happy+=(tg-S.happy)*.12*(tg<S.happy?DIF[S.dif].hap:1)}
 // growth
 S.growT++;const iv=6+(1-S.happy/100)*14;
 if(pop<cap&&S.res.food>0&&S.happy>=30&&S.growT>=iv){S.growT=0;const hs=freeHouse(28,28);if(hs){const side=irnd(0,3);const ex=side===0?0:side===1?W-1:irnd(2,W-3),ey=side===2?0:side===3?H-1:irnd(2,H-3);spawnCit(hs,Math.max(1,ex),ey)}}
 if(S.happy<18&&pop>4&&Math.random()<.15){const i=irnd(0,pop-1);ft(C[i].x,C[i].y,'moved away','#f99');C.splice(i,1);msg('Unhappy citizens are leaving!','bad')}
 // training
 for(const b of B){const d=D[b.k];if(d.train){const mine=SO.filter(s=>s.home===b).length;b.tt++;if(mine<d.train+(cn('training')?2:0)&&b.tt>=6&&S.res.arms>=1&&S.res.gold>=15){b.tt=0;S.res.arms--;S.res.gold-=15;SO.push({x:b.x+b.w/2,y:b.y+b.h,hp:40,home:b,cd:0,off:rnd(-1.5,1.5),off2:rnd(0,1.5)});ft(b.x+1,b.y,'+Soldier','#8cf')}}}
 if(S.trader){S.trader.t--;if(S.trader.t<=0){S.trader=null;$('offer').classList.add('hidden');msg('The trader packed up and left.')}}
 if(!RA.length)for(const b of B)if(b.hp<maxhp(b.k))b.hp=Math.min(maxhp(b.k),b.hp+1.5);
 if(cn('tower')>=3&&cn('wall')>=10)ach('fort');if(SO.length>=8)ach('army');
 maybeChallenge();raidCheck();{const hd=Math.floor(OD());if(S.dif===0&&HINTS[hd]&&S.lastHint!==hd){S.lastHint=hd;msg(HINTS[hd])}}

 if(!S.over){if(OD()>4&&C.length===0&&S.everPop>2&&!SC[S.sc].free)end(false,'Everyone has moved away. The kingdom is empty.');
  else if(S.hadCastle&&!cn('castle')&&S.sc===4)end(false,'The castle fell to the bandits!');

function sim(dt){
 S.t+=dt;S.tod+=dt/(DAY*M());if(S.tod>=1){S.tod-=1;S.day++;newDay()}
 S.acc+=dt;if(S.acc>=1){S.acc-=1;sec()}

 if(S.pending){S.pending.t-=dt;if(S.pending.t<=0)spawnRaid()}
 for(const b of B)b.present=0;
 for(const c of C){moveCit(c,dt);if(c.work)c.job.present++}
 prod(dt);mil(dt);
 let rp=.1+bon('rp');for(const b of B){const d=D[b.k];if(d.rp)rp+=d.rp*(d.jobs?b.present/jobsOf(b):1)}S.rp+=rp*dt;S.rpRate=rp;
 if(CART){CART.t+=dt;const tx=CART.arrived?CART.ex:CART.tx,ty=CART.arrived?CART.ey:CART.ty,dx=tx-CART.x,dy=ty-CART.y,d=Math.hypot(dx,dy);if(d>.3){CART.x+=dx/d*2.2*dt;CART.y+=dy/d*2.2*dt}else if(CART.arrived)CART=null;else CART.arrived=1;if(CART&&CART.arrived&&!S.trader)CART.leave=1}
 for(let i=PR.length-1;i>=0;i--){const p=PR[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.g)p.vy+=90*dt;if(p.life<=0)PR.splice(i,1)}
 for(let i=AR.length-1;i>=0;i--){AR[i].t+=dt;if(AR[i].t>.25)AR.splice(i,1)}
 flash=Math.max(0,flash-dt*2);if(S.weather==='storm'&&Math.random()<dt*.15){flash=1;sfx('thunder')}}
function mult(b){const k=b.k,se=season();let m=1+bon(k);
 if(k==='farm'){m*=sd([1,1.2,1.3,DIF[S.dif].win+bon('winter')][se]);if(S.weather==='rain')m*=1.15}
 else if(k==='orchard')m*=sd([.6,1.2,2,0][se]);else if(k==='harbor'&&se===3)m*=sd(.6);
 else if(k==='lumber'&&se===3)m*=sd(.8);
 if(S.weather==='storm')m*=.7;return m}
function prod(dt){
 const mk=Math.min;
 for(const b of B){const d=D[b.k];if(!d.cyc)continue;const rate=d.jobs?b.present/jobsOf(b):1;
  if(rate<=0){b.st=b.n?'workers resting':'needs workers';continue}
  const m=mult(b);if(m<=0){b.st='out of season';continue}
  if(b.prog<d.cyc)b.prog+=dt*rate*m;
  if(b.prog<d.cyc){b.st='working';continue}
  if(d.need){const t=nearTile(b,d.need,d.rad);if(t===null){b.st='nothing nearby to gather';continue}b.tile=t}
  const IO=io(b),inn=IO.inn;let ok=true;for(const r in inn)if(S.res[r]<inn[r]){b.st='needs '+RES[r][1];ok=false;break}
  if(!ok)continue;
  const out=IO.out;
  for(const r in out)if(r!=='gold'&&S.res[r]>=storCap()){b.st='storage full';ok=false;break}
  if(!ok)continue;
  for(const r in inn)S.res[r]-=inn[r];
  for(const r in out){let n=out[r];if(r==='gold'&&d.outf){const u5=5*(b.lv-1);n=(n-u5)*(1+bon('trade')*.5)+u5}addRes(r,n);if(view.z>.5)ft(b.x+b.w/2,b.y,'+'+(Math.round(n*10)/10)+RES[r][0],'#fff',11)}
  if(d.need===2&&Math.random()<.12){T[b.tile]=0;buildMiniPx(b.tile)}
  if(d.need===3&&Math.random()<.08){T[b.tile]=0;buildMiniPx(b.tile)}
  b.prog-=d.cyc;b.st='working'}}

function spawnRaid(){const n=S.pending.n,side=S.pending.side;S.pending=null;S.kills=0;S.raidActive=n;
 for(let i=0;i<n;i++){let x,y,t=0;do{x=side===0?1:side===1?W-2:irnd(3,W-4);y=side===2?1:side===3?H-2:irnd(3,H-4);x+=rnd(-1.5,1.5);y+=rnd(-1.5,1.5);t++}while(t<20&&(x<0||y<0||x>=W||y>=H||T[Math.floor(y)*W+Math.floor(x)]===1));
  const hp=(26+OD()*.4)*DIF[S.dif].rhp;RA.push({x:Math.max(.5,Math.min(W-.5,x)),y:Math.max(.5,Math.min(H-.5,y)),hp,mhp:hp,tg:null,life:0,flee:false,loot:0,cd:0,hit:0,spd:1.1+Math.random()*.2})}

function mil(dt){
 for(let i=RA.length-1;i>=0;i--){const r=RA[i];r.life+=dt;r.cd-=dt;r.hit=Math.max(0,r.hit-dt);
  if(r.hp<=0){S.kills++;burst(r.x,r.y,'⭐',6);ft(r.x,r.y,'POOF!','#ff0',14);sfx('boom');RA.splice(i,1);continue}
  if(!r.flee&&(r.hp<r.mhp*.3||r.loot>=24||r.life>110)){r.flee=true;if(r.hp<r.mhp*.3){S.kills++;ft(r.x,r.y,'Ow! Run!','#ff0',13)}}
  if(r.flee){const tx=r.x<W/2?-2:W+2,dx=tx-r.x,d=Math.abs(dx);r.x+=Math.sign(dx)*1.6*dt;if(r.x<-1.5||r.x>W+1.5){RA.splice(i,1)}continue}
  // soldier fight
  let ns=null,nd=1.1;for(const s of SO){const d=Math.hypot(s.x-r.x,s.y-r.y);if(d<nd){nd=d;ns=s}}
  if(ns){ns.hp-=4*dt;r.hit=.2;continue}
  if(!r.tg||r.tg.dead){let bd=1e9;r.tg=null;for(const b of B){if(b.k==='road')continue;const d=Math.hypot(b.x+b.w/2-r.x,b.y+b.h/2-r.y);if(d<bd){bd=d;r.tg=b}}}
  if(!r.tg)continue;
  const tx=r.tg.x+r.tg.w/2,ty=r.tg.y+r.tg.h/2,dx=tx-r.x,dy=ty-r.y,d=Math.hypot(dx,dy)||1,sp=r.spd*dt;
  const nx=r.x+dx/d*sp,ny=r.y+dy/d*sp,o=OCC[Math.max(0,Math.min(H-1,Math.floor(ny)))*W+Math.max(0,Math.min(W-1,Math.floor(nx)))];
  if(o&&o.k!=='road'){o.hp-=4.5*dt;r.hit=.2;r.tt=(r.tt||0)+dt;sfx('hit');if(r.tt>4){r.tt=0;const st=Math.min(S.res.gold,6);S.res.gold-=st;r.loot+=st||6;ft(r.x,r.y,'-'+st+'\u{1FA99}','#fa6')}
   if(o.hp<=0){msg(D[o.k].n+' was destroyed!','bad');removeB(o,false);S.lost++;r.loot+=8}}
  else{r.x=nx;r.y=ny}}
 if(S.raidActive&&!RA.length&&!S.pending)raidOver();
 for(let i=SO.length-1;i>=0;i--){const s=SO[i];s.cd-=dt;
  if(s.hp<=0){burst(s.x,s.y,'\u{1F4A2}',3);SO.splice(i,1);continue}
  let nr=null,nd=24;for(const r of RA){const d=Math.hypot(r.x-s.x,r.y-s.y);if(d<nd){nd=d;nr=r}}
  if(nr){const dx=nr.x-s.x,dy=nr.y-s.y,d=Math.hypot(dx,dy);if(d>.8){s.x+=dx/d*2.3*dt;s.y+=dy/d*2.3*dt}else{nr.hp-=(9+9*bon('sold'))*dt;nr.hit=.2;sfx('hit')}}
  else{const tx=s.home.x+s.home.w/2+s.off,ty=s.home.y+s.home.h+.6+s.off2,dx=tx-s.x,dy=ty-s.y,d=Math.hypot(dx,dy);if(d>.3){s.x+=dx/d*1.8*dt;s.y+=dy/d*1.8*dt}if(s.hp<40)s.hp=Math.min(40,s.hp+3*dt)}}
 for(const b of B){const tw=TW[b.k];if(!tw)continue;b.cd-=dt;if(b.cd>0)continue;let nr=null,nd=tw.rg;
  for(const r of RA){const d=Math.hypot(r.x-(b.x+b.w/2),r.y-(b.y+b.h/2));if(d<nd){nd=d;nr=r}}
  if(nr){b.cd=1.1;nr.hp-=tw.dm*(1+bon('tower'));nr.hit=.2;AR.push({x0:b.x+b.w/2,y0:b.y+b.h/2,x1:nr.x,y1:nr.y,t:0});sfx('arrow')}}}

 let tot=0;L.forEach(e=>tot+=e[1]);let r=Math.random()*tot,ev='bard';for(const e of L){r-=e[1];if(r<=0){ev=e[0];break}}
 if(ev==='storm'){S.weather='storm';S.wT=rnd(20,35);const l=Math.min(S.res.wood,Math.round(irnd(10,25)*DIF[S.dif].ev));S.res.wood-=l;S.mood-=3;msg('Storm! The wind scattered '+Math.floor(l)+' wood.','bad');sfx('thunder')}
 else if(ev==='festival'){if(S.res.food>=15&&S.res.gold>=10){S.res.food-=15;S.res.gold-=10;S.mood+=14;msg('The villagers threw a festival! Everyone is cheering.','good');sfx('event');for(let i=0;i<14;i++)burst(rnd(24,32),rnd(24,32),['\u{1F386}','\u{1F389}','✨'][i%3],1)}else msg('The villagers wanted a festival, but you had too little food or gold.')}
 else if(ev==='trader'){if(S.trader||CART)return;makeTrader()}
 else if(ev==='neigh'){const k=['wood','stone','food','gold'][irnd(0,3)];const n=Math.floor(irnd(25,50)*(1+bon('trade')));addRes(k,n);msg('Friendly neighbours sent a gift: '+n+' '+RES[k][1]+' '+RES[k][0],'good');sfx('event')}
 else if(ev==='harvest'){addRes('food',40);msg('Bumper harvest! +40 food','good');sfx('event')}

 S.trader={k,n,gold,sell,t:60};CART={x:sell?W-2:1,y:28+irnd(-2,3),tx:30,ty:30,ex:sell?W+3:-3,ey:30,arrived:0,t:0};

function io(b){const d=D[b.k],lv=b.lv||1;let out=d.outf?{gold:3+Math.min(C.length,80)*.06}:Object.assign({},d.out||{}),inn=Object.assign({},d.in||{});const up=5*(lv-1);
 if(up&&Object.keys(out).length){const mk=Object.keys(out)[0];out[mk]+=up;for(const r in inn)inn[r]+=Math.round(up/2)}return{out,inn}}

 return (b.k==='warehouse'?'<br>Next level: storage +'+(150+50*b.lv)+' (now +'+(150+50*(b.lv-1))+')':'<br>Next level: makes '+costStr(io(nb).out)+(Object.keys(io(nb).inn).length?', uses '+costStr(io(nb).inn):''))+'<br>Upgrade cost: '+costStr(c)+' (upkeep +2\u{1FA99}/day per level; needs more workers at Lv3, Lv5)<br><button id="upg" '+(ok?'':'disabled')+'>⬆ Upgrade to Lv'+(b.lv+1)+'</button>'}
