<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1a120d;overflow:hidden;font-family:system-ui,Segoe UI,Arial,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(14,9,5,.8);z-index:5;padding:10px;overflow:auto}
.card{background:linear-gradient(#4a3524,#33241a);border:3px solid #e8b04a;border-radius:16px;padding:16px 20px;max-width:680px;width:100%;max-height:96vh;overflow:auto;box-shadow:0 8px 40px #000a}
h1{margin:0 0 4px;font-size:44px;color:#f3c562;text-shadow:3px 3px 0 #6b3a0a;letter-spacing:2px;text-align:center}
h2{margin:0 0 8px;color:#f3c562;text-align:center}
.sub{text-align:center;color:#d4bb94;margin-bottom:10px;font-size:14px}
.btn{display:block;width:100%;margin:8px 0;padding:11px;font-size:18px;font-weight:700;background:#e8a93a;color:#3a1e00;border:0;border-radius:10px;cursor:pointer;box-shadow:0 4px 0 #9a6410}
.btn:hover{background:#f3c562}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #9a6410}
.btn.dim{background:#6f5c48;color:#eee;box-shadow:0 4px 0 #3d3226}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.how{font-size:14px;line-height:1.5;color:#efe0c4;background:#00000033;padding:8px 12px;border-radius:8px}
.row{display:flex;gap:10px;align-items:center;background:#00000033;border-radius:10px;padding:7px 10px;margin:5px 0}
.row .t{flex:1}.row b{color:#ffd98a}.row small{color:#c4b294;display:block}
.row img{width:36px;height:36px;flex:none}
.row .btn{width:auto;margin:0;padding:8px 12px;font-size:15px;min-width:86px;position:relative;overflow:hidden}
.brush .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:#6bdc7a88;pointer-events:none}
.pips{letter-spacing:2px;color:#e8a93a;font-size:12px}
.ach{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ach div{background:#00000033;border-radius:8px;padding:6px 8px;font-size:13px;opacity:.45}
.ach div.on{opacity:1;background:#3b5a1f}
.ach b{display:block;color:#ffd98a}
.pb{height:12px;background:#0006;border-radius:6px;overflow:hidden;flex:1}.pb i{display:block;height:100%;background:#6bdc7a}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.tabs button{flex:1;min-width:58px;padding:6px 2px;font-size:11px;font-weight:700;border:0;border-radius:6px;background:#6f5c48;color:#fff;cursor:pointer}
.tabs button.on{background:#e8a93a;color:#3a1e00}
.lock{opacity:.45}
#top{position:fixed;left:10px;top:94px;z-index:4;display:flex;gap:4px}
#top button{width:40px;height:30px;font-size:10px;font-weight:700;border:2px solid #fff6;border-radius:8px;background:#0007;color:#fff;cursor:pointer;padding:0}
#top button:hover{background:#e8a93a99}
#touch{display:none;position:fixed;inset:0;pointer-events:none;z-index:3}
body.touch #touch{display:block}
#touch button{position:absolute;pointer-events:auto;width:64px;height:64px;border-radius:50%;border:3px solid #fff8;background:#0006;color:#fff;font-size:20px;font-weight:700;touch-action:none}
#touch button:active{background:#e8a93a99}
@media (max-width:640px){h1{font-size:34px}}

const ERAS=[['Ice Age','the last 2.6 million years'],['Tertiary','66 to 2.6 million years ago'],['Cretaceous','145 to 66 million years ago'],['Jurassic','201 to 145 million years ago'],['Triassic','252 to 201 million years ago'],['Permian','299 to 252 million years ago'],['Carboniferous','359 to 299 million years ago'],['Devonian','419 to 359 million years ago'],['Cambrian','539 to 485 million years ago'],['Precambrian','older than 539 million years']];
/* find rows: name, icon kind, color, fun fact (true!) */
const FD=[
[['Mammoth Tusk','tusk','#efe6d2',"Woolly mammoths lived until about 4,000 years ago on Wrangel Island, and their tusks could grow to around 4 metres long."],
 ['Cave Bear Tooth','tooth','#ece0c4',"Cave bears slept through winter in caves all over Europe and died out roughly 24,000 years ago."],
 ['Saber-tooth Cat Fang','tooth','#f4ecd6',"The saber-toothed cat Smilodon had huge upper canine teeth, but they were fairly fragile, so it probably ambushed its prey."],
 ['Mammoth Molar','rock','#cbbfa4',"A mammoth chewed tough grass with big ridged grinding teeth. Elephants and mammoths replace their teeth several times in life."],
 ['Ground Sloth Claw','claw','#d8c9a8',"Some ground sloths grew as big as elephants. Megatherium weighed about four tonnes."],

 for(let i=0;i<12;i++){const cy=ri(SURF+18,CORE_Y-12),x0=ri(3,34),x1=Math.min(W-3,x0+ri(12,34));

 gen((Math.random()*4e9)|0);P=freshPlayer();UPLV={drill:0,fuel:0,cargo:0,hull:0,lamp:0,jet:0,brush:0,radar:0};S=freshStats();ach={};
 resetFx();P.fuel=cap('fuel');P.hull=cap('hull');lastSeenTx=-1;playT=0;hintShown=false}
function resetFx(){rocks=[];gas=[];parts=[];texts=[];toasts=[]}
const lv=id=>UPLV[id]||0;
const UPD=id=>UPS.find(u=>u.id===id);
function cap(id){return UPD(id).vals[lv(id)]}
const cargoN=()=>{let n=0;for(let i=0;i<NF;i++)n+=P.cargo[i]+P.clean[i];return n};
const depthM=()=>Math.max(0,Math.floor(P.y/TS-SURF));
const cleanMult=()=>1.4+.1*lv('brush');
const unitVal=(i,clean)=>Math.round(FINDS[i].v*(clean?cleanMult():1));
const musCount=()=>S.mus.reduce((a,b)=>a+b,0);
const eraMus=e=>{let n=0;for(let j=0;j<10;j++)n+=S.mus[e*10+j];return n};

/* ===== save/load ===== */
function b64(u){let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)}
function unb64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function save(){
 if(!P||!tiles)return;
 try{localStorage.setItem(KEY,JSON.stringify({v:1,seed,P:{x:P.x,y:P.y,fuel:P.fuel,hull:P.hull,cargo:P.cargo,clean:P.clean,coins:P.coins,face:P.face},UPLV,S,ach,
  crit:crits.map(c=>[c.t,Math.round(c.x),Math.round(c.y),c.dir]),tiles:b64(tiles),seen:b64(seen),muted}))}catch(e){}}
function hasSave(){try{return !!localStorage.getItem(KEY)}catch(e){return false}}
function load(){
 try{const raw=localStorage.getItem(KEY);if(!raw)return false;const d=JSON.parse(raw);
  const t=unb64(d.tiles),s=unb64(d.seen);if(t.length!==W*H||s.length!==W*H)return false;
  tiles=t;seen=s;seed=d.seed;P=freshPlayer();Object.assign(P,d.P);UPLV=Object.assign({drill:0,fuel:0,cargo:0,hull:0,lamp:0,jet:0,brush:0,radar:0},d.UPLV);
  S=Object.assign(freshStats(),d.S);ach=d.ach||{};setMute(!!d.muted);resetFx();
  crits=(d.crit||[]).map(a=>{const c=mkCrit(a[0],a[1],a[2]);c.dir=a[3];return c});
  for(const k of['cargo','clean'])while(P[k].length<NF)P[k].push(0);
  lastSeenTx=-1;return true}catch(e){return false}}

/* ===== audio ===== */
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();startDrone()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});return AC}
function startDrone(){try{const o=AC.createOscillator(),o2=AC.createOscillator();droneG=AC.createGain();droneG.gain.value=muted?0:.018;o.type='sine';o.frequency.value=55;o2.type='sine';o2.frequency.value=82.5;o.connect(droneG);o2.connect(droneG);droneG.connect(AC.destination);o.start();o2.start()}catch(e){}}
function setMute(m){muted=m;if(droneG)droneG.gain.value=m?0:.018}
function tone(f,d,type,vol,slide,delay){const a=ac();if(!a||muted)return;try{const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+d);g.gain.setValueAtTime(vol||.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function noise(d,vol,fr,delay){const a=ac();if(!a||muted)return;try{const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=fr||1200;const g=a.createGain();g.gain.value=vol||.1;s.connect(f);f.connect(g);g.connect(a.destination);s.start(a.currentTime+(delay||0))}catch(e){}}
const sfx={
 dig(){noise(.05,.05,900)},collect(){tone(660,.08,'triangle',.06);tone(990,.1,'triangle',.06,0,.07)},
 sell(){[523,659,784,1047].forEach((f,i)=>tone(f,.12,'triangle',.07,0,i*.07))},
 hurt(){tone(160,.25,'sawtooth',.09,-100);noise(.15,.08,500)},
 buy(){tone(440,.08,'square',.05);tone(660,.08,'square',.05,0,.08);tone(880,.15,'square',.05,0,.16)},
 ach(){[784,988,1175,1568].forEach((f,i)=>tone(f,.15,'triangle',.07,0,i*.09))},
 land(){noise(.08,.07,300)},jet(){noise(.06,.03,700)},rumble(){noise(.9,.12,200);tone(60,.8,'sawtooth',.06,-20)},
 hit(){tone(220,.1,'square',.05,-80)},boing(){tone(300,.15,'sine',.08,300)},die(){tone(300,.7,'sawtooth',.1,-250);noise(.5,.15,400)},
 brush(){noise(.06,.04,2500)},donate(){[392,523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.07,0,i*.08))},click(){tone(500,.04,'square',.04)}};
function ambient(dt){
 ambT-=dt;if(ambT>0||!AC||muted)return;ambT=3+Math.random()*6;
 const pent=[262,294,330,392,440],d=depthM();
 if(Math.random()<.5)tone(pent[Math.floor(Math.random()*5)]*(d>100?.5:1),1.6,'sine',.025);
 else tone(1300+Math.random()*400,.09,'sine',.03,-700)}

/* ===== input ===== */
const kb={},tc={};
const KM={KeyA:'l',ArrowLeft:'l',KeyD:'r',ArrowRight:'r',KeyW:'u',ArrowUp:'u',KeyS:'d',ArrowDown:'d'};
const inp=k=>kb[k]||tc[k];
function pressAction(k){
 if(k==='e'){if(state==='play'&&!modal)interact();else if(modal)closeModal()}
 else if(k==='x'){if(state==='play'&&!modal)rescue()}}
addEventListener('keydown',e=>{
 ac();const k=KM[e.code];
 if(k){kb[k]=true;e.preventDefault();return}
 if(e.repeat)return;
 if(e.code==='KeyE'||e.code==='Enter'){if(state==='play'){e.preventDefault();pressAction('e')}}
 else if(e.code==='KeyP'||e.code==='Escape'){if(modal)closeModal();else if(state==='play'||state==='pause')togglePause()}
 else if(e.code==='KeyM'){setMute(!muted);toast(muted?'Sound off':'Sound on')}
 else if(e.code==='KeyN'){toggleMap()}
 else if(e.code==='KeyG'){toggleGfx()}
 else if(e.code==='KeyR'){if(state==='play'&&!modal)rescue()}
 else if(e.code==='KeyT'){if(state==='play'||state==='pause')showAch()}
 else if(e.code==='KeyB'){if(state==='play'||state==='pause')showBook()}
});
addEventListener('keyup',e=>{const k=KM[e.code];if(k)kb[k]=false});
addEventListener('blur',()=>{for(const k in kb)kb[k]=false;if(state==='play'&&!modal)togglePause()});
document.querySelectorAll('#touch button').forEach(b=>{const k=b.dataset.k;
 const dn=e=>{e.preventDefault();ac();document.body.classList.add('touch');if('lrud'.includes(k))tc[k]=true;else pressAction(k)};
 const up=e=>{e.preventDefault();if('lrud'.includes(k))tc[k]=false};
 b.addEventListener('pointerdown',dn);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up)});
if(matchMedia('(pointer:coarse)').matches||'ontouchstart' in window)document.body.classList.add('touch');
document.getElementById('bP').onclick=()=>{ac();if(modal)closeModal();else if(state==='play'||state==='pause')togglePause()};
document.getElementById('bN').onclick=()=>{ac();toggleMap()};
document.getElementById('bM').onclick=()=>{ac();setMute(!muted);toast(muted?'Sound off':'Sound on')};
document.getElementById('bB').onclick=()=>{ac();if(state==='play'||state==='pause')showBook()};
document.getElementById('bT').onclick=()=>{ac();if(state==='play'||state==='pause')showAch()};

/* ===== fx helpers ===== */
function toast(t){if(!toasts)return;toasts.push({t,life:2.6});if(toasts.length>4)toasts.shift()}
function ftext(x,y,t,c){texts.push({x,y,t,c:c||'#fff',life:1.2})}
function burst(x,y,col,n,sp,life,g){if(gfx&&n>=2)vDust(x,y,col,Math.min(3,n>>2));for(let i=0;i<n&&parts.length<500;i++){const a=Math.random()*6.283,s=Math.random()*sp;parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-sp*.3,life:life*(.5+Math.random()*.5),max:life,c:col,s:2+Math.random()*3,g:g===undefined?500:g})}}
function colorOfTile(t,y){if(t>=F0)return FINDS[t-F0].c;if(t===GAS)return'#8be36a';if(t===BOULDER)return'#8a8a8a';return BASECOL[t]||BASECOL[baseTile(y)]}
function unlock(id){if(ach[id])return;ach[id]=1;const a=ACH.find(x=>x[0]===id);toast('Trophy: '+a[1]);sfx.ach();save()}
function checkAch(){
 const d=S.maxDepth,kinds=S.got.reduce((a,b)=>a+b,0),m=musCount();
 if(S.dug>=1)unlock('first_dig');if(S.finds>=1)unlock('first_find');if(S.sales>=1)unlock('first_sale');if(S.cleaned>=1)unlock('first_clean');if(S.donated>=1)unlock('first_don');
 if(d>=50)unlock('d50');if(d>=100)unlock('d100');if(d>=200)unlock('d200');if(d>=300)unlock('d300');
 if(S.maxEra>=3)unlock('jur');if(S.maxEra>=8)unlock('cam');
 if(S.earned>=1000)unlock('e1k');if(S.earned>=10000)unlock('e10k');if(S.earned>=50000)unlock('e50k');
 if(S.finds>=25)unlock('f25');if(S.finds>=200)unlock('f200');
 if(kinds>=25)unlock('k25');if(kinds>=50)unlock('k50');if(kinds>=NF)unlock('k100');
 if(S.ups>=5)unlock('up5');if(UPS.some(u=>lv(u.id)>=u.costs.length))unlock('maxup');
 if(m>=10)unlock('m10');if(m>=50)unlock('m50');if(m>=NF)unlock('m100');
 if(S.eraBonus.some(x=>x))unlock('era1');
 if(S.got[FIDX['T. rex Tooth']])unlock('trex');if(S.got[FIDX['Trilobite']])unlock('trilo');if(S.got[FIDX['Amber with Insect']])unlock('amber');if(S.got[FIDX['Gold Nugget']])unlock('gold');
 if(S.caved&&!P.dead&&P.cave<=0)unlock('cavein');if(S.gasHit)unlock('gas');if(S.deaths>=1)unlock('oops');
 if(S.kills>=10)unlock('crit10');if(S.waterT>=3)unlock('river');if(S.heatT>=15)unlock('heat');if(S.finished)unlock('end')}

/* ===== player actions ===== */
function hurt(amt,cont){
 if(P.dead||state!=='play')return;
 if(!cont){if(P.inv>0)return;P.inv=.8;P.flash=.3;sfx.hurt();shake=Math.max(shake,5)}
 P.hull-=amt;
 if(P.hull<=0)die()}
function die(){
 P.hull=0;P.dead=true;P.deadT=2.4;S.deaths++;sfx.die();shake=12;
 burst(P.x,P.y,'#ffc400',40,260,1.2);burst(P.x,P.y,'#555',30,200,1.2);
 P.cargo.fill(0);P.clean.fill(0);P.dig=null;toast('Rig wrecked! Cargo lost.')}
function respawn(){
 P.coins=Math.floor(P.coins*.9);P.x=33*TS;P.y=SURF*TS-HH-1;P.vx=P.vy=0;P.dead=false;P.hull=cap('hull');P.fuel=Math.max(P.fuel,cap('fuel')*.5);P.inv=2;P.cave=0;
 toast('Repair crew towed you home (-10% coins).');save()}
function rescue(){
 if(depthM()<2){toast('You are already home.');return}
 P.cargo.fill(0);P.clean.fill(0);P.x=33*TS;P.y=SURF*TS-HH-1;P.vx=P.vy=0;P.fuel=Math.max(P.fuel,cap('fuel')*.25);P.dig=null;
 toast('Emergency tow! Cargo was lost.');sfx.hit();save()}
function addFind(i){
 if(cargoN()>=cap('cargo')){ftext(P.x,P.y-24,'CARGO FULL!','#ff6b6b');return false}
 P.cargo[i]++;S.finds++;S.got[i]=1;ftext(P.x,P.y-24,'+'+FINDS[i].n,FINDS[i].c);sfx.collect();return true}
function gasBurst(tx,ty){
 gas.push({x:(tx+.5)*TS,y:(ty+.5)*TS,life:3.2});S.gasHit=1;
 for(let i=0;i<24;i++)parts.push({x:(tx+.5)*TS,y:(ty+.5)*TS,vx:(Math.random()-.5)*90,vy:(Math.random()-.5)*90-20,life:2,max:2,c:'#9ae85a',s:6+Math.random()*6,g:-20});
 const d=Math.hypot(P.x-(tx+.5)*TS,P.y-(ty+.5)*TS);if(d<60){hurt(14);toast('Gas pocket! Back away!')}}
function startFall(tx,ty){if(tileAt(tx,ty)!==BOULDER)return;tiles[idx(tx,ty)]=A;rocks.push({x:(tx+.5)*TS,y:(ty+.5)*TS,vy:0,tile:true,t:.35})}
function clearTile(tx,ty){
 const t=tileAt(tx,ty);if(t===A||t===BEDROCK||t===WATER)return false;
 tiles[idx(tx,ty)]=A;
 if(t>=F0){const i=t-F0;if(i===GREAT){S.got[i]=1;S.mus[i]=1;S.finds++;burst((tx+.5)*TS,(ty+.5)*TS,'#ffe27a',60,300,1.4);ending()}else addFind(i)}
 else if(t===GAS)gasBurst(tx,ty);
 burst((tx+.5)*TS,(ty+.5)*TS,colorOfTile(t,ty),5,120,.6);
 S.dug++;if(tileAt(tx,ty-1)===BOULDER)startFall(tx,ty-1);
 if(ty-SURF>30&&Math.random()<.006&&P.cave<=0){P.cave=1.2;sfx.rumble();toast('Rumble... cave-in!')}
 return true}
function dropRocks(){
 const tx=Math.floor(P.x/TS);let cy=Math.floor(P.y/TS);
 for(let k=0;k<8&&!solid(tx,cy-1);k++)cy--;
 for(let dx=-1;dx<=1;dx++){const x=tx+dx;if(!solid(x,cy)&&Math.random()<.85)rocks.push({x:(x+.5)*TS,y:cy*TS+10,vy:0,tile:false,t:0})}
 S.caved=1}
function killCrit(c){S.kills++;const v=3+c.t*2;P.coins+=v;S.earned+=v;ftext(c.x,c.y-10,'Poof! +'+v,'#ffe066');burst(c.x,c.y,CRIT[c.t].c,14,140,.7);sfx.hit()}

 switch(k){

 case 'feather':c.lineWidth=2;c.beginPath();c.moveTo(-6,9);c.lineTo(6,-9);c.stroke();c.lineWidth=1.3;for(let i=0;i<6;i++){const px=-4+i*2,py=6-i*3;c.beginPath();c.moveTo(px,py);c.lineTo(px-4,py-2);c.moveTo(px,py);c.lineTo(px+4,py+2);c.stroke()}break;

 case 'amber':c.globalAlpha=.9;c.beginPath();c.moveTo(-6,-4);c.quadraticCurveTo(-8,8,2,9);c.quadraticCurveTo(9,6,7,-3);c.quadraticCurveTo(0,-9,-6,-4);c.fill();c.globalAlpha=1;c.fillStyle='#3a2208';ell(0,1,1.8,3,1);c.lineWidth=.8;c.strokeStyle='#3a2208';c.beginPath();c.moveTo(-3,0);c.lineTo(3,1);c.moveTo(-3,3);c.lineTo(3,3);c.moveTo(-2,-3);c.lineTo(-4,-5);c.moveTo(2,-3);c.lineTo(4,-5);c.stroke();break;

/* ===== update ===== */
function boxHit(x,y){
 const x0=Math.floor((x-HW)/TS),x1=Math.floor((x+HW-.01)/TS),y0=Math.floor((y-HH)/TS),y1=Math.floor((y+HH-.01)/TS);
 for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(solid(tx,ty))return true;return false}
function moveP(dx,dy){
 let hx=0,hy=0;const n=Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))/1.5)||1,sx=dx/n,sy=dy/n;
 for(let i=0;i<n;i++){
  if(sx){P.x+=sx;if(boxHit(P.x,P.y)){P.x-=sx;hx=sx>0?1:-1;P.vx=0}}
  if(sy){P.y+=sy;if(boxHit(P.x,P.y)){P.y-=sy;hy=sy>0?1:-1}}}
 return[hx,hy]}
function heatDps(){const d=depthM();return Math.max(0,(d-190)*.02-lv('hull')*.3)}
function updatePlayer(dt){
 const L=inp('l'),R=inp('r'),U=inp('u'),D=inp('d'),fuelOk=P.fuel>0,jl=lv('jet');
 const inWater=tileAt(Math.floor(P.x/TS),Math.floor(P.y/TS))===WATER;
 let ax=0;if(fuelOk){if(L)ax--;if(R)ax++}
 if(ax)P.face=ax;
 P.vx+=(ax*150-P.vx)*Math.min(1,dt*(P.onGround?14:6));
 if(inWater){P.vx+=curDir(Math.floor(P.y/TS))*500*dt;S.waterT+=dt;P.vy*=.96;if(Math.random()<dt*8)parts.push({x:P.x,y:P.y-8,vx:0,vy:-30,life:.8,max:.8,c:'#bfe8ff',s:3,g:-20})}
 P.thrust=false;
 if(U&&fuelOk){P.vy-=(1500+jl*200)*dt;P.thrust=true;
  if(Math.random()<dt*14){parts.push({x:P.x+(Math.random()-.5)*8,y:P.y+HH,vx:(Math.random()-.5)*30,vy:120+Math.random()*60,life:.35,max:.35,c:Math.random()<.5?'#ffb300':'#ff5a1c',s:3,g:0})}
  sfxT-=dt;if(sfxT<=0){sfx.jet();sfxT=.12}}
 P.vy+=GRAV*dt*(inWater?.5:1);
 const maxUp=130+jl*35;if(P.vy<-maxUp)P.vy=-maxUp;if(P.vy>560)P.vy=560;
 const pre=P.vy,px0=P.x,py0=P.y,r=moveP(P.vx*dt,P.vy*dt);
 if(P.thrust)P.fuel-=.02*Math.hypot(P.x-px0,P.y-py0)/TS;   // 0.02 fuel for every block you fly
 if(r[1]){if(r[1]===1&&pre>430){hurt((pre-430)*.09);sfx.land();burst(P.x,P.y+HH,'#aa8866',8,100,.4)}else if(r[1]===1&&pre>200)sfx.land();P.vy=0}
 P.onGround=boxHit(P.x,P.y+1.5);
 let tg=null;
 if(fuelOk){
  if(D&&!L&&!R){const ty=Math.floor((P.y+HH+2)/TS);let tx=Math.floor(P.x/TS);if(!solid(tx,ty)){const a1=Math.floor((P.x-HW+1)/TS),a2=Math.floor((P.x+HW-1)/TS);tx=solid(a1,ty)?a1:(solid(a2,ty)?a2:tx)}if(P.onGround&&solid(tx,ty)){tg=[tx,ty];P.digDir=[0,1];P.x+=(((tx+.5)*TS)-P.x)*Math.min(1,dt*10)}}
  else if(ax){const tx=Math.floor((P.x+ax*(HW+2))/TS),ty=Math.floor((P.y+HH-6)/TS);if(solid(tx,ty)){tg=[tx,ty];P.digDir=[ax,0]}}
  else if(U&&!D){const ty=Math.floor((P.y-HH-2)/TS),tx=Math.floor(P.x/TS);if(solid(tx,ty)&&P.vy>-30){tg=[tx,ty];P.digDir=[0,-1];P.x+=(((tx+.5)*TS)-P.x)*Math.min(1,dt*10)}}}
 if(tg){
  const t=tileAt(tg[0],tg[1]);
  if(t===BEDROCK){P.dig=null;if(Math.random()<dt*3){burst(P.x+P.digDir[0]*16,P.y+P.digDir[1]*16,'#999',1,60,.3)}}
  else if(t>=F0&&t!==F0+GREAT&&cargoN()>=cap('cargo')){P.dig=null;if(!(P.fullMsg>0)){P.fullMsg=1.5;ftext(P.x,P.y-24,'CARGO FULL - go sell!','#ff6b6b')}}
  else{
   const hd=t>=F0?FINDS[t-F0].h+.6+FINDS[t-F0].e*.6:(t>=1&&t<=10?.6+(t-1)*.6:1);
   const need=(hd+.4)*.33/UPD('drill').vals[lv('drill')];
   if(!P.dig||P.dig.x!==tg[0]||P.dig.y!==tg[1])P.dig={x:tg[0],y:tg[1],t:0,need,s:0};
   P.dig.t+=dt;P.dig.s-=dt;
   if(P.dig.s<=0){sfx.dig();P.dig.s=.14;burst((tg[0]+.5)*TS,(tg[1]+.5)*TS,colorOfTile(t,tg[1]),2,90,.4);shake=Math.max(shake,1.2)}
   if(P.dig.t>=P.dig.need){clearTile(tg[0],tg[1]);P.dig=null;P.fuel=Math.max(0,P.fuel-.01)}}}   // 0.01 fuel for every block you break
 else P.dig=null;
 if(P.fullMsg>0)P.fullMsg-=dt;
 if(P.fuel<0)P.fuel=0;
 if(P.fuel===0&&!P.warnedFuel){P.warnedFuel=true;toast('OUT OF FUEL! Press R for an emergency tow.')}
 if(P.fuel>0.5)P.warnedFuel=false;
 const hd=heatDps();P.heat=hd;
 if(hd>0){hurt(hd*dt,true);S.heatT+=dt;if(!P.heatMsg){P.heatMsg=1;toast('It is getting hot down here! Upgrade your hull cooling.')}}
 if(P.inv>0)P.inv-=dt;if(P.flash>0)P.flash-=dt;
