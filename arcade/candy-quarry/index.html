<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Candy Quarry - S.I.P. Arcade</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#ffd9f0;overflow:hidden;font-family:system-ui,Segoe UI,Arial,sans-serif;color:#5a2a5a;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(120,50,120,.45);z-index:5;padding:10px;overflow:auto}
.card{background:linear-gradient(#fff8fd,#ffe3f4);border:4px solid #ff7ac8;border-radius:20px;padding:16px 20px;max-width:660px;width:100%;max-height:96vh;overflow:auto;box-shadow:0 8px 40px #7a2a7a88}
h1{margin:0 0 2px;font-size:46px;color:#ff4fa8;text-shadow:3px 3px 0 #ffd23a,5px 5px 0 #c93f8a;letter-spacing:2px;text-align:center}
h2{margin:0 0 8px;color:#e0408f;text-align:center}
.sub{text-align:center;color:#a0549a;margin-bottom:10px;font-size:14px}
.btn{display:block;width:100%;margin:8px 0;padding:11px;font-size:18px;font-weight:700;background:#ff6fb5;color:#fff;border:0;border-radius:12px;cursor:pointer;box-shadow:0 4px 0 #c93f8a;font-family:inherit}
.btn:hover{background:#ff86c2}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c93f8a}
.btn.dim{background:#b79ac6;box-shadow:0 4px 0 #8a6a9c}
.btn.go{background:#3ec9a0;box-shadow:0 4px 0 #1f8f70}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.how{font-size:14px;line-height:1.5;color:#6a3a6a;background:#ffffff99;padding:8px 12px;border-radius:10px}
.row{display:flex;gap:10px;align-items:center;background:#ffffffaa;border-radius:12px;padding:7px 10px;margin:6px 0}
.row .t{flex:1}.row b{color:#c0307a}.row small{color:#9a6a96;display:block}
.row .btn{width:auto;margin:0;padding:8px 12px;font-size:15px;min-width:96px}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #0003}
.pips{letter-spacing:2px;color:#ff4fa8;font-size:13px}
.ach,.book{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.book{grid-template-columns:repeat(5,1fr)}
.ach div{background:#ffffff88;border-radius:10px;padding:6px 8px;font-size:13px;opacity:.5}
.ach div.on{opacity:1;background:#d6ffe9}
.ach b{display:block;color:#c0307a}
.book div{background:#ffffffaa;border-radius:10px;padding:4px;font-size:10px;text-align:center;min-height:62px}
.book img{width:28px;height:28px;display:block;margin:0 auto 2px}
.book .q{font-size:20px;color:#c9a0c4;line-height:28px}
#hud{position:fixed;right:8px;top:8px;z-index:4;display:flex;gap:6px}
#hud button{height:40px;min-width:40px;padding:0 10px;border-radius:12px;border:3px solid #fff;background:#ff6fb5;color:#fff;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 3px 0 #c93f8a;font-family:inherit}
#hud button:active{transform:translateY(2px)}
#touch{display:none;position:fixed;inset:0;pointer-events:none;z-index:3}
body.touch #touch{display:block}
#touch button{position:absolute;pointer-events:auto;width:64px;height:64px;border-radius:50%;border:3px solid #fff;background:#ff6fb5aa;color:#fff;font-size:20px;font-weight:700;touch-action:none}
#touch button:active{background:#ffd23acc}
@media (max-width:640px){h1{font-size:34px}.book{grid-template-columns:repeat(4,1fr)}}
</style></head><body>

 else if(k==='sell'){[784,988,1175,1568].forEach((f,i)=>tone(f,t+i*.06,.18,'triangle',.25))}

  '<button class="btn" data-a="charge1"'+(miss>0?'':' disabled')+'>Charge +1.00  (2 coins)</button><button class="btn go" data-a="chargeall"'+(miss>0?'':' disabled')+'>Fill up  ('+cost+' coins)</button>'}
 else if(kind==='kitchen'){const miss=Math.ceil(maxHp()-G.hp),cost=Math.ceil(miss/2);
  h='<h2>Repair Kitchen</h2><div class="sub">Hull: <b>'+Math.ceil(G.hp)+' / '+maxHp()+'</b>  -  Coins: <b>'+G.coins+'</b></div><div class="how">The chefs patch up your drill-mobile with gummy glue. 1 coin fixes 2 hull.</div><button class="btn go" data-a="repair"'+(miss>0?'':' disabled')+'>Repair all  ('+cost+' coins)</button>'}
 else if(kind==='bakery'){h='<h2>Upgrade Bakery</h2><div class="sub">Coins: <b>'+G.coins+'</b></div>';
  for(const u of UPG){const l=G.upg[u.id],mx=l>=UMAX,c=upCost(u,l);h+='<div class="row"><div class="t"><b>'+u.n+'</b> '+pips(l)+'<small>'+u.d+'</small></div><button class="btn" data-a="buy" data-id="'+u.id+'"'+(mx||G.coins<c?' disabled':'')+'>'+(mx?'MAX':'Buy '+c)+'</button></div>'}}
 else if(kind==='book'){h='<h2>Sweet-Tooth Book</h2><div class="sub">Discovered '+dcount()+' of 100 sweets</div>';
  for(let t=0;t<5;t++){h+='<div class="sub"><b>'+TIERNAMES[t]+'</b></div><div class="book">';for(let k=0;k<20;k++){const i=t*20+k+1,o=ORES[i];h+=G.disc[i]?'<div><img src="'+oreUrl(i)+'"><b>'+o.n+'</b><br>'+o.v+'c</div>':'<div class="q">?<br><small>'+o.v+'c</small></div>'}h+='</div>'}}
 else if(kind==='ach'){let n=0;h='';for(const a of ACH)if(G.ach[a[0]])n++;h='<h2>Trophies  ('+n+' / '+ACH.length+')</h2><div class="ach">';for(const a of ACH)h+='<div class="'+(G.ach[a[0]]?'on':'')+'"><b>'+a[1]+'</b>'+a[2]+'</div>';h+='</div>'}
 else if(kind==='pause'){h='<h2>Paused</h2><button class="btn go" data-a="close">Resume</button><button class="btn" data-a="mute">Sound: '+(G.muted?'OFF':'ON')+'</button><button class="btn dim" data-a="saveq">Save game</button><button class="btn dim" data-a="gfx">Graphics: '+GFXN()+'</button>'}
 h+=(kind==='pause'?'':'<button class="btn dim" data-a="close">Close</button>');showOv(h)}
function closeMenu(){hideOv();if(G.mode==='menu'||G.mode==='paused')G.mode='play';save()}
function titleScreen(){G.mode='title';showOv('<h1>Candy Quarry</h1><div class="sub">S.I.P. Arcade</div><div class="how"><b>How to play:</b> Drive your drill-mobile through the sweet underground. Hold <b>Arrows / WASD</b> to move and dig, <b>Up</b> to spin the rotor and fly. Collect 100 different sweets, sell them at the Candy Shop, charge the battery, and upgrade at the Bakery. Dig all the way to the <b>Sugar Core</b>!<br><br>Watch out for sticky caramel, hot fudge, falling gumdrops, fizzy gas and grumpy marshmallows (squish them with your drill!). <b>E</b> = enter a building, <b>P</b> = pause, <b>M</b> = sound, <b>B</b> = book, <b>T</b> = trophies, <b>N</b> = map on/off.</div>'+(hasSave()?'<button class="btn go" data-a="cont">Continue</button><button class="btn dim" data-a="new">New game</button>':'<button class="btn go" data-a="new">Play</button>'))}
let newConfirm=0;
ov.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a;initAudio();if(AC&&AC.state==='suspended')AC.resume();
 if(a==='cont'){if(!load())resetAll();startPlay()}
 else if(a==='new'){if(hasSave()&&!newConfirm){newConfirm=1;b.textContent='Really start over? Click again';return}newConfirm=0;resetAll();startPlay()}
 else if(a==='close')closeMenu();
 else if(a==='keep'){hideOv();G.mode='play'}
 else if(a==='home'){hideOv();respawnPos();G.mode='play';save()}
 else if(a==='mute'){setMute(!G.muted);openMenu('pause')}
 else if(a==='gfx'){toggleGfx()}
 else if(a==='saveq'){save();toast('Game saved!','#2fb890');sfx('ui')}
 else if(a==='sell1'){const id=+b.dataset.id,o=ORES[id],n=G.inv[id];G.inv[id]=0;sell(n*o.v);openMenu('shop')}
 else if(a==='sellall'){sell(cargoVal());for(let i=1;i<=100;i++)G.inv[i]=0;openMenu('shop')}
 else if(a==='charge1'){const need=Math.min(100,maxFuel()-G.fuel);if(G.coins>=2&&need>0){G.coins-=2;G.fuel+=need;sfx('buy');save()}else sfx('no');openMenu('charger')}
 else if(a==='chargeall'){const miss=maxFuel()-G.fuel;let units=Math.min(miss,G.coins*50);if(units>0){G.coins-=Math.ceil(units/50);G.fuel+=units;sfx('buy');save()}else sfx('no');openMenu('charger')}
 else if(a==='repair'){const miss=Math.ceil(maxHp()-G.hp);const fix=Math.min(miss,G.coins*2);if(fix>0){G.coins-=Math.ceil(fix/2);G.hp=Math.min(maxHp(),G.hp+fix);sfx('buy');save()}else sfx('no');openMenu('kitchen')}
 else if(a==='buy'){const u=UPG.find(x=>x.id===b.dataset.id),l=G.upg[u.id],c=upCost(u,l);if(l<UMAX&&G.coins>=c){G.coins-=c;G.upg[u.id]++;G.S.bought++;if(u.id==='hull')G.hp+=25;if(u.id==='battery')G.fuel+=500;sfx('buy');toast(u.n+' upgraded!','#2fb890');checkAch();save()}else sfx('no');openMenu('bakery')}});
function sell(v){if(v<=0)return;G.coins+=v;G.S.earned+=v;G.S.sales++;sfx('sell');for(let i=0;i<40;i++)confetti.length<80&&confetti.push({x:Math.random(),y:-.05,vy:.4+Math.random()*.4,c:SPR[i%6],r:3+Math.random()*3,s:0});toast('Sold for '+v+' coins!','#e0a000');checkAch();save()}
setInterval(()=>{if(G.mode!=='end')confetti=confetti.filter(c=>c.y<1)},1500);
function startPlay(){hideOv();G.mode='play';P.cx=Math.floor(P.x/TS);P.cy=Math.floor(P.y/TS);curLayer=layerAt(Math.floor(P.y/TS));cam.x=P.x-cv.width/sc/2;cam.y=P.y-cv.height/sc/2;setMute(G.muted)}
function interact(){if(G.mode!=='play')return;const b=nearBld();if(b){sfx('ui');openMenu(b.id)}}

addEventListener('keydown',e=>{initAudio();if(AC&&AC.state==='suspended')AC.resume();const k=e.key;if(KM[k]){K[KM[k]]=1;if(G.mode==='play')e.preventDefault();return}

 else if(k==='p'||k==='P')togglePause();
 else if(k==='n'||k==='N')toggleMap();
 else if(k==='m'||k==='M')setMute(!G.muted);
 else if(k==='g'||k==='G')toggleGfx();
 else if(k==='b'||k==='B'){if(G.mode==='play')openMenu('book');else if(menuKind==='book')closeMenu()}
 else if(k==='t'||k==='T'){if(G.mode==='play')openMenu('ach');else if(menuKind==='ach')closeMenu()}
 else if(k==='Escape'){if(G.mode==='menu')closeMenu();else if(G.mode==='play')togglePause()}});
addEventListener('keyup',e=>{if(KM[e.key])K[KM[e.key]]=0});
addEventListener('blur',()=>{K.l=K.r=K.u=K.d=0});

document.querySelectorAll('#touch button').forEach(b=>{const k=b.dataset.k;const on=e=>{e.preventDefault();initAudio();if(k==='e')interact();else K[k]=1};const off=e=>{e.preventDefault();if(k!=='e')K[k]=0};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)});

 if(G.time-mmT>.4||top!==mmTop){mmT=G.time;mmTop=top;const im=mmG.createImageData(W,100);for(let y=0;y<100;y++)for(let x=0;x<W;x++){const i=(y*W+x)*4,gy=top+y;let c=gy<SURF?0x8fd8ff:(tiles[gy*W+x]?MC[tiles[gy*W+x]]:0x40204a);if(gy>=SURF&&ore[gy*W+x]&&G.disc[ore[gy*W+x]])c=0xffe040;im.data[i]=c>>16&255;im.data[i+1]=c>>8&255;im.data[i+2]=c&255;im.data[i+3]=235}mmG.putImageData(im,0,0)}
 const mx=w-130,my=56;ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#fffc';rr(ctx,mx-4,my-4,128,208,8);ctx.fill();ctx.imageSmoothingEnabled=false;ctx.drawImage(mmC,mx,my,120,200);ctx.imageSmoothingEnabled=true;
 const px=mx+P.x/TS*2,py=my+(P.y/TS-top)*2;ctx.fillStyle=Math.floor(G.time*4)%2?'#fff':'#e0107a';ctx.fillRect(px-3,py-3,6,6);ctx.strokeStyle='#5a2a5a';ctx.lineWidth=1;ctx.strokeRect(px-3,py-3,6,6)}

addEventListener('resize',resize);resize();
