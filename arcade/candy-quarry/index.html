<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Candy Quarry - S.I.P. Arcade</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#ffd9f0;overflow:hidden;font-family:system-ui,Segoe UI,Arial,sans-serif;color:#5a2a5a;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(120,50,120,.45);z-index:5;padding:10px;overflow:auto}
.card{background:linear-gradient(#fff8fd,#ffe3f4);border:4px solid #ff7ac8;border-radius:20px;padding:16px 20px;max-width:660px;width:100%;max-height:96vh;overflow:auto;box-shadow:0 8px 40px #7a2a7a88}
h1{margin:0 0 2px;font-size:46px;color:#ff4fa8;text-shadow:3px 3px 0 #ffd23a,5px 5px 0 #c93f8a;letter-spacing:2px;text-align:center}
h2{margin:0 0 8px;color:#e0408f;text-align:center}
.sub{text-align:center;color:#a0549a;margin-bottom:10px;font-size:14px}
.btn{display:block;width:100%;margin:8px 0;padding:11px;font-size:18px;font-weight:700;background:#ff6fb5;color:#fff;border:0;border-radius:12px;cursor:pointer;box-shadow:0 4px 0 #c93f8a;font-family:inherit}
.btn:hover{background:#ff86c2}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c93f8a}
.btn.dim{background:#b79ac6;box-shadow:0 4px 0 #8a6a9c}
.btn.go{background:#3ec9a0;box-shadow:0 4px 0 #1f8f70}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.how{font-size:14px;line-height:1.5;color:#6a3a6a;background:#ffffff99;padding:8px 12px;border-radius:10px}
.row{display:flex;gap:10px;align-items:center;background:#ffffffaa;border-radius:12px;padding:7px 10px;margin:6px 0}
.row .t{flex:1}.row b{color:#c0307a}.row small{color:#9a6a96;display:block}
.row .btn{width:auto;margin:0;padding:8px 12px;font-size:15px;min-width:96px}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #0003}
.pips{letter-spacing:2px;color:#ff4fa8;font-size:13px}
.ach,.book{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.book{grid-template-columns:repeat(5,1fr)}
.ach div{background:#ffffff88;border-radius:10px;padding:6px 8px;font-size:13px;opacity:.5}
.ach div.on{opacity:1;background:#d6ffe9}
.ach b{display:block;color:#c0307a}
.book div{background:#ffffffaa;border-radius:10px;padding:4px;font-size:10px;text-align:center;min-height:62px}
.book img{width:28px;height:28px;display:block;margin:0 auto 2px}
.book .q{font-size:20px;color:#c9a0c4;line-height:28px}
#hud{position:fixed;right:8px;top:8px;z-index:4;display:flex;gap:6px}
#hud button{height:40px;min-width:40px;padding:0 10px;border-radius:12px;border:3px solid #fff;background:#ff6fb5;color:#fff;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 3px 0 #c93f8a;font-family:inherit}
#hud button:active{transform:translateY(2px)}
#touch{display:none;position:fixed;inset:0;pointer-events:none;z-index:3}
body.touch #touch{display:block}
#touch button{position:absolute;pointer-events:auto;width:64px;height:64px;border-radius:50%;border:3px solid #fff;background:#ff6fb5aa;color:#fff;font-size:20px;font-weight:700;touch-action:none}
#touch button:active{background:#ffd23acc}
@media (max-width:640px){h1{font-size:34px}.book{grid-template-columns:repeat(4,1fr)}}
</style></head><body>

 else if(k==='sell'){[784,988,1175,1568].forEach((f,i)=>tone(f,t+i*.06,.18,'triangle',.25))}

function drawSky(w,h){const g=ctx.createLinearGradient(0,0,0,SURF*TS-cam.y);g.addColorStop(0,'#7fd4ff');g.addColorStop(1,'#ffe0f4');ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#ffe0f4';ctx.fillRect(0,0,w,h);ctx.setTransform(sc,0,0,sc,0,0);
 const horizon=(SURF*TS-cam.y);if(horizon>0){ctx.fillStyle=g;ctx.fillRect(0,0,w/sc,horizon)}}
function drawWorld(){const vw=cv.width/sc,vh=cv.height/sc;
 ctx.save();ctx.translate(-Math.round(cam.x),-Math.round(cam.y));
 // sun & rainbow & clouds
 const t=G.time;ctx.fillStyle='#ffe96b';ctx.beginPath();ctx.arc(cam.x*.9+vw-110,SURF*TS-190,38,0,7);ctx.fill();ctx.fillStyle='#ff9e3d';ctx.beginPath();ctx.arc(cam.x*.9+vw-122,SURF*TS-198,3,0,7);ctx.arc(cam.x*.9+vw-98,SURF*TS-198,3,0,7);ctx.fill();ctx.strokeStyle='#ff9e3d';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cam.x*.9+vw-110,SURF*TS-186,12,.2,2.9);ctx.stroke();
 const rc=['#ff6f9c','#ffae42','#ffe96b','#7be08a','#6fd6ff','#b48cff'];for(let i=0;i<6;i++){ctx.strokeStyle=rc[i]+'aa';ctx.lineWidth=7;ctx.beginPath();ctx.arc(W*TS*.2,SURF*TS+30,260-i*7,Math.PI,0);ctx.stroke()}
 for(const c of CLOUDS){const x=((c[0]+t*6*c[2])%(W*TS+200))-100,y=SURF*TS-240+c[1];ctx.fillStyle='#ffffffcc';ctx.beginPath();ctx.arc(x,y,22*c[2],0,7);ctx.arc(x+24*c[2],y-8,28*c[2],0,7);ctx.arc(x+52*c[2],y,22*c[2],0,7);ctx.fill()}
 // lollipop trees
 for(const tr of TREES){const x=tr[0]*TS+16,y=SURF*TS;ctx.fillStyle='#fff';ctx.fillRect(x-3,y-70,6,70);ctx.strokeStyle='#ff6f9c';ctx.lineWidth=3;for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(x-3,y-i*14);ctx.lineTo(x+3,y-i*14-7);ctx.stroke()}
  const cols=['#ff6fb5','#7be08a','#ffae42','#6fd6ff'];ctx.fillStyle=cols[tr[1]];ctx.beginPath();ctx.arc(x,y-86,24,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(x,y-86,16,0,5.5);ctx.stroke();ctx.beginPath();ctx.arc(x,y-86,7,0,5.5);ctx.stroke()}
 // underground background
 for(const L of LAYERS){ctx.fillStyle=L.bg;ctx.fillRect(0,L.a*TS,W*TS,(L.b-L.a)*TS)}
 // buildings
 for(const b of BLD)drawBld(b);
 const x0=Math.max(0,Math.floor(cam.x/TS)),x1=Math.min(W-1,Math.floor((cam.x+vw)/TS)),y0=Math.max(0,Math.floor(cam.y/TS)),y1=Math.min(H-1,Math.floor((cam.y+vh)/TS));
 const fr=Math.floor(t*4);
 for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const i=y*W+x,tt=tiles[i];if(!tt)continue;const v=(x*7+y*13)&3;
  let spr=(tt===T.FUDGE||tt===T.FIZZ)?TEX[tt][(fr+x+y)&3]:TEX[tt][v];
  let ox=0;if(tt===T.BOULDER&&wobble[i])ox=Math.sin(t*50)*2;
  ctx.drawImage(spr,x*TS+ox,y*TS,TS+1,TS+1);
  if(y===SURF&&tt!==T.BEDROCK&&tt!==0)ctx.drawImage(FROST,x*TS,y*TS-3);
  if(ore[i]){ctx.drawImage(ORE_SPR[ore[i]],x*TS,y*TS+(ORES[ore[i]].t>=4?Math.sin(t*3+x)*1:0));if(ORES[ore[i]].t>=3&&Math.sin(t*4+x*3+y)>.9){ctx.fillStyle='#fff';ctx.fillRect(x*TS+20,y*TS+6,2,6);ctx.fillRect(x*TS+18,y*TS+8,6,2)}}}
 // dig cracks
 if(P.digCell>=0&&P.digP>0){const x=P.digCell%W,y=Math.floor(P.digCell/W);ctx.strokeStyle='#0008';ctx.lineWidth=2;ctx.beginPath();const n=Math.ceil(P.digP*5);for(let i=0;i<n;i++){ctx.moveTo(x*TS+4+i*5,y*TS+3);ctx.lineTo(x*TS+10+i*4,y*TS+16);ctx.lineTo(x*TS+6+i*5,y*TS+29)}ctx.stroke()}
 for(const c of critters)if(c.x>cam.x-40&&c.x<cam.x+vw+40)drawCritter(c);
 for(const f of fallers)ctx.drawImage(TEX[T.BOULDER][f.v],f.x-16,f.y-16);
 drawPlayer();
 for(const p of parts){ctx.globalAlpha=Math.max(0,Math.min(1,p.life/(p.max||1)));ctx.fillStyle=p.c;if(p.ring){ctx.strokeStyle=p.c;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.stroke()}else{ctx.fillRect(p.x-p.r/2,p.y-p.r/2,p.r,p.r)}}ctx.globalAlpha=1;
 ctx.font='bold 14px system-ui';ctx.textAlign='center';for(const f of floats){ctx.globalAlpha=Math.min(1,f.t);ctx.fillStyle='#fff';ctx.strokeStyle='#5a2a5a';ctx.lineWidth=3;ctx.strokeText(f.txt,f.x,f.y);ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x,f.y)}ctx.globalAlpha=1;
 // sprinkles falling on surface
 ctx.restore()}
function drawBld(b){const x=b.tx*TS,y=SURF*TS,w=4*TS;ctx.save();
 ctx.fillStyle='#00000020';ctx.fillRect(x-4,y-3,w+8,4);
 ctx.fillStyle=b.c;rr(ctx,x+6,y-84,w-12,84,10);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();
 // awning stripes
 for(let i=0;i<8;i++){ctx.fillStyle=i%2?'#fff':'#ff4fa8';ctx.beginPath();ctx.moveTo(x+i*16,y-60);ctx.lineTo(x+i*16+16,y-60);ctx.lineTo(x+i*16+16,y-48);ctx.arc(x+i*16+8,y-48,8,0,Math.PI);ctx.closePath();ctx.fill()}
 ctx.fillStyle='#fff';ctx.fillRect(x+w/2-12,y-34,24,34);ctx.fillStyle='#ffffff99';ctx.fillRect(x+14,y-40,22,18);ctx.fillRect(x+w-36,y-40,22,18);
 ctx.fillStyle='#5a2a5a';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillText(b.n,x+w/2,y-96);
 // icons on roof
 ctx.translate(x+w/2,y-72);ctx.fillStyle='#fff';
 if(b.id==='shop'){ctx.beginPath();ctx.arc(0,0,9,0,7);ctx.fill();ctx.fillStyle='#e0a000';ctx.font='bold 12px system-ui';ctx.fillText('$',0,4)}
 else if(b.id==='charger'){ctx.fillStyle='#ffd23a';ctx.beginPath();ctx.moveTo(3,-10);ctx.lineTo(-6,2);ctx.lineTo(0,2);ctx.lineTo(-3,10);ctx.lineTo(6,-2);ctx.lineTo(0,-2);ctx.closePath();ctx.fill()}
 else if(b.id==='kitchen'){ctx.beginPath();ctx.arc(-4,-2,6,0,7);ctx.arc(4,-2,6,0,7);ctx.arc(0,-6,6,0,7);ctx.fill();ctx.fillRect(-7,0,14,8)}
 else if(b.id==='bakery'){ctx.fillStyle='#fff';rr(ctx,-10,-2,20,10,3);ctx.fill();rr(ctx,-7,-8,14,7,3);ctx.fill();ctx.fillStyle='#ff4fa8';ctx.beginPath();ctx.arc(0,-11,3,0,7);ctx.fill()}
 else{ctx.fillStyle='#fff';rr(ctx,-10,-8,20,16,2);ctx.fill();ctx.fillStyle='#7ae0a0';ctx.fillRect(-1,-8,2,16)}
 ctx.restore()}
function drawCritter(c){const s=1+Math.sin(c.t*8)*.06;ctx.save();ctx.translate(c.x,c.y+11);ctx.scale(1/s,s);ctx.fillStyle='#fff';rr(ctx,-11,-22,22,22,8);ctx.fill();ctx.strokeStyle='#e8c6dc';ctx.lineWidth=1.5;ctx.stroke();
 ctx.fillStyle='#ffb0d0';ctx.beginPath();ctx.arc(-7,-9,2.5,0,7);ctx.arc(7,-9,2.5,0,7);ctx.fill();ctx.fillStyle='#5a2a5a';ctx.fillRect(-6,-16,3,3);ctx.fillRect(3,-16,3,3);ctx.strokeStyle='#5a2a5a';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-8,-19);ctx.lineTo(-3,-17);ctx.moveTo(8,-19);ctx.lineTo(3,-17);ctx.moveTo(-4,-6);ctx.quadraticCurveTo(0,-9,4,-6);ctx.stroke();ctx.restore()}
function drawPlayer(){if(P.hurtT>0&&Math.floor(G.time*20)%2)return;ctx.save();ctx.translate(P.x,P.y);
 const f=P.face;
 // rotor
 const spin=G.time*(P.thrustT>0?40:6);ctx.fillStyle='#fff';ctx.fillRect(-2,-HH-8,4,8);const bl=24*Math.abs(Math.cos(spin));ctx.fillStyle='#ffd23a';ctx.fillRect(-bl,-HH-10,bl*2,3);
 // wheels
 ctx.fillStyle='#5a2a5a';for(const wx of[-9,9]){ctx.beginPath();ctx.arc(wx,HH-3,6,0,7);ctx.fill();ctx.strokeStyle='#ffd23a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(wx+Math.cos(P.wheel)*4,HH-3+Math.sin(P.wheel)*4);ctx.lineTo(wx-Math.cos(P.wheel)*4,HH-3-Math.sin(P.wheel)*4);ctx.stroke()}
 // drill
 let ax=P.aimX,ay=P.aimY;if(!P.digging){ax=f;ay=0}
 ctx.save();ctx.rotate(Math.atan2(ay,ax));ctx.fillStyle='#c9d4e0';ctx.beginPath();ctx.moveTo(10,-8);ctx.lineTo(26,0);ctx.lineTo(10,8);ctx.closePath();ctx.fill();ctx.strokeStyle='#8a96a8';ctx.lineWidth=2;const off=(P.digging?G.time*60:0)%8;for(let i=0;i<3;i++){const px=12+i*4+off*.4;ctx.beginPath();ctx.moveTo(px,-7+i*2);ctx.lineTo(px+3,7-i*2);ctx.stroke()}ctx.restore();
 // body
 ctx.fillStyle='#ff6fb5';rr(ctx,-15,-HH,30,HH+8,8);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#fff';ctx.fillRect(-15,2,30,3);
 ctx.fillStyle='#bff0ff';ctx.beginPath();ctx.arc(f*2,-4,8,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.stroke();
 ctx.fillStyle='#5a2a5a';ctx.fillRect(f*2-4,-6,2.5,3);ctx.fillRect(f*2+1.5,-6,2.5,3);ctx.strokeStyle='#5a2a5a';ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(f*2,-2,3.5,.2,2.9);ctx.stroke();
 ctx.restore()}
function drawDark(w,h){const row=P.y/TS;if(row<SURF)return;const dk=clamp((row-SURF)/(H-SURF),0,1),fade=clamp((row-SURF)/5,0,1),a=(.12+.66*dk)*fade;
 const px=(P.x-Math.round(cam.x)),py=(P.y-Math.round(cam.y)),R=lampR();
 const g=ctx.createRadialGradient(px,py,R*.3,px,py,R);g.addColorStop(0,'rgba(40,10,70,0)');g.addColorStop(1,'rgba(40,10,70,'+a.toFixed(3)+')');ctx.fillStyle=g;ctx.fillRect(0,0,w/sc,h/sc)}
function drawRadar(){const L=G.upg.radar;if(!L)return;const r=2+1.5*L,pc=Math.floor(P.x/TS),pr=Math.floor(P.y/TS),t=G.time;
 ctx.save();ctx.translate(-Math.round(cam.x),-Math.round(cam.y));
 for(let y=Math.max(SURF,Math.floor(pr-r));y<=pr+r;y++)for(let x=Math.max(1,Math.floor(pc-r));x<=pc+r;x++){if(x>=W||y>=H)continue;const d=Math.hypot(x-pc,y-pr);if(d>r)continue;const o=ore[y*W+x];if(!o)continue;
  ctx.strokeStyle=ORES[o].c;ctx.lineWidth=2;ctx.globalAlpha=.4+.4*Math.sin(t*5+x);ctx.beginPath();ctx.arc(x*TS+16,y*TS+16,10+Math.sin(t*5+x)*2,0,7);ctx.stroke()}
 ctx.restore();ctx.globalAlpha=1}
function bar(x,y,w,h,f,c,lab,txt){ctx.fillStyle='#ffffffcc';rr(ctx,x,y,w,h,h/2);ctx.fill();ctx.fillStyle=c;if(f>0){rr(ctx,x+2,y+2,Math.max(h-4,(w-4)*clamp(f,0,1)),h-4,(h-4)/2);ctx.fill()}ctx.fillStyle='#5a2a5a';ctx.font='bold 12px system-ui';ctx.textAlign='left';ctx.fillText(lab,x+8,y+h-5);ctx.textAlign='right';ctx.fillText(txt,x+w-8,y+h-5)}
function drawHud(w,h){ctx.setTransform(1,0,0,1,0,0);
 ctx.fillStyle='#ffffff99';rr(ctx,6,6,236,128,14);ctx.fill();
 bar(12,12,224,20,G.hp/maxHp(),'#ff6f9c','HULL',Math.max(0,Math.ceil(G.hp))+' / '+maxHp());
 bar(12,36,224,20,G.fuel/maxFuel(),'#ffd23a','BATTERY',(G.fuel/100).toFixed(2)+' / '+(maxFuel()/100).toFixed(2));
 bar(12,60,224,20,cargoN()/cap(),'#7be08a','CARGO',cargoN()+' / '+cap());
 ctx.fillStyle='#5a2a5a';ctx.font='bold 16px system-ui';ctx.textAlign='left';ctx.fillText('Coins: '+G.coins,14,100);ctx.font='13px system-ui';const row=Math.max(0,Math.floor(P.y/TS)-SURF);ctx.fillText('Depth '+row+' m  -  '+(P.y/TS<SURF?'Sugar Surface':LAYERS[layerAt(Math.floor(P.y/TS))].n),14,122);
 ctx.fillText('Sweets '+dcount()+'/100',150,100);
 // prompt
 if(G.mode==='play'){const b=nearBld();if(b){ctx.textAlign='center';ctx.font='bold 18px system-ui';ctx.fillStyle='#fff';ctx.strokeStyle='#c93f8a';ctx.lineWidth=4;const tx='Press E: '+b.n;ctx.strokeText(tx,w/2,h-96);ctx.fillText(tx,w/2,h-96)}
  if(G.fuel<=0&&!onSurface()){ctx.textAlign='center';ctx.font='bold 20px system-ui';ctx.fillStyle='#e04040';ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.strokeText('BATTERY EMPTY - rescue in '+Math.max(0,Math.ceil(6-P.strandT))+'s',w/2,90);ctx.fillText('BATTERY EMPTY - rescue in '+Math.max(0,Math.ceil(6-P.strandT))+'s',w/2,90)}}
 // toasts
 let y=40;ctx.textAlign='center';ctx.font='bold 15px system-ui';for(const t of toasts){ctx.globalAlpha=Math.min(1,t.a);const tw=ctx.measureText(t.t).width+24;ctx.fillStyle='#ffffffee';rr(ctx,w/2-tw/2,y-18,tw,26,13);ctx.fill();ctx.fillStyle=t.col;ctx.fillText(t.t,w/2,y);y+=32}ctx.globalAlpha=1;
 if(banner){ctx.globalAlpha=Math.min(1,banner.a);ctx.font='bold 38px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.strokeStyle='#c93f8a';ctx.lineWidth=7;ctx.strokeText(banner.t,w/2,h*.28);ctx.fillText(banner.t,w/2,h*.28);ctx.globalAlpha=1}
 if(G.mode==='end')for(const c of confetti){ctx.fillStyle=c.c;ctx.fillRect(c.x*w,c.y*h,c.r,c.r*(1+Math.sin(c.s)))}}
function render(){const w=cv.width,h=cv.height;drawSky(w,h);ctx.setTransform(sc,0,0,sc,0,0);drawWorld();ctx.setTransform(sc,0,0,sc,0,0);drawDark(w,h);drawRadar();drawHud(w,h);drawMap(w)}
function resize(){cv.width=innerWidth;cv.height=innerHeight;sc=clamp(Math.min(innerHeight/430,innerWidth/520),.7,1.5)}
/* ===== overlays ===== */
let menuKind=null;
function showOv(html){ov.innerHTML='<div class="card">'+html+'</div>';ov.style.display='flex'}
function hideOv(){ov.style.display='none';ov.innerHTML='';menuKind=null}
function pips(l){return'<span class="pips">'+'●'.repeat(l)+'○'.repeat(UMAX-l)+'</span>'}
function openMenu(kind){menuKind=kind;if(G.mode==='play')G.mode='menu';K.l=K.r=K.u=K.d=0;let h='';
 if(kind==='shop'){const ids=[];for(let i=1;i<=100;i++)if(G.inv[i])ids.push(i);ids.sort((a,b)=>ORES[b].v-ORES[a].v);
  h='<h2>Candy Shop</h2><div class="sub">Sell your sweets for coins.  Coins: <b>'+G.coins+'</b></div>';
  if(!ids.length)h+='<div class="how">Your cargo is empty. Dig down and find some sweets!</div>';
  for(const i of ids){const o=ORES[i];h+='<div class="row"><img src="'+oreUrl(i)+'" width=28 height=28><div class="t"><b>'+o.n+'</b> x'+G.inv[i]+'<small>'+o.v+' coins each</small></div><b>'+G.inv[i]*o.v+'</b><button class="btn dim" data-a="sell1" data-id="'+i+'">Sell</button></div>'}
  h+='<button class="btn go" data-a="sellall"'+(ids.length?'':' disabled')+'>Sell all  (+'+cargoVal()+' coins)</button>'}
 else if(kind==='charger'){const miss=maxFuel()-G.fuel,cost=Math.ceil(miss/50);
  h='<h2>Battery Charger</h2><div class="sub">Sugar battery: <b>'+(G.fuel/100).toFixed(2)+' / '+(maxFuel()/100).toFixed(2)+'</b>  -  Coins: <b>'+G.coins+'</b></div><div class="how">Digging a block uses 0.01. Flying one block with the spinner uses 0.02. Charging costs 2 coins per unit.</div>'+
  '<button class="btn" data-a="charge1"'+(miss>0?'':' disabled')+'>Charge +1.00  (2 coins)</button><button class="btn go" data-a="chargeall"'+(miss>0?'':' disabled')+'>Fill up  ('+cost+' coins)</button>'}
 else if(kind==='kitchen'){const miss=Math.ceil(maxHp()-G.hp),cost=Math.ceil(miss/2);
  h='<h2>Repair Kitchen</h2><div class="sub">Hull: <b>'+Math.ceil(G.hp)+' / '+maxHp()+'</b>  -  Coins: <b>'+G.coins+'</b></div><div class="how">The chefs patch up your drill-mobile with gummy glue. 1 coin fixes 2 hull.</div><button class="btn go" data-a="repair"'+(miss>0?'':' disabled')+'>Repair all  ('+cost+' coins)</button>'}
 else if(kind==='bakery'){h='<h2>Upgrade Bakery</h2><div class="sub">Coins: <b>'+G.coins+'</b></div>';
  for(const u of UPG){const l=G.upg[u.id],mx=l>=UMAX,c=upCost(u,l);h+='<div class="row"><div class="t"><b>'+u.n+'</b> '+pips(l)+'<small>'+u.d+'</small></div><button class="btn" data-a="buy" data-id="'+u.id+'"'+(mx||G.coins<c?' disabled':'')+'>'+(mx?'MAX':'Buy '+c)+'</button></div>'}}
 else if(kind==='book'){h='<h2>Sweet-Tooth Book</h2><div class="sub">Discovered '+dcount()+' of 100 sweets</div>';
  for(let t=0;t<5;t++){h+='<div class="sub"><b>'+TIERNAMES[t]+'</b></div><div class="book">';for(let k=0;k<20;k++){const i=t*20+k+1,o=ORES[i];h+=G.disc[i]?'<div><img src="'+oreUrl(i)+'"><b>'+o.n+'</b><br>'+o.v+'c</div>':'<div class="q">?<br><small>'+o.v+'c</small></div>'}h+='</div>'}}
 else if(kind==='ach'){let n=0;h='';for(const a of ACH)if(G.ach[a[0]])n++;h='<h2>Trophies  ('+n+' / '+ACH.length+')</h2><div class="ach">';for(const a of ACH)h+='<div class="'+(G.ach[a[0]]?'on':'')+'"><b>'+a[1]+'</b>'+a[2]+'</div>';h+='</div>'}
 else if(kind==='pause'){h='<h2>Paused</h2><button class="btn go" data-a="close">Resume</button><button class="btn" data-a="mute">Sound: '+(G.muted?'OFF':'ON')+'</button><button class="btn dim" data-a="saveq">Save game</button>'}
 h+=(kind==='pause'?'':'<button class="btn dim" data-a="close">Close</button>');showOv(h)}
function closeMenu(){hideOv();if(G.mode==='menu'||G.mode==='paused')G.mode='play';save()}
function titleScreen(){G.mode='title';showOv('<h1>Candy Quarry</h1><div class="sub">S.I.P. Arcade</div><div class="how"><b>How to play:</b> Drive your drill-mobile through the sweet underground. Hold <b>Arrows / WASD</b> to move and dig, <b>Up</b> to spin the rotor and fly. Collect 100 different sweets, sell them at the Candy Shop, charge the battery, and upgrade at the Bakery. Dig all the way to the <b>Sugar Core</b>!<br><br>Watch out for sticky caramel, hot fudge, falling gumdrops, fizzy gas and grumpy marshmallows (squish them with your drill!). <b>E</b> = enter a building, <b>P</b> = pause, <b>M</b> = sound, <b>B</b> = book, <b>T</b> = trophies, <b>N</b> = map on/off.</div>'+(hasSave()?'<button class="btn go" data-a="cont">Continue</button><button class="btn dim" data-a="new">New game</button>':'<button class="btn go" data-a="new">Play</button>'))}
let newConfirm=0;
ov.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a;initAudio();if(AC&&AC.state==='suspended')AC.resume();
 if(a==='cont'){if(!load())resetAll();startPlay()}
 else if(a==='new'){if(hasSave()&&!newConfirm){newConfirm=1;b.textContent='Really start over? Click again';return}newConfirm=0;resetAll();startPlay()}
 else if(a==='close')closeMenu();
 else if(a==='keep'){hideOv();G.mode='play'}
 else if(a==='home'){hideOv();respawnPos();G.mode='play';save()}
 else if(a==='mute'){setMute(!G.muted);openMenu('pause')}
 else if(a==='saveq'){save();toast('Game saved!','#2fb890');sfx('ui')}
 else if(a==='sell1'){const id=+b.dataset.id,o=ORES[id],n=G.inv[id];G.inv[id]=0;sell(n*o.v);openMenu('shop')}
 else if(a==='sellall'){sell(cargoVal());for(let i=1;i<=100;i++)G.inv[i]=0;openMenu('shop')}
 else if(a==='charge1'){const need=Math.min(100,maxFuel()-G.fuel);if(G.coins>=2&&need>0){G.coins-=2;G.fuel+=need;sfx('buy');save()}else sfx('no');openMenu('charger')}
 else if(a==='chargeall'){const miss=maxFuel()-G.fuel;let units=Math.min(miss,G.coins*50);if(units>0){G.coins-=Math.ceil(units/50);G.fuel+=units;sfx('buy');save()}else sfx('no');openMenu('charger')}

 else if(a==='buy'){const u=UPG.find(x=>x.id===b.dataset.id),l=G.upg[u.id],c=upCost(u,l);if(l<UMAX&&G.coins>=c){G.coins-=c;G.upg[u.id]++;G.S.bought++;if(u.id==='hull')G.hp+=25;if(u.id==='battery')G.fuel+=500;sfx('buy');toast(u.n+' upgraded!','#2fb890');checkAch();save()}else sfx('no');openMenu('bakery')}});
