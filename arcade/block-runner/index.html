function ac(){if(!AC){try{const C=window.AudioContext||window.webkitAudioContext;if(C){AC=new C();master=AC.createGain();master.gain.value=.7;master.connect(AC.destination)}}catch(e){AC=null}}
 if(AC&&AC.state==='suspended'){try{AC.resume()}catch(e){}}return AC}
function tone(f,d,type,v,sl,t0){if(muted||!AC)return;const t=t0||AC.currentTime;const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);
 if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),t+d);g.gain.setValueAtTime(v||.07,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03)}
let nbuf=null;
function noise(d,v,t0){if(muted||!AC)return;if(!nbuf){nbuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=nbuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}
 const t=t0||AC.currentTime,s=AC.createBufferSource(),g=AC.createGain();s.buffer=nbuf;g.gain.setValueAtTime(v||.1,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(g);g.connect(master);s.start(t);s.stop(t+d+.03)}

function build(W,fn){
 const g=[];for(let y=0;y<GH;y++)g.push(Array(W).fill('.'));const mv=[];

  g(x0,x1,top=11){for(let x=x0;x<=x1;x++)for(let y=top;y<GH;y++)g[y][x]='#'},
  gi(x0,x1,top=11){for(let x=x0;x<=x1;x++)for(let y=top;y<GH;y++)g[y][x]=(y===top?'I':'#')},
  p(x,y,w,ch='X'){for(let i=0;i<w;i++)g[y][x+i]=ch},
  wall(x,y0,y1,ch='X'){for(let y=y0;y<=y1;y++)g[y][x]=ch},
  put(x,y,ch){g[y][x]=ch},
  coins(x,y,n){for(let i=0;i<n;i++)if(g[y][x+i]==='.')g[y][x+i]='c'},
  sp(x0,x1,y){for(let x=x0;x<=x1;x++)g[y][x]='^'},
  mh(x,y,gapW,spd=1.2){mv.push({t:'h',x:x*TS,y:y*TS,r:(gapW-3)*TS,s:spd})},
  mv(x,y,r,spd=1){mv.push({t:'v',x:x*TS,y:y*TS,r:r*TS,s:spd})},
  stairs(x,n){for(let i=0;i<n;i++)for(let k=0;k<=i;k++)g[10-k][x+i]='X'}
 };
 fn(a);return {rows:g.map(r=>r.join('')),mv,W};
}

function loadLevel(i){
 lvi=i;const d=LEVELS[i];
 LV={i,W:d.W,th:d.th,name:d.name,g:[],boss:d.boss,bossDead:false,time:0,deaths:0,coinTotal:0,coinGot:0,gemGot:0,done:false};
 ents=[];coinsA=[];gems=[];powers=[];movers=[];checks=[];bullets=[];parts=[];boss=null;flag=null;
 for(let y=0;y<GH;y++){const row=d.rows[y].split('');
  for(let x=0;x<d.W;x++){const c=row[x],px=x*TS,py=y*TS;let keep=false;
   switch(c){
    case '#':case 'X':case 'I':case '^':keep=true;break;
    case 'c':coinsA.push({x:px+16,y:py+16,got:0,ph:Math.random()*6});LV.coinTotal++;break;
    case 'G':gems.push({x:px+16,y:py+16,got:0});break;
    case 'S':startPt={x:px+5,y:py+TS-28};break;
    case 'F':flag={x:px,y:py-TS,w:TS,h:TS*2};break;
    case 'K':checks.push({x:px,y:py,on:0});break;
    case 'e':ents.push(mkEnemy('walk',x,y));break;
    case 'j':ents.push(mkEnemy('jump',x,y));break;
    case 's':ents.push(mkEnemy('shoot',x,y));break;
    case 'h':powers.push({x:px+16,y:py+16,t:'shield',got:0});break;
    case 'w':powers.push({x:px+16,y:py+16,t:'swift',got:0});break;
    case 'B':mkBoss(x,y,d.th);break;
   }
   if(!keep)row[x]='.';}
  LV.g.push(row);}
 for(const m of d.mv)movers.push({t:m.t,bx:m.x,by:m.y,x:m.x,y:m.y,w:96,h:14,r:m.r,s:m.s,ph:0,dx:0,dy:0,pos:0,dir:1});
 // vertical movers: y is bottom-top and moves upward by r
 spawnPt={x:startPt.x,y:startPt.y};
 P={x:startPt.x,y:startPt.y,w:22,h:28,vx:0,vy:0,face:1,onGround:false,onIce:false,coy:0,jb:0,wcoy:0,wdir:0,wall:0,wlock:0,air:0,hp:3,inv:0,shield:false,swift:0,dead:false,deadT:0,ride:null,anim:0,sq:0,sliding:false};
 cam.x=Math.max(0,Math.min(LV.W*TS-VW,P.x-VW/2));cam.y=0;
 state='play';toast(d.name,120);
}
function mkEnemy(type,tx,ty){const w=type==='shoot'?28:26,h=w;return {type,x:tx*TS+(TS-w)/2,y:(ty+1)*TS-h,w,h,vx:type==='walk'?-1:0,vy:0,dir:-1,onGround:false,dead:0,t:Math.floor(Math.random()*60),sh:60+Math.floor(Math.random()*50)}}
function mkBoss(tx,ty,th){const prm=[{hp:3,spd:1.3,jt:130,st:9999},{hp:4,spd:1.7,jt:110,st:150},{hp:5,spd:1.5,jt:100,st:120},{hp:6,spd:1.9,jt:90,st:100}][th];
 let left=tx,right=tx;while(isSolidG(left-1,ty+1))left--;right=LV.W-1;
 boss={x:tx*TS,y:(ty+1)*TS-52,w:56,h:52,vx:0,vy:0,hp:prm.hp,max:prm.hp,spd:prm.spd,jt:prm.jt,jtMax:prm.jt,st:prm.st,stMax:prm.st,inv:0,dead:0,active:false,th,onGround:false,face:-1,L:(tx-14)*TS,R:(LV.W-1)*TS,t:0}}
function isSolidG(tx,ty){return false}

/* ---------- particles ---------- */
function burst(n,x,y,c,sp,life,sz){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=Math.random()*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,l:life*(.5+Math.random()*.5),L:life,c,s:sz||3,g:.12})}}
function dust(x,y,n){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*2,vy:-Math.random()*.8,l:14,L:14,c:'rgba(255,255,255,.7)',s:3,g:0})}

/* ---------- collision helpers ---------- */
function mvx(o){o.x+=o.vx;o.hitX=0;if(o.vx===0)return;
 const x0=Math.floor(o.x/TS),x1=Math.floor((o.x+o.w-.01)/TS),y0=Math.floor(o.y/TS),y1=Math.floor((o.y+o.h-.01)/TS);
 for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(isSolid(tx,ty)){
  if(o.vx>0){o.x=tx*TS-o.w;o.hitX=1}else{o.x=(tx+1)*TS;o.hitX=-1}o.vx=0;return}}
function mvy(o){o.y+=o.vy;o.onGround=false;if(o.vy===0)return;
 const x0=Math.floor(o.x/TS),x1=Math.floor((o.x+o.w-.01)/TS),y0=Math.floor(o.y/TS),y1=Math.floor((o.y+o.h-.01)/TS);
 for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(isSolid(tx,ty)){
  if(o.vy>0){o.y=ty*TS-o.h;o.onGround=true}else{o.y=(ty+1)*TS}o.vy=0;return}}

/* ---------- player ---------- */
function hurt(fromX,force){
 const p=P;if(p.dead||p.inv>0)return;
 if(p.shield){p.shield=false;p.inv=70;sfx('hurt');burst(14,p.x+11,p.y+14,'#8ff',3,26);shake=6;return}
 p.hp--;p.inv=100;sfx('hurt');shake=8;p.vy=-6;p.vx=(p.x+p.w/2<fromX?-1:1)*4;burst(10,p.x+11,p.y+14,'#f55',3,24);
 if(p.hp<=0)die();
}
function die(){const p=P;if(p.dead)return;p.dead=true;p.deadT=55;LV.deaths++;sfx('die');shake=10;burst(26,p.x+11,p.y+14,'#ff6b4a',5,40,4);burst(14,p.x+11,p.y+14,'#fff',4,30,3);p.vx=0;p.vy=0}
function respawn(){const p=P;p.x=spawnPt.x;p.y=spawnPt.y;p.vx=0;p.vy=0;p.dead=false;p.hp=3;p.inv=90;p.shield=false;p.swift=0;p.ride=null;p.onGround=false;
 cam.x=Math.max(0,Math.min(LV.W*TS-VW,p.x-VW/2));bullets.length=0;
 for(const e of ents)if(e.dead===0&&e.type!=='x'){e.vy=0}
}
function rect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

function updatePlayer(){
 const p=P;
 if(p.dead){p.deadT--;if(p.deadT<=0)respawn();return}
 if(p.inv>0)p.inv--;if(p.swift>0)p.swift--;
 // carry by mover
 if(p.ride){p.x+=p.ride.dx;p.y=p.ride.y-p.h;p.ride=null}
 const ax=K.r-K.l;
 if(ax)p.face=ax;
 const maxS=p.swift>0?5.4:4;
 const acc=p.onGround?(p.onIce?.16:.6):.42;
 if(p.wlock>0){p.wlock--}
 else{
  if(ax>0&&p.vx<maxS)p.vx=Math.min(maxS,p.vx+acc);
  else if(ax<0&&p.vx>-maxS)p.vx=Math.max(-maxS,p.vx-acc);
  else if(ax===0){const fr=p.onGround?(p.onIce?.04:.55):.12;if(Math.abs(p.vx)<=fr)p.vx=0;else p.vx-=Math.sign(p.vx)*fr}
  else p.vx*=.96;
 }
 // timers
 if(p.jb>0)p.jb--;if(p.coy>0)p.coy--;if(p.wcoy>0)p.wcoy--;
 if(p.onGround){p.coy=7;p.air=0}
 p.wall=0;
 if(!p.onGround){if(boxSolid(p.x-1,p.y+4,1,p.h-8))p.wall=-1;else if(boxSolid(p.x+p.w,p.y+4,1,p.h-8))p.wall=1}
 if(p.wall){p.wcoy=7;p.wdir=p.wall}
 // jump
 if(p.jb>0){
  if(p.coy>0){p.vy=-11.6;p.jb=0;p.coy=0;sfx('jump');dust(p.x+11,p.y+p.h,4);p.sq=-4}
  else if(p.wcoy>0&&!p.onGround){p.vy=-10.8;p.vx=-p.wdir*5.2;p.wlock=9;p.face=-p.wdir;p.jb=0;p.wcoy=0;p.air=0;sfx('wall');dust(p.x+(p.wdir>0?p.w:0),p.y+14,5)}
  else if(save.dj&&p.air<1){p.vy=-10.4;p.air++;p.jb=0;sfx('dj');burst(8,p.x+11,p.y+p.h,'#fff',2,18)}
 }
 // gravity
 let g=.55;if(p.vy<0&&!K.j)g*=2.5;
 p.vy=Math.min(p.vy+g,11);
 p.sliding=false;
 if(p.wall&&p.vy>0&&ax===p.wall&&!p.onGround){p.vy=Math.min(p.vy,1.7);p.sliding=true;if(tick%5===0)dust(p.x+(p.wall>0?p.w:0),p.y+p.h-6,1)}
 const wasG=p.onGround,preVy=p.vy;
 mvx(p);
 const oldY=p.y;mvy(p);
 // movers (one-way from above)
 if(p.vy>=0||p.onGround){}
 for(const m of movers){
  if(preVy>=0&&!p.onGround&&p.x+p.w>m.x+2&&p.x<m.x+m.w-2&&oldY+p.h<=m.y+10&&p.y+p.h>=m.y){p.y=m.y-p.h;p.vy=0;p.onGround=true;p.ride=m;break}
  if(p.onGround&&!p.ride&&Math.abs(p.y+p.h-m.y)<1&&p.x+p.w>m.x+2&&p.x<m.x+m.w-2){p.ride=m;break}
 }
 if(p.onGround&&!wasG&&preVy>3){sfx('land');dust(p.x+11,p.y+p.h,5);p.sq=5}
 if(p.sq>0)p.sq--;else if(p.sq<0)p.sq++;
 p.onIce=p.onGround&&tileAt(Math.floor((p.x+p.w/2)/TS),Math.floor((p.y+p.h+1)/TS))==='I';
 p.anim+=Math.abs(p.vx)*.15;
 if(p.y>GH*TS+40){die();return}
 // coins
 const pc={x:p.x,y:p.y,w:p.w,h:p.h};
 for(const c of coinsA)if(!c.got&&Math.abs(c.x-(p.x+11))<20&&Math.abs(c.y-(p.y+14))<24){c.got=1;LV.coinGot++;sfx('coin');burst(5,c.x,c.y,'#ffd43b',2,16,2)}
 for(const c of gems)if(!c.got&&Math.abs(c.x-(p.x+11))<22&&Math.abs(c.y-(p.y+14))<26){c.got=1;LV.gemGot++;sfx('gem');burst(18,c.x,c.y,'#ff5de1',4,34,3);toast('Gem found! '+LV.gemGot+'/3',90)}
 for(const c of powers)if(!c.got&&Math.abs(c.x-(p.x+11))<22&&Math.abs(c.y-(p.y+14))<26){c.got=1;sfx('power');
  if(c.t==='shield'){p.shield=true;toast('Shield! Blocks one hit',90)}else{p.swift=600;toast('Swift boots!',90)}burst(12,c.x,c.y,'#fff',3,24)}
 for(const c of checks)if(!c.on&&p.x+p.w>c.x&&p.x<c.x+TS&&Math.abs(p.y+p.h-(c.y+TS))<40){c.on=1;spawnPt={x:c.x+5,y:c.y+TS-28};sfx('check');toast('Checkpoint!',70);burst(10,c.x+16,c.y+10,'#6f6',3,24)}
 // spikes
 {const x0=Math.floor((p.x+3)/TS),x1=Math.floor((p.x+p.w-3)/TS),y0=Math.floor((p.y+p.h-8)/TS),y1=Math.floor((p.y+p.h-1)/TS);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(tileAt(tx,ty)==='^'){const sx=tx*TS+4,sy=ty*TS+14;
   if(p.x+p.w>sx&&p.x<sx+TS-8&&p.y+p.h>sy&&p.y<sy+TS-14){hurt(tx*TS+16);if(!p.dead){p.vy=-8.5}}}
 }
 // goal
 if(flag&&rect(p,flag)){
  if(!LV.boss||LV.bossDead)finishLevel();
  else if(tick%90===0)toast('Defeat the boss first!',80)
 }
}

function stompOK(e){const p=P;return p.vy>0&&(p.y+p.h-p.vy)<=e.y+e.h*.6}

function updateEnemies(){
 const p=P;
 for(const e of ents){
  if(e.dead>0){e.dead--;continue}
  if(e.dead<0)continue;
  e.t++;
  if(e.type==='walk'){
   e.vx=e.dir*1.0;
   const fx=Math.floor((e.x+(e.dir>0?e.w+3:-3))/TS),fy=Math.floor((e.y+e.h+4)/TS),ch=tileAt(fx,Math.floor((e.y+e.h-6)/TS));
   if(e.onGround&&(!isSolid(fx,fy)||ch==='^'))e.dir=-e.dir,e.vx=e.dir;
  }else if(e.type==='jump'){
   if(e.onGround){e.vx=0;if(e.t%70===0){e.vy=-9.5;e.vx=(p.x<e.x?-1:1)*1.6;e.dir=Math.sign(e.vx)}}
  }else{ // shoot
   e.dir=p.x<e.x?-1:1;
   if(Math.abs(p.x-e.x)<440&&Math.abs(p.y-e.y)<200&&e.t%130===e.sh%130){bullets.push({x:e.x+e.w/2,y:e.y+e.h/2,vx:e.dir*2.8,vy:0,r:5,c:'#222',life:240});sfx('shoot')}
  }
  e.vy=Math.min(e.vy+.5,10);
  const dx=e.vx;mvx(e);
  if(e.hitX&&e.type==='walk'){e.dir=-e.dir}
  if(e.hitX&&e.type==='jump'){e.vx=0}
  e.vx=dx;mvy(e);
  if(e.y>GH*TS+50){e.dead=-1;continue}
  if(!p.dead&&rect(p,e)){
   if(stompOK(e)){e.dead=18;p.vy=K.j?-10.5:-7.5;p.air=0;sfx('stomp');burst(10,e.x+e.w/2,e.y+e.h/2,TH[LV.th].en,3,22);if(Math.random()<.5)spawnCoin(e.x+e.w/2,e.y)}
   else hurt(e.x+e.w/2);
  }
 }
}
function spawnCoin(x,y){coinsA.push({x,y:y-4,got:0,ph:0});LV.coinTotal++}

function updateBullets(){
 const p=P;
 for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.x+=b.vx;b.y+=b.vy;b.life--;
  if(b.life<=0||isSolid(Math.floor(b.x/TS),Math.floor(b.y/TS))){bullets.splice(i,1);burst(3,b.x,b.y,'#999',1.5,10,2);continue}
  if(!p.dead&&Math.abs(b.x-(p.x+11))<b.r+10&&Math.abs(b.y-(p.y+14))<b.r+13){bullets.splice(i,1);hurt(b.x)}}
}

function updateBoss(){
 const b=boss,p=P;if(!b)return;
 if(b.dead){if(b.dead>0)b.dead--;return}
 if(!b.active){if(Math.abs(p.x-b.x)<520){b.active=true;toast('Boss! Stomp it on the head!',130);sfx('boss')}else{return}}
 b.t++;if(b.inv>0)b.inv--;
 const dir=p.x+11<b.x+28?-1:1;b.face=dir;
 if(b.onGround){
  b.vx=b.inv>40?0:dir*b.spd;
  b.jt--;if(b.jt<=0){b.vy=-12.5;b.jt=b.jtMax+Math.floor(Math.random()*30);b.vx=dir*b.spd*2.2}
 }
 b.st--;if(b.st<=0){b.st=b.stMax;const n=b.th===3?2:b.th===2?3:1;
  for(let i=0;i<n;i++){const vy=n===1?0:(i-(n-1)/2)*1.4;bullets.push({x:b.x+28,y:b.y+34,vx:dir*3.2,vy:vy*0.6,r:6,c:b.th===2?'#bff':'#f84',life:260})}sfx('shoot')}
 b.vy=Math.min(b.vy+.55,11);
 const vx0=b.vx;mvx(b);b.vx=vx0;mvy(b);
 if(b.x<b.L){b.x=b.L}
 if(b.x+b.w>b.R){b.x=b.R-b.w}
 if(!p.dead&&rect(p,b)){
  if(p.vy>0&&(p.y+p.h-p.vy)<=b.y+22){
   if(b.inv<=0){b.hp--;b.inv=70;b.spd*=1.1;b.stMax=Math.max(40,b.stMax*.92);sfx('boss');shake=10;burst(18,b.x+28,b.y+8,'#fff',4,30);
    if(b.hp<=0){b.dead=60;LV.bossDead=true;burst(60,b.x+28,b.y+26,TH[b.th].boss,6,60,5);burst(30,b.x+28,b.y+26,'#ffd43b',5,50,4);
     for(let i=0;i<8;i++)spawnCoin(b.x+i*7,b.y-8-i*3);bullets.length=0;sfx('win');toast('Boss defeated! Reach the flag!',180);
     if(!save.dj&&LV.i===2){save.dj=1;writeSave();setTimeout(()=>toast('Double Jump unlocked! Press jump in the air',200),1900)}}}
   p.vy=-10.5;p.air=0;
  }else if(b.inv<=0)hurt(b.x+28);
 }
}

function updateMovers(){
 for(const m of movers){
  const ox=m.x,oy=m.y;m.pos+=m.dir*m.s;if(m.pos>=m.r){m.pos=m.r;m.dir=-1}else if(m.pos<=0){m.pos=0;m.dir=1}
  if(m.t==='h'){m.x=m.bx+m.pos;m.y=m.by}else{m.x=m.bx;m.y=m.by-m.pos}
  m.dx=m.x-ox;m.dy=m.y-oy}
}

function updateParts(){for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.x+=q.vx;q.y+=q.vy;q.vy+=q.g;q.l--;if(q.l<=0)parts.splice(i,1)}}

function finishLevel(){
 if(LV.done)return;LV.done=true;state='win';sfx('win');
 let st=1;if(LV.gemGot>=3)st++;if(LV.coinGot>=LV.coinTotal*.8)st++;
 LV.stars=st;if(st>save.s[LV.i])save.s[LV.i]=st;save.coins+=LV.coinGot;writeSave();LV.winT=0;
}

function playUpdate(){
 tick++;
 LV.time++;
 updateMovers();
 updatePlayer();updateEnemies();updateBoss();updateBullets();updateParts();
 // camera
 const p=P,tx=p.x+11-VW/2+p.face*50;cam.x+=(tx-cam.x)*.1;
 cam.x=Math.max(0,Math.min(LV.W*TS-VW,cam.x));
 if(shake>0)shake*=.85;if(toastT>0)toastT--;
 if(!p.dead&&p.x<0)p.x=0;
}
function update(){
 if(state==='play'){playUpdate();music(LV.th)}
 else if(state==='win'){tick++;LV.winT++;updateParts();music(LV.th)}
 else{tick++;music(0)}
}

/* ---------- drawing ---------- */
function R(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function txt(s,x,y,sz,c,al,sh){ctx.font='bold '+sz+'px "Trebuchet MS",Verdana,sans-serif';ctx.textAlign=al||'left';ctx.textBaseline='middle';
 if(sh!==false){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillText(s,x+2,y+2)}ctx.fillStyle=c||'#fff';ctx.fillText(s,x,y)}

function drawBG(th,cx){
 const t=TH[th];const gr=ctx.createLinearGradient(0,0,0,VH);gr.addColorStop(0,t.sky[0]);gr.addColorStop(1,t.sky[1]);ctx.fillStyle=gr;ctx.fillRect(0,0,VW,VH);
 const hills=(f,base,amp,wl,col)=>{ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,VH);for(let x=0;x<=VW+8;x+=8){const wx=x+cx*f;ctx.lineTo(x,base-amp*(Math.sin(wx/wl)*.5+.5)-amp*.4*Math.sin(wx/(wl*.37)))}ctx.lineTo(VW,VH);ctx.fill()};
 const rep=(f,per,fn)=>{const off=-((cx*f)%per);for(let x=off-per;x<VW+per;x+=per)fn(x,Math.floor((x+cx*f)/per))};
 if(th===0){
  R(640,50,50,50,'#fff3a0');R(650,60,30,30,'#ffe14d');
  rep(.12,260,(x,i)=>{const y=60+(i*37%70);R(x,y,90,22,'rgba(255,255,255,.9)');R(x+16,y-14,52,18,'rgba(255,255,255,.9)')});
  hills(.25,330,90,90,'#7fd0a0');hills(.45,380,70,60,'#4fb06a');
  rep(.7,170,(x,i)=>{R(x+20,330,10,40,'#6b4423');R(x,300,50,40,'#2f8f3f');R(x+8,282,34,24,'#37a34a')});
 }else if(th===1){
  R(600,40,70,70,'#fff0b0');R(610,50,50,50,'#ffe070');
  hills(.2,340,70,140,'#e8a860');
  rep(.3,420,(x,i)=>{ctx.fillStyle='#c98a4a';ctx.beginPath();ctx.moveTo(x+40,380);ctx.lineTo(x+130,250);ctx.lineTo(x+220,380);ctx.fill();ctx.fillStyle='#e0a860';ctx.beginPath();ctx.moveTo(x+130,250);ctx.lineTo(x+220,380);ctx.lineTo(x+150,380);ctx.fill()});
  hills(.5,400,60,110,'#d8a050');
  rep(.8,230,(x,i)=>{R(x+20,330,12,50,'#4a8a3a');R(x+8,345,12,8,'#4a8a3a');R(x+8,340,6,16,'#4a8a3a');R(x+32,338,12,8,'#4a8a3a');R(x+38,326,6,18,'#4a8a3a')});
 }else if(th===2){
  rep(.1,300,(x,i)=>{R(x,40+(i*53%60),100,18,'rgba(255,255,255,.8)')});

/* ---------- input ---------- */
function setKey(c,v){
 if(c==='ArrowLeft'||c==='KeyA')K.l=v;else if(c==='ArrowRight'||c==='KeyD')K.r=v;
 else if(c==='Space'||c==='ArrowUp'||c==='KeyW'||c==='KeyZ'||c==='KeyX'){if(v&&!K.j&&P&&state==='play')P.jb=7;K.j=v}
}
addEventListener('keydown',e=>{
 ac();const c=e.code;
 if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(c))e.preventDefault();
 if(c==='KeyM'){muted=!muted;return}
 if(state==='title'){if(c==='Enter'||c==='Space'){state='select';sfx('click')}return}
 if(state==='select'){
  if(c==='ArrowLeft'||c==='KeyA')sel=Math.max(0,sel-1);else if(c==='ArrowRight'||c==='KeyD')sel=Math.min(11,sel+1);
  else if(c==='ArrowUp'||c==='KeyW')sel=Math.max(0,sel-3);else if(c==='ArrowDown'||c==='KeyS')sel=Math.min(11,sel+3);
  else if((c==='Enter'||c==='Space')&&unlocked(sel)){sfx('click');loadLevel(sel)}else if(c==='Escape')state='title';return}
 if(state==='win'){if(c==='Enter'||c==='Space'){if(lvi<11){loadLevel(lvi+1);sel=lvi}else state='select'}else if(c==='KeyR')loadLevel(lvi);else if(c==='Escape'){sel=lvi;state='select'}return}
 if(state==='pause'){if(c==='KeyP'||c==='Escape'||c==='Enter')setPause(false);else if(c==='KeyR')loadLevel(lvi);else if(c==='KeyQ'){sel=lvi;state='select'}return}
