<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#12122a;overflow:hidden;font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#fff;touch-action:none}
#wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:1280px;height:720px;background:#000;overflow:hidden;box-shadow:0 0 40px #000}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#ui{position:absolute;inset:0;font-size:20px;pointer-events:none}
#ui *{pointer-events:auto}
.scr{position:absolute;inset:0;display:none;pointer-events:none}
.scr.on{display:block;animation:fin .35s ease-out}
.scr>*{pointer-events:auto}
@keyframes fin{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
@keyframes slide{0%{transform:translateX(-120%)}15%,80%{transform:none}100%{transform:translateX(120%)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.btn{display:inline-block;border:0;border-radius:.7em;padding:.5em 1em;font:inherit;font-weight:bold;color:#fff;cursor:pointer;background:linear-gradient(#ffb02e,#f07a00);box-shadow:0 .2em 0 #8a4400,0 .35em .6em #0006;text-shadow:0 2px 0 #0004;transition:transform .08s}
.btn:hover{transform:translateY(-2px) scale(1.03)}.btn:active{transform:translateY(2px);box-shadow:0 0 0 #8a4400}
.btn.g{background:linear-gradient(#5fd35f,#2c9a2c);box-shadow:0 .2em 0 #176017,0 .35em .6em #0006}
.btn.b{background:linear-gradient(#5aa8ff,#2a6fd8);box-shadow:0 .2em 0 #153f8a,0 .35em .6em #0006}
.btn.r{background:linear-gradient(#ff6a6a,#d82a2a);box-shadow:0 .2em 0 #7a1010,0 .35em .6em #0006}
.btn.p{background:linear-gradient(#c58bff,#8a3fd8);box-shadow:0 .2em 0 #4a1a8a,0 .35em .6em #0006}
.btn.s{padding:.25em .6em;font-size:.8em}
.btn.dis{filter:grayscale(1);opacity:.6;cursor:not-allowed}
.panel{background:#1b2a4acc;border:.15em solid #fff5;border-radius:1em;padding:.8em 1em;backdrop-filter:blur(3px)}
h1,h2,h3{margin:0;text-shadow:0 .1em 0 #0007}
#logo{position:absolute;left:0;right:0;top:3%;text-align:center;animation:bob 3s infinite}
#logo .l1{font-size:3.4em;font-weight:900;color:#ffd23f;-webkit-text-stroke:.07em #8a3a00;text-shadow:0 .08em 0 #8a3a00,0 .2em .4em #0008;letter-spacing:.03em;line-height:1}
#logo .l2{font-size:3em;font-weight:900;color:#fff;-webkit-text-stroke:.07em #1a3a8a;text-shadow:0 .08em 0 #1a3a8a,0 .2em .4em #0008;line-height:1}
#logo .l3{font-size:1em;color:#fff;opacity:.9;margin-top:.3em;letter-spacing:.3em;text-shadow:0 2px 3px #000}
.menu{position:absolute;left:50%;top:44%;transform:translateX(-50%);display:flex;flex-direction:column;gap:.4em;width:15em}
.menu .btn{font-size:1.05em;text-align:center;padding:.4em 1em}
#goalchip{position:absolute;left:50%;bottom:1.5%;transform:translateX(-50%);background:#0008;border:.1em solid #ffd23f;border-radius:2em;padding:.35em 1.2em;font-weight:bold;max-width:80%;text-align:center;color:#ffe9a0}
.top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:.6em;padding:.6em .8em;background:linear-gradient(#0009,#0000)}
.top h2{flex:1;text-align:center;font-size:1.5em}
.coins{background:#0008;border-radius:2em;padding:.2em .8em;font-weight:bold;color:#ffd23f}
#lvtabs{position:absolute;left:4%;right:4%;top:11%;display:flex;gap:.4em}
#lvtabs .btn{flex:1;font-size:.82em;padding:.4em .2em}
#lvgrid{position:absolute;left:4%;right:4%;top:22%;bottom:12%;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(3,1fr);gap:.6em}
.lvb{position:relative;border:0;border-radius:.8em;background:linear-gradient(#fff,#cfe3ff);color:#1a2a5a;font:inherit;font-weight:900;cursor:pointer;box-shadow:0 .2em 0 #6a86c0,0 .3em .5em #0006;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.2em}
.lvb:hover{transform:scale(1.04)}
.lvb .n{font-size:1.6em;line-height:1}.lvb .nm{font-size:.6em;opacity:.8;line-height:1.1;margin:.1em 0}.lvb .st{font-size:1em;color:#f5a000;letter-spacing:.05em;text-shadow:0 1px 0 #8a5a00}
.lvb.lock{filter:grayscale(1);opacity:.45;cursor:not-allowed}.lvb.boss{background:linear-gradient(#ffb0b0,#ff6a6a)}
#hud{position:absolute;inset:0;display:none;pointer-events:none}#hud.on{display:block}
#hud>*{pointer-events:auto}
#hudtop{position:absolute;left:.6em;top:.5em;display:flex;gap:.4em}
#hudtop .btn{padding:.3em .55em;font-size:.95em}
#hudmid{position:absolute;left:50%;top:.4em;transform:translateX(-50%);text-align:center;pointer-events:none!important}
#hudmid *{pointer-events:none}
#score{font-size:1.7em;font-weight:900;text-shadow:0 .08em 0 #000,0 0 .4em #000}
#gobs{font-size:.95em;background:#0008;border-radius:1em;padding:.1em .8em;display:inline-block}
#hudr{position:absolute;right:.6em;top:.5em;text-align:right;pointer-events:none!important;text-shadow:0 2px 3px #000;font-size:.85em}
#hudr *{pointer-events:none}
#tray{position:absolute;left:50%;bottom:.5em;transform:translateX(-50%);display:flex;gap:.45em;align-items:flex-end;background:#0007;border-radius:1.2em;padding:.4em .7em}
.am{width:2.7em;height:2.7em;border-radius:50%;border:.15em solid #fff9;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.8em;color:#fff;text-shadow:0 1px 2px #000;position:relative;transition:transform .1s}
.am.sel{transform:translateY(-.5em) scale(1.25);border-color:#ffd23f;box-shadow:0 0 .8em #ffd23f}

<script>
'use strict';
/* ===== Physics engine (boxes + circles, sequential impulses, warm start, sleeping) ===== */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const MATS={
 wood:{d:.55,T:3600,fr:.6,rs:.08,col:'#d9964a',dk:'#8a5a24',val:100},
 stone:{d:1.1,T:9000,fr:.75,rs:.03,col:'#a9afb8',dk:'#5e646c',val:200},
 glass:{d:.4,T:1100,fr:.25,rs:.1,col:'#c4f0ff',dk:'#5fb3d6',val:80},
 ice:{d:.5,T:2200,fr:.12,rs:.04,col:'#dcf6ff',dk:'#7fc4e6',val:120},
 metal:{d:2.2,T:60000,fr:.45,rs:.12,col:'#8794a4',dk:'#3f4a58',val:300},
 jelly:{d:.35,T:1e9,fr:.9,rs:.85,col:'#ff7ac8',dk:'#c0408f',val:0},
 tnt:{d:.6,T:1400,fr:.6,rs:.05,col:'#e0402f',dk:'#8a1c12',val:300},
 gob:{d:.6,T:2400,fr:.7,rs:.12,col:'#6fc43c',dk:'#3b7d1c',val:0},
 ball:{d:2,T:1e9,fr:.5,rs:.15,col:'#999',dk:'#444',val:0},
 ground:{d:1,T:1e12,fr:.8,rs:.05,col:'#6b4',dk:'#483',val:0}
};
const PH={g:980,dmgOn:true,bodies:[],arbs:new Map(),time:0,onHit:null,onPierce:null,groundFr:.8,nid:1};
const IMPV=100,SLOP=.8,ITER=14;
function mkBody(o){
 const M=MATS[o.mat]||MATS.wood;
 const b={id:PH.nid++,sh:o.sh,x:o.x,y:o.y,a:o.a||0,vx:0,vy:0,av:0,mat:o.mat,kind:o.kind||'block',st:!!o.st,
  fr:o.fr!=null?o.fr:M.fr,rs:o.rs!=null?o.rs:M.rs,gs:1,bvx:0,bvy:0,bav:0,sleep:false,sleepT:0,dead:false,hit:0,burn:0,frozen:0,pow:o.pow||1,grp:o.grp||0};
 let area;
 if(o.sh==='box'){b.hw=o.w/2;b.hh=o.h/2;area=o.w*o.h}else{b.r=o.r;area=Math.PI*o.r*o.r}
 const dens=o.dens||M.d;
 if(b.st){b.m=0;b.im=0;b.I=0;b.iI=0}else{
  b.m=dens*area/100;b.im=1/b.m;
  b.I=o.sh==='box'?b.m*(o.w*o.w+o.h*o.h)/12:.5*b.m*o.r*o.r;b.iI=1/b.I}
 b.T=b.hp=o.T||M.T;
 for(const k in o)if(!(k in b)&&k!=='w'&&k!=='h')b[k]=o[k];
 if(o.sh==='box'){b.w=o.w;b.h=o.h}
 aabb(b);
 return b;
}
function aabb(b){
 if(b.sh==='circle'){b.ex=b.ey=b.r}else{const c=Math.abs(Math.cos(b.a)),s=Math.abs(Math.sin(b.a));b.ex=c*b.hw+s*b.hh;b.ey=s*b.hw+c*b.hh}
}
function colCC(A,B){
 const dx=B.x-A.x,dy=B.y-A.y,r=A.r+B.r,d2=dx*dx+dy*dy;
 if(d2>=r*r)return null;
 const d=Math.sqrt(d2);let nx=1,ny=0;if(d>1e-6){nx=dx/d;ny=dy/d}
 const pen=r-d;
 return {nx,ny,cs:[{x:A.x+nx*(A.r-pen/2),y:A.y+ny*(A.r-pen/2),pen}]};
}
// circle c, box b; normal from circle to box
function colCB(c,b){
 const cs=Math.cos(b.a),sn=Math.sin(b.a),dx=c.x-b.x,dy=c.y-b.y;
 const lx=dx*cs+dy*sn,ly=-dx*sn+dy*cs;
 const qx=clamp(lx,-b.hw,b.hw),qy=clamp(ly,-b.hh,b.hh);
 let ex=lx-qx,ey=ly-qy;const d2=ex*ex+ey*ey;
 let nlx,nly,pen,px=qx,py=qy;
 if(d2>1e-9){
  const d=Math.sqrt(d2);if(d>=c.r)return null;
  nlx=ex/d;nly=ey/d;pen=c.r-d;
 }else{
  const ox=b.hw-Math.abs(lx),oy=b.hh-Math.abs(ly);
  if(ox<oy){const s=lx<0?-1:1;nlx=s;nly=0;pen=ox+c.r;px=s*b.hw;py=ly}
  else{const s=ly<0?-1:1;nlx=0;nly=s;pen=oy+c.r;px=lx;py=s*b.hh}
 }
 const nwx=nlx*cs-nly*sn,nwy=nlx*sn+nly*cs;
 return {nx:-nwx,ny:-nwy,cs:[{x:b.x+px*cs-py*sn,y:b.y+px*sn+py*cs,pen}]};
}
function colBB(A,B){
 const ac=Math.cos(A.a),as=Math.sin(A.a),bc=Math.cos(B.a),bs=Math.sin(B.a);
 const dx=B.x-A.x,dy=B.y-A.y;
 const ax=[ac,-as,bc,-bs],ay=[as,ac,bs,bc];
 let best=1e9,bi=-1,bpen=0;
 for(let i=0;i<4;i++){
  const ux=ax[i],uy=ay[i];
  const rA=A.hw*Math.abs(ux*ac+uy*as)+A.hh*Math.abs(-ux*as+uy*ac);
  const rB=B.hw*Math.abs(ux*bc+uy*bs)+B.hh*Math.abs(-ux*bs+uy*bc);
  const pen=rA+rB-Math.abs(dx*ux+dy*uy);
  if(pen<0)return null;
  const sc=pen+(i>=2?.4:0);
  if(sc<best){best=sc;bi=i;bpen=pen}
 }
 const ux=ax[bi],uy=ay[bi];
 const sg=(dx*ux+dy*uy)<0?-1:1;
 const nx=ux*sg,ny=uy*sg;
 let ref,inc,rnx,rny;
 if(bi<2){ref=A;inc=B;rnx=nx;rny=ny}else{ref=B;inc=A;rnx=-nx;rny=-ny}
 const ai=bi%2;
 const hn=ai===0?ref.hw:ref.hh,ht=ai===0?ref.hh:ref.hw;
 const tx=-rny,ty=rnx;
 const icx=Math.cos(inc.a),isn=Math.sin(inc.a);
 // candidate outward normals of inc
 const cand=[[icx,isn,inc.hw,inc.hh],[-icx,-isn,inc.hw,inc.hh],[-isn,icx,inc.hh,inc.hw],[isn,-icx,inc.hh,inc.hw]];
 let bd=1e9,bc2=null;
 for(const c of cand){const d=c[0]*rnx+c[1]*rny;if(d<bd){bd=d;bc2=c}}
 const ecx=inc.x+bc2[0]*bc2[2],ecy=inc.y+bc2[1]*bc2[2];
 const dxx=-bc2[1],dyy=bc2[0],hl=bc2[3];
 const p1x=ecx-dxx*hl,p1y=ecy-dyy*hl,p2x=ecx+dxx*hl,p2y=ecy+dyy*hl;
 const fcx=ref.x+rnx*hn,fcy=ref.y+rny*hn;
 const s1=(p1x-fcx)*tx+(p1y-fcy)*ty,s2=(p2x-fcx)*tx+(p2y-fcy)*ty;
 let t0=0,t1=1;const ds=s2-s1;
 if(Math.abs(ds)<1e-9){if(Math.abs(s1)>ht)return null}
 else{let ta=(-ht-s1)/ds,tb=(ht-s1)/ds;if(ta>tb){const q=ta;ta=tb;tb=q}t0=Math.max(t0,ta);t1=Math.min(t1,tb);if(t0>t1)return null}
 const cs=[];
 for(const t of [t0,t1]){
  const qx=p1x+(p2x-p1x)*t,qy=p1y+(p2y-p1y)*t;
  const dist=(qx-ref.x)*rnx+(qy-ref.y)*rny;
  const depth=hn-dist;
  if(depth>-.3)cs.push({x:qx+rnx*depth*.5,y:qy+rny*depth*.5,pen:Math.max(depth,0)});
 }
 if(!cs.length)return null;
 return {nx,ny,cs};
}
function collide(A,B){ // A.id<B.id
 if(A.sh==='box'){return B.sh==='box'?colBB(A,B):(()=>{const m=colCB(B,A);if(m){m.nx=-m.nx;m.ny=-m.ny}return m})()}
 return B.sh==='box'?colCB(A,B):colCC(A,B);
}
function canCollide(a,b){
 if(a.dead||b.dead)return false;
 if(a.st&&b.st)return false;
 if(a.sleep&&b.sleep)return false;
 if((a.sleep&&b.st)||(b.sleep&&a.st))return false;
 if(a.weld||b.weld)return false;
 if(a.grp&&a.grp===b.grp)return false;
 const A=a.kind==='ball'?a:b.kind==='ball'?b:null;
 if(A){
  const O=A===a?b:a;
  if(A.ghost>0&&O.kind==='block'&&!O.st)return false;
  if(A.drill>0&&O.kind==='block'&&!O.st&&(O.mat==='wood'||O.mat==='glass'||O.mat==='ice'||O.mat==='jelly'||O.mat==='tnt')){if(PH.onPierce)PH.onPierce(A,O);return false}
 }
 return true;
}
PH.step=function(dt){
 const bs=PH.bodies,n=bs.length;
 for(let i=0;i<n;i++){const b=bs[i];if(b.st||b.sleep||b.weld)continue;
  b.vy+=PH.g*b.gs*dt;const k=1/(1+dt*.04);b.vx*=k;b.vy*=k;b.av*=1/(1+dt*(b.kind==='goblin'?5:.35));
  const sp=b.vx*b.vx+b.vy*b.vy;if(sp>2.9e6){const f=1700/Math.sqrt(sp);b.vx*=f;b.vy*=f}
  b.av=clamp(b.av,-40,40);aabb(b)}
 const old=PH.arbs,cur=new Map(),list=[];
 for(let i=0;i<n;i++){const a0=bs[i];
  for(let j=i+1;j<n;j++){const b0=bs[j];
   if(Math.abs(a0.x-b0.x)>a0.ex+b0.ex||Math.abs(a0.y-b0.y)>a0.ey+b0.ey)continue;
   if(!canCollide(a0,b0))continue;
   const a=a0.id<b0.id?a0:b0,b=a===a0?b0:a0;
   const m=collide(a,b);if(!m)continue;
   // wake logic
   if(a.sleep&&!b.sleep&&!b.st&&b.sleepT<.3)a.sleep=false;
   if(b.sleep&&!a.sleep&&!a.st&&a.sleepT<.3)b.sleep=false;
   const key=a.id*100000+b.id;
   const ar={a,b,key,nx:m.nx,ny:m.ny,cs:m.cs,mu:Math.sqrt(a.fr*b.fr),e:Math.max(a.rs,b.rs)};
   const prev=old.get(key);
   for(const c of ar.cs){c.Pn=0;c.Pt=0;
    if(prev)for(const pc of prev.cs){const ddx=pc.x-c.x,ddy=pc.y-c.y;if(ddx*ddx+ddy*ddy<64){c.Pn=pc.Pn;c.Pt=pc.Pt;break}}}
   cur.set(key,ar);list.push(ar);
  }}
 PH.arbs=cur;
 const idt=1/dt;
 for(const ar of list){
  const a=ar.a,b=ar.b;
  ar.ima=(a.st||a.sleep)?0:a.im;ar.iIa=(a.st||a.sleep)?0:a.iI;
  ar.imb=(b.st||b.sleep)?0:b.im;ar.iIb=(b.st||b.sleep)?0:b.iI;
  const nx=ar.nx,ny=ar.ny,tx=-ny,ty=nx;
  for(const c of ar.cs){
   const rax=c.x-a.x,ray=c.y-a.y,rbx=c.x-b.x,rby=c.y-b.y;
   c.rax=rax;c.ray=ray;c.rbx=rbx;c.rby=rby;
   const rna=rax*ny-ray*nx,rnb=rbx*ny-rby*nx;
   c.mn=1/(ar.ima+ar.imb+ar.iIa*rna*rna+ar.iIb*rnb*rnb);
   const rta=rax*ty-ray*tx,rtb=rbx*ty-rby*tx;
   c.mt=1/(ar.ima+ar.imb+ar.iIa*rta*rta+ar.iIb*rtb*rtb);
   const dvx=b.vx-b.av*rby-a.vx+a.av*ray,dvy=b.vy+b.av*rbx-a.vy-a.av*rax;
   const vn=dvx*nx+dvy*ny;
   c.bias=Math.min(.3*Math.max(c.pen-SLOP,0)*idt,260);c.Pb=0;
   if(vn<-IMPV){
    c.bounce=-ar.e*vn;
    if(PH.dmgOn&&PH.onHit&&!c.hit){const mr=1/((a.st?0:a.im)+(b.st?0:b.im)+1e-9);PH.onHit(a,b,(-vn-IMPV)*mr,c.x,c.y,-vn)}
   }else c.bounce=0;
   c.tb=c.bounce;
   // warm start
   const px=c.Pn*nx+c.Pt*tx,py=c.Pn*ny+c.Pt*ty;
   a.vx-=ar.ima*px;a.vy-=ar.ima*py;a.av-=ar.iIa*(rax*py-ray*px);
   b.vx+=ar.imb*px;b.vy+=ar.imb*py;b.av+=ar.iIb*(rbx*py-rby*px);
  }
 }
 for(let it=0;it<ITER;it++){
  for(const ar of list){
   const a=ar.a,b=ar.b,nx=ar.nx,ny=ar.ny,tx=-ny,ty=nx;
   for(const c of ar.cs){
    let dvx=b.vx-b.av*c.rby-a.vx+a.av*c.ray,dvy=b.vy+b.av*c.rbx-a.vy-a.av*c.rax;
    let vn=dvx*nx+dvy*ny;
    let dP=c.mn*(-vn+c.tb);
    const nP=Math.max(c.Pn+dP,0);dP=nP-c.Pn;c.Pn=nP;
    let px=dP*nx,py=dP*ny;
    a.vx-=ar.ima*px;a.vy-=ar.ima*py;a.av-=ar.iIa*(c.rax*py-c.ray*px);
    b.vx+=ar.imb*px;b.vy+=ar.imb*py;b.av+=ar.iIb*(c.rbx*py-c.rby*px);
    if(c.bias>0){
     const bdx=b.bvx-b.bav*c.rby-a.bvx+a.bav*c.ray,bdy=b.bvy+b.bav*c.rbx-a.bvy-a.bav*c.rax;
     let dPb=c.mn*(-(bdx*nx+bdy*ny)+c.bias);const nPb=Math.max(c.Pb+dPb,0);dPb=nPb-c.Pb;c.Pb=nPb;
     const qx=dPb*nx,qy=dPb*ny;

const AU={ctx:null,master:null,mute:false,inten:0,tick:0,step:0,world:0,sfxN:0};
function ac(){if(!AU.ctx){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AU.ctx=new C();AU.master=AU.ctx.createGain();AU.master.gain.value=AU.mute?0:.6;AU.master.connect(AU.ctx.destination)}catch(e){return null}}
 if(AU.ctx.state==='suspended')AU.ctx.resume().catch(()=>{});return AU.ctx}
function setMute(m){AU.mute=!!m;S.set.mute=m?1:0;if(AU.master)AU.master.gain.value=m?0:.6;save()}
function tone(f,dur,type,vol,slide,delay,dest){const c=ac();if(!c||AU.mute)return;const t=c.currentTime+(delay||0);
 const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);
 if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+dur);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.2,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(g);g.connect(dest||AU.master);o.start(t);o.stop(t+dur+.05)}
let _nb=null;
function noise(dur,vol,fq,q,delay,slide){const c=ac();if(!c||AU.mute)return;
 if(!_nb){_nb=c.createBuffer(1,c.sampleRate,c.sampleRate);const d=_nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
 const t=c.currentTime+(delay||0),s=c.createBufferSource();s.buffer=_nb;s.loop=true;
 const f=c.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(fq||1000,t);if(slide)f.frequency.exponentialRampToValueAtTime(Math.max(40,fq*slide),t+dur);f.Q.value=q||1;
 const g=c.createGain();g.gain.setValueAtTime(vol||.3,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 s.connect(f);f.connect(g);g.connect(AU.master);s.start(t);s.stop(t+dur+.05)}

function musicTick(){ // called ~every 220ms
 const c=ac();if(!c||AU.mute||!AU.on)return;
 AU.step++;const sc=SCALES[AU.world%6],root=[196,174,164,146,220,130][AU.world%6];
 const i=AU.step;
 if(i%8===0)tone(root/2,1.6,'sine',.12,0,0);
 if(i%2===0||AU.inten>.5){const d=sc[(i*3+(i>>3))%5],oc=(i%7===0)?2:1;tone(root*Math.pow(2,d/12)*oc,.5,'triangle',.05+AU.inten*.04,0)}
 if(AU.inten>.3&&i%4===2)noise(.06,.05+AU.inten*.04,5000,1);
 if(AU.inten>.6&&i%2===1)tone(root*2,.1,'square',.025);
 AU.inten=Math.max(0,AU.inten-.012);
 if(AU.world===5&&i%16===0)tone(2000,.8,'sine',.02,.5);
 if(i%24===5&&AU.world!==5)tone(1800,.1,'sine',.04,1.4); // bird chirp
}

  if(b.burn>0){b.burn-=dt;b.sleep=false;damage(b,(b.mat==='tnt'?2500:900)*dt,'fire');

  if(b.kind==='goblin'&&b.boss&&G.settle<=0&&!b.dead){b.bt-=dt;if(b.bt<=0){b.bt=3.2;if(b.hurt<=0&&Math.abs(b.vy)<30&&G.phase!=='lose'&&b.y>GY-b.r-6&&!PH.bodies.some(o=>!o.st&&o!==b&&o.y<b.y&&Math.abs(o.x-b.x)<b.r+o.ex&&b.y-o.y<b.r+o.ey+90)){b.sleep=false;b.imm=1.2;b.vy=-380;b.vx=0;if(G.fx)ftext(b.x,b.y-b.r-24,['Hehe!','Nope!','Catch me!','I\'m the boss!'][(Math.random()*4)|0],'#fff',1,20)}}}
 }
 if(PH.time%1<dt*1.5)burnSpread();
 if(G.comboT>0){G.comboT-=dt;if(G.comboT<=0)G.combo=0}
 // win

 // flow
 if(G.phase==='fly'){

   let moving=false;

  for(let i=G.parts.length-1;i>=0;i--){const p=G.parts[i];p.l-=dt;if(p.l<=0){G.parts.splice(i,1);continue}

/* ---- win / lose ---- */
function starsFor(used,L){const t3=Math.max(1,Math.ceil(L*.55)),t2=Math.max(t3,L-1);return used<=t3?3:used<=t2?2:1}
function finishWin(){
 if(G.phase==='won')return;
 G.phase='won';const d=G.def;
 const left=G.queue.length;
 const stars=starsFor(G.used,G.baseLen);
 let mult=1;if(G.opts.muts)for(const m of G.opts.muts){const mm=MUTS.find(x=>x.id===m);if(mm)mult*=mm.mult}
 const bonus=left*1500;G.score=Math.round((G.score+bonus)*mult);
 const res={stars,score:G.score,bonus,coins:0,newAmmo:null,first:false,hat:null};
 if(!G.bot){
  let coins=8+stars*10+Math.min(40,G.kills*2);coins=Math.round(coins*mult*(G.diff===2?1.5:1));
  if(d.custom||G.opts.sandbox)coins=Math.round(coins*.3);
  res.coins=coins;
  if(!d.custom&&!G.opts.endless){
   const p=S.prog[d.id]||{stars:0,score:0};
   const old=p.stars;
   if(stars>p.stars){if(stars===3&&p.stars<3)coins+=20;p.stars=stars}
   if(G.score>p.score)p.score=G.score;
   S.prog[d.id]=p;res.first=!old;res.coins=coins;
   if(!old&&G.used===1)stat('oneShot');
   if(!old&&(S.fails[d.id]||0)>0){stat('comebacks')}
   if(G.diff===2)stat('hardWins');
   if(G.opts.muts&&G.opts.muts.length)stat('mutWins');
   if(!old&&d.n===1&&!S.own['hat:party']){S.own['hat:party']=1;S.eq.hat='party';res.hat='Party Hat';}
   const prevMax=d.n;const na=AMMO.filter((a,i)=>AMMO_UNLOCK[i]===d.n+1);if(na.length)res.newAmmo=na[0];
  }
  if(G.opts.endless){stat('endlessWins');if(G.opts.pinata)stat('pinata')}
  addCoins(res.coins);
  stat('wins');checkAch();save();
 }
 G.over=res;
 if(G.fx){sfx('win');bumpInten(1)}
 if(window.onWin&&!G.bot)window.onWin(res);
}
function loseLevel(){
 G.phase='lose';

 if(window.onLose&&!G.bot)window.onLose();
}

function updateCam(dt){

 const ZF=Math.min(1,1280/(G.W+250));
 if(G.phase==='intro'){G.introT+=dt;const k=Math.min(1,G.introT/2.4);c.tx=0;c.x+= (c.tx-c.x)*Math.min(1,dt*2.2);if(k>=1&&Math.abs(c.x-c.tx)<8){G.phase='aim'}return}
 let tx=c.tx,tz=c.tz;
 if(G.phase==='fly'||G.phase==='winwait'){
  let lead=null;for(const b of G.balls)if(!lead||b.x>lead.x)lead=b;
  if(lead){tx=lead.x-420;G.camTrack=lead}
  else if(G.phase==='winwait'&&G.focus){tx=G.focus.x-640;tz=1.5}
  else if(G.phase==='fly'){let mx=0,cnt=0;for(const b of PH.bodies)if(!b.st&&!b.sleep&&b.kind!=='ball'){mx+=b.x;cnt++}if(cnt)tx=mx/cnt-640}
 }
 if(G.phase==='winwait'&&G.focus){tz=1.5;tx=G.focus.x-640/tz}
 if(G.phase==='aim'||G.phase==='lose')tz=c.ov?ZF:1;
 c.z+=(tz-c.z)*Math.min(1,dt*4);
 const vw=1280/c.z;
 tx=clamp(tx,-60,Math.max(0,G.W+200-vw));
 c.x+=(tx-c.x)*Math.min(1,dt*(G.phase==='fly'?5:3.5));
 // vertical
 const base=GY+100-720/c.z;let ty=base;
 if(G.phase==='fly'&&G.camTrack&&!G.camTrack.dead&&G.camTrack.y<180/c.z+base)ty=Math.min(base,G.camTrack.y-260/c.z);
 if(G.phase==='winwait'&&G.focus)ty=G.focus.y-360/c.z;
 c.y+=(ty-c.y)*Math.min(1,dt*3);
}
function update(dt){
 dt=Math.min(dt,.05);

function drawParticles(t){

 for(const p of G.parts){const a=Math.max(0,p.l/p.ml);c.globalAlpha=Math.min(1,a*1.5);c.fillStyle=p.c;c.strokeStyle=p.c;
  switch(p.k){

   case 'chip':c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);c.restore();break;
   case 'smoke':c.globalAlpha=a*.5;c.beginPath();c.arc(p.x,p.y,p.s*(2-a),0,TAU);c.fill();break;
   case 'flame':c.globalAlpha=a*.85;c.beginPath();c.arc(p.x,p.y,p.s*(.4+a*.8),0,TAU);c.fill();break;
   case 'ring':c.lineWidth=3;c.beginPath();c.arc(p.x,p.y,p.s,0,TAU);c.stroke();break;
   case 'poof':c.globalAlpha=a*.8;c.beginPath();c.arc(p.x,p.y,p.s*(1.4-a*.6),0,TAU);c.fill();break;
   case 'spark':c.lineWidth=2;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x-p.vx*.03,p.y-p.vy*.03);c.stroke();break;
   case 'coin':c.save();c.translate(p.x,p.y);c.scale(Math.abs(Math.cos(p.rot*2)),1);c.beginPath();c.arc(0,0,p.s,0,TAU);c.fill();c.restore();break;

   case 'conf':c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);c.restore();break;

/* ---- endless ---- */
function genEndless(n,pin){
 const r=rng32(n*7919+(pin?555:13));const wi=(n-1)%6;
 const un=unlockedAmmo().map(a=>a.c);
 const mats=['w','w','s','g','i','m','j'].slice(0,Math.min(7,3+((n/2)|0)));
 const k=Math.min(5,2+((n/3)|0));
 const ammo=[];const total=Math.min(8,4+((n/3)|0));
 for(let i=0;i<total;i++)ammo.push(i<2?'s':un[(r()*un.length)|0]);
 let am=ammo.join('');
 const fn=b=>{
  let x=900;
  for(let i=0;i<k;i++){
   const m=pin?'j':mats[(r()*mats.length)|0];const t=(r()*4)|0;
   const fl=1+((r()*(1+n/4))|0)%4;
   if(pin){b.pyr('j',x,0,3+(i%2),38);b.gob(x,3*38);if(r()<.5)b.tnt(x+100,0);x+=250}
   else if(t===0){b.tower(m,x,0,fl,'0'.repeat(fl)+'1');x+=190}
   else if(t===1){const rows=2+((r()*3)|0);b.wall(m,x,0,2,rows);b.gob(x+70,0);x+=190}
   else if(t===2){b.pyr(m,x,0,3+((r()*2)|0),34,true);x+=230}
   else{b.tower(m==='j'?'w':m,x,0,fl,('01').repeat(fl).slice(0,fl)+'1');if(r()<.6)b.tnt(x+70,0);x+=200}
  }
  if(r()<.5)b.gob(x+40,0);
 };
 return {world:wi,name:(pin?'Pinata Party':'Round '+n),ammo:pin?'sbopzs'.split('').filter(c=>un.indexOf(c)>=0||c==='s').concat(['s','s']).join('').slice(0,6):am,fn,W:Math.max(2200,1000+k*260),n:0,id:'e'+n,endless:true};
}
function startEndless(pin,next){
 const round=next?(G.opts.round||1)+1:1;
 const def=genEndless(round,pin);
 fadeTo(()=>playLevel(def,{endless:true,pinata:pin,round,noNew:true}));
}

const MRL={wood:'w',stone:'s',glass:'g',ice:'i',metal:'m',jelly:'j',tnt:'t'};
function objsToData(ED){
 return {n:ED.name,w:ED.world,a:ED.ammo,W:ED.W,p:ED.pits.map(p=>[Math.round(p[0]),Math.round(p[1])]),
  o:ED.objs.map(e=>[e.t,e.t==='s'||e.t==='g'?'':(MRL[e.m]||e.m),Math.round(e.x),Math.round(e.y),Math.round(e.t==='c'?e.r:e.t==='g'?(e.boss?1:0):e.w),Math.round(e.t==='c'||e.t==='g'?0:e.h),(e.t==='b'||e.t==='s')?Math.round((e.a||0)*1000)/1000:0])};
}
function dataToEd(d){
 const num=(v,a,b,def)=>{v=+v;return isFinite(v)?clamp(v,a,b):def};
 const ED={name:String(d.n||'Shared Level').replace(/[<>&"']/g,'').slice(0,24),world:num(d.w,0,5,0)|0,W:num(d.W,1600,3200,2200),objs:[],pits:[],ammo:''};
 ED.ammo=String(d.a||'sss').split('').filter(c=>AMMO_BY_C[c]).join('').slice(0,12)||'sss';
 if(!Array.isArray(d.o)||d.o.length>260)throw new Error('bad');
 for(const o of d.o){
  if(!Array.isArray(o))throw new Error('bad');
  const t=o[0],x=num(o[2],-300,3400,0),y=num(o[3],-900,760,0),w=num(o[4],0,900,20),h=num(o[5],0,900,20),a=num(o[6],-7,7,0);
  if(t==='b'){const m=MC[o[1]];if(!m)throw new Error('bad');ED.objs.push({t:'b',m,x,y,w:clamp(w,8,600),h:clamp(h,8,600),a})}
  else if(t==='g'){const bo=w===1;ED.objs.push({t:'g',x,y,boss:bo,r:bo?36:17})}
  else if(t==='c'){const m=MC[o[1]];if(!m)throw new Error('bad');ED.objs.push({t:'c',m,x,y,r:clamp(w,8,80)})}
  else if(t==='s'){ED.objs.push({t:'s',x,y,w:clamp(w,10,700),h:clamp(h,10,300),a})}
  else throw new Error('bad');
 }
 if(Array.isArray(d.p))for(const p of d.p.slice(0,12)){const a=num(p[0],-300,3400,0),b=num(p[1],-300,3400,0);if(b>a)ED.pits.push([a,b])}
 return ED;
}
function encodeShare(ED){const s=JSON.stringify(objsToData(ED));return 'SIPCS1-'+btoa(unescape(encodeURIComponent(s)))}
function decodeShare(code){
 code=String(code).trim().replace(/\s+/g,'');
 if(code.indexOf('SIPCS1-')!==0)throw new Error('Not a Catapult Smash code');
 const s=decodeURIComponent(escape(atob(code.slice(7))));
 return dataToEd(JSON.parse(s));
}

function edHit(x,y){
 for(let i=ED.objs.length-1;i>=0;i--){const e=ED.objs[i];
  if(e.t==='g'||e.t==='c'){if(Math.hypot(x-e.x,y-e.y)<(e.r||17)+3)return i}
  else{const a=-(e.a||0),dx=x-e.x,dy=y-e.y,lx=dx*Math.cos(a)-dy*Math.sin(a),ly=dx*Math.sin(a)+dy*Math.cos(a);if(Math.abs(lx)<=e.w/2&&Math.abs(ly)<=e.h/2)return i}}
 return -1;
}

  if(wi===5&&Math.hypot(p.x-BG.moon.x,p.y-BG.moon.y)<66){BG.cheese=!BG.cheese;secret('cheese');sfx('pop');return}
  if(wi!==3&&wi!==5&&Math.hypot(p.x-BG.cloud.x,p.y-BG.cloud.y)<70){BG.cloudHit=1.5;secret('cloud');ftextScreen(BG.cloud.x,BG.cloud.y-30,'hehe!');sfx('pop');return}
 }
 if(G.mode==='menu'){
  if(curScr==='title'){
   for(const g of TG){if(Math.hypot(p.x-g.x,p.y-g.y)<g.r+10){gobClicks++;g.sq=1;g.hurt=.3;sfx('poof',gobClicks);ftextScreen(g.x,g.y-50,['Hee hee!','Stop it!','Ha ha!','*sneeze*'][gobClicks%4]);if(gobClicks>=5){secret('goblin5');gobClicks=0}if(g.sneeze>0){secret('sneeze')}return}}
   if(p.x>60&&p.x<200&&p.y>480&&p.y<600){duckClicks++;sfx('quack');if(duckClicks>=10){secret('duck');S.own['hat:duck']=1;duckClicks=0}}
  }
  return}
 if(G.mode==='edit'){edDown(p,e);return}
 if(G.mode!=='play'||G.paused)return;
 const wp=w2(p);
 if(G.phase==='aim'){
  if(Math.hypot(wp.x-AX,wp.y-AY)<170){AIM.on=true;AIM.pull=0;AIM.ang=.7;aimUpdate(wp);G.idle=0;sfx('click');return}
  drag={sx:p.x,cx:G.cam.x,pan:true};return}
 if(G.phase==='fly'||G.sandbox){if(activateAll())return}
 if(G.sandbox&&G.phase!=='aim'){}
});
function aimUpdate(wp){
 const dx=AX-wp.x,dy=wp.y-AY;let len=Math.hypot(dx,dy);
 let ang=Math.atan2(dy,dx);ang=clamp(ang,-.35,1.5);
 AIM.ang=ang;AIM.pull=Math.min(MAXPULL,len);
}
cv.addEventListener('pointermove',e=>{
 const p=ptr(e);pointer=p;
 if(G.mode==='edit'){edMove(p);return}
 if(AIM.on&&G.mode==='play'){aimUpdate(w2(p));return}
 if(drag&&drag.pan){G.cam.tx=clamp(drag.cx-(p.x-drag.sx)/G.cam.z,-60,Math.max(0,G.W+200-1280/G.cam.z));G.cam.x=G.cam.tx}
});
function endPtr(e){
 if(G.mode==='edit'){edUp();return}
 if(AIM.on){AIM.on=false;if(G.phase==='aim'&&AIM.pull>28){const b=launch(AIM.ang,AIM.pull/MAXPULL);S.tut=1;if(b){}}AIM.pull=0}
 drag=null;
}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',()=>{AIM.on=false;drag=null;edUp()});
cv.addEventListener('contextmenu',e=>e.preventDefault());
/* editor mouse */
function edDown(p,e){
 const wp=w2(p);
 if(wp.y>GY+200||p.x<250){return}
 if(edTool.tool==='place'){edPlace(wp.x,wp.y);return}
 const i=edHit(wp.x,wp.y);
 if(edTool.tool==='del'){if(i>=0){ED.objs.splice(i,1);sfx('pop');edRebuild()}return}
 if(edTool.tool==='rot'){if(i>=0&&ED.objs[i].t!=='g'&&ED.objs[i].t!=='c'){ED.objs[i].a=((ED.objs[i].a||0)+Math.PI/12);if(ED.objs[i].a>Math.PI*1.99)ED.objs[i].a=0;sfx('click');edRebuild()}return}
 if(edTool.tool==='pit'){const k=ED.pits.findIndex(q=>wp.x>=q[0]&&wp.x<=q[1]);if(k>=0)ED.pits.splice(k,1);else ED.pits.push([Math.round((wp.x-80)/10)*10,Math.round((wp.x+80)/10)*10]);sfx('pop');edRebuild();return}
 if(edTool.tool==='move'){if(i>=0){edDrag={i,dx:ED.objs[i].x-wp.x,dy:ED.objs[i].y-wp.y}}else drag={sx:p.x,cx:G.cam.x,pan:true}}
}
function edMove(p){
 if(edDrag){const wp=w2(p),o=ED.objs[edDrag.i];o.x=Math.round((wp.x+edDrag.dx)/10)*10;o.y=Math.round((wp.y+edDrag.dy)/10)*10;edRebuildSoft()}
 else if(drag&&drag.pan){G.cam.tx=clamp(drag.cx-(p.x-drag.sx),-60,Math.max(0,ED.W+200-1280));G.cam.x=G.cam.tx}
}
function edRebuildSoft(){edRebuild()}
function edUp(){edDrag=null;drag=null}
/* keyboard */
let kbuf='';
const KONAMI='ArrowUpArrowUpArrowDownArrowDownArrowLeftArrowRightArrowLeftArrowRightba';
let kseq='';
addEventListener('keydown',e=>{
 const k=e.key;
 if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT'))return;
 ac();
 kseq=(kseq+(k.length===1?k.toLowerCase():k)).slice(-KONAMI.length);
 if(kseq===KONAMI){secret('konami');S.own['hat:rainbow']=1;confetti(100)}
 if(k.length===1){kbuf=(kbuf+k.toLowerCase()).slice(-8);
  if(kbuf.endsWith('pizza')){secret('pizza');S.own['skin:pizza']=1;for(let i=0;i<30;i++)CONF.push({x:Math.random()*1280,y:-20,vy:150+Math.random()*150,vx:0,e:'🍕',r:Math.random()*6,l:6})}
  if(kbuf.endsWith('boom')){secret('boom');window.BIGBOOM=true;toast('Big Boom Mode!','Explosions are HUGE now!','#f93')}
  if(kbuf.endsWith('flip')){secret('flip');wrap.style.transition='transform 1s';const t=wrap.style.transform;wrap.style.transform=t+' rotate(180deg)';setTimeout(()=>{wrap.style.transform=t;setTimeout(()=>wrap.style.transition='',1100)},4000)}
  if(k==='9'&&curScr==='title')secret('nine');
 }
 if(k==='m'||k==='M'){setMute(!AU.mute)}
 if(G.mode==='play'||G.mode==='edit'){
  if(k===' '||k==='Enter'){if(G.mode==='play'){activateAll();e.preventDefault()}}
  if(k==='p'||k==='P'||k==='Escape')pauseGame(!G.paused);
  if(G.mode==='play'){
   if(k==='r'||k==='R')fadeTo(currentRestart);
   if(k==='o'||k==='O')G.cam.ov=!G.cam.ov;
   if(k==='h'||k==='H'){const hs=COS.hat.map(h=>h[0]);S.eq.hat=hs[(hs.indexOf(S.eq.hat)+1)%hs.length];hatN++;if(hatN>=5)secret('hat')}
   if(/^[1-9]$/.test(k)){const i=+k-1;const q=G.sandbox?AMMO:G.queue;if(i<q.length&&G.phase==='aim'){G.sel=i;lastSig=''}}
   if(k==='ArrowRight'||k==='d'){G.cam.tx=clamp(G.cam.tx+200,-60,Math.max(0,G.W+200-1280));}
   if(k==='ArrowLeft'||k==='a'){G.cam.tx=clamp(G.cam.tx-200,-60,Math.max(0,G.W+200-1280));}
  }
  if(G.mode==='edit'){
   if(k==='ArrowRight'){G.cam.tx=G.cam.x=clamp(G.cam.x+120,-60,Math.max(0,ED.W+200-1280))}
   if(k==='ArrowLeft'){G.cam.tx=G.cam.x=clamp(G.cam.x-120,-60,Math.max(0,ED.W+200-1280))}
   if(k==='Delete'||k==='Backspace'){const i=edHit(w2(pointer).x,w2(pointer).y);if(i>=0){ED.objs.splice(i,1);edRebuild()}}
   if(k==='r'||k==='R'){const i=edHit(w2(pointer).x,w2(pointer).y);if(i>=0&&ED.objs[i].t!=='g'&&ED.objs[i].t!=='c'){ED.objs[i].a=(ED.objs[i].a||0)+Math.PI/12;edRebuild()}}
  }
 }
});
let hatN=0;
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.mode==='play')pauseGame(true)});
/* ---- screen-space effects ---- */
const CONF=[],SFT=[];
window.confetti=function(n){for(let i=0;i<(n||30);i++)CONF.push({x:Math.random()*1280,y:-10-Math.random()*200,vx:(Math.random()-.5)*160,vy:100+Math.random()*250,c:'hsl('+(Math.random()*360|0)+',90%,60%)',r:Math.random()*6,vr:(Math.random()-.5)*12,l:5})};
function ftextScreen(x,y,s){SFT.push({x,y,s,l:1.2})}
function drawScreenFX(dt){
 const c=cx;c.setTransform(1,0,0,1,0,0);
 for(let i=CONF.length-1;i>=0;i--){const p=CONF[i];p.l-=dt;p.y+=p.vy*dt;p.x+=(p.vx||0)*dt;p.r+=(p.vr||0)*dt;if(p.l<=0||p.y>760){CONF.splice(i,1);continue}
  if(p.e){c.font='34px Arial';c.textAlign='center';c.fillText(p.e,p.x,p.y)}else{c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.c;c.fillRect(-5,-3,10,6);c.restore()}}
 c.textAlign='center';c.textBaseline='middle';
 for(let i=SFT.length-1;i>=0;i--){const t=SFT[i];t.l-=dt;t.y-=30*dt;if(t.l<=0){SFT.splice(i,1);continue}c.globalAlpha=Math.min(1,t.l*2);c.font='bold 26px "Arial Black",Arial';c.lineWidth=5;c.strokeStyle='#222';c.strokeText(t.s,t.x,t.y);c.fillStyle='#fff';c.fillText(t.s,t.x,t.y);c.globalAlpha=1}
 // random events (pig / ufo)
 if(G.mode==='play'&&!G.paused&&(G.phase==='aim'||G.phase==='fly')){
  EV.t-=dt;
  if(!EV.k&&EV.t<=0){EV.k=(G.def&&(G.def.world===5||G.def.world===4)&&Math.random()<.6)?'ufo':'pig';EV.x=-60;EV.y=90+Math.random()*120;EV.vx=130+Math.random()*60;EV.hit=false}
 }
 if(EV.k){EV.x+=EV.vx*dt;EV.y+=Math.sin(EV.x*.02)*30*dt;
  if(EV.x>1360){EV.k=null;EV.t=40+Math.random()*60}
  else{c.save();c.translate(EV.x,EV.y);
   if(EV.k==='pig'){c.fillStyle='#ffb0c8';c.strokeStyle='#a04060';c.lineWidth=3;c.beginPath();c.ellipse(0,0,30,22,0,0,TAU);c.fill();c.stroke();c.beginPath();c.arc(26,-4,12,0,TAU);c.fill();c.stroke();c.fillStyle='#ff8aa8';c.beginPath();c.ellipse(34,-2,6,5,0,0,TAU);c.fill();c.fillStyle='#222';c.beginPath();c.arc(28,-9,2.5,0,TAU);c.fill();c.fillStyle='#fff';const w=Math.sin(G.t*20+performance.now()/60)*10;c.beginPath();c.ellipse(-6,-18,16,7+w*.4,-.4,0,TAU);c.fill();c.stroke();c.strokeStyle='#a04060';c.beginPath();c.arc(-32,0,6,0,5);c.stroke()}
   else{c.fillStyle='#9ab';c.strokeStyle='#345';c.lineWidth=3;c.beginPath();c.ellipse(0,0,36,12,0,0,TAU);c.fill();c.stroke();c.fillStyle='#8ef';c.beginPath();c.arc(0,-6,16,Math.PI,0);c.fill();c.stroke();c.fillStyle='#ff0';for(let i=-2;i<=2;i++){c.beginPath();c.arc(i*14,2,2.5,0,TAU);c.fill()}}
   c.restore()}}
}
/* ---- title scene ---- */
const TG=[{x:330,y:560,r:34},{x:960,y:575,r:30},{x:1130,y:560,r:38},{x:200,y:575,r:26}].map((g,i)=>Object.assign(g,{a:0,hp:1,T:1,id:i+1,blink:i,sq:0,hurt:0,frozen:0,boss:false,sneeze:0}));
function drawTitleScene(t){
 const c=cx;c.setTransform(1,0,0,1,0,0);
 const wi=curScr==='title'?0:(curScr==='levels'?curWorld:0);
 BG.sun.x=1020;
 drawBG(wi,{x:t*25},t);
 const W=WORLDS[wi];c.fillStyle=W.gr2;c.fillRect(0,620,1280,100);c.fillStyle=W.gr;c.fillRect(0,620,1280,22);
 if(curScr==='title'){
  for(const g of TG){g.sq=Math.max(0,g.sq-.03);g.hurt=Math.max(0,g.hurt-.02);g.sneeze=Math.max(0,g.sneeze-.016);
   const sv=G.balls;G.balls=[];const bounce=Math.abs(Math.sin(t*2+g.id))*14;const o={...g,y:g.y-bounce};drawGoblin(o,t);G.balls=sv}
  if(Math.random()<.002){const g=TG[(Math.random()*4)|0];g.sneeze=.6;ftextScreen(g.x,g.y-60,'ACHOO!')}
  c.save();c.translate(130,540);c.scale(.8,.8);const sv2=G.def;drawCatapultSimple(c);c.restore();
  c.fillStyle='#fffc';c.font='bold 18px Arial';c.textAlign='center';c.fillText(S.eq.title+' Goblin Smasher',640,330);
 }
}
function drawCatapultSimple(c){c.fillStyle='#8a5a24';c.strokeStyle='#4a2a10';c.lineWidth=4;rr(c,-50,60,150,26,6);c.fill();c.stroke();c.strokeStyle='#4a2a10';c.lineWidth=16;c.lineCap='round';c.beginPath();c.moveTo(-18,60);c.lineTo(-24,-30);c.moveTo(18,60);c.lineTo(24,-30);c.stroke();c.fillStyle='#333';c.beginPath();c.arc(-20,80,16,0,TAU);c.arc(70,80,16,0,TAU);c.fill()}
/* ---- main loop ---- */
let last=performance.now(),saveT=0,titleT=0;
function frame(now){
 const dt=Math.min(.1,(now-last)/1000);last=now;
 try{
  if(G.mode==='play'||G.mode==='edit'){update(dt);draw(now/1000);if(G.mode==='play')updateHUD();if(G.mode==='edit')drawEditorOverlay()}
  else{titleT+=dt;drawTitleScene(titleT)}
  drawScreenFX(dt);
  flushToasts(dt);
  if(BG.cloudHit>0)BG.cloudHit-=dt;
  AU.world=G.def?G.def.world:0;
  saveT+=dt;if(saveT>6){saveT=0;save()}
 }catch(e){console.error(e)}
 requestAnimationFrame(frame);
}
function drawEditorOverlay(){
 const c=cx,cam=G.cam;c.setTransform(1,0,0,1,0,0);
 c.save();c.scale(cam.z,cam.z);c.translate(-cam.x,-cam.y);
 c.strokeStyle='rgba(255,255,255,.12)';c.lineWidth=1;for(let x=0;x<ED.W+200;x+=50){c.beginPath();c.moveTo(x,0);c.lineTo(x,GY);c.stroke()}
 for(let y=0;y<GY;y+=50){c.beginPath();c.moveTo(0,y);c.lineTo(ED.W,y);c.stroke()}
 const wp=w2(pointer);
 const i=edHit(wp.x,wp.y);
 if(i>=0){const e=ED.objs[i];c.strokeStyle='#fff';c.lineWidth=3;c.setLineDash([6,4]);c.save();c.translate(e.x,e.y);c.rotate(e.a||0);if(e.t==='g'||e.t==='c'){c.beginPath();c.arc(0,0,(e.r||17)+4,0,TAU);c.stroke()}else c.strokeRect(-e.w/2-3,-e.h/2-3,e.w+6,e.h+6);c.restore();c.setLineDash([])}
 if(edTool.tool==='place'&&pointer.x>260){c.globalAlpha=.5;const k=edTool.kind,x=Math.round(wp.x/10)*10,y=Math.round(wp.y/10)*10;
  if(k==='b'){const s=ED_SIZES[edTool.size];c.fillStyle=MATS[edTool.mat].col;c.fillRect(x-s[0]/2,y-s[1]/2,s[0],s[1])}
  else{c.fillStyle='#6fc43c';c.beginPath();c.arc(x,y,k==='B'?36:k==='c'?24:17,0,TAU);c.fill()}
  c.globalAlpha=1}
 c.restore();
 c.fillStyle='#fff';c.font='bold 16px Arial';c.textAlign='right';c.fillText('EDITOR - tool: '+edTool.tool,1260,24);
}
/* ---- init ---- */
loadSave();AU.mute=!!S.set.mute;
document.getElementById('bMute').textContent='♫';
go('title',true);
requestAnimationFrame(frame);
setInterval(save,8000);
addEventListener('pointerdown',()=>{ac();AU.on=true},{once:false});
checkAch();
