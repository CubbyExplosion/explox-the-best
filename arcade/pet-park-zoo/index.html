<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#27402c;font-family:"Trebuchet MS","Segoe UI",sans-serif;color:#2a2a3a;user-select:none;touch-action:none}
canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:6px 10px;background:#fff;color:#2a2a3a;box-shadow:0 2px 0 #0003;transition:transform .08s,filter .1s}
button:hover{filter:brightness(1.07)}button:active{transform:scale(.93)}
button.on{background:#ffd54a}button.big{padding:12px 22px;font-size:20px;font-weight:700}
button[disabled]{opacity:.45;cursor:default}
#top{position:absolute;left:0;right:0;top:0;display:flex;gap:6px;align-items:center;padding:5px 8px;background:linear-gradient(#2f6b45,#2a5a3c);color:#fff;flex-wrap:wrap;font-weight:700;z-index:5}
#top .st{background:#0003;border-radius:10px;padding:4px 9px;white-space:nowrap}
#top .sp{flex:1}
#alerts{position:absolute;left:8px;top:44px;display:flex;flex-direction:column;gap:3px;z-index:4;max-width:60%}
.chip{background:#fff;border-left:5px solid #f90;border-radius:8px;padding:3px 8px;font-size:13px;cursor:pointer;box-shadow:0 2px 0 #0003}
#goal{position:absolute;right:8px;top:44px;font-size:13px;background:#fffbe6;border:3px solid #ffb300;border-radius:12px;padding:5px 9px;max-width:min(250px,48vw);z-index:4;box-shadow:0 3px 0 #0003}
#goal b{color:#c25a00}#goal .bar{height:6px;background:#0002;border-radius:3px;margin-top:4px;overflow:hidden}#goal .bar i{display:block;height:100%;background:#4caf50;transition:width .3s}
#bar{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#2a5a3c,#244c34);padding:5px;display:flex;gap:5px;overflow-x:auto;z-index:5;align-items:center}
#bar button{white-space:nowrap;flex:0 0 auto}
#menu{position:absolute;left:0;right:0;bottom:52px;background:#fffdf2ee;padding:6px;display:none;gap:6px;overflow-x:auto;z-index:5;border-top:3px solid #2f6b45}
.card{flex:0 0 112px;background:#fff;border-radius:12px;padding:5px;text-align:center;box-shadow:0 2px 0 #0003;cursor:pointer;font-size:12px;border:3px solid transparent}
.card.sel{border-color:#ff9800}.card.lock{opacity:.45}.card .e{font-size:28px}
#win{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);width:min(760px,96vw);max-height:84vh;background:#fffdf5;border-radius:16px;border:4px solid #2f6b45;box-shadow:0 8px 0 #0004;display:none;flex-direction:column;z-index:20;opacity:0;transition:transform .18s,opacity .18s}
#win.show{transform:translate(-50%,-50%) scale(1);opacity:1}
#win h2{margin:0;padding:8px 12px;background:#2f6b45;color:#fff;display:flex;justify-content:space-between;align-items:center;font-size:19px}
#wb{padding:10px;overflow:auto;font-size:14px;touch-action:pan-y}
#wb table{width:100%;border-collapse:collapse}#wb td,#wb th{padding:3px 5px;border-bottom:1px solid #0001;text-align:left}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:4px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.tile{background:#fff;border-radius:10px;padding:5px;text-align:center;box-shadow:0 2px 0 #0002;font-size:12px}
.tile .e{font-size:26px}.tile.no{opacity:.5;filter:grayscale(1)}.tile.gold{background:#fff4b8}
.meter{height:8px;background:#0002;border-radius:4px;overflow:hidden;min-width:60px;flex:1}.meter i{display:block;height:100%}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
#toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);display:flex;flex-direction:column;gap:4px;align-items:center;z-index:30;pointer-events:none}
.t{background:#222d;color:#fff;border-radius:20px;padding:6px 14px;font-size:14px;animation:tin .25s,tout .4s 3.2s forwards}
.t.good{background:#2e7d32ee}.t.warn{background:#e65100ee}
@keyframes tin{from{transform:translateY(20px) scale(.7);opacity:0}}@keyframes tout{to{opacity:0;transform:translateY(-10px)}}
#mini{position:absolute;right:8px;bottom:112px;width:140px;height:140px;border:3px solid #fff;border-radius:8px;z-index:6;background:#000;display:none}
#title,#modal{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;text-align:center;background:radial-gradient(circle at 50% 30%,#8fe0a0,#2f8f5a 60%,#1c5a3c);color:#fff}
#modal{background:#0007;z-index:50;display:none}#modal .box{background:#fffdf5;color:#2a2a3a;border-radius:16px;padding:18px;max-width:420px;border:4px solid #ff9800;animation:pop .25s}
@keyframes pop{from{transform:scale(.6);opacity:0}}
#title h1{font-size:clamp(34px,8vw,68px);margin:0;text-shadow:0 5px 0 #0004;animation:bob 2s infinite ease-in-out}
@keyframes bob{50%{transform:translateY(-8px) rotate(-1.5deg)}}
#title .pets span{font-size:clamp(28px,6vw,48px);display:inline-block;animation:bob 1.6s infinite}
#cele{position:absolute;inset:0;z-index:35;display:none;align-items:center;justify-content:center;flex-direction:column;pointer-events:none;color:#fff;text-shadow:0 4px 0 #0006;font-size:clamp(30px,7vw,60px);font-weight:900;text-align:center}
#cele.show{display:flex;animation:pop .4s}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:34;transition:opacity .4s}

function bulldoze(x,y){const i=idx(x,y),g=S.g[i];if(!inReg(x,y))return;
 if(g===1){S.g[i]=0;S.lit[i]=0;S.money+=2;bump();sfx.click();burst(x+.5,y+.5,'💨',3,30)}
 else if(g===3){const b=bldAt(x,y);if(b)ask('Sell '+BT[b.t].n+' for '+sellValue(b)+' coins?',()=>sellBld(b))}
 else if(g===2){const e=encAt(x,y);if(e)ask('Sell '+e.name+(e.an.length?' and send its '+e.an.length+' animals to a happy farm':'')+'?',()=>sellEnc(e))}
 else if(g===4||g===5){const c=Math.round((g===4?25:40)*cm());if(!canPay(c))return noMoney();spend(c);S.g[i]=0;sfx.click();burst(x+.5,y+.5,g===4?'🍃':'💨',5,40)}}

 else{sfx.animal(sp.kind,sp.h);toast(sp.e+' '+a.name+' the '+sp.n+' joined the zoo!','good')}

function sellAnimal(a){const e=encById(a.e);e.an=e.an.filter(x=>x!==a);S.animals=S.animals.filter(x=>x!==a);const v=Math.round(adoptCost(a.s)*.5);S.money+=v;sfx.coin(0);toast('Waved goodbye. +'+v+' coins')}
function encCalc(e){const area=(e.x1-e.x0+1)*(e.y1-e.y0+1);e.area=area;e.use=area*(1+.15*(e.fence-1))*(has('fences')?1.15:1)*.8;let need=0;for(const a of e.an)need+=ANI[a.s].sp*(a.baby?.5:1);e.need=need;e.spaceScore=Math.min(100,100*e.use/Math.max(.01,need));e.fcap=6+e.an.length*3;e.free=e.use-need}
function wxPen(a,e){const w=S.weather,h=ANI[a.s].h;let p=0;if(w==='heat'){if(h===2)p=22;else if(h===5)p=-6}else if(w==='snow'){if(h===5)p=22;else if(h===2)p=-6}else if(w==='rain'&&h===5)p=10;if(p>0){if(has('shelter'))p*=.5;if(e.decor>=2)p*=.6}return p}
function updEnc(e,dt){
 e._t=(e._t||0)-dt;if(e._t<=0){e._t=1;encCalc(e)}
 const n=e.an.length;if(!n){e.dirt=Math.max(0,e.dirt-dt*.05);return}
 e.dirt=Math.min(100,e.dirt+n*.2*dt/DAYH*D.drain*DAYH*.1);if(e.playT>0)e.playT-=dt;
 const auto=has('autofeed');
 for(const a of e.an){const sp=ANI[a.s];
  a.food-=.28*dt*D.drain*(a.baby?.8:1);a.water-=.34*dt*D.drain;
  if(a.food<55){const need=sp.f/3;if(e.feed>=need){e.feed-=need;a.food=Math.min(100,a.food+36)}else if(auto&&S.sup.feed>=need){S.sup.feed-=need;a.food=Math.min(100,a.food+36)}}
  if(a.water<60&&e.water>0&&e.dirt<85)a.water=Math.min(100,a.water+36+8*e.water);
  a.food=Math.max(0,a.food);a.water=Math.max(0,a.water);
  let friends=100;if(sp.soc){let c=0;for(const o of e.an)if(o.s===a.s)c++;friends=c>=2?100:35}
  const tgt=Math.min(100,22+e.toy*13+e.decor*9+(e.playT>0?22:0));a.enr+=(tgt-a.enr)*Math.min(1,dt*.1);
  const hab=sp.h===e.hab?100:35;
  let mood=.25*a.food+.15*a.water+.15*e.spaceScore+.1*friends+.1*a.enr+.15*hab+.1*(100-e.dirt)+(e.water-1)*3-wxPen(a,e);
  if(a.dance>0)a.dance-=dt;
  mood=clamp(mood,0,100);a.mood+=(mood-a.mood)*Math.min(1,dt*.15);
  if(a.mood<35)a.health-=.03*dt;else if(a.mood>55)a.health+=.05*dt;a.health=clamp(a.health,15,100);
  if(a.pop>0)a.pop-=dt;
  a.tm-=dt;if(a.tm<=0){a.tm=2+Math.random()*4;a.tx=e.x0+.7+Math.random()*(e.x1-e.x0+.6);a.ty=e.y0+.7+Math.random()*(e.y1-e.y0+.6)}
  const dx=a.tx-a.x,dy=a.ty-a.y,d=Math.hypot(dx,dy);if(d>.05){const m=Math.min(d,(a.dance>0?1.2:.45)*dt);a.x+=dx/d*m;a.y+=dy/d*m;a.fx=dx>0?1:-1}}
}

function wishPool(){const w=[];const owned={};for(const a of S.animals)owned[a.s]=1;const ks=Object.keys(owned);
 if(ks.length){w.push({t:'sp',id:+pick(ks)});w.push({t:'sp',id:+pick(ks)})}
 const hs={};for(const e of S.encs)if(e.an.length)hs[e.hab]=1;const hk=Object.keys(hs);if(hk.length)w.push({t:'hab',h:+pick(hk)});
 w.push({t:'food'},{t:'gift'});return w}
function mkVis(o){o=o||{};const age=o.age!==undefined?o.age:pickAge();const kid=age<=1;
 const gold=o.gold!==undefined?o.gold:(age>=2&&Math.random()<.02*D.gold*(S.mut==='gold'?3:1));
 const v={id:S.nid++,x:GX+.5,y:GY+.5,fx:1,age,kid,gold,grp:o.grp||0,teacher:!!o.teacher,lead:o.lead||null,L:LOOKS[age][(Math.random()*24)|0],name:pick(NAMES),gone:false,
 hap:55+Math.random()*25,money:(kid?45:90)+Math.random()*70+(gold?400:0),bl:Math.random()*25,hu:Math.random()*35,th:Math.random()*35,fun:Math.random()*40,wish:[],seen:{},tIn:0,maxT:70+Math.random()*40,st:'idle',path:null,goal:null,timer:0,bub:null,bt:0,
 spd:(1.7+Math.random()*.5)*[.75,.95,1.1,1,.82][age]*(S.mut==='fast'?1.3:1),thk:Math.random()*.5,use:null,ub:null,hapS:0,
 ph:0,en:70+Math.random()*30,eat:0,trash:false,tr:0,cry:false,bal:(kid&&Math.random()<.3)?1+((Math.random()*5)|0):0,umb:(Math.random()*6)|0,th2:3+Math.random()*4,act:null,sp:null,flash:0,stroller:false,qi:0,tipWill:Math.random()*.9,tipped:false,helpBy:0,sqn:0,sqs:0};

function say(v,e,t){v.bub=e;v.bt=t||2}
function wishDone(v,f){for(let i=v.wish.length-1;i>=0;i--)if(f(v.wish[i])){v.wish.splice(i,1);v.hap=Math.min(100,v.hap+9);say(v,'💖',2);floatT(v.x,v.y-.5,'Wish!','#ff9ad5',14);S.wishes=(S.wishes||0)+1}}
function bOf(kind){return S.blds.filter(b=>BT[b.t].kind===kind)}
function goKind(v,kind,maxLen){const bs=bOf(kind).filter(b=>{if(kind==='food'||kind==='drink'){}return true});if(!bs.length)return false;
 const tiles=[];for(const b of bs)for(const t of accB(b))tiles.push(t);if(!tiles.length)return false;
 const p=bfs(idx(v.x|0,v.y|0),mk(tiles));if(!p)return false;if(maxLen&&p.length>maxLen)return false;v.path=p;v.goal={kind};v.st='walk';return true}
function goEnc(v,encs){const tiles=[];for(const e of encs)for(const t of accE(e))tiles.push(t);if(!tiles.length)return false;
 const p=bfs(idx(v.x|0,v.y|0),mk(tiles));if(!p)return false;v.path=p;v.goal={kind:'enc'};v.st='walk';return true}
function goLeave(v){v.goal={kind:'leave'};const p=bfs(idx(v.x|0,v.y|0),mk([idx(GX,GY)]));if(p){v.path=p;v.st='walk'}else{exitVis(v)}}
function decide(v){
 const endH=has('lights')?21:19.5;
 if(S.hour>=endH-.5||S.hour<6||v.tIn>v.maxT||v.hap<8)return goLeave(v);
 const here=S.vis.length;
 if(v.trash&&goKind(v,'bin',14))return;
 if(v.en<32&&goKind(v,'rest'))return;
 if(!v.tipped&&v.hap>66&&tipProb(v)>v.tipWill&&goKind(v,'tip',24))return;
 if(v.bl>70&&goKind(v,'toilet'))return;
 if(v.hu>65&&goKind(v,'food'))return;
 if(v.th>65&&goKind(v,'drink'))return;
 if(v.fun>75&&goKind(v,'play'))return;
 const W0=v.wish[0];
 if(W0){if(W0.t==='sp'){const es=S.encs.filter(e=>e.an.some(a=>a.s===W0.id));if(es.length&&goEnc(v,es))return}
  else if(W0.t==='hab'){const es=S.encs.filter(e=>e.hab===W0.h&&e.an.length);if(es.length&&goEnc(v,es))return}
  else if(goKind(v,W0.t))return;
  v.wish.shift()}
 const unseen=S.encs.filter(e=>e.an.length&&!v.seen[e.id]);
 if(unseen.length&&goEnc(v,unseen))return;
 const r=Math.random();
 if(r<.25&&v.money>20&&goKind(v,'gift'))return;
 if(r<.4&&goKind(v,'rest'))return;
 if(r<.55&&v.kid&&goKind(v,'play'))return;
 const any=S.encs.filter(e=>e.an.length);if(any.length&&Math.random()<.6&&goEnc(v,any))return;
 if(v.hap<45||v.tIn>v.maxT*.7)return goLeave(v);
 // wander
 const a=S.blds.concat(S.encs);if(a.length){const o=pick(a);const t=o.acc?o.acc:(o.x!==undefined&&o.t?accB(o):accE(o));if(t&&t.length){const p=bfs(idx(v.x|0,v.y|0),mk([pick(t)]));if(p){v.path=p;v.goal={kind:'wander'};v.st='walk';return}}}
 v.thk=1.5}
function adjB(tile,kind){const x=tile%W,y=(tile/W)|0;for(let k=0;k<4;k++){const X=x+DX[k],Y=y+DY[k];if(X<0||Y<0||X>=W||Y>=H)continue;const b=bldAt(X,Y);if(b&&BT[b.t].kind===kind)return b}return null}
function adjE(tile,id){const x=tile%W,y=(tile/W)|0;for(let k=0;k<4;k++){const X=x+DX[k],Y=y+DY[k];if(X<0||Y<0||X>=W||Y>=H)continue;const e=encAt(X,Y);if(e&&(!id||e.id===id))return e}return null}
function capB(b){return BT[b.t].cap+(b.lv-1)}

 if(g.kind==='leave'){exitVis(v);return}
 const tile=idx(v.x|0,v.y|0);
 if(g.kind==='wander'){v.st='idle';v.thk=1+Math.random();return}
 if(g.kind==='enc'){const es=[];const x=tile%W,y=(tile/W)|0;let e=null;for(let k=0;k<4&&!e;k++){const X=x+DX[k],Y=y+DY[k];if(X>=0&&Y>=0&&X<W&&Y<H){const c=encAt(X,Y);if(c&&c.an.length&&(!v.seen[c.id]||k>=0))e=c}}
  if(!e){v.st='idle';return}v.st='use';v.timer=3+Math.random()*3;v.use={k:'e',e};v.fx=(e.x0+e.x1+1)/2>=v.x?1:-1;const rr=Math.random();v.act=v.kid?(rr<.45?'wave':rr<.6?'photo':rr<.75?'point':'watch'):(rr<.4?'photo':rr<.7?'point':'watch');if(v.act==='photo')v.timer+=2;if(Math.random()<.5&&e.an.length){const a0=pick(e.an),sp0=ANI[a0.s];v.sp={t:pick(a0.mood<40?SAY_SAD:SAY_OK).replace('#',sp0.n),left:3.4}}return}
 const b=adjB(tile,g.kind);if(!b){v.st='idle';return}
 v.fx=b.x+.5>=v.x?1:-1;if(b.users<capB(b)){b.users++;v.ub=b;v.st='use';v.timer=BT[b.t].kind==='rest'?5+Math.random()*4:2+Math.random()*2;v.use={k:'b',b}}else{v.st='wait';v.timer=9;v.ub=b}}

$('wb').addEventListener('input',e=>{const t=e.target;if(t.dataset.a==='ticket'){S.ticket=+t.value;$('tp').textContent=S.ticket;if(S.ticket===0)secret('freeday');if(S.ticket>=50)secret('greedy')}});

 else if(a==='hat'){const an=S.animals.find(x=>x.id==+d.id);let i=an.hat;for(let k=0;k<HATS.length;k++){i=(i+1)%HATS.length;if(hatOK(i))break}an.hat=i;an.pop=.5;if(i){S.st.hats++;sfx.pop();burst(an.x,an.y,['🎩','✨'],5,50);if(ANI[an.s].n==='Dragon')secret('hatdragon')}checkAch()}
 else if(a==='nm'){const an=S.animals.find(x=>x.id==+d.id);modal('<h3>Rename '+an.name+'</h3><input id="nmi" value="'+an.name+'" maxlength="14" style="font-size:18px;padding:6px"> <button class="big" id="nmo">OK</button>');$('nmo').onclick=()=>{const v=$('nmi').value.trim().slice(0,14);if(v){an.name=v;if(/^bob$/i.test(v))secret('bob');if(/^sir /i.test(v))secret('sirname')}closeModal();renderWin()}}

 else if(a==='bsell'){const b=S.blds.find(x=>x.id==+d.id);ask('Sell '+BT[b.t].n+'?',()=>{sellBld(b);closeWin()});return}
 else if(a==='goenc'){const en=encById(+d.id);cam.x=(en.x0+en.x1+1)/2*TS;cam.y=(en.y0+en.y1+1)/2*TS;openEnc(en);return}
 else if(a==='hire'){hireStaff(d.k)}
 else if(a==='fire'){const s=S.staff.find(x=>x.id==+d.id);S.staff=S.staff.filter(x=>x!==s);sfx.click()}

function treatRush(){closeWin();closeMenu();setTool({k:'sel'});let score=0,combo=0,t=12,miss=0;modal('<h3>🎯 Treat Rush!</h3><p>Tap the treats before they pop! Golden ones are worth more. Chain taps for a combo!</p><div id="mga" style="position:relative;width:min(320px,80vw);height:220px;background:#cdeccd;border-radius:12px;overflow:hidden;margin:auto"></div><p id="mgs"><b>Score 0</b> · Time 12</p><button onclick="closeModal()">Close</button>');
 const arena=$('mga');S.st.mg=(S.st.mg||0)+1;sfx.fanfare();

  d.onpointerdown=ev=>{ev.stopPropagation();combo++;const p=(gold?5:1)*Math.min(5,1+(combo>>2));score+=p;d.textContent='+'+p;d.style.transform='scale(1.6)';d.onpointerdown=null;sfx.coin(Math.min(combo,14));setTimeout(()=>d.remove(),200);missed=0;};

// ---------- title ----------
let selDiff='medium',selMut='none';
function showTitle(){started=false;S&&(S.paused=true);const t=$('title');t.style.display='flex';closeWin();closeMenu();

 t.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.d){selDiff=b.dataset.d;newMenu()}else if(b.dataset.m){selMut=b.dataset.m;newMenu()}else if(b.id==='tGo')startNew();else if(b.id==='tBack')showTitle()}}
function starterPen(){const e=placeEnc.call(null,3,21,27,24,30);if(!e)return;const a=newAnimal(ANI.find(x=>x.n==='Chicken').id,e,false),b=newAnimal(ANI.find(x=>x.n==='Duck').id,e,false);a.sex=0;b.sex=1;for(const q of[a,b]){S.animals.push(q);e.an.push(q);S.book[q.s]=1;S.st.adopt++}S.sup.feed=40;S.money=D.money;S.dIn=0;S.dOut=0;S.st.built=0;e.name='Starter Farm';e.feed=10}

let last=performance.now(),acc=0,uiT=0,saveT=0,goalT=0,bookT=0;
function frame(now){const rd=Math.min(.1,(now-last)/1000);last=now;T+=rd;
 if(S&&started){
  if(fx.hit>0)fx.hit-=rd;
  else if(!S.paused){acc+=rd*S.speed*fx.slow;let n=0;while(acc>=.1&&n++<30){step(.1);acc-=.1}if(n>=30)acc=0}
