<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cube Dash - S.I.P. Arcade</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0620;overflow:hidden;font-family:"Trebuchet MS",Verdana,sans-serif;color:#fff;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
canvas#c{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
.ov{position:fixed;inset:0;display:none;overflow:auto;touch-action:pan-y;background:rgba(8,4,28,.82)}
.ov.show{display:block}
.panel{max-width:980px;margin:0 auto;padding:14px 14px 40px}
h1{margin:6px 0 0;font-size:clamp(34px,7vw,64px);letter-spacing:4px;text-align:center;text-shadow:0 0 18px #7c4dff,0 4px 0 #3b1fa3;color:#fff}
.sub{text-align:center;color:#b9a8ff;letter-spacing:3px;font-size:14px;margin-bottom:8px}
.row{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin:8px 0}
button{font:inherit;font-weight:700;color:#fff;background:#5b3df0;border:0;border-bottom:4px solid #35229b;border-radius:10px;padding:10px 18px;font-size:16px;cursor:pointer;touch-action:manipulation}
button:active{transform:translateY(2px);border-bottom-width:2px}
button.alt{background:#1fa86a;border-bottom-color:#127147}
button.gray{background:#4a4670;border-bottom-color:#2e2b48}
button.sm{padding:6px 12px;font-size:14px}
.wallet{background:#2a1c63;border:2px solid #ffd23f;border-radius:20px;padding:6px 14px;color:#ffd23f;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;margin-top:10px}
.card{background:linear-gradient(160deg,hsl(var(--h),60%,26%),hsl(var(--h),70%,14%));border:2px solid hsl(var(--h),80%,60%);border-radius:14px;padding:10px;text-align:center;position:relative}
.card .n{position:absolute;left:8px;top:4px;font-size:22px;font-weight:900;color:hsl(var(--h),90%,75%)}
.card .nm{font-size:18px;font-weight:800;margin-top:14px}
.card .df{font-size:12px;color:#d8d0ff;margin:2px 0}
.card .st{font-size:13px;color:#ffd23f;letter-spacing:2px;min-height:18px}
.bar{height:8px;background:#0007;border-radius:5px;margin:6px 0;overflow:hidden}
.bar i{display:block;height:100%;background:hsl(var(--h),90%,60%)}
.bar.p i{background:#37e6a0}
.pct{font-size:12px;color:#cfc8ff}
.card .row{margin:6px 0 0}
#hud{position:fixed;left:0;top:0;right:0;pointer-events:none;display:none}
#hud.show{display:block}
#hud button{pointer-events:auto;position:absolute;top:10px;padding:6px 12px;font-size:16px;opacity:.85}
#bPause{right:10px}
#bCp{right:68px;display:none}
#bCpx{right:128px;display:none}
.pr #bCp,.pr #bCpx{display:block}
.box{background:#1a1245;border:2px solid #7c4dff;border-radius:16px;max-width:460px;margin:12vh auto 0;padding:18px;text-align:center}
.box h2{margin:0 0 8px;font-size:30px;color:#ffd23f}
.box p{margin:6px 0;color:#d8d0ff}
.stats{display:flex;gap:14px;justify-content:center;margin:10px 0;flex-wrap:wrap}
.stats div{background:#0006;border-radius:10px;padding:8px 14px}
.stats b{display:block;font-size:22px;color:#fff}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:8px 0 16px}
.it{background:#1a1245;border:2px solid #3b2d8f;border-radius:12px;padding:8px;text-align:center;font-size:13px;cursor:pointer}
.it.sel{border-color:#37e6a0;background:#143a46}
.it.lock{opacity:.85}
.it canvas{width:64px;height:64px;display:block;margin:0 auto 4px}
.it .pr{color:#ffd23f;font-weight:800}
h3{margin:14px 0 4px;color:#b9a8ff;letter-spacing:2px}
#hero{display:block;margin:4px auto;width:84px;height:84px}
.hint{text-align:center;color:#8f84c9;font-size:13px;margin-top:14px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><button id="bCpx" class="gray" title="Remove checkpoint">&#9670;-</button><button id="bCp" class="alt" title="Place checkpoint">&#9670;+</button><button id="bPause" class="gray">&#10074;&#10074;</button></div>

<div id="title" class="ov show"><div class="panel">
  <h1>CUBE DASH</h1><div class="sub">S.I.P. ARCADE</div>
  <canvas id="hero" width="168" height="168"></canvas>
  <div class="row"><span class="wallet" id="wal">Coins: 0</span><button id="bShop" class="alt">Cube Shop</button><button id="bSnd" class="gray">Sound: on</button></div>
  <div class="grid" id="lvgrid"></div>
  <div class="hint">Space / Up / click / tap = jump, fly or flip. Hold for ship and wave. P or Esc = pause.</div>
</div></div>

<div id="shop" class="ov"><div class="panel">
  <h1 style="font-size:40px">CUBE SHOP</h1>
  <div class="row"><span class="wallet" id="wal2">Coins: 0</span><button id="bShopBack" class="gray">Back</button></div>
  <h3>COLORS</h3><div class="shopgrid" id="shopC"></div>
  <h3>FACES</h3><div class="shopgrid" id="shopF"></div>
  <div class="hint" id="shopMsg">Collect coins in normal runs to unlock more.</div>
</div></div>

<div id="pause" class="ov"><div class="box"><h2>Paused</h2>
  <div class="row"><button id="bRes" class="alt">Resume</button><button id="bRst">Restart</button></div>
  <div class="row"><button id="bPrac" class="gray">Practice mode</button><button id="bQuit" class="gray">Menu</button></div>
  <div class="row"><button id="bGfx" class="gray sm">Graphics: Realistic</button></div>
</div></div>

<div id="done" class="ov"><div class="box"><h2 id="dTitle">Level Complete!</h2><p id="dName"></p>
  <div class="stats"><div><b id="dAtt">0</b>attempts</div><div><b id="dCoin">0/3</b>coins</div><div><b id="dTime">0s</b>time</div></div>
  <p id="dMsg"></p>
  <div class="row"><button id="bNext" class="alt">Next level</button><button id="bAgain">Replay</button><button id="bMenu" class="gray">Menu</button></div>
</div></div>

<script>
'use strict';
/* ===================== helpers + save ===================== */
var SAVE_KEY='sip_cube-dash_save';
function defSave(){return{coins:0,lv:{},own:{c:[0],f:[0]},sel:{c:0,f:0},sound:true}}
function loadSave(){try{var r=localStorage.getItem(SAVE_KEY);if(r){var o=JSON.parse(r),d=defSave();for(var k in d)if(o[k]===undefined)o[k]=d[k];if(!o.own||!o.own.c||!o.own.f)o.own=d.own;if(!o.sel)o.sel=d.sel;return o}}catch(e){}return defSave()}
var save=loadSave();
function writeSave(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save))}catch(e){}}
function lvs(i){return save.lv[i]||(save.lv[i]={best:0,pbest:0,coins:[0,0,0],att:0,done:0})}

function drawCube(g,x,y,s,ci,fi,rot){
 var c=COLORS[ci]||COLORS[0];
 g.save();g.translate(x,y);if(rot)g.rotate(rot);
 var h=s/2;
 var gr=g.createLinearGradient(-h,-h,h,h);gr.addColorStop(0,c.a);gr.addColorStop(1,c.b);
 g.fillStyle=gr;g.fillRect(-h,-h,s,s);
 g.lineWidth=Math.max(2,s*.08);g.strokeStyle='#fff';g.globalAlpha=.9;g.strokeRect(-h+g.lineWidth/2,-h+g.lineWidth/2,s-g.lineWidth,s-g.lineWidth);g.globalAlpha=1;
 drawFace(g,s,fi);
 g.restore();
}
function drawFace(g,s,fi){
 var e=s*.11;g.fillStyle='#111';g.strokeStyle='#111';g.lineWidth=Math.max(1.5,s*.06);g.lineCap='round';
 function eyes(){g.fillRect(-s*.22-e/2,-s*.12-e,e,e*2);g.fillRect(s*.22-e/2,-s*.12-e,e,e*2)}
 function smile(w,d){g.beginPath();g.arc(0,s*.1,w,.2*Math.PI,.8*Math.PI);g.stroke()}
 switch(fi){
 case 0:eyes();smile(s*.26);break;
 case 1:g.fillStyle='#111';g.fillRect(-s*.36,-s*.2,s*.72,s*.2);g.fillStyle='#fff';g.fillRect(-s*.3,-s*.17,s*.1,s*.05);g.fillRect(s*.1,-s*.17,s*.1,s*.05);g.strokeStyle='#111';g.beginPath();g.moveTo(-s*.15,s*.2);g.lineTo(s*.15,s*.2);g.stroke();break;
 case 2:g.beginPath();g.moveTo(-s*.32,-s*.05);g.lineTo(-s*.22,-s*.2);g.lineTo(-s*.12,-s*.05);g.moveTo(s*.12,-s*.05);g.lineTo(s*.22,-s*.2);g.lineTo(s*.32,-s*.05);g.stroke();g.beginPath();g.arc(0,s*.05,s*.28,.1*Math.PI,.9*Math.PI);g.stroke();break;
 case 3:eyes();g.beginPath();g.moveTo(-s*.34,-s*.3);g.lineTo(-s*.1,-s*.18);g.moveTo(s*.34,-s*.3);g.lineTo(s*.1,-s*.18);g.stroke();g.beginPath();g.moveTo(-s*.16,s*.26);g.lineTo(s*.16,s*.26);g.stroke();break;
 case 4:for(var k=-1;k<=1;k+=2){g.save();g.translate(k*s*.22,-s*.08);g.fillStyle='#111';g.beginPath();for(var i=0;i<8;i++){var r=i%2?s*.05:s*.15,a=i*Math.PI/4;g.lineTo(Math.sin(a)*r,-Math.cos(a)*r)}g.closePath();g.fill();g.restore()}smile(s*.22);break;
 case 5:g.fillRect(-s*.32,-s*.2,s*.2,s*.2);g.fillRect(s*.12,-s*.2,s*.2,s*.2);g.fillRect(-s*.25,s*.15,s*.5,s*.14);g.fillStyle='#8f8';g.fillRect(-s*.26,-s*.19,s*.08,s*.08);g.fillRect(s*.14,-s*.19,s*.08,s*.08);g.fillStyle='#fff';for(var j=-2;j<=2;j++)g.fillRect(j*s*.1-1,s*.16,2,s*.12);break;
 case 6:g.beginPath();g.moveTo(-s*.5,-s*.5);g.lineTo(-s*.5,-s*.26);g.lineTo(-s*.26,-s*.5);g.closePath();g.moveTo(s*.5,-s*.5);g.lineTo(s*.5,-s*.26);g.lineTo(s*.26,-s*.5);g.closePath();g.fill();eyes();g.lineWidth=1.2;g.beginPath();g.moveTo(-s*.1,s*.1);g.lineTo(-s*.42,s*.04);g.moveTo(-s*.1,s*.16);g.lineTo(-s*.42,s*.2);g.moveTo(s*.1,s*.1);g.lineTo(s*.42,s*.04);g.moveTo(s*.1,s*.16);g.lineTo(s*.42,s*.2);g.stroke();g.beginPath();g.moveTo(-s*.06,s*.1);g.lineTo(0,s*.16);g.lineTo(s*.06,s*.1);g.stroke();break;
 case 7:g.fillStyle='#ffd23f';g.beginPath();g.moveTo(-s*.3,-s*.14);g.lineTo(-s*.34,-s*.42);g.lineTo(-s*.15,-s*.28);g.lineTo(0,-s*.46);g.lineTo(s*.15,-s*.28);g.lineTo(s*.34,-s*.42);g.lineTo(s*.3,-s*.14);g.closePath();g.fill();g.stroke();g.fillStyle='#111';g.fillRect(-s*.22-e/2,-s*.04,e,e*1.6);g.fillRect(s*.22-e/2,-s*.04,e,e*1.6);g.beginPath();g.arc(0,s*.14,s*.2,.2*Math.PI,.8*Math.PI);g.stroke();break;
 }
}

 function add(o,x0,x1){L.all.push(o);for(var c=Math.floor(x0);c<=Math.floor(x1);c++){(L.cols[c]||(L.cols[c]=[])).push(o)}}
 def.o.forEach(function(e){
  var t=e[0],X=e[1]*tpb,i,o;
  if(t==='S'||t==='D'){
   var n=e[2],y=t==='S'?e[3]:CEIL,dx=t==='S'?e[4]:e[3];
   for(i=0;i<n;i++){var cx=X+dx+(i-(n-1)/2);
    o=t==='S'?{k:'s',x0:cx-.16,x1:cx+.16,y0:y,y1:y+.55,cx:cx,by:y,dir:1}:{k:'s',x0:cx-.16,x1:cx+.16,y0:CEIL-.55,y1:CEIL,cx:cx,by:CEIL,dir:-1};
    add(o,cx-.5,cx+.5)}
  }else if(t==='B'){o={k:'b',x0:X+e[5],x1:X+e[5]+e[3],y0:e[2],y1:e[2]+e[4]};add(o,o.x0,o.x1)}
  else if(t==='T'){var gx=X+e[5],lo=e[2]-e[3]/2,hi=e[2]+e[3]/2;
   if(lo>.01){o={k:'b',x0:gx,x1:gx+e[4],y0:0,y1:lo,g:1};add(o,o.x0,o.x1)}
   if(hi<CEIL-.01){o={k:'b',x0:gx,x1:gx+e[4],y0:hi,y1:CEIL,g:1};add(o,o.x0,o.x1)}}
  else if(t==='W'){o={k:'w',x:X+e[4],y:e[2],r:e[3]};add(o,o.x-o.r,o.x+o.r)}
  else if(t==='U'){var px=X+e[3];o={k:'u',x0:px-.5,x1:px+.5,y0:e[2],y1:e[2]+.3,id:L.nid++};add(o,o.x0,o.x1)}
  else if(t==='O'){o={k:'o',x:X+e[3],y:e[2],id:L.nid++};add(o,o.x,o.x)}
  else if(t==='C'){o={k:'c',x:X+e[3],y:e[2],i:L.ncoin++};L.coinList.push(o);add(o,o.x,o.x)}
  else if(t==='M'){L.trig.push({k:'m',x:X,mode:e[2],g:e[3]})}
  else if(t==='G'){L.trig.push({k:'g',x:X,g:e[2]})}
 });
 L.trig.sort(function(a,b){return a.x-b.x});
 L.trig.forEach(function(t){L.all.push(t)});
 if(L.ncoin!==3&&window.console)console.warn('level '+def.name+' has '+L.ncoin+' coins');
 return L;
}
var LC=[];function getL(i){return LC[i]||(LC[i]=compile(LEVELS[i]))}
function newState(L){return{L:L,t:0,x:0,y:HS.cube,vy:0,mode:'cube',gd:1,gr:true,prev:false,buf:0,ti:0,dead:false,won:false,rot:0,used:new Uint8Array(L.nid+1),cmask:0,why:''}}
function cloneS(S){var T=Object.assign({},S);T.used=S.used.slice();return T}
function die(S,why,em){S.dead=true;S.why=why}
function step(S,hold,dt,em){
 if(S.dead||S.won)return;
 var L=S.L,v=L.v,i,c,o,list;
 if(hold&&!S.prev)S.buf=.1;else if(S.buf>0)S.buf=Math.max(0,S.buf-dt);
 S.prev=hold;
 while(S.ti<L.trig.length&&L.trig[S.ti].x<=S.x){
  var tr=L.trig[S.ti++];
  if(tr.k==='m'){S.mode=tr.mode;S.gd=tr.g;S.gr=false;if(tr.mode==='ship')S.vy=Math.max(-8,Math.min(8,S.vy))}
  else if(S.mode==='cube'||S.mode==='ball'){S.gd=tr.g;S.gr=false}
  if(em)em('portal');
 }
 var m=S.mode,hs=HS[m],g=S.gd;
 if(m==='cube'){
  if(S.gr&&hold){S.vy=JV*g;S.gr=false;if(em)em('jump')}
  S.vy-=GRAV*g*dt;if(S.vy<-26)S.vy=-26;if(S.vy>26)S.vy=26;
 }else if(m==='ship'){
  S.vy+=(hold?50:-40)*dt;if(S.vy>8)S.vy=8;if(S.vy<-8)S.vy=-8;
 }else if(m==='ball'){
  if(S.buf>0&&S.gr){S.gd=g=-g;S.gr=false;S.buf=0;S.vy=0;if(em)em('flip')}
  S.vy-=GB*g*dt;if(S.vy<-24)S.vy=-24;if(S.vy>24)S.vy=24;
 }else{S.vy=hold?v:-v}
 var y0=S.y;S.y+=S.vy*dt;S.gr=false;
 var lo=hs,hi=CEIL-hs;
 if(S.y<lo){S.y=lo;if(m!=='wave'&&S.vy<0)S.vy=0;if(g===1)S.gr=true}
 else if(S.y>hi){S.y=hi;if(m!=='wave'&&S.vy>0)S.vy=0;if(g===-1)S.gr=true}
 var c0=Math.floor(S.x-1.7),c1=Math.floor(S.x+1.7),E=1e-6;
 for(c=c0;c<=c1;c++){list=L.cols[c]||EMPTY;
  for(i=0;i<list.length;i++){o=list[i];if(o.k!=='b')continue;
   if(S.x+hs>o.x0+E&&S.x-hs<o.x1-E&&S.y+hs>o.y0+E&&S.y-hs<o.y1-E){
    if(m==='wave'){die(S,'block');return}
    if(y0-hs>=o.y1-1e-4){S.y=o.y1+hs;if(S.vy<0)S.vy=0;if(g===1)S.gr=true}
    else if(y0+hs<=o.y0+1e-4){S.y=o.y0-hs;if(S.vy>0)S.vy=0;if(g===-1)S.gr=true}
   }}}
 S.x+=v*dt;
 for(c=c0;c<=c1+1;c++){list=L.cols[c]||EMPTY;
  for(i=0;i<list.length;i++){o=list[i];if(o.k!=='b')continue;
   if(S.x+hs>o.x0+E&&S.x-hs<o.x1-E&&S.y+hs>o.y0+E&&S.y-hs<o.y1-E){
    if(m==='wave'){die(S,'block');return}
    var rise=o.y1-(S.y-hs),drop=(S.y+hs)-o.y0;
    if(rise>0&&rise<=.16){S.y=o.y1+hs;if(S.vy<0)S.vy=0;if(g===1)S.gr=true}
    else if(drop>0&&drop<=.16){S.y=o.y0-hs;if(S.vy>0)S.vy=0;if(g===-1)S.gr=true}
    else{die(S,'wall');return}
   }}}
 for(c=c0;c<=c1+1;c++){list=L.cols[c]||EMPTY;
  for(i=0;i<list.length;i++){o=list[i];
   switch(o.k){
   case's':if(S.x+hs>o.x0&&S.x-hs<o.x1&&S.y+hs>o.y0&&S.y-hs<o.y1){die(S,'spike');return}break;
   case'w':{var nx=Math.max(S.x-hs,Math.min(o.x,S.x+hs)),ny=Math.max(S.y-hs,Math.min(o.y,S.y+hs)),dx=nx-o.x,dy=ny-o.y,rr=o.r*.8;if(dx*dx+dy*dy<rr*rr){die(S,'saw');return}break}
   case'u':if(!S.used[o.id]&&m==='cube'&&S.x+hs>o.x0&&S.x-hs<o.x1&&S.y+hs>o.y0&&S.y-hs<o.y1){S.used[o.id]=1;S.vy=PADV*g;S.gr=false;if(em)em('pad')}break;
   case'o':if(!S.used[o.id]&&m==='cube'&&S.buf>0&&Math.abs(S.x-o.x)<.9&&Math.abs(S.y-o.y)<.9){S.used[o.id]=1;S.vy=ORBV*g;S.buf=0;S.gr=false;if(em)em('orb')}break;
   case'c':if(!(S.cmask>>o.i&1)&&Math.abs(S.x-o.x)<.9&&Math.abs(S.y-o.y)<.9){S.cmask|=1<<o.i;if(em)em('coin')}break;
   }}}
 if(m==='cube'){if(S.gr){S.rot=Math.round(S.rot/90)*90}else S.rot+=-g*330*dt}
 S.t+=dt;
 if(S.x>=L.endX){S.won=true}
}

/* ===================== test bot (perfect-play planner) ===================== */
var BOT_EP=6;
function botDfs(S,dep,pref,coinMode,bud){
 if(dep===0)return[];
 var order=(pref.length&&pref[0])?[true,false]:[false,true];
 for(var q=0;q<2;q++){
  var a=order[q],T=cloneS(S),k;
  for(k=0;k<BOT_EP;k++){step(T,a,DT);if(T.dead||T.won)break}
  if(T.dead)continue;
  if(T.won)return[a];
  if(coinMode){var bad=false;for(var ci=0;ci<T.L.coinList.length;ci++){var cn=T.L.coinList[ci];if(cn.x+.95<T.x&&!(T.cmask>>cn.i&1)){bad=true;break}}if(bad)continue}
  if(--bud.n<0)return null;
  var r=botDfs(T,dep-1,pref.slice(1),coinMode,bud);
  if(r)return[a].concat(r);
 }
 return null;
}
function runBot(li,coinMode,depth){
 var L=compile(LEVELS[li]),S=newState(L),pref=[],epochs=0,stuck=null;
 depth=depth||14;
 while(!S.won&&!S.dead&&epochs<20000){
  var plan=botDfs(S,depth,pref,coinMode,{n:60000});
  if(!plan){return{ok:false,x:+S.x.toFixed(2),beat:+(S.x/L.tpb).toFixed(2),pct:Math.floor(S.x/L.endX*100),why:'no-plan',mode:S.mode}}
  var a=plan[0];pref=plan.slice(1);
  for(var k=0;k<BOT_EP;k++){step(S,a,DT);if(S.dead||S.won)break}
  epochs++;
 }
 return{ok:S.won,x:+S.x.toFixed(2),coins:S.cmask,time:+S.t.toFixed(1),why:S.why};
}

/* ===================== audio ===================== */
var actx=null,master=null,bus=null,noiseBuf=null,musTimer=0,musStart=0,nextStep=0,musSd=0.1,curDef=null;
function ensureAudio(){
 try{
  if(actx){if(actx.state==='suspended')actx.resume();return}
  var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  actx=new AC();master=actx.createGain();master.gain.value=save.sound?.8:0;master.connect(actx.destination);
  noiseBuf=actx.createBuffer(1,actx.sampleRate,actx.sampleRate);var ch=noiseBuf.getChannelData(0);for(var i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;
 }catch(e){actx=null}
}
function setSound(on){save.sound=on;writeSave();if(master)master.gain.value=on?.8:0;$('bSnd').textContent='Sound: '+(on?'on':'off')}
function frq(m){return 440*Math.pow(2,(m-69)/12)}
function tone(f,t,dur,type,vol,dest,slide){
 var o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
 g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.03);
}
function noiseHit(t,dur,vol,ftype,fq,dest){
 var n=actx.createBufferSource();n.buffer=noiseBuf;var f=actx.createBiquadFilter();f.type=ftype;f.frequency.value=fq;var g=actx.createGain();
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);n.connect(f);f.connect(g);g.connect(dest);n.start(t,Math.random()*.5);n.stop(t+dur+.02);
}
function degSemi(sc,dg){var oc=Math.floor(dg/7),ix=((dg%7)+7)%7;return sc[ix]+12*oc}
function schedStep(st,t){
 var m=curDef.m,i=st%16,bar=Math.floor(st/16)%4,ph=Math.floor(st/64),ch=m.prog[bar],sd=musSd,dest=bus;
 if(m.K[i]==='x'){tone(150,t,.16,'sine',.9,dest,42)}
 if(m.S[i]==='x'){noiseHit(t,.14,.35,'bandpass',1800,dest);tone(220,t,.08,'triangle',.2,dest,120)}
 if(m.H[i]==='x'){noiseHit(t,.04,.12,'highpass',7500,dest)}
 var bc=m.B[i];
 if(bc!=='.'){tone(frq(m.root-12+degSemi(m.sc,ch)+(bc==='o'?12:0)),t,sd*1.7,m.bw,.2,dest)}
 if(ph%2===1||ph>=3){var tk=m.L.split(' ')[st%32];if(tk&&tk!=='.')tone(frq(m.root+12+degSemi(m.sc,parseInt(tk,10)+ch)),t,sd*1.9,m.lw,.09,dest)}
 if(ph>=2&&m.arp){var ar=[0,2,4,7][i%4];tone(frq(m.root+12+degSemi(m.sc,ch+ar)),t,sd*.8,'triangle',.06,dest)}
}
function pump(){
 if(!actx||!bus||!curDef)return;
 var lim=actx.currentTime+.35;
 while(musStart+nextStep*musSd<lim){schedStep(nextStep,Math.max(actx.currentTime,musStart+nextStep*musSd));nextStep++}
}
function stopMusic(){clearInterval(musTimer);musTimer=0;if(bus){try{bus.gain.value=0;bus.disconnect()}catch(e){}bus=null}}
function startMusic(def,songT){
 if(!actx)return;stopMusic();
 try{bus=actx.createGain();bus.gain.value=1;bus.connect(master);curDef=def;musSd=60/def.bpm/4;
  musStart=actx.currentTime+.08-songT;nextStep=Math.ceil(songT/musSd-1e-6);musTimer=setInterval(pump,25);pump()}catch(e){}
}
function sfx(kind){
 if(!actx||!save.sound)return;var t=actx.currentTime;
 try{
 switch(kind){
 case'jump':tone(500,t,.08,'square',.05,master,900);break;
 case'pad':tone(300,t,.2,'sawtooth',.12,master,1200);break;
 case'orb':tone(700,t,.12,'triangle',.15,master,1400);break;
 case'flip':tone(400,t,.1,'square',.06,master,200);break;
 case'portal':tone(200,t,.3,'sawtooth',.12,master,1000);break;
 case'coin':tone(988,t,.08,'square',.15,master);tone(1319,t+.07,.25,'square',.15,master);break;
 case'die':noiseHit(t,.4,.6,'lowpass',900,master);tone(180,t,.3,'sawtooth',.25,master,40);break;
 case'win':[523,659,784,1047].forEach(function(f,i){tone(f,t+i*.12,.4,'triangle',.2,master)});break;
 case'buy':tone(700,t,.1,'square',.12,master);tone(1050,t+.08,.2,'square',.12,master);break;
 case'click':tone(600,t,.05,'square',.08,master);break;
 }}catch(e){}
}

/* ===================== update ===================== */
function update(dt){
 if(scene!=='play'||!S)return;
 if(shake>0)shake-=dt;if(flash>0)flash-=dt;
 if(!S.dead&&!S.won){
  acc+=dt;var n=0;
  while(acc>=DT&&n<30){
   step(S,hold,DT,emit);acc-=DT;n++;
   if(S.dead||S.won)break;
  }
  if(acc>DT*30)acc=0;
  for(var q=0;q<evq.length;q++)sfx(evq[q]);evq.length=0;
  // trails
  var c=COLORS[save.sel.c];
  if(S.mode==='wave'){wtrail.push({x:S.x,y:S.y});}
  else if(S.mode==='ship'){if(hold||Math.random()<.4)parts.push({x:S.x-.5,y:S.y-.1,vx:-3-Math.random()*2,vy:(Math.random()-.5)*1.5,life:.35,max:.35,sz:.18,col:hold?'#ffd23f':'#ff7a3c',g:0})}
  else{if(S.gr||Math.random()<.5)parts.push({x:S.x-.35,y:S.y+(S.gd===1?-.35:.35),vx:-2-Math.random()*2,vy:(Math.random()-.3)*(S.gd)*1.5,life:.4,max:.4,sz:.1+Math.random()*.1,col:Math.random()<.5?c.a:'#fff',g:0})}
  if(S.dead&&!deadHandled){onDeath()}
  if(!practice&&!S.dead&&S.t-lastCp<0){}
  if(practice&&!S.dead&&!S.won&&S.t-lastCp>=3){lastCp=S.t;cps.push(cloneS(S));if(cps.length>40)cps.shift()}
  if(S.won){wonT=0}
 }else if(S.dead){
  deadT+=dt;if(deadT>.8)respawn();
 }else if(S.won){
  wonT+=dt;if(wonT>.9&&scene==='play'){onWin()}
 }
 for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy-=p.g*dt}
 if(parts.length>400)parts.splice(0,parts.length-400);
 if(wtrail.length>400)wtrail.splice(0,wtrail.length-400);
}

/* ===================== render ===================== */
var SC=40,OY=0,CAML=0,clock=0;
function sx(x){return(x-CAML)*SC}
function sy(y){return OY-y*SC}
function rgba(hex,a){var n=parseInt(hex.slice(1),16);return'rgba('+(n>>16)+','+(n>>8&255)+','+(n&255)+','+a+')'}
function renderClassic(now){
 var g=g2;g.setTransform(DPR,0,0,DPR,0,0);
 clock=now/1000;
 var def=(scene==='title'||scene==='shop'||!L)?LEVELS[Math.floor(clock/6)%LEVELS.length]:L.def;
 var inPlay=(scene==='play'||scene==='pause'||scene==='done')&&S;
 var songT=inPlay?S.t:clock;
 var beat=songT*def.bpm/60,ph=beat%1,pulse=Math.exp(-ph*4.5);
 SC=Math.min(VW/17,VH/11.4);OY=(VH-11.4*SC)/2+10.2*SC;
 var px=inPlay?S.x:clock*def.v;
 CAML=px-.28*VW/SC;
 var pal=def.pal;
 // background
 var bg=g.createLinearGradient(0,0,0,VH);bg.addColorStop(0,pal[0]);bg.addColorStop(1,pal[1]);g.fillStyle=bg;g.fillRect(0,0,VW,VH);
 // parallax shapes pulsing
 g.save();
 for(var layer=0;layer<2;layer++){
  var par=layer?.35:.15,sz=(layer?1.6:2.6)*SC,gap=(layer?3.2:5.4)*SC;
  var off=-((CAML*SC*par)%gap);
  g.fillStyle=rgba(pal[2],(layer?.10:.07)+.08*pulse);
  for(var xx=off-gap;xx<VW+gap;xx+=gap){
   var idx=Math.round((xx-off)/gap)+Math.floor(CAML*SC*par/gap);var hh=sz*(1.4+((idx*37)%5)*.45)*(1+.18*pulse);
   if(layer){g.save();g.translate(xx,sy(1)-hh*.8);g.rotate(Math.PI/4);g.fillRect(-sz/2,-sz/2,sz*(1+.2*pulse),sz*(1+.2*pulse));g.restore()}
   else g.fillRect(xx,sy(0)-hh*1.6,sz,hh*1.6);
  }
 }
 g.restore();
 g.fillStyle='rgba(255,255,255,'+(.06*pulse)+')';g.fillRect(0,0,VW,VH);
 // shake
 g.save();
 if(shake>0){g.translate((Math.random()-.5)*SC*.3*shake*3,(Math.random()-.5)*SC*.3*shake*3)}
 // ground + ceiling
 var gy=sy(0),cy=sy(CEIL);
 var gg=g.createLinearGradient(0,gy,0,VH);gg.addColorStop(0,pal[1]);gg.addColorStop(1,'#000');g.fillStyle=gg;g.fillRect(0,gy,VW,VH-gy);
 var cg=g.createLinearGradient(0,0,0,cy);cg.addColorStop(0,'#000');cg.addColorStop(1,pal[1]);g.fillStyle=cg;g.fillRect(0,0,VW,cy);
 g.strokeStyle=rgba(pal[2],.7+.3*pulse);g.lineWidth=3+3*pulse;g.beginPath();g.moveTo(0,gy);g.lineTo(VW,gy);g.moveTo(0,cy);g.lineTo(VW,cy);g.stroke();
 g.strokeStyle=rgba(pal[2],.25);g.lineWidth=1;
 for(var gx=-((CAML%1.5)*SC);gx<VW;gx+=1.5*SC){g.beginPath();g.moveTo(gx,gy);g.lineTo(gx-SC*.6,VH);g.stroke();g.beginPath();g.moveTo(gx,cy);g.lineTo(gx-SC*.6,0);g.stroke()}
 // objects
 if(L&&(inPlay||scene==='play')){
  var left=CAML-2,right=CAML+VW/SC+2,cm=inPlay?S.cmask:0,all=L.all;
  for(var i=0;i<all.length;i++){var o=all[i];
   switch(o.k){
   case'b':if(o.x1<left||o.x0>right)break;drawBlock(g,o,pal,pulse);break;
   case's':if(o.cx<left||o.cx>right)break;drawSpike(g,o,pal);break;
   case'w':if(o.x<left||o.x>right)break;drawSaw(g,o,pal);break;
   case'u':if(o.x1<left||o.x0>right)break;g.fillStyle='#ffe14f';g.shadowColor='#ffe14f';g.shadowBlur=10;g.fillRect(sx(o.x0),sy(o.y1),SC,SC*.3);g.shadowBlur=0;g.fillStyle='#fff8';g.fillRect(sx(o.x0)+SC*.1,sy(o.y1),SC*.8,SC*.08);break;
   case'o':if(o.x<left||o.x>right)break;var rr=SC*(.42+.06*pulse);g.strokeStyle='#ffe14f';g.lineWidth=4;g.shadowColor='#ffe14f';g.shadowBlur=12;g.beginPath();g.arc(sx(o.x),sy(o.y),rr,0,6.28);g.stroke();g.fillStyle='rgba(255,225,79,.35)';g.beginPath();g.arc(sx(o.x),sy(o.y),rr*.6,0,6.28);g.fill();g.shadowBlur=0;break;
   case'c':if(o.x<left||o.x>right||(cm>>o.i&1))break;drawCoin(g,sx(o.x),sy(o.y),SC*.36,clock);break;
   case'm':if(o.x<left||o.x>right)break;drawPortal(g,o,'m');break;
   case'g':if(o.x<left||o.x>right)break;drawPortal(g,o,'g');break;
   }
  }
  // finish
  var fx=sx(L.endX);if(fx<VW+50){g.fillStyle='rgba(255,255,255,.85)';for(var r=0;r<20;r++){g.fillStyle=r%2?'#fff':'#111';g.fillRect(fx,sy(CEIL)+r*SC*.45,SC*.4,SC*.45);g.fillStyle=r%2?'#111':'#fff';g.fillRect(fx+SC*.4,sy(CEIL)+r*SC*.45,SC*.4,SC*.45)}}
 }
 // particles
 for(var j=0;j<parts.length;j++){var p=parts[j];g.globalAlpha=Math.max(0,p.life/p.max);g.fillStyle=p.col;g.fillRect(sx(p.x)-p.sz*SC/2,sy(p.y)-p.sz*SC/2,p.sz*SC,p.sz*SC)}
 g.globalAlpha=1;
 // wave trail
 if(inPlay&&wtrail.length>1){
  g.strokeStyle=COLORS[save.sel.c].a;g.lineWidth=SC*.28;g.lineJoin='round';g.lineCap='round';g.shadowColor=COLORS[save.sel.c].a;g.shadowBlur=10;
  g.beginPath();var st=false;for(var k=0;k<wtrail.length;k++){var w=wtrail[k];if(w.x<CAML-1)continue;if(!st){g.moveTo(sx(w.x),sy(w.y));st=true}else g.lineTo(sx(w.x),sy(w.y))}
  g.stroke();g.shadowBlur=0;
 }
 // player
 if(inPlay&&!S.dead)drawPlayer(g);
 else if(!inPlay){drawCube(g,sx(px),sy(.5+Math.abs(Math.sin(clock*3))*1.5),SC*.9,save.sel.c,save.sel.f,clock*3)}
 g.restore();
 if(flash>0){g.fillStyle='rgba(255,255,255,'+(flash*.5)+')';g.fillRect(0,0,VW,VH)}
 if(inPlay&&scene!=='done')drawHUD(g,pulse);
}
function drawBlock(g,o,pal,pulse){
 var x=sx(o.x0),y=sy(o.y1),w=(o.x1-o.x0)*SC,h=(o.y1-o.y0)*SC;
 var gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,rgba(pal[2],.55));gr.addColorStop(1,rgba(pal[2],.22));

 g.strokeStyle=rgba(pal[2],.25);g.lineWidth=1;g.beginPath();
 for(var u=1;u<(o.x1-o.x0);u++){g.moveTo(x+u*SC,y);g.lineTo(x+u*SC,y+h)}
 for(var v=1;v<(o.y1-o.y0);v++){g.moveTo(x,y+v*SC);g.lineTo(x+w,y+v*SC)}
 g.stroke();
 g.strokeStyle='#fff';g.globalAlpha=.7+.3*pulse;g.lineWidth=2.5;g.strokeRect(x+1,y+1,w-2,h-2);g.globalAlpha=1;

function drawSpike(g,o,pal){

function drawSaw(g,o,pal){

 for(var i=0;i<16;i++){var a=i*Math.PI/8,rr=i%2?r*.72:r;g.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}
 g.closePath();g.fill();g.stroke();g.fillStyle=pal[3];g.beginPath();g.arc(0,0,r*.28,0,6.28);g.fill();g.restore();
}

 var fg=g.createLinearGradient(0,gy,0,VH);fg.addColorStop(0,'rgba(0,0,0,.1)');fg.addColorStop(1,'rgba(0,0,0,.88)');g.fillStyle=fg;g.fillRect(0,gy,VW,VH-gy);

 g.globalCompositeOperation='lighter';
 var gl=g.createLinearGradient(0,gy,0,gy+SC*2.2);gl.addColorStop(0,rgba(pal[2],.22));gl.addColorStop(1,rgba(pal[2],0));g.fillStyle=gl;g.fillRect(0,gy,VW,SC*2.2);
 gl=g.createLinearGradient(0,cy-SC*2.2,0,cy);gl.addColorStop(0,rgba(pal[2],0));gl.addColorStop(1,rgba(pal[2],.2));g.fillStyle=gl;g.fillRect(0,cy-SC*2.2,VW,SC*2.2);
