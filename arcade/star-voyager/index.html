<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Star Voyager - S.I.P. Arcade</title>
<style>
:root{--bg:#02030a;--pan:rgba(8,14,30,.86);--bd:#27406e;--tx:#dbe8ff;--dim:#8fa6cf;--ac:#4fc3ff;--ok:#5fe39a;--warn:#ffc857;--bad:#ff6b6b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.4 "Segoe UI",system-ui,Arial,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
#ov{z-index:2}#gl{z-index:1}
#top{position:fixed;z-index:5;left:0;right:0;top:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;background:linear-gradient(#000c,#0000)}
#brand{font-weight:700;letter-spacing:.08em;color:var(--ac);margin-right:6px;white-space:nowrap}
#locn{color:var(--dim);flex:1;min-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sci{color:var(--warn);font-weight:700;white-space:nowrap}
button,.btn{background:#0d1c3a;color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
button:hover{background:#17306100;border-color:var(--ac);background:#173061}
button.pri{background:#0a5a8a;border-color:var(--ac)}
button.pri:hover{background:#0e78b4}
button:disabled{opacity:.4;cursor:default}
#side{position:fixed;z-index:8;right:8px;top:48px;bottom:56px;width:min(360px,calc(100% - 16px));overflow:auto;background:var(--pan);border:1px solid var(--bd);border-radius:10px;padding:10px;touch-action:pan-y}
.hidden{display:none!important}
#side h2{margin:0 0 2px;font-size:18px;color:#fff}
#side h3{margin:10px 0 4px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ac)}
table.kv{width:100%;border-collapse:collapse}
table.kv td{padding:2px 0;vertical-align:top}
table.kv td:first-child{color:var(--dim);padding-right:8px;white-space:nowrap}
table.kv td:last-child{text-align:right}
.est{color:var(--warn);font-style:italic;font-size:11px}
.tag{display:inline-block;padding:0 6px;border-radius:9px;font-size:11px;border:1px solid var(--bd);margin:0 3px 3px 0;color:var(--dim)}
.tag.ok{color:var(--ok);border-color:var(--ok)}
.bar{height:8px;background:#10213f;border-radius:4px;overflow:hidden;margin:1px 0 5px}
.bar i{display:block;height:100%;background:var(--ac)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
#bottom{position:fixed;z-index:5;left:8px;bottom:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 16px)}
#bottom span{color:var(--dim)}#bottom input[type=range]{padding:0}#bottom input[type=range]{padding:0}
#toast{position:fixed;z-index:30;left:50%;top:56px;transform:translateX(-50%);max-width:min(560px,92%);text-align:center;pointer-events:none}
#toast div{background:#0b1f3ee6;border:1px solid var(--ac);border-radius:8px;padding:6px 12px;margin-bottom:6px}
#tut{position:fixed;z-index:9;left:8px;top:48px;width:min(320px,calc(100% - 16px));background:#0b2a1cee;border:1px solid var(--ok);border-radius:10px;padding:8px 10px}
#modal{position:fixed;z-index:20;inset:0;background:#000a;display:flex;align-items:flex-start;justify-content:center;padding:44px 8px 8px;touch-action:pan-y}
#mbox{background:#070d1ef2;border:1px solid var(--bd);border-radius:12px;width:min(1000px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
#mhead{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--bd)}
#mhead h2{margin:0;flex:1;font-size:18px}
#mbody{padding:10px 12px;overflow:auto;flex:1;min-height:0}
#mbody h3{color:var(--ac);margin:12px 0 4px}
#mbody p{margin:4px 0}
input,select{background:#0a1630;color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:5px 8px;font:inherit;user-select:text;-webkit-user-select:text}
#vl{position:relative;overflow:auto;height:min(52vh,520px);border:1px solid var(--bd);border-radius:6px;touch-action:pan-y}
#vl .vr{position:absolute;left:0;right:0;height:30px;display:grid;grid-template-columns:2.4fr 1.8fr .9fr .8fr .8fr .9fr .7fr .6fr 1.3fr 36px;gap:6px;align-items:center;padding:0 8px;cursor:pointer;white-space:nowrap;overflow:hidden;border-bottom:1px solid #12203f}
#vl .vr:hover{background:#142a52}
#vl .vr span{overflow:hidden;text-overflow:ellipsis}
#vh{display:grid;grid-template-columns:2.4fr 1.8fr .9fr .8fr .8fr .9fr .7fr .6fr 1.3fr 36px;gap:6px;padding:4px 8px;color:var(--ac);font-size:12px;cursor:pointer}
#vh span:hover{text-decoration:underline}
@media(max-width:700px){#vl .vr,#vh{grid-template-columns:2fr 1.2fr .8fr .8fr 36px}#vl .vr span:nth-child(n+5):nth-child(-n+9),#vh span:nth-child(n+5):nth-child(-n+9){display:none}#side{top:auto;bottom:56px;height:45%}}
#ol{position:relative;overflow:auto;height:min(52vh,520px);border:1px solid var(--bd);border-radius:6px;touch-action:pan-y}#ol .vr{position:absolute;left:0;right:0;height:30px;display:grid;grid-template-columns:2.4fr 1.8fr 1fr .8fr .8fr;gap:6px;align-items:center;padding:0 8px;cursor:pointer;white-space:nowrap;overflow:hidden;border-bottom:1px solid #12203f}#ol .vr:hover{background:#142a52}#ol .vr span{overflow:hidden;text-overflow:ellipsis}#oh{display:grid;grid-template-columns:2.4fr 1.8fr 1fr .8fr .8fr;gap:6px;padding:4px 8px;color:var(--ac);font-size:12px;cursor:pointer}
.card{border:1px solid var(--bd);border-radius:8px;padding:8px;margin:6px 0;background:#0a1630}
.card.done{border-color:var(--ok)}
#touch{position:fixed;z-index:6;left:0;right:0;bottom:8px;display:flex;justify-content:space-between;padding:0 12px;pointer-events:none}

function parseCSV(text){
  const rows=[];let row=[],cur='',q=false,i=0,n=text.length,lineStart=true;

    if(lineStart&&c===35&&!q){while(i<n&&text.charCodeAt(i)!==10)i++;i++;continue}
    lineStart=false;

    if(c===13){i++;continue}
    if(c===10){row.push(cur);cur='';if(row.length>1||row[0]!=='')rows.push(row);row=[];lineStart=true;i++;continue}

// ---- catalog (virtualized) ----
let catView=[],catSort={k:'name',dir:1},catFilter='all',catQ='',catRender=null,catTimer=0;
const CATCOLS=[['name','Name'],['host','Host star'],['dist','Dist (ly)'],['R','Radius'],['M','Mass'],['P','Period d'],['Teq','Teq K'],['year','Year'],['cls','Class'],['',' ']];
function catKey(p,k){const d=derive(p);switch(k){case 'name':return p.name.toLowerCase();case 'host':return p.starObj.name.toLowerCase();case 'dist':return p.starObj.dist;case 'R':return p.R;case 'M':return p.M;case 'P':return p.P;case 'Teq':return d.Teq;case 'year':return p.year||0;case 'cls':return d.cls;case 'g':return d.g}return 0}
const nz=s=>s.toLowerCase().replace(/gliese /g,'gj ');
function rebuildCat(){
  const q=nz(catQ.trim());const out=[];
  for(const p of PL){const d=derive(p);
    if(q&&nz(p.name).indexOf(q)<0&&nz(p.starObj.name).indexOf(q)<0&&d.cls.indexOf(q)<0)continue;
    switch(catFilter){case 'hz':if(!d.inHZ)continue;break;case 'rocky':if(!isSolid(p,d)||p.kind==='moon')continue;break;case 'giant':if(p.R<6)continue;break;case 'moon':if(p.kind!=='moon')continue;break;case 'sol':if(!p.sol)continue;break;case 'exo':if(p.sol)continue;break;case 'scanned':if(!S.scanned.has(p.id))continue;break;case 'unscanned':if(S.scanned.has(p.id))continue;break;case 'landed':if(!S.landed.has(p.id))continue;break;case 'file':if(!p.csv)continue;break}
    out.push(p)}
  const k=catSort.k,dir=catSort.dir;
  const keys=new Map();for(const p of out)keys.set(p,catKey(p,k));
  out.sort((a,b)=>{let x=keys.get(a),y=keys.get(b);const xn=x==null||x!==x,yn=y==null||y!==y;if(xn&&yn)return 0;if(xn)return 1;if(yn)return -1;return (x<y?-1:x>y?1:0)*dir});
  catView=out}
function catRow(i){const p=catView[i],d=derive(p);
  const st=(S.scanned.has(p.id)?'S':'')+(S.landed.has(p.id)?'L':'')+(S.probed.has(p.id)?'P':'');
  return '<span title="'+esc(p.name)+'">'+esc(p.name)+'</span><span>'+esc(p.starObj.name)+'</span><span>'+(p.starObj.key==='Sun'?'0':fmtN(p.starObj.dist,3))+'</span><span>'+(p.Rest?'~':'')+fmtN(p.R,3)+'</span><span>'+(p.Mest?'~':'')+fmtN(p.M,3)+'</span><span>'+fmtN(p.P,4)+'</span><span>'+fmtN(d.Teq,3)+(d.TeqEst?'*':'')+'</span><span>'+(p.year||(p.sol?'old':'—'))+'</span><span>'+esc(d.cls)+'</span><span style="color:var(--ok)">'+st+'</span>'}
function openCatalog(focusLoad){
  openModal('Planet catalog',`<div class="row"><input id="cq" placeholder="Search name, star or class..." style="flex:1;min-width:160px"><select id="cf"><option value="all">All</option><option value="exo">Exoplanets</option><option value="sol">Solar System</option><option value="moon">Moons</option><option value="hz">Habitable zone</option><option value="rocky">Rocky (R&lt;1.75)</option><option value="giant">Giants</option><option value="file">From NASA file</option><option value="scanned">Scanned</option><option value="unscanned">Not scanned</option><option value="landed">Landed</option></select>
  <button class="pri" id="cload">Load NASA catalog file</button><input type="file" id="cfile" accept=".csv,text/csv,text/plain" class="hidden"></div>
  <div id="cinfo" style="color:var(--dim);font-size:12px;margin:2px 0"></div>
  <div id="vh">${CATCOLS.map(c=>'<span data-k="'+c[0]+'">'+c[1]+'</span>').join('')}</div><div id="vl"></div>
  <div style="color:var(--dim);font-size:12px;margin-top:6px">~ = estimated from the other value, * = estimated temperature. Click a row to select it. Built-in list covers famous worlds; get the free "Planetary Systems" CSV from the NASA Exoplanet Archive to load every known planet.${S.csvCount?' <a href="#" id="cforget">Forget loaded file</a>':''}</div>`,()=>{
    const vl=$('vl');const spacer=document.createElement('div');spacer.style.cssText='width:1px;height:0';vl.appendChild(spacer);
    const pool=[];let lastFirst=-1,lastN=-1;
    catRender=function(force){const n=catView.length,RH=30;spacer.style.height=n*RH+'px';const first=Math.max(0,Math.floor(vl.scrollTop/RH)-2);if(!force&&first===lastFirst&&n===lastN)return;lastFirst=first;lastN=n;
      const cnt=Math.ceil(vl.clientHeight/RH)+6;while(pool.length<cnt){const r=document.createElement('div');r.className='vr';vl.appendChild(r);pool.push(r)}
      for(let i=0;i<pool.length;i++){const idx=first+i,r=pool[i];if(idx<n&&i<cnt){r.style.display='';r.style.top=idx*RH+'px';r.dataset.i=idx;r.innerHTML=catRow(idx)}else r.style.display='none'}
      $('cinfo').textContent=n.toLocaleString()+' of '+PL.length.toLocaleString()+' bodies'+(S.csvCount?' (NASA file: '+S.csvCount.toLocaleString()+' rows loaded)':'')};
    const refresh=()=>{rebuildCat();vl.scrollTop=0;catRender(true)};
    $('cq').oninput=()=>{clearTimeout(catTimer);catTimer=setTimeout(()=>{catQ=$('cq').value;refresh()},120)};
    $('cf').onchange=()=>{catFilter=$('cf').value;refresh()};$('cf').value=catFilter;$('cq').value=catQ;
    vl.addEventListener('scroll',()=>requestAnimationFrame(()=>catRender&&catRender()));
    vl.addEventListener('click',e=>{const r=e.target.closest('.vr');if(!r)return;const p=catView[+r.dataset.i];if(p){selectPlanet(p.id);toast('Selected '+p.name+' - use the side panel to jump there.')}});
    $('vh').onclick=e=>{const k=e.target.dataset&&e.target.dataset.k;if(!k)return;if(catSort.k===k)catSort.dir*=-1;else catSort={k,dir:1};refresh()};
    $('cload').onclick=()=>$('cfile').click();
    $('cfile').onchange=e=>{const f=e.target.files[0];if(!f)return;$('cinfo').textContent='Reading '+f.name+' ...';
      const rd=new FileReader();rd.onload=()=>{const res=importCSVText(rd.result,true);
        if(!res.ok){$('cinfo').textContent=res.msg;toast(res.msg,6000);return}
        toast('Loaded '+res.rows.toLocaleString()+' planets from the NASA file in '+res.ms+' ms'+(res.kept?' (remembered for next time).':' (too big to remember - reload the file next time).'),7000);
        catFilter='all';rebuildCat();catRender(true)};
      rd.onerror=()=>toast('Could not read that file.');rd.readAsText(f)};
    if($('cforget'))$('cforget').onclick=e=>{e.preventDefault();forgetCatalog();toast('Forgot the saved file. Reload the page to clear it from this session.',5000)};
    refresh();if(focusLoad)setTimeout(()=>$('cload').click(),50);
  })}

// ---------- galaxy map ----------
function mapT(x,y,z){if(!MAP.log)return[x,y,z];const r=Math.sqrt(x*x+y*y+z*z);if(r<1e-9)return[0,0,0];const f=Math.log(1+r/3)/r;return[x*f,y*f,z*f]}
function mapProject(v){const c=MAP.c,x=v[0]-c[0],y=v[1]-c[1],z=v[2]-c[2];const cy=Math.cos(MAP.yaw),sy=Math.sin(MAP.yaw),cp=Math.cos(MAP.pitch),sp=Math.sin(MAP.pitch);
  const x1=cy*x-sy*y,y1=sy*x+cy*y;const y2=cp*y1-sp*z,z2=sp*y1+cp*z;const zl=MAP.log?MAP.zl:MAP.zlin;
  return[W/2+x1*zl,H/2-z2*zl,y2]}
function centerMapOnSel(){const s=S.sel;let st=null;if(s)st=s.type==='star'?STARS.get(s.id):s.type==='obj'?OBJMAP.get(s.id):PLMAP.get(s.id).starObj;else st=STARS.get(S.loc.star);if(st)MAP.tc=mapT(st.x,st.y,st.z)}
function starPassesFilter(st){
  if(st.dist===0&&st.key!=='Sun')return false;
  if(MAP.q){const q=nz(MAP.q);if(nz(st.name).indexOf(q)<0){let ok=false;for(const p of st.planets){if(nz(p.name).indexOf(q)>=0){ok=true;break}}if(!ok)return false}}
  if(MAP.hz&&!starFlags(st).hz)return false;
  if(MAP.multi&&starFlags(st).np<2)return false;
  return true}
function mapObjDraw(o,p){const c=(TYPEINFO[o.type]||['','#fff'])[1];const fade=clamp(.9-p[2]*(MAP.log?.03:.0005),.4,1);ctx.globalAlpha=fade;ctx.fillStyle=c;ctx.strokeStyle=c;ctx.lineWidth=1.2;const x=p[0],y=p[1];
  switch(o.type){case 'gal':ctx.globalAlpha=fade*.5;ctx.beginPath();ctx.ellipse(x,y,5,2.5,.5,0,7);ctx.fill();ctx.globalAlpha=fade;ctx.stroke();break;
    case 'nebula':ctx.globalAlpha=fade*.35;ctx.beginPath();ctx.arc(x,y,5,0,7);ctx.fill();ctx.globalAlpha=fade;ctx.beginPath();ctx.arc(x,y,5,0,7);ctx.stroke();break;
    case 'cluster':for(let i=0;i<5;i++){ctx.fillRect(x+Math.cos(i*1.26)*3,y+Math.sin(i*1.26)*3,1.6,1.6)}break;
    case 'bh':ctx.fillStyle='#000';ctx.beginPath();ctx.arc(x,y,4,0,7);ctx.fill();ctx.stroke();break;
    case 'pulsar':case 'magnetar':ctx.beginPath();ctx.moveTo(x-5,y);ctx.lineTo(x+5,y);ctx.moveTo(x,y-5);ctx.lineTo(x,y+5);ctx.stroke();break;
    case 'quasar':case 'blazar':ctx.beginPath();ctx.moveTo(x-6,y);ctx.lineTo(x+6,y);ctx.moveTo(x,y-6);ctx.lineTo(x,y+6);ctx.moveTo(x-3,y-3);ctx.lineTo(x+3,y+3);ctx.moveTo(x-3,y+3);ctx.lineTo(x+3,y-3);ctx.stroke();break;
    case 'event':ctx.beginPath();ctx.moveTo(x,y-5);ctx.lineTo(x+5,y);ctx.lineTo(x,y+5);ctx.lineTo(x-5,y);ctx.closePath();ctx.stroke();break;
    case 'region':ctx.setLineDash([2,3]);ctx.strokeRect(x-5,y-5,10,10);ctx.setLineDash([]);break;
    default:ctx.beginPath();ctx.arc(x,y,2,0,7);ctx.fill()}
  ctx.globalAlpha=1}
function drawMap(dt){
  drawBG(S.t);
  for(let i=0;i<3;i++)MAP.c[i]+=(MAP.tc[i]-MAP.c[i])*Math.min(1,dt*5);
  // distance rings
  ctx.lineWidth=1;const ringsLy=[10,100,1000,10000];
  for(const rl of ringsLy){const rr=MAP.log?Math.log(1+rl/3):rl;const zl=MAP.log?MAP.zl:MAP.zlin;const o=mapProject([0,0,0]);const px=rr*zl;if(px<8||px>4000)continue;
    ctx.strokeStyle='rgba(80,130,220,.25)';ctx.beginPath();ctx.ellipse(o[0],o[1],px,px*Math.abs(Math.sin(MAP.pitch)),0,0,7);ctx.stroke();ctx.fillStyle='rgba(120,160,230,.6)';ctx.font='11px sans-serif';ctx.fillText(fmtN(rl)+' ly',o[0]+px*.72+3,o[1]-px*.72*Math.abs(Math.sin(MAP.pitch))-2)}
  const vis=[];let shown=0;let hov=null,hd=1e9;
  const cur=STARS.get(S.loc.star);
  if(MAP.omode!=='objects')for(const st of STARS.values()){
    if(!starPassesFilter(st))continue;
    const v=mapT(st.x,st.y,st.z),p=mapProject(v);
    if(p[0]<-20||p[0]>W+20||p[1]<-20||p[1]>H+20)continue;
    shown++;
    const dx=p[0]-mouse.x,dy=p[1]-mouse.y,dd=dx*dx+dy*dy;
    const lum=Math.log10(1+(st.L||0.1));const sz=clamp(1.4+lum*1.2,1.4,4.2);
    const col=tempColor(st.T);const f=starFlags(st);
    const fade=clamp(.85-p[2]*(MAP.log?.04:.0008),.35,1);
    ctx.fillStyle='rgba('+col[0]+','+col[1]+','+col[2]+','+fade+')';
    ctx.beginPath();ctx.arc(p[0],p[1],sz,0,7);ctx.fill();
    if(f.hz){ctx.strokeStyle='rgba(95,227,154,.8)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(p[0],p[1],sz+3,0,7);ctx.stroke()}
    if(S.visited.has(st.key)&&st.key!=='Sun'){ctx.fillStyle='rgba(255,200,87,.9)';ctx.fillRect(p[0]-1,p[1]+sz+4,3,3)}
    if(dd<hd&&dd<200){hd=dd;hov=st}
    vis.push([st,p])}
  if(MAP.omode!=='stars'){const q=MAP.q?nz(MAP.q):'';
    for(const o of OBJS){if(o.solar||(o.dist||0)<1)continue;
      if(MAP.otype!=='all'){const t=o.type;if(MAP.otype==='pulsar'?(t!=='pulsar'&&t!=='magnetar'):MAP.otype==='quasar'?(t!=='quasar'&&t!=='blazar'):t!==MAP.otype)continue}
      if(q&&nz(o.name).indexOf(q)<0)continue;
      const p=mapProject(mapT(o.x,o.y,o.z));if(p[0]<-20||p[0]>W+20||p[1]<-20||p[1]>H+20)continue;shown++;
      mapObjDraw(o,p);const dx=p[0]-mouse.x,dy=p[1]-mouse.y,dd=dx*dx+dy*dy;if(dd<hd&&dd<200){hd=dd;hov=o}vis.push([o,p])}}
  MAP.vis=vis;MAP.hover=hov;
  // labels
  ctx.font='12px sans-serif';ctx.textBaseline='middle';
  const lab=(st,p,c)=>{ctx.fillStyle=c;ctx.fillText(st.name,p[0]+8,p[1]-8)};
  let nl=0;const cand=vis.filter(v=>v[0].builtin&&v[0].planets.length>=(vis.length>150?4:1)).sort((a,b)=>(a[1][0]-W/2)**2+(a[1][1]-H/2)**2-(b[1][0]-W/2)**2-(b[1][1]-H/2)**2);
  for(const v of cand){if(nl++>34)break;lab(v[0],v[1],'rgba(170,200,255,.7)')}
  const sp=mapProject(mapT(cur.x,cur.y,cur.z));
  ctx.strokeStyle='#ffc857';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(sp[0],sp[1],9,0,7);ctx.stroke();lab(cur,sp,'#ffc857');
  if(S.sel){const st=S.sel.type==='star'?STARS.get(S.sel.id):S.sel.type==='obj'?(OBJMAP.get(S.sel.id)||cur):PLMAP.get(S.sel.id).starObj;const p=mapProject(mapT(st.x,st.y,st.z));
    ctx.strokeStyle='#4fc3ff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p[0],p[1],12+Math.sin(S.t*4)*2,0,7);ctx.stroke();lab(st,p,'#4fc3ff');
    ctx.setLineDash([4,4]);ctx.strokeStyle='rgba(79,195,255,.5)';ctx.beginPath();ctx.moveTo(sp[0],sp[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();ctx.setLineDash([])}
  if(hov){const p=mapProject(mapT(hov.x,hov.y,hov.z));lab(hov,p,'#fff');ctx.fillStyle='#9fb8e8';ctx.fillText(hov.ext?((TYPEINFO[hov.type]||['Object'])[0]+' / '+fmtDist(hov.dist)):((hov.key==='Sun'?'home':fmtDist(hov.dist))+' / '+hov.planets.filter(q=>q.kind!=='moon').length+' planets'),p[0]+8,p[1]+6)}
  const mc=$('mcount');if(mc)mc.textContent=shown.toLocaleString()+' systems shown';
  ctx.fillStyle='rgba(140,170,220,.7)';ctx.font='12px sans-serif';ctx.textBaseline='alphabetic';ctx.fillText('Drag to rotate · scroll to zoom · click a star · '+(MAP.log?'logarithmic distance scale (far stars are squeezed in)':'linear scale'),10,H-52);
  camYaw=MAP.yaw*0.2;camPitch=MAP.pitch*0.2}
function mapClick(x,y){let best=null,bd=18*18;for(const v of MAP.vis){const dx=v[1][0]-x,dy=v[1][1]-y,dd=dx*dx+dy*dy;if(dd<bd){bd=dd;best=v[0]}}
  if(best&&best.ext){selectObj(best);return}
  if(best){const n=sysPlanets(best);
    if(MAP.q){for(const p of best.planets){if(nz(p.name).indexOf(nz(MAP.q))>=0&&nz(best.name).indexOf(nz(MAP.q))<0){selectPlanet(p.id);return}}}
    selectStar(best.key)}}

// ---------- system view ----------
function sysGeom(){const st=STARS.get(S.loc.star),pls=sysPlanets(st);let amax=0.05;for(const p of pls)amax=Math.max(amax,p.a*(1+p.e));
  const hz=starHZ(st);if(hz&&pls.length===0)amax=Math.max(amax,hz[1]);
  const Rmax=Math.min(W*.5-60,(H*.5-80)/SYS.tiltK)*SYS.zoom;return{st,pls,amax,Rmax}}
function sysScreen(r,ang,g,zf){const rs=SYS.lin?g.Rmax*r/g.amax:g.Rmax*Math.sqrt(r/g.amax),a=ang+SYS.rot;return[W/2+Math.cos(a)*rs,H/2+8+Math.sin(a)*rs*SYS.tiltK-(zf||0)*rs*.35,rs]}
function sysScr3(v,g){const r=Math.hypot(v[0],v[1])||1e-9;return sysScreen(r,Math.atan2(v[1],v[0]),g,(v[2]||0)/r)}
function moonTh(m){const ph=tsDays()/m.P>1.5?(S.t*.1+m.seed*.37)%1:(S.simT%m.P)/m.P;return m.m0+2*Math.PI*ph*(m.retro?-1:1)}
function sysMotion(p,g){const cyc=tsDays()/p.P;if(cyc<=.1)return;const look=lookOf(p),c=look.a,col=(k)=>'rgba('+(c[0]*255|0)+','+(c[1]*255|0)+','+(c[2]*255|0)+','+k+')';
  ctx.lineCap='round';

const D2R=Math.PI/180;

const ELEMS={Mercury:[7.005,48.331,77.456,252.251],Venus:[3.395,76.680,131.532,181.980],Earth:[0.0,0.0,102.947,100.464],Mars:[1.850,49.558,336.04,355.453],Jupiter:[1.303,100.464,14.331,34.351],Saturn:[2.489,113.666,93.057,50.077],Uranus:[0.773,74.017,173.005,314.055],Neptune:[1.770,131.784,48.124,304.349],Pluto:[17.14,110.299,224.07,238.93]};
const ALB={Mercury:.088,Venus:.76,Earth:.306,Mars:.25,Ceres:.09,Jupiter:.503,Saturn:.342,Uranus:.3,Neptune:.29,Pluto:.72,Moon:.11,Io:.63,Europa:.67,Ganymede:.43,Callisto:.17,Titan:.22,Enceladus:.99,Triton:.76,Charon:.35};
const OBL={Mercury:.03,Venus:177.36,Earth:23.44,Mars:25.19,Jupiter:3.13,Saturn:26.73,Uranus:97.77,Neptune:28.32,Pluto:122.53,Moon:6.68,Ceres:4};
const HSCALE={Earth:8500,Mars:11100,Venus:15900,Titan:21000};
const ROUGH={Moon:1.3,Mercury:1.2,Mars:1.0,Venus:.8,Earth:.9,Titan:.7,Europa:.4,Io:.6,Enceladus:.6};
const ISP=310;
function eph(p){if(p._eph)return p._eph;const el=ELEMS[p.name];let w=p.w,i=0,Om=0,L0=null,vp=null;if(el&&p.kind!=='moon'){i=el[0]*D2R;Om=el[1]*D2R;vp=el[2]*D2R;w=vp-Om;L0=el[3]*D2R}return p._eph={w,i,Om,L0,vp,has:L0!=null}}
function rot3(p,x,y){const q=eph(p),cw=Math.cos(q.w),sw=Math.sin(q.w),cO=Math.cos(q.Om),sO=Math.sin(q.Om),ci=Math.cos(q.i),si=Math.sin(q.i);
  return[x*(cw*cO-sw*sO*ci)-y*(sw*cO+cw*sO*ci),x*(cw*sO+sw*cO*ci)-y*(sw*sO-cw*cO*ci),x*sw*si+y*cw*si]}
function posAtM(p,M){const E=solveE(M,p.e);const x=p.a*(Math.cos(E)-p.e),y=p.a*Math.sqrt(1-p.e*p.e)*Math.sin(E);return rot3(p,x,y)}
function meanAt(p,t){const q=eph(p);if(q.has){const d=(EPOCH_YEAR-2000)*365.25+t;return(q.L0-q.vp)+2*Math.PI*((d%p.P)/p.P)}return p.m0+2*Math.PI*((t%p.P)/p.P)}
function bodyPos(p,t){return posAtM(p,meanAt(p,t))}
function dispPos(p){if(tsDays()/p.P>1.5){const ph=(S.t*.1+p.seed*.37)%1;return posAtM(p,p.m0+2*Math.PI*ph)}return bodyPos(p,S.simT)}
function subsolarLat(p){const P=p.kind==='moon'?p.parentObj:p;const eps=(OBL[p.name]||0)*D2R;const pos=bodyPos(P,S.simT);const ls=Math.atan2(pos[1],pos[0])+Math.PI;return Math.asin(Math.sin(eps)*Math.sin(ls))}
function realRot(p){if(tsDays()<=3){const h=p.rot||24;return(((S.simT*24/h)%1)+1)%1*2*Math.PI}return S.t*.08+p.seed}
function oblTilt(p){return OBL[p.name]!=null?OBL[p.name]*D2R:p.tilt*.5}
function tidalCalc(p,d){
  if(p.kind==='moon')return{locked:true,txt:'tidally locked to '+p.parent+' (one face always toward it)'};
  if(p.sol){const r=Math.abs(p.rot)/24/p.P;if(Math.abs(r-1)<.02)return{locked:true,txt:'tidally locked'};if(Math.abs(r-2/3)<.02)return{locked:false,txt:'3:2 spin-orbit resonance (Mercury)'};return{locked:false,txt:'not locked (spins freely)'}}
  const st=p.starObj,Ms=(st.M||1)*1.989e30,a=p.a*AU_M,m=p.M*M_EARTH,R=p.R*R_EARTH,w=2*Math.PI/(10*3600);

  return{locked:t<1e9,t,txt:t<1e9?'probably tidally locked (locking time ~'+fmtN(t,2)+' yr, est.)':'probably not locked (locking time ~'+fmtN(t,2)+' yr, est.)'}}
function hillText(p,d){if(p.kind==='moon')return null;const st=p.starObj,m=p.M*M_EARTH,Ms=(st.M||1)*1.989e30;const rH=p.a*(1-p.e)*Math.cbrt(m/(3*Ms));return fmtN(rH,3)+' AU ('+fmtN(rH*1.496e8,3)+' km)'}
function rocheText(p,d){if(p.kind==='moon')return null;const km=2.44*p.R*6371*Math.cbrt(d.rho/1.5);return fmtN(km,4)+' km (fluid icy moon, '+fmtN(km/(p.R*6371),3)+' planet radii)'}
function rotText(p){if(p.sol){const h=Math.abs(p.rot);return (h>=72?fmtN(h/24,4)+' days':fmtN(h,4)+' hours')+(p.rot<0?' (retrograde)':'')}
  const t=tidalCalc(p,derive(p));return t.locked?fmtN(p.P,4)+' d (= orbital period) est.':'unknown'}
function uncText(p){if(p.sol)return '±<0.1%';if(p.unk)return 'size unknown';if(p.Mest&&p.Rest)return '± factor ~2 (est.)';if(p.Mest||p.Rest)return '±~40% (est.)';if(/m/.test(p.flags||''))return 'lower limit on mass';return '±~10-20% (typical)'}
function envRows(p,d){
  const rows=[];

  if(d.TeqAlb!=null)rows.push(['Equilibrium temp. (albedo '+fmtN(d.alb,2)+(d.albEst?' est.':'')+')',fmtN(d.TeqAlb,3)+' K ('+fmtN(d.TeqAlb-273.15,3)+' °C)']);
  rows.push(['Rotation period',rotText(p)]);
  const ob=OBL[p.name];if(ob!=null){rows.push(['Axial tilt',fmtN(ob,3)+'°'+(ob>90?' (retrograde spin)':'')]);if(p.kind!=='moon'||p.parentObj)rows.push(['Subsolar latitude now',fmtN(subsolarLat(p)/D2R,3)+'° (sets the season)'])}
  rows.push(['Spin-orbit state',tidalCalc(p,d).txt]);
  const hl=hillText(p,d);if(hl)rows.push(['Hill sphere radius',hl]);
