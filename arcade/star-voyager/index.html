<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Star Voyager - S.I.P. Arcade</title>
<style>
:root{--bg:#02030a;--pan:rgba(8,14,30,.86);--bd:#27406e;--tx:#dbe8ff;--dim:#8fa6cf;--ac:#4fc3ff;--ok:#5fe39a;--warn:#ffc857;--bad:#ff6b6b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.4 "Segoe UI",system-ui,Arial,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
#ov{z-index:2}#gl{z-index:1}
#top{position:fixed;z-index:5;left:0;right:0;top:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;background:linear-gradient(#000c,#0000)}
#brand{font-weight:700;letter-spacing:.08em;color:var(--ac);margin-right:6px;white-space:nowrap}
#locn{color:var(--dim);flex:1;min-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sci{color:var(--warn);font-weight:700;white-space:nowrap}
button,.btn{background:#0d1c3a;color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
button:hover{background:#17306100;border-color:var(--ac);background:#173061}
button.pri{background:#0a5a8a;border-color:var(--ac)}
button.pri:hover{background:#0e78b4}
button:disabled{opacity:.4;cursor:default}
#side{position:fixed;z-index:8;right:8px;top:48px;bottom:56px;width:min(360px,calc(100% - 16px));overflow:auto;background:var(--pan);border:1px solid var(--bd);border-radius:10px;padding:10px;touch-action:pan-y}
.hidden{display:none!important}
#side h2{margin:0 0 2px;font-size:18px;color:#fff}
#side h3{margin:10px 0 4px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ac)}
table.kv{width:100%;border-collapse:collapse}
table.kv td{padding:2px 0;vertical-align:top}
table.kv td:first-child{color:var(--dim);padding-right:8px;white-space:nowrap}
table.kv td:last-child{text-align:right}
.est{color:var(--warn);font-style:italic;font-size:11px}
.tag{display:inline-block;padding:0 6px;border-radius:9px;font-size:11px;border:1px solid var(--bd);margin:0 3px 3px 0;color:var(--dim)}
.tag.ok{color:var(--ok);border-color:var(--ok)}
.bar{height:8px;background:#10213f;border-radius:4px;overflow:hidden;margin:1px 0 5px}
.bar i{display:block;height:100%;background:var(--ac)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
#bottom{position:fixed;z-index:5;left:8px;bottom:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 16px)}
#bottom span{color:var(--dim)}
#toast{position:fixed;z-index:30;left:50%;top:56px;transform:translateX(-50%);max-width:min(560px,92%);text-align:center;pointer-events:none}
#toast div{background:#0b1f3ee6;border:1px solid var(--ac);border-radius:8px;padding:6px 12px;margin-bottom:6px}
#tut{position:fixed;z-index:9;left:8px;top:48px;width:min(320px,calc(100% - 16px));background:#0b2a1cee;border:1px solid var(--ok);border-radius:10px;padding:8px 10px}
#modal{position:fixed;z-index:20;inset:0;background:#000a;display:flex;align-items:flex-start;justify-content:center;padding:44px 8px 8px;touch-action:pan-y}
#mbox{background:#070d1ef2;border:1px solid var(--bd);border-radius:12px;width:min(1000px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
#mhead{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--bd)}
#mhead h2{margin:0;flex:1;font-size:18px}
#mbody{padding:10px 12px;overflow:auto;flex:1;min-height:0}
#mbody h3{color:var(--ac);margin:12px 0 4px}
#mbody p{margin:4px 0}
input,select{background:#0a1630;color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:5px 8px;font:inherit;user-select:text;-webkit-user-select:text}
#vl{position:relative;overflow:auto;height:min(52vh,520px);border:1px solid var(--bd);border-radius:6px;touch-action:pan-y}
#vl .vr{position:absolute;left:0;right:0;height:30px;display:grid;grid-template-columns:2.4fr 1.8fr .9fr .8fr .8fr .9fr .7fr .6fr 1.3fr 36px;gap:6px;align-items:center;padding:0 8px;cursor:pointer;white-space:nowrap;overflow:hidden;border-bottom:1px solid #12203f}
#vl .vr:hover{background:#142a52}
#vl .vr span{overflow:hidden;text-overflow:ellipsis}
#vh{display:grid;grid-template-columns:2.4fr 1.8fr .9fr .8fr .8fr .9fr .7fr .6fr 1.3fr 36px;gap:6px;padding:4px 8px;color:var(--ac);font-size:12px;cursor:pointer}
#vh span:hover{text-decoration:underline}
@media(max-width:700px){#vl .vr,#vh{grid-template-columns:2fr 1.2fr .8fr .8fr 36px}#vl .vr span:nth-child(n+5):nth-child(-n+9),#vh span:nth-child(n+5):nth-child(-n+9){display:none}#side{top:auto;bottom:56px;height:45%}}
.card{border:1px solid var(--bd);border-radius:8px;padding:8px;margin:6px 0;background:#0a1630}
.card.done{border-color:var(--ok)}
#touch{position:fixed;z-index:6;left:0;right:0;bottom:8px;display:flex;justify-content:space-between;padding:0 12px;pointer-events:none}
#touch .g{display:flex;gap:8px;pointer-events:auto}
#touch button{width:64px;height:64px;font-size:22px;border-radius:50%;opacity:.8}
.big{font-size:34px;font-weight:800;letter-spacing:.12em;color:#fff}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
a{color:var(--ac)}
</style>
</head>
<body>
<canvas id="gl"></canvas><canvas id="ov"></canvas>
<div id="top">
 <span id="brand">S.I.P. ARCADE &middot; STAR VOYAGER</span>
 <span id="locn"></span>
 <span id="sci"></span>

function parseCSV(text){
  const rows=[];let row=[],cur='',q=false,i=0,n=text.length,lineStart=true;
  while(i<n){const c=text.charCodeAt(i);
    if(lineStart&&c===35&&!q){while(i<n&&text.charCodeAt(i)!==10)i++;i++;continue}
    lineStart=false;
    if(q){if(c===34){if(text.charCodeAt(i+1)===34){cur+='"';i+=2;continue}q=false;i++;continue}cur+=text[i];i++;continue}
    if(c===34){q=true;i++;continue}
    if(c===44){row.push(cur);cur='';i++;continue}
    if(c===13){i++;continue}
    if(c===10){row.push(cur);cur='';if(row.length>1||row[0]!=='')rows.push(row);row=[];lineStart=true;i++;continue}
    cur+=text[i];i++}
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows}
function importCSVText(text,persist){

  const H={};rows[0].forEach((h,i)=>H[h.trim().toLowerCase()]=i);
  if(H.pl_name==null)return{ok:false,msg:'This file has no "pl_name" column. Download the "Planetary Systems" table as CSV.'};
  const g=(r,k)=>{const i=H[k];return i==null?null:(r[i]===''||r[i]==null?null:r[i])};
  const gn=(r,k)=>{const v=g(r,k);return v==null||isNaN(+v)?null:+v};
  const seen=new Set(),store=[];let added=0,updated=0;
  for(let k=1;k<rows.length;k++){const r=rows[k];const name=(g(r,'pl_name')||'').trim();if(!name||seen.has(name))continue;
    if(H.default_flag!=null&&g(r,'default_flag')==='0')continue;
    seen.add(name);

    const pc=gn(r,'sy_dist');const dist=pc!=null?pc*3.26156:null;
    const M=gn(r,'pl_bmasse')??gn(r,'pl_masse')??(gn(r,'pl_bmassj')!=null?gn(r,'pl_bmassj')*317.83:null)??gn(r,'pl_msinie');
    const R=gn(r,'pl_rade')??(gn(r,'pl_radj')!=null?gn(r,'pl_radj')*11.209:null);
    const lg=gn(r,'st_lum');

      T:gn(r,'st_teff'),Rs:gn(r,'st_rad'),Ms:gn(r,'st_mass'),L:lg!=null?Math.pow(10,lg):null,spec:g(r,'st_spectype')};
    store.push([rec.name,rec.host,rec.dist,rec.ra,rec.dec,rec.M,rec.R,rec.P,rec.a,rec.Teq,rec.year,rec.method,rec.e,rec.T,rec.Rs,rec.Ms,rec.L,rec.spec]);

let catView=[],catSort={k:'name',dir:1},catFilter='all',catQ='',catRender=null,catTimer=0;
const CATCOLS=[['name','Name'],['host','Host star'],['dist','Dist (ly)'],['R','Radius'],['M','Mass'],['P','Period d'],['Teq','Teq K'],['year','Year'],['cls','Class'],['',' ']];
function catKey(p,k){const d=derive(p);switch(k){case 'name':return p.name.toLowerCase();case 'host':return p.starObj.name.toLowerCase();case 'dist':return p.starObj.dist;case 'R':return p.R;case 'M':return p.M;case 'P':return p.P;case 'Teq':return d.Teq;case 'year':return p.year||0;case 'cls':return d.cls;case 'g':return d.g}return 0}
const nz=s=>s.toLowerCase().replace(/gliese /g,'gj ');
function rebuildCat(){
  const q=nz(catQ.trim());const out=[];
  for(const p of PL){const d=derive(p);
    if(q&&nz(p.name).indexOf(q)<0&&nz(p.starObj.name).indexOf(q)<0&&d.cls.indexOf(q)<0)continue;
    switch(catFilter){case 'hz':if(!d.inHZ)continue;break;case 'rocky':if(!isSolid(p,d)||p.kind==='moon')continue;break;case 'giant':if(p.R<6)continue;break;case 'moon':if(p.kind!=='moon')continue;break;case 'sol':if(!p.sol)continue;break;case 'exo':if(p.sol)continue;break;case 'scanned':if(!S.scanned.has(p.id))continue;break;case 'unscanned':if(S.scanned.has(p.id))continue;break;case 'landed':if(!S.landed.has(p.id))continue;break;case 'file':if(!p.csv)continue;break}
    out.push(p)}
  const k=catSort.k,dir=catSort.dir;
  const keys=new Map();for(const p of out)keys.set(p,catKey(p,k));
  out.sort((a,b)=>{let x=keys.get(a),y=keys.get(b);const xn=x==null||x!==x,yn=y==null||y!==y;if(xn&&yn)return 0;if(xn)return 1;if(yn)return -1;return (x<y?-1:x>y?1:0)*dir});
  catView=out}
function catRow(i){const p=catView[i],d=derive(p);
  const st=(S.scanned.has(p.id)?'S':'')+(S.landed.has(p.id)?'L':'')+(S.probed.has(p.id)?'P':'');
  return '<span title="'+esc(p.name)+'">'+esc(p.name)+'</span><span>'+esc(p.starObj.name)+'</span><span>'+(p.starObj.key==='Sun'?'0':fmtN(p.starObj.dist,3))+'</span><span>'+(p.Rest?'~':'')+fmtN(p.R,3)+'</span><span>'+(p.Mest?'~':'')+fmtN(p.M,3)+'</span><span>'+fmtN(p.P,4)+'</span><span>'+fmtN(d.Teq,3)+(d.TeqEst?'*':'')+'</span><span>'+(p.year||(p.sol?'old':'—'))+'</span><span>'+esc(d.cls)+'</span><span style="color:var(--ok)">'+st+'</span>'}
function openCatalog(focusLoad){

      for(let i=0;i<pool.length;i++){const idx=first+i,r=pool[i];if(idx<n&&i<cnt){r.style.display='';r.style.top=idx*RH+'px';r.dataset.i=idx;r.innerHTML=catRow(idx)}else r.style.display='none'}

    const refresh=()=>{rebuildCat();vl.scrollTop=0;catRender(true)};
    $('cq').oninput=()=>{clearTimeout(catTimer);catTimer=setTimeout(()=>{catQ=$('cq').value;refresh()},120)};
    $('cf').onchange=()=>{catFilter=$('cf').value;refresh()};$('cf').value=catFilter;$('cq').value=catQ;

    $('cload').onclick=()=>$('cfile').click();

      const rd=new FileReader();rd.onload=()=>{const res=importCSVText(rd.result,true);

        toast('Loaded '+res.rows.toLocaleString()+' planets from the NASA file in '+res.ms+' ms'+(res.kept?' (remembered for next time).':' (too big to remember - reload the file next time).'),7000);
        catFilter='all';rebuildCat();catRender(true)};
      rd.onerror=()=>toast('Could not read that file.');rd.readAsText(f)};
    if($('cforget'))$('cforget').onclick=e=>{e.preventDefault();forgetCatalog();toast('Forgot the saved file. Reload the page to clear it from this session.',5000)};
    refresh();if(focusLoad)setTimeout(()=>$('cload').click(),50);
  })}

  const top=mix(c0,[0,0,.05],.2+.6*depth),bot=mix(c1,[0,0,0],.3+.65*depth);
  gr.addColorStop(0,rgb(top,.55));gr.addColorStop(1,rgb(bot,.35+.4*depth));ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  if(pr.state!=='ready'){

    const sp=pr.state==='entry'?600:pr.rate*500;
    for(let i=0;i<14;i++){const yy=((i*H/12+S.t*sp)%(H+60))-30;const cw=ctx.createLinearGradient(0,yy-20,0,yy+20);cw.addColorStop(0,'rgba(255,255,255,0)');cw.addColorStop(.5,rgb(c2,.12+.1*(1-depth)).replace('rgb','rgba').replace(')',',.18)'));cw.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=cw;ctx.fillRect(0,yy-20,W,40)}}

  if(pr.state==='descent'||pr.state==='done'){ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-6,-14);ctx.lineTo(-40,-70);ctx.moveTo(6,-14);ctx.lineTo(40,-70);ctx.stroke();ctx.fillStyle='rgba(255,140,60,.85)';ctx.beginPath();ctx.ellipse(0,-78,46,16,0,Math.PI,2*Math.PI);ctx.fill()}

  ctx.fillStyle='rgba(180,200,240,.7)';ctx.font='12px sans-serif';ctx.fillText('Up/W slower · Down/S faster · Enter = transmit data and finish · stay below the red hull limit!',W/2,H-14);ctx.textAlign='left';

// ================= INPUT + MAIN LOOP =================
const keys={};
const ptrs=new Map();
function rel(e){const r=cvOV.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
cvOV.addEventListener('pointerdown',e=>{
  cvOV.setPointerCapture&&cvOV.setPointerCapture(e.pointerId);const[x,y]=rel(e);ptrs.set(e.pointerId,[x,y]);
  mouse.x=x;mouse.y=y;mouse.down=true;mouse.drag=false;mouse.sx=x;mouse.sy=y;
  if(ptrs.size===2){const a=[...ptrs.values()];MAP.pinch=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);MAP.pz=MAP.log?MAP.zl:MAP.zlin;MAP.pozoom=ORB.zoom;MAP.psz=SYS.zoom}
  if(S.scene==='jump'&&S.jump&&S.jump.t>.8)S.jump.t=S.jump.dur});
cvOV.addEventListener('pointermove',e=>{
  const[x,y]=rel(e);const px=mouse.x,py=mouse.y;mouse.x=x;mouse.y=y;
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,[x,y]);
  if(ptrs.size>=2){const a=[...ptrs.values()];const d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(MAP.pinch>0){const k=d/MAP.pinch;
    if(S.scene==='map'){if(MAP.log)MAP.zl=clamp(MAP.pz*k,5,900);else MAP.zlin=clamp(MAP.pz*k,.0005,200)}
    else if(S.scene==='orbit')ORB.zoom=clamp(MAP.pozoom*k,1.5,6000);
    else if(S.scene==='system')SYS.zoom=clamp(MAP.psz*k,.3,6)}mouse.drag=true;return}
  if(!mouse.down)return;
  if(Math.hypot(x-mouse.sx,y-mouse.sy)>5)mouse.drag=true;
  if(!mouse.drag)return;
  const dx=x-px,dy=y-py;
  if(S.scene==='map'){MAP.yaw+=dx*.006;MAP.pitch=clamp(MAP.pitch+dy*.006,-1.5,1.5)}
  else if(S.scene==='system'){SYS.rot+=dx*.006;SYS.tiltK=clamp(SYS.tiltK-dy*.003,.12,1)}
});
const endPtr=e=>{const was=mouse.down&&!mouse.drag&&ptrs.size<=1;const[x,y]=rel(e);ptrs.delete(e.pointerId);if(ptrs.size<2)MAP.pinch=0;mouse.down=ptrs.size>0;
  if(was&&e.type==='pointerup'){
    if(S.scene==='map')mapClick(x,y);else if(S.scene==='system'){if(!sysClick(x,y)){}}else if(S.scene==='orbit')orbClick(x,y)}
  if(!ptrs.size)mouse.drag=false};
cvOV.addEventListener('pointerup',endPtr);cvOV.addEventListener('pointercancel',endPtr);
cvOV.addEventListener('dblclick',e=>{const[x,y]=rel(e);if(S.scene==='system'){for(const b of SYS.pos){if(Math.hypot(b.x-x,b.y-y)<=b.px+8){enterOrbit(b.p);return}}}});
cvOV.addEventListener('wheel',e=>{e.preventDefault();const k=Math.exp(-e.deltaY*.0012);
  if(S.scene==='map'){if(MAP.log)MAP.zl=clamp(MAP.zl*k,5,900);else MAP.zlin=clamp(MAP.zlin*k,.0005,200)}
  else if(S.scene==='orbit')ORB.zoom=clamp(ORB.zoom*k,1.5,6000);
  else if(S.scene==='system')SYS.zoom=clamp(SYS.zoom*k,.3,6)},{passive:false});
window.addEventListener('keydown',e=>{
  const tg=e.target.tagName;if(tg==='INPUT'||tg==='SELECT'||tg==='TEXTAREA')return;
  const k=e.key.toLowerCase();keys[k]=true;
  if(S.scene==='land'||S.scene==='probe'){if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault()}
  if(k==='escape'){if(modalOpen&&S.scene!=='title')closeModal();return}
  if(modalOpen)return;
  if(S.scene==='land'&&S.lander){const L=S.lander;if(k==='z')L.sas=!L.sas;if(k==='w'||k==='+'||k==='=')L.throttle=clamp(L.throttle+.1,.1,1);if(k==='s'||k==='-')L.throttle=clamp(L.throttle-.1,.1,1);if(k==='escape'){}}

window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});

function togglePause(){if(S.scene==='title')return;S.paused=!S.paused;updateTop()}
function goMap(){if(S.scene==='land'||S.scene==='probe'||S.scene==='jump')return;S.scene='map';buildBottom();if(!S.sel)centerMapOnSel();setScene('map');MAP.tc=MAP.tc;showSide();tutEvent('map')}

document.querySelectorAll('#top [data-act]').forEach(b=>b.addEventListener('click',()=>{const a=b.dataset.act;
  if(S.scene==='jump')return;
  if(a==='pause'){togglePause();return}
  if(S.scene==='title'&&a!=='help')return;
  if(S.scene==='land'||S.scene==='probe'){if(a==='help')openHelp();return}
  if(a==='map')goMap();else if(a==='system')goSystem();else if(a==='catalog')openCatalog();else if(a==='log')openLog();else if(a==='shop')openShop();else if(a==='missions')openMissions();else if(a==='help')openHelp()}));

function getInp(){
  return{thrust:keys['arrowup']||keys[' ']||keys['t_thrust'],left:keys['arrowleft']||keys['a']||keys['t_left'],right:keys['arrowright']||keys['d']||keys['t_right'],sl:keys['q'],sr:keys['e']}}
let saveTimer=0;
function update(dt){
  if(S.paused||S.pausedByModal)return;
  if(S.scene==='system'||S.scene==='orbit'){S.simT+=dt*TS[S.timeIdx][0]/86400}
  if(S.scene==='orbit'&&S.scan){S.scan.t+=dt;if(S.scan.t>=S.scan.T)finishScan()}
  if(S.scene==='land'&&S.lander){const sub=4;for(let i=0;i<sub;i++)S.lander.step(dt/sub,getInp())}
  if(S.scene==='probe'&&S.probe){const i={up:keys['arrowup']||keys['w']||keys['t_pu'],down:keys['arrowdown']||keys['s']||keys['t_pd']};S.probe.step(dt,i)}
  saveTimer+=dt;if(saveTimer>15){saveTimer=0;if(S.scene!=='title')save()}
}
function drawTitle(dt){
  drawBG(S.t);camYaw=S.t*.02;
  const e=PLMAP.get('Earth');const r=Math.min(W,H)*.28;
  queueBody({x:W*.5,y:H*.62,r:r,look:lookOf(e),L:[.8,.3,.5],rot:S.t*.1,tilt:.4,seed:3,z:0});flushBodies(S.t)}
function draw(dt){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const sc=S.scene;
  if(sc==='map')drawMap(dt);else if(sc==='system')drawSystem(dt);else if(sc==='orbit')drawOrbit(dt);
  else if(sc==='jump')drawJump(dt);else if(sc==='land'&&S.lander)drawLander(dt);else if(sc==='probe'&&S.probe)drawProbe(dt);
  else drawTitle(dt);
  if(sc!=='map'&&sc!=='jump'&&sc!=='land'&&sc!=='probe'){}
  if(S.paused){ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='700 32px sans-serif';ctx.textAlign='center';ctx.fillText('PAUSED',W/2,H/2);ctx.font='14px sans-serif';ctx.fillText('Press P or Resume',W/2,H/2+26);ctx.textAlign='left'}
}
let lastT=performance.now(),frames=0,fpsT=0,FPS=0;
function frame(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;S.t+=dt;
  try{update(dt);draw(dt)}catch(err){console.error('frame error',err);if(!window._ferr||window._ferr<5){window._ferr=(window._ferr||0)+1}}
  frames++;fpsT+=dt;if(fpsT>1){FPS=frames/fpsT;frames=0;fpsT=0}
  requestAnimationFrame(frame)}

function init(){
  parseBuiltin();
  const n=loadStoredCatalog();
  forceNoGL=/[?&]nogl/.test(location.search);initGL();resize();window.addEventListener('resize',resize);
