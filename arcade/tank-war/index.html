let AC=null,NB=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')try{AC.resume()}catch(e){}return AC}
function tone(f,d,type,vol,slide,delay){if(!save.snd)return;const a=ac();if(!a)return;try{const t=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(vol||.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}

  const s=['Cleared','No tank lost','Under '+G.par+' seconds'];s.forEach((t,i)=>txt((i<r.stars?'✓ ':'• ')+t,416,250+i*20,14,i<r.stars?'#fff':'#78909c','center','normal'))}
 else txt('Try again, you can do it!',416,200,18,'#ffcc80');
 txt('Coins earned: '+r.earn+(r.bonus?' + '+r.bonus+' bonus':''),416,330,17,'#ffd600');txt('Total: '+save.coins,416,354,15,'#fff8e1','center','normal');
 if(r.win&&G.lv<19)btn('Next Level',296,372,240,40,()=>startLevel(G.lv+1),{col:'#2e7d32'});
 else if(r.win)txt('You beat every level! Great job!',416,392,18,'#8bc34a');
 else btn('Retry',296,372,240,40,()=>startLevel(G.lv),{col:'#2e7d32'});
 btn('Shop',266,418,130,34,()=>{shopNext=r.win&&G.lv<19?G.lv+1:G.lv;mode='shop'},{sz:16});btn('Levels',436,418,130,34,()=>{mode='select'},{sz:16,col:'#455a64'})}
function drawPause(){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,CW,CH);panel(296,130,240,290);txt('PAUSED',416,170,34,'#ffb300');
 btn('Resume',326,210,180,44,()=>{G.paused=false});btn('Restart',326,266,180,44,()=>{startLevel(G.lv)});btn('Sound: '+(save.snd?'On':'Off'),326,322,180,36,()=>{save.snd=save.snd?0:1;persist()},{col:'#455a64',sz:15});btn('Quit',326,368,180,36,()=>{G=null;mode='select'},{col:'#455a64',sz:15})}
function draw(){btns=[];ctx.clearRect(0,0,CW,CH);
 if(mode==='title')drawTitle();else if(mode==='select')drawSelect();else if(mode==='shop')drawShop();
 else if(mode==='play'&&G){drawPlay();if(G.paused)drawPause()}else if(mode==='result'&&G)drawResult()}
/* ---------- input ---------- */
function cpos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*CW/r.width,y:(e.clientY-r.top)*CH/r.height}}
function clickAt(p){ac();for(let i=btns.length-1;i>=0;i--){const b=btns[i];if(!b.dis&&p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){sfx('click');b.cb();return true}}return false}
cv.addEventListener('mousemove',e=>{const p=cpos(e);mouse.x=p.x;mouse.y=p.y;mouse.aim=true;hover=p});
cv.addEventListener('mouseleave',()=>{hover=null;mouse.down=false});
cv.addEventListener('mousedown',e=>{e.preventDefault();ac();const p=cpos(e);mouse.x=p.x;mouse.y=p.y;mouse.aim=true;
 if(mode==='play'&&G&&!G.paused){if(!clickAt(p))mouse.down=true}else clickAt(p)});
addEventListener('mouseup',()=>{mouse.down=false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
function tStart(t){const p=cpos(t);
 if(mode==='play'&&G&&!G.paused){if(p.x>=790&&p.y<32){clickAt(p);return}
  if(Math.hypot(p.x-740,p.y-460)<62){touchFire=true;fireId=t.identifier;return}
  if(Math.hypot(p.x-650,p.y-495)<44){SPECP[0]=true;return}
  if(p.x<460&&!tj.on){tj.on=true;tj.id=t.identifier;tj.ox=p.x;tj.oy=p.y;tj.x=tj.y=0}}
 else clickAt(p)}
cv.addEventListener('touchstart',e=>{e.preventDefault();touchMode=true;mouse.aim=false;for(const t of e.changedTouches)tStart(t)},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(tj.on&&t.identifier===tj.id){const p=cpos(t);let dx=(p.x-tj.ox)/45,dy=(p.y-tj.oy)/45;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}if(l<.25){dx=dy=0}tj.x=dx;tj.y=dy}},{passive:false});
function tEnd(e){for(const t of e.changedTouches){if(t.identifier===tj.id){tj.on=false;tj.id=-1;tj.x=tj.y=0}if(t.identifier===fireId){touchFire=false;fireId=-1}}}
cv.addEventListener('touchend',e=>{e.preventDefault();tEnd(e)},{passive:false});cv.addEventListener('touchcancel',tEnd,{passive:false});
function togglePause(){if(mode==='play'&&G&&!G.over)G.paused=!G.paused}
addEventListener('keydown',e=>{
 if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
 if(e.repeat){K[e.code]=true;return}
 K[e.code]=true;ac();
 if(e.code==='Space')mouse.aim=false;
 if(e.code==='KeyP'||e.code==='Escape'){if(mode==='play')togglePause();else if(mode==='select'||mode==='shop')mode='title';else if(mode==='result')mode='select'}
 else if(e.code==='KeyM'){save.snd=save.snd?0:1;persist()}
 else if(e.code==='ShiftLeft'||e.code==='ShiftRight'||e.code==='KeyE')SPECP[0]=true;
 else if(e.code==='KeyO')SPECP[1]=true;
 else if(e.code==='Enter'){if(mode==='title'&&!showHelp){coop=false;mode='select'}else if(mode==='result'){G.res.win&&G.lv<19?startLevel(G.lv+1):startLevel(G.lv)}}
});
addEventListener('keyup',e=>{K[e.code]=false});
addEventListener('blur',()=>{for(const k in K)K[k]=false;mouse.down=false;if(mode==='play'&&G&&!G.over)G.paused=true});
/* ---------- loop ---------- */
let last=0,acc=0;
function frame(ts){requestAnimationFrame(frame);const d=Math.min(.1,(ts-last)/1000||0);last=ts;acc+=d;let n=0;while(acc>=1/60&&n<6){update(1/60);acc-=1/60;n++}if(n===6)acc=0;draw()}
requestAnimationFrame(frame);
window.TW={get G(){return G},get mode(){return mode},set mode(v){mode=v},startLevel,update,LV,buildLevel,save,K,SPECP,endLevel,set coop(v){coop=v},draw,btns:()=>btns,clickAt,ET,useSpecial};
</script></body></html>
