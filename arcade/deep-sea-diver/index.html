<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#02101c;overflow:hidden;font-family:system-ui,Segoe UI,Arial,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}

.card{background:linear-gradient(#0f3a55,#0a2438);border:3px solid #3fd0e6;border-radius:16px;padding:16px 20px;max-width:700px;width:100%;max-height:96vh;overflow:auto;box-shadow:0 8px 40px #000a}
h1{margin:0 0 4px;font-size:44px;color:#7ff0ff;text-shadow:3px 3px 0 #08536b;letter-spacing:2px;text-align:center}
h2{margin:0 0 8px;color:#7ff0ff;text-align:center}
.sub{text-align:center;color:#9cc9d6;margin-bottom:12px;font-size:14px}
.btn{display:block;width:100%;margin:8px 0;padding:11px;font-size:18px;font-weight:700;background:#3fd0e6;color:#02323f;border:0;border-radius:10px;cursor:pointer;box-shadow:0 4px 0 #1b8196}
.btn:hover{background:#7ff0ff}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1b8196}
.btn.dim{background:#4d6d7a;color:#ddd;box-shadow:0 4px 0 #2b4048}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.how{font-size:14px;line-height:1.5;color:#d3eef5;background:#00000033;padding:8px 12px;border-radius:8px}
.row{display:flex;gap:10px;align-items:center;background:#00000033;border-radius:10px;padding:8px 10px;margin:6px 0}
.row .t{flex:1}.row b{color:#a8f4ff}.row small{color:#8fb7c4;display:block}
.row .btn{width:auto;margin:0;padding:8px 12px;font-size:15px;min-width:96px}
.pips{letter-spacing:2px;color:#ffd24a;font-size:12px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.tabs button{flex:1;min-width:70px;padding:7px 4px;border:0;border-radius:8px;background:#1d5670;color:#d6f6ff;font-weight:700;cursor:pointer}
.tabs button.on{background:#3fd0e6;color:#02323f}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.grid div{background:#00000040;border-radius:8px;padding:5px;font-size:11px;text-align:center;min-height:50px}
.grid div.no{opacity:.4}
.ach{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ach div{background:#00000033;border-radius:8px;padding:6px 8px;font-size:13px;opacity:.45}
.ach div.on{opacity:1;background:#1f6b5a}
.ach b{display:block;color:#a8f4ff}
#bar{position:fixed;right:8px;top:8px;z-index:4;display:flex;gap:6px}
#bar button{padding:7px 10px;border:2px solid #7ff0ff88;border-radius:8px;background:#04223399;color:#fff;font-weight:700;cursor:pointer}
#bar button:hover{background:#0b4a66}
#touch{display:none;position:fixed;inset:0;pointer-events:none;z-index:3}
body.touch #touch{display:block}
#touch button{position:absolute;pointer-events:auto;width:62px;height:62px;border-radius:50%;border:3px solid #fff8;background:#0006;color:#fff;font-size:18px;font-weight:700;touch-action:none}
#touch button:active{background:#3fd0e699}
@media (max-width:640px){h1{font-size:34px}}

 /* hazards */
