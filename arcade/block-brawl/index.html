<script>
'use strict';
/* ===== Block Brawl - S.I.P. Arcade ===== */
const W=960,H=540;
const cv=document.getElementById('c'),cx=cv.getContext('2d');
const R=Math.random,PI=Math.PI,abs=Math.abs,min=Math.min,max=Math.max,floor=Math.floor,sqrt=Math.sqrt;
const rnd=(a,b)=>a+R()*(b-a),ri=(a,b)=>floor(a+R()*(b-a+1)),pick=a=>a[floor(R()*a.length)],clamp=(v,a,b)=>v<a?a:v>b?b:v,sgn=v=>v<0?-1:1;
const lerp=(a,b,t)=>a+(b-a)*t;
/* ---------- save ---------- */
const SK='sip_block-brawl_save';
const DEF_SET={stocks:3,dmg:1,time:0,items:2,diff:0,music:1,mute:0,shake:1,mut:{}};
let SV={ach:{},st:{chars:{},won:{},stages:{},bosses:{},mm:{}},set:Object.assign({},DEF_SET),story:{best:0},best:{},coins:0,cos:{hats:{none:1},tints:{none:1},titles:{rookie:1}},eq:{hat:'none',tint:'none',title:'rookie'},eggs:{},seen:{},tut:0,trophies:{},chal:{}};
function loadSave(){try{const j=JSON.parse(localStorage.getItem(SK)||'null');if(j&&typeof j==='object'){for(const k in j){if(j[k]&&typeof j[k]==='object'&&!Array.isArray(j[k])&&SV[k])Object.assign(SV[k],j[k]);else SV[k]=j[k];}}}catch(e){}
 SV.set.mut=SV.set.mut||{};}
function save(){try{localStorage.setItem(SK,JSON.stringify(SV));}catch(e){}}
loadSave();
const ST=()=>SV.st;
function bump(k,n){SV.st[k]=(SV.st[k]||0)+(n===undefined?1:n);}
function best(k,v){if(v>(SV.st[k]||0))SV.st[k]=v;}
/* ---------- audio ---------- */
const AU={ctx:null,master:null,mus:null,on:false,inten:0,step:0,track:'menu',timer:null,next:0};
function au(){if(!AU.ctx){try{AU.ctx=new (window.AudioContext||window.webkitAudioContext)();AU.master=AU.ctx.createGain();AU.master.gain.value=SV.set.mute?0:.55;AU.master.connect(AU.ctx.destination);}catch(e){return null;}}
 if(AU.ctx.state==='suspended')AU.ctx.resume().catch(()=>{});return AU.ctx;}
function setMute(m){SV.set.mute=m?1:0;if(AU.master)AU.master.gain.value=m?0:.55;save();}
function tone(f,d,type,v,slide,delay){const c=AU.ctx;if(!c)return;const t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(max(30,f+slide),t+d);g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AU.master);o.start(t);o.stop(t+d+.02);}
let nbuf=null;
function noise(d,v,f0,f1,delay){const c=AU.ctx;if(!c)return;if(!nbuf){nbuf=c.createBuffer(1,c.sampleRate,c.sampleRate);const a=nbuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=R()*2-1;}
 const t=c.currentTime+(delay||0),s=c.createBufferSource();s.buffer=nbuf;const fl=c.createBiquadFilter();fl.type='bandpass';fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(max(40,f1),t+d);const g=c.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl);fl.connect(g);g.connect(AU.master);s.start(t);s.stop(t+d+.02);}
const SFX={
 punch(p){noise(.09,.6,2500,250);tone(140*p,.1,'square',.25,-70);},
 hit2(p){noise(.14,.8,3000,200);tone(90*p,.18,'sawtooth',.3,-50);tone(500*p,.06,'square',.15,300);},
 slash(){noise(.12,.35,1200,5000);},whoosh(){noise(.14,.25,300,2200);},
 zap(){tone(900,.15,'sawtooth',.15,-700);noise(.1,.2,4000,800);},shoot(){tone(700,.09,'square',.18,-450);noise(.05,.3,3000,1500);},
 jump(){tone(300,.12,'square',.12,350);},djump(){tone(450,.12,'triangle',.18,500);},land(){noise(.05,.2,400,150);},
 ko(){tone(600,.7,'sawtooth',.28,-520);noise(.5,.6,4000,100);tone(80,.5,'square',.3,-40);},
 star(p){tone(880*p,.15,'triangle',.22,0);tone(1320*p,.2,'triangle',.18,0,.07);},
 boom(){noise(.5,.9,1800,60);tone(70,.4,'sawtooth',.4,-40);},
 pick(){tone(660,.07,'square',.18);tone(990,.1,'square',.18,0,.07);},heal(){[523,659,784,1046].forEach((f,i)=>tone(f,.15,'triangle',.2,0,i*.07));},
 shield(){tone(220,.1,'triangle',.2);noise(.08,.2,3000,900);},sbreak(){noise(.4,.7,3500,200);tone(300,.4,'sawtooth',.3,-250);},
 click(){tone(520,.05,'square',.12);},sel(){tone(780,.08,'square',.15);tone(1040,.1,'square',.15,0,.06);},back(){tone(300,.08,'square',.12);},
 ach(){[660,880,1100,1320,1760].forEach((f,i)=>tone(f,.18,'triangle',.22,0,i*.08));},
 win(){[523,659,784,1046,784,1046,1318].forEach((f,i)=>tone(f,.22,'square',.2,0,i*.1));},
 lose(){[392,330,262,196].forEach((f,i)=>tone(f,.3,'triangle',.25,0,i*.16));},
 slip(){tone(900,.4,'sine',.2,-800);tone(500,.3,'square',.1,200,.1);},boing(){tone(180,.3,'sine',.35,500);},
 coin(p){tone(1200*p,.07,'square',.15);tone(1600*p,.12,'square',.15,0,.06);},tick(){tone(800,.04,'square',.1);},
 go(){tone(520,.25,'square',.25);tone(780,.35,'square',.25,0,.1);},ready(){tone(330,.15,'square',.2);},
 gold(){[1046,1318,1568,2093,1568,2093,2637].forEach((f,i)=>tone(f,.12,'triangle',.2,0,i*.05));},
 honk(){tone(220,.2,'sawtooth',.3);tone(196,.25,'sawtooth',.3,0,.02);},boop(){tone(400,.1,'sine',.3,300);},
 snore(){tone(110,.6,'sine',.2,30);},tada(){[392,523,659,784,1046].forEach((f,i)=>tone(f,.3,'square',.15,0,i*.06));}

function transDraw(){const T=G.trans;if(!T)return;const p=T.t<9?T.t/9:(18-T.t)/9;cx.setTransform(1,0,0,1,0,0);cx.fillStyle='rgba(10,10,40,'+clamp(p,0,1)+')';

function tick(){
 if(G.trans){G.trans.t++;if(G.trans.t===9){const T=G.trans;setScene(T.to,T.arg);}if(G.trans.t>=18)G.trans=null;}
 const s=SCN[G.scene];if(s&&s.upd)s.upd();G.sceneT++;if(G.sceneT%900===0)save();
 for(let i=toasts.length-1;i>=0;i--){if(--toasts[i].life<=0)toasts.splice(i,1);}
 musicHook();
}
function musicHook(){}
function render(){
 cx.setTransform(1,0,0,1,0,0);cx.globalAlpha=1;cx.clearRect(0,0,W,H);
 uiBegin();uiKeys();
 const s=SCN[G.scene];if(s&&s.draw){try{s.draw();}catch(e){console.error('draw',G.scene,e);BB.err=(e&&e.stack)||String(e);}}
 cx.setTransform(1,0,0,1,0,0);drawToasts();transDraw();
 uiEnd();
 for(const k in KP)delete KP[k];
}
let lastT=0,accT=0;
function loop(ts){requestAnimationFrame(loop);const dt=min(100,ts-lastT||16);lastT=ts;accT+=dt;let n=0;while(accT>=16.67&&n<4){accT-=16.67;n++;try{tick();}catch(e){console.error('tick',e);BB.err=(e&&e.stack)||String(e);}}if(n===0&&false)0;render();}
addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
BB.tick=tick;BB.render=render;BB.G=G;BB.SV=SV;
BB.sim=function(n){for(let i=0;i<n;i++)tick();};
setScene('title');demoStart();
