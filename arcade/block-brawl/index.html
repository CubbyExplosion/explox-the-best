<script>
'use strict';
/* ===== Block Brawl - S.I.P. Arcade ===== */
const W=960,H=540;
const cv=document.getElementById('c'),cx=cv.getContext('2d');
const R=Math.random,PI=Math.PI,abs=Math.abs,min=Math.min,max=Math.max,floor=Math.floor,sqrt=Math.sqrt;
const rnd=(a,b)=>a+R()*(b-a),ri=(a,b)=>floor(a+R()*(b-a+1)),pick=a=>a[floor(R()*a.length)],clamp=(v,a,b)=>v<a?a:v>b?b:v,sgn=v=>v<0?-1:1;
const lerp=(a,b,t)=>a+(b-a)*t;
/* ---------- save ---------- */
const SK='sip_block-brawl_save';
const DEF_SET={stocks:3,dmg:1,time:0,items:2,diff:0,music:1,mute:0,shake:1,camZoom:0,mut:{},unlockAll:0,ff:0,sharedStocks:0};
let SV={ach:{},st:{chars:{},won:{},stages:{},bosses:{},mm:{}},set:Object.assign({},DEF_SET),story:{best:0},best:{},coins:0,cos:{hats:{none:1},tints:{none:1},titles:{rookie:1}},eq:{hat:'none',tint:'none',title:'rookie'},eggs:{},seen:{},tut:0,trophies:{},chal:{},fav:{},ver:2,seenW:{}};
function loadSave(){try{const j=JSON.parse(localStorage.getItem(SK)||'null');if(j&&typeof j==='object'){for(const k in j){if(j[k]&&typeof j[k]==='object'&&!Array.isArray(j[k])&&SV[k])Object.assign(SV[k],j[k]);else SV[k]=j[k];}}}catch(e){}
 SV.set.mut=SV.set.mut||{};}
function save(){try{localStorage.setItem(SK,JSON.stringify(SV));}catch(e){}}
loadSave();
const ST=()=>SV.st;
function bump(k,n){SV.st[k]=(SV.st[k]||0)+(n===undefined?1:n);}
function best(k,v){if(v>(SV.st[k]||0))SV.st[k]=v;}
/* ---------- audio ---------- */
const AU={ctx:null,master:null,mus:null,on:false,inten:0,step:0,track:'menu',timer:null,next:0};
function au(){if(!AU.ctx){try{AU.ctx=new (window.AudioContext||window.webkitAudioContext)();AU.master=AU.ctx.createGain();AU.master.gain.value=SV.set.mute?0:.55;AU.master.connect(AU.ctx.destination);}catch(e){return null;}}
 if(AU.ctx.state==='suspended')AU.ctx.resume().catch(()=>{});return AU.ctx;}
function setMute(m){SV.set.mute=m?1:0;if(AU.master)AU.master.gain.value=m?0:.55;save();}
function tone(f,d,type,v,slide,delay){const c=AU.ctx;if(!c)return;const t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(max(30,f+slide),t+d);g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AU.master);o.start(t);o.stop(t+d+.02);}
let nbuf=null;
function noise(d,v,f0,f1,delay){const c=AU.ctx;if(!c)return;if(!nbuf){nbuf=c.createBuffer(1,c.sampleRate,c.sampleRate);const a=nbuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=R()*2-1;}
 const t=c.currentTime+(delay||0),s=c.createBufferSource();s.buffer=nbuf;const fl=c.createBiquadFilter();fl.type='bandpass';fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(max(40,f1),t+d);const g=c.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl);fl.connect(g);g.connect(AU.master);s.start(t);s.stop(t+d+.02);}
const SFX={
 punch(p){noise(.09,.6,2500,250);tone(140*p,.1,'square',.25,-70);},
 hit2(p){noise(.14,.8,3000,200);tone(90*p,.18,'sawtooth',.3,-50);tone(500*p,.06,'square',.15,300);},
 slash(){noise(.12,.35,1200,5000);},whoosh(){noise(.14,.25,300,2200);},
 zap(){tone(900,.15,'sawtooth',.15,-700);noise(.1,.2,4000,800);},shoot(){tone(700,.09,'square',.18,-450);noise(.05,.3,3000,1500);},
 jump(){tone(300,.12,'square',.12,350);},djump(){tone(450,.12,'triangle',.18,500);},land(){noise(.05,.2,400,150);},
 ko(){tone(600,.7,'sawtooth',.28,-520);noise(.5,.6,4000,100);tone(80,.5,'square',.3,-40);},
 star(p){tone(880*p,.15,'triangle',.22,0);tone(1320*p,.2,'triangle',.18,0,.07);},
 boom(){noise(.5,.9,1800,60);tone(70,.4,'sawtooth',.4,-40);},
 pick(){tone(660,.07,'square',.18);tone(990,.1,'square',.18,0,.07);},heal(){[523,659,784,1046].forEach((f,i)=>tone(f,.15,'triangle',.2,0,i*.07));},
 shield(){tone(220,.1,'triangle',.2);noise(.08,.2,3000,900);},sbreak(){noise(.4,.7,3500,200);tone(300,.4,'sawtooth',.3,-250);},
 click(){tone(520,.05,'square',.12);},sel(){tone(780,.08,'square',.15);tone(1040,.1,'square',.15,0,.06);},back(){tone(300,.08,'square',.12);},
 ach(){[660,880,1100,1320,1760].forEach((f,i)=>tone(f,.18,'triangle',.22,0,i*.08));},
 win(){[523,659,784,1046,784,1046,1318].forEach((f,i)=>tone(f,.22,'square',.2,0,i*.1));},
 lose(){[392,330,262,196].forEach((f,i)=>tone(f,.3,'triangle',.25,0,i*.16));},
 slip(){tone(900,.4,'sine',.2,-800);tone(500,.3,'square',.1,200,.1);},boing(){tone(180,.3,'sine',.35,500);},
 coin(p){tone(1200*p,.07,'square',.15);tone(1600*p,.12,'square',.15,0,.06);},tick(){tone(800,.04,'square',.1);},
 go(){tone(520,.25,'square',.25);tone(780,.35,'square',.25,0,.1);},ready(){tone(330,.15,'square',.2);},

 case'survBest':return SV.best.surv||0;case'muts':return Object.keys(s.mm).length;case'nWorlds':return Object.keys(SV.seenW||{}).length;case'nCoop':return Object.keys(s.cobosses||{}).length;case'nFav':return Object.keys(SV.fav||{}).length;

 case'nSU':{let n=0;for(const st of STAGES){if(!st.locked||SV.su[st.id]||(st.pts!==undefined&&ptsNow()>=st.pts))n++;}return n;}default:return s[k]||0;}}

 toast('Achievement: '+a[1],sub);sfx('ach');save();}
function checkAch(){if(typeof announceUnlocks==='function')announceUnlocks();let n=0;for(const a of AS){if(!SV.ach[a[0]]&&stat(a[3])>=a[4]){awardAch(a);n++;}}return n;}

/* ---- assemble final stage list (existing 12 get worlds) ---- */
(function(){const wmap={plains:0,factory:0,sky:4,cloud:4,mansion:9,clock:9,beach:8,final:5,lava:3,ice:2,space:5,candy:6};
 STAGES.forEach(s=>{s.world=wmap[s.id];s.tags=s.tags||{};for(const h of s.hz)s.tags[h.t]=1;for(const p of s.plats){for(const k of['conv','bounce','mv'])if(p[k])s.tags[k]=1;}if(s.fric>.9)s.tags.slip=1;if(s.grav<1)s.tags.low=1;
  s.desc=Object.keys(s.tags).map(k=>FDESC[k]).filter(Boolean).slice(0,3).join('. ')||'A classic arena';s.desc+=s.desc.endsWith('.')?'':'.';s.mus=WORLDS[s.world][4];if(['plains','sky','mansion','beach','final','factory'].includes(s.id))s.open=1;});
 // keep legacy factory conveyor flipping
 STAGES.find(s=>s.id==='factory').plats[0].flip=1;
 for(const s of NEWSTAGES){STAGES.push(s);SID[s.id]=s;s.fric=s.fric||.8;s.grav=s.grav||1;}
 // order by world then insertion
 STAGES.sort((a,b)=>a.world-b.world);
 // open flags: 2 first of each world
 const cnt={};STAGES.forEach((s,i)=>{s.idx=i;});
 const openIds={};WORLDS.forEach((w,wi)=>{let n=0;STAGES.filter(s=>s.world===wi).forEach(s=>{if(s.open&&n<2){n++;}else s.open=0;});});
 STAGES.forEach(s=>{if(s.locked&&s.open)s.locked=0;});
 // everything not open becomes progression-locked (legacy 'locked' via achievements kept)
 STAGES.forEach(s=>{if(!s.open&&!s.locked)s.locked=1;s.lockedN=0;});
 let k=0;STAGES.forEach(s=>{if(!s.open){k++;s.pts=k*2;}});
})();

   if(p.conv){const dir=(p.flip?m.convDir:1)*sgn(p.conv);c.fillStyle='rgba(0,0,0,.35)';for(let x=p.x+((t*1.6*dir)%30+30)%30;x<p.x+p.w-8;x+=30){c.beginPath();c.moveTo(x,p.y+3);c.lineTo(x+(dir>0?10:-10),p.y+8);c.lineTo(x,p.y+13);c.fill();}}}

 if(cfg.time&&!cfg.training){const s=max(0,floor(m.timeLeft/60));top=floor(s/60)+':'+String(s%60).padStart(2,'0');}
 if(cfg.mode==='survival')top='WAVE '+m.wave+'   BEST '+(SV.best.surv||0);
 if(cfg.mode==='time')top='FOE '+min(5,m.wave)+' / 5     '+((m.playT||0)/60).toFixed(1)+'s';
 if(cfg.mode==='target')top='TARGETS '+m.targets.filter(t=>!t.dead).length+'     '+((m.playT||0)/60).toFixed(1)+'s';
 if(cfg.mode==='chal'){const c=CHAL.find(q=>q[0]===cfg.chal);top=c?c[1]:'';if(cfg.chal==='storm')top+='   '+max(0,45-floor(m.t/60))+'s';if(cfg.chal==='speedy')top+='   '+max(0,30-floor(m.t/60))+'s';if(cfg.chal==='duoc')top+='   '+max(0,120-floor(m.t/60))+'s';}
 if(cfg.mode==='story'&&G.story)top='STORY  '+(G.story.idx+1)+'/10';
 if(cfg.mode==='team')top=(cfg.coop?'CO-OP vs BOSS':cfg.teamMode.toUpperCase())+(m.sd?'  HURRY UP!':'');
 if(top){panel(W/2-130,8,260,32,'rgba(0,0,0,.55)');txtO(top,W/2,24,19,'#fff');}
 if(m.ev){txtO(m.ev[1]+' '+ceilS(m.evLeft),W/2,top?82:56,16,'#ff8ae8');}
 if(m.st.desc&&m.t<260&&!cfg.demo){const a=min(1,(260-m.t)/40);cx.globalAlpha=a;txtO(m.st.name,W/2,100,22,'#fff');txt(m.st.desc,W/2,122,13,'#ffe14a');cx.globalAlpha=1;}
 if(cfg.training&&!cfg.lab){panel(10,8,300,92,'rgba(0,0,0,.6)');const h=m.fighters[0];txt('TRAINING',20,22,13,'#ffd23f','left');txt('Combo: '+h.combo+'   Best: '+h.maxCombo,20,44,16,'#fff','left');const lc=m.lastCombo;txt(lc?'Last: '+lc.n+' hits, '+lc.d+'% dmg':'Last: -',20,66,15,'#cde','left');txt('Dummy: '+(m.fighters[1].dummy||'stand')+'   (P = menu)',20,86,13,'#9bf','left');}
 else if(cfg.lab&&m.lab)drawLab(m);

 if(cfg.tutorial)drawTutHUD(m);
}

function announceUnlocks(){
 SV.seen=SV.seen||{};const first=!SV.seen.init;let nf=0,ns=0,fn='',sn='';

 for(const s of STAGES){const ok=!s.locked||SV.su[s.id]||(s.pts!==undefined&&ptsNow()>=s.pts);if(ok&&!SV.seen['s_'+s.id]){SV.seen['s_'+s.id]=1;if(!first){ns++;sn=s.name;}}}

/* ================= EXPLOX S.I.P. REWARDS ================= */
const EXPLOX='https://explox-server.onrender.com';
function exToday(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function exDevice(){if(!SV.dev||SV.dev.length<8){const A='abcdefghijklmnopqrstuvwxyz0123456789';let id='';for(let i=0;i<14;i++)id+=A[floor(R()*A.length)];SV.dev=id;save();}return SV.dev;}
function exFetch(path,body,cb){
 let done=false,ctl=null;try{ctl=typeof AbortController!=='undefined'?new AbortController():null;}catch(e){}
 const fin=o=>{if(done)return;done=true;clearTimeout(to);try{cb(o);}catch(e){}};
 const to=setTimeout(()=>{try{if(ctl)ctl.abort();}catch(e){}fin({ok:false,net:true,error:'timeout'});},8000);
 try{const opt={method:body?'POST':'GET'};if(body){opt.headers={'Content-Type':'text/plain'};opt.body=JSON.stringify(body);}if(ctl)opt.signal=ctl.signal;
  fetch(EXPLOX+path,opt).then(r=>r.json().then(j=>{j=j&&typeof j==='object'?j:{ok:false};j._st=r.status;fin(j);},()=>fin({ok:false,error:'Strange reply from the server.',_st:r.status}))).catch(()=>fin({ok:false,net:true,error:'net'}));
 }catch(e){fin({ok:false,net:true,error:'net'});}}
G.ex={health:'idle',claim:'idle',msg:'',redeem:'idle',rmsg:'',name:''};
function exHealth(){G.ex.health='wait';exFetch('/api/health',null,j=>{G.ex.health=(j&&!j.net&&(j.ok!==false)&&j._st<500)?'ok':'bad';});}
function exClaim(){const E=G.ex;if(E.claim==='wait')return;E.claim='wait';E.msg='';
 exFetch('/api/exworld/sip/code',{device:exDevice()},j=>{
  if(j.net){E.claim='net';E.msg='Could not reach the Explox server.';return;}
  if(j.ok&&j.code){E.claim='ok';SV.exCode=String(j.code);SV.exDay=exToday();E.msg='Your code is ready! It is worth '+(j.sip||100)+' S.I.P.';save();bump('exClaims');return;}
  if(j.code){E.claim='already';SV.exCode=String(j.code);SV.exDay=exToday();E.msg='You already claimed today, come back tomorrow! (Your unused code is below.)';save();return;}
  if(/already|tomorrow|too many/i.test(j.error||'')){E.claim='already';SV.exDay=exToday();E.msg='You already claimed today, come back tomorrow!';save();return;}
  E.claim='err';E.msg=(j.error&&String(j.error).slice(0,90))||'The server said no. Try again later.';});}
function exRedeem(){const E=G.ex;if(E.redeem==='wait')return;const name=(E.name||SV.exName||'').trim();if(!SV.exCode){E.redeem='err';E.rmsg='Get a code first.';return;}if(!name){E.redeem='err';E.rmsg='Type your Explox account name first.';return;}
 E.redeem='wait';E.rmsg='';SV.exName=name;save();
 exFetch('/api/exworld/sip/redeem',{code:SV.exCode,name:name},j=>{
  if(j.net){E.redeem='net';E.rmsg='Could not reach the Explox server.';return;}
  if(j.ok){E.redeem='ok';E.rmsg='Sent '+(j.sip||100)+' S.I.P. to '+String(j.name||name).slice(0,30)+'!';SV.exCode=null;save();sfx('tada');bump('exSent');return;}
  E.redeem='err';E.rmsg=(j.error&&String(j.error).slice(0,110))||'That did not work. Check the name and try again.';});}
function exNameInput(){
 if(typeof TOUCH!=='undefined'&&TOUCH){let v=null;try{v=prompt('Explox account name (capital letters count):',G.ex.name||SV.exName||'');}catch(e){}if(v!==null)G.ex.name=String(v).replace(/[^\w \-.]/g,'').slice(0,24);return;}
 G.srch.on=true;G.srch.kind='exname';if(!G.ex.name)G.ex.name=SV.exName||'';}
addEventListener('keydown',e=>{const S=G.srch;if(!S.on||S.kind!=='exname')return;const E=G.ex;
 if(e.key==='Backspace'){E.name=E.name.slice(0,-1);e.preventDefault();}
 else if(e.key==='Enter'||e.key==='Escape'){S.on=false;e.preventDefault();}
 else if(e.key.length===1&&/[\w \-.]/.test(e.key)&&E.name.length<24){E.name+=e.key;e.preventDefault();}},true);
function wrapTxt(s,x,y,w,sz,col,lh){const words=String(s).split(' ');let line='',yy=y;cx.font='bold '+sz+'px Trebuchet MS, Verdana, sans-serif';for(const wd of words){const t=line?line+' '+wd:wd;if(cx.measureText(t).width>w&&line){txt(line,x,yy,sz,col);line=wd;yy+=lh;}else line=t;}if(line)txt(line,x,yy,sz,col);return yy;}
function drawExCard(){
 const x=640,y=228,w=300,h=96;panel(x,y,w,h,'rgba(10,40,20,.9)');cx.strokeStyle='#7dff9a';cx.lineWidth=3;rr(x,y,w,h,14);cx.stroke();
 txtO('Claim 100 S.I.P. for Explox!',x+w/2,y+18,16,'#ffe14a');txt('A free daily gift. No passwords.',x+w/2,y+38,12,'#cde');
 btn('exc','Claim now',x+20,y+52,w-40,34,()=>{G.exBack='results';G.exAuto=true;go('explox');},{col:'#2e8a4f',sz:17,pulse:1});}
SCN.explox={enter(){const E=G.ex;E.claim=SV.exDay===exToday()&&SV.exCode?'ok':'idle';E.msg=E.claim==='ok'?'Your code for today is below.':'';E.redeem='idle';E.rmsg='';E.name=E.name||SV.exName||'';exHealth();G.srch.on=false;if(G.exAuto){G.exAuto=false;if(SV.exDay!==exToday())exClaim();}},upd(){demoStep();},
 draw(){drawPlain();const E=G.ex;title3d('EXPLOX S.I.P.',480,30,34,'#fff','#2e8a4f');backBtn(G.exBack||'menu');
  const dc=E.health==='ok'?'#4cff7a':E.health==='bad'?'#ff5a5a':'#bbb';cx.fillStyle=dc;cx.beginPath();cx.arc(780,30,8,0,7);cx.fill();cx.strokeStyle='#fff';cx.lineWidth=2;cx.stroke();txt(E.health==='ok'?'Explox server: online':E.health==='bad'?'Explox server: not reachable':'Explox server: checking...',796,30,13,'#fff','left');
  panel(40,62,880,70);wrapTxt('Earn 100 S.I.P. a day for Explox. No passwords. Ask a parent if you are not sure. Press "Get today\'s code", then type the name of your Explox account and press Send.',480,84,830,15,'#fff',22);
  panel(40,142,880,104);txt('1. Get today\'s code',60,160,17,'#ffd23f','left');
  const can=E.claim!=='wait';
  btn('exget',E.claim==='wait'?'Asking the server...':(E.claim==='net'?'Retry':'Get today\'s code'),60,176,260,44,()=>{exClaim();},{col:'#2e8a4f',sz:19,en:can&&SV.exDay!==exToday()||E.claim==='net'||E.claim==='err'});
  if(SV.exCode)txtO(SV.exCode,620,194,30,'#7dff9a');else txt('(no code yet)',620,194,18,'#789');
  if(E.msg)wrapTxt(E.msg,620,226,560,13,E.claim==='ok'?'#7dff9a':E.claim==='already'?'#ffe14a':'#ff9a9a',17);
  panel(40,256,880,150);txt('2. Send it to your Explox account',60,274,17,'#ffd23f','left');
  txt('Account name:',60,306,15,'#fff','left');const on=G.srch.on&&G.srch.kind==='exname';
  btn('exname',(E.name||'')+(on&&floor(G.sceneT/20)%2?'|':'')||'(click and type)',200,288,330,36,()=>{exNameInput();},{col:on?'#d6a02e':'#34407a',sz:16});
  btn('exsend',E.redeem==='wait'?'Sending...':'Send',550,288,150,36,()=>{G.srch.on=false;exRedeem();},{col:'#2e8a4f',sz:19,en:E.redeem!=='wait'});
  if(E.redeem==='net')btn('exretry','Retry',712,288,100,36,()=>{exRedeem();},{col:'#a07a2a',sz:16});
  if(E.rmsg)wrapTxt(E.rmsg,60,350,800,15,E.redeem==='ok'?'#7dff9a':'#ff9a9a',20);
  txt('Only a random device id, the code and the name you type are sent. Nothing else.',480,424,13,'#9bf');
  txt('Capital letters count in the account name.',480,444,12,'#cde');
 }};
