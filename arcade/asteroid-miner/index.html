<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05060f;overflow:hidden;font-family:system-ui,Segoe UI,Arial,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(3,4,14,.8);z-index:5;padding:10px;overflow:auto}
.card{background:linear-gradient(#1d2347,#121733);border:3px solid #4fd8ff;border-radius:16px;padding:18px 22px;max-width:660px;width:100%;max-height:96vh;overflow:auto;box-shadow:0 8px 40px #000a}
h1{margin:0 0 4px;font-size:42px;color:#7fe6ff;text-shadow:3px 3px 0 #1b4a8a;letter-spacing:2px;text-align:center}
h2{margin:0 0 8px;color:#7fe6ff;text-align:center}
.sub{text-align:center;color:#9fb4e0;margin-bottom:12px;font-size:14px}
.btn{display:block;width:100%;margin:8px 0;padding:11px;font-size:18px;font-weight:700;background:#4fd8ff;color:#06203a;border:0;border-radius:10px;cursor:pointer;box-shadow:0 4px 0 #1f86a8}
.btn:hover{background:#8ae9ff}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1f86a8}
.btn.dim{background:#55608a;color:#e6e9ff;box-shadow:0 4px 0 #333a5c}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.how{font-size:14px;line-height:1.5;color:#d3dcff;background:#00000040;padding:8px 12px;border-radius:8px}
.row{display:flex;gap:10px;align-items:center;background:#00000040;border-radius:10px;padding:8px 10px;margin:6px 0}
.row .t{flex:1}.row b{color:#ffe08a}.row small{color:#9fb0d8;display:block}
.row .btn{width:auto;margin:0;padding:8px 12px;font-size:15px;min-width:92px}
.pips{letter-spacing:2px;color:#4fd8ff;font-size:12px}
.ach{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ach div{background:#00000040;border-radius:8px;padding:6px 8px;font-size:13px;opacity:.45}
.ach div.on{opacity:1;background:#1f5a4a}
.ach b{display:block;color:#ffe08a}
.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:5px}
.coll div{background:#00000040;border-radius:8px;padding:4px;font-size:11px;text-align:center;min-height:50px}
.coll i{display:block;width:16px;height:16px;border-radius:4px;margin:0 auto 2px}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs .btn{margin:0;padding:6px;font-size:15px}
#touch{display:none;position:fixed;inset:0;pointer-events:none;z-index:3}
body.touch #touch{display:block}
#touch button{position:absolute;pointer-events:auto;width:64px;height:64px;border-radius:50%;border:3px solid #fff8;background:#0006;color:#fff;font-size:20px;font-weight:700;touch-action:none}
#touch button:active{background:#4fd8ff99}
@media (max-width:640px){h1{font-size:32px}}

function titleScreen(){const sv=hasSave();$o('<h1>ASTEROID MINER</h1><div class="sub">S.I.P. Arcade</div><div class="how">Dig through 6 giant asteroids, collect 100 space materials, sell them at the station, and upgrade your suit until you reach the glowing core!<br><br><b>Move:</b> Arrows / A D &nbsp; <b>Jetpack:</b> Up / W / Space &nbsp; <b>Dig:</b> push into rock, or hold Down<br><b>E:</b> use building / pet a bug &nbsp; <b>P:</b> pause &nbsp; <b>M:</b> mute &nbsp; <b>N:</b> map on/off<br>Mining costs 0.01 fuel per block and flying costs 0.02 per block. Watch your oxygen, falling rocks, gas vents, meteors and heat!</div>'+
 (sv?'<button class="btn" onclick="A.cont()">Continue</button><button class="btn dim" onclick="A.newg()">New Game</button>':'<button class="btn" onclick="A.newg()">Play</button>'))}
const A={cont(){audioInit();startGame(loadSave())},newg(){audioInit();try{localStorage.removeItem(KEY)}catch(e){}startGame(null);toast('Welcome aboard! Press E at buildings.','#9ff')},
 sell(i){const o=ORES[i],n=S.cargo[i];if(!n)return;const g=n*o.v;S.money+=g;S.st.earned+=g;S.st.sales++;S.cargo[i]=0;sfx.sell();ach();save();openBuilding('market')},
 sellAll(){let g=0;for(let i=0;i<NORE;i++){g+=S.cargo[i]*ORES[i].v;S.cargo[i]=0}if(g){S.money+=g;S.st.earned+=g;S.st.sales++;sfx.sell();toast('Sold everything for '+money(g),'#ffe08a')}ach();save();openBuilding('market')},
 fuel(n){const need=Math.min(n,Math.floor((fuelCap()-S.fuel)*100)/100);const cost=Math.ceil(need*FUELPRICE);if(need<=0||S.money<cost)return;S.money-=cost;S.fuel=Math.min(fuelCap(),Math.round((S.fuel+need)*1e4)/1e4);sfx.buy();save();openBuilding('dock')},
 repair(){const need=Math.ceil(hpMax()-S.hp);if(need<=0||S.money<need)return;S.money-=need;S.hp=hpMax();sfx.buy();save();openBuilding('repair')},
 up(i){if(S.up[i]>=MAXLV)return;const c=upCost(i);if(S.money<c)return;S.money-=c;S.up[i]++;if(i===3)S.hp+=25;sfx.buy();ach();save();openBuilding('lab')},
 tab(t){openBuilding('trophy',t)},resume(){closeOv()},
 beacon(){closeOv();S.cargo.fill(0);S.st.deaths++;S.hp=hpMax();S.o2=o2Cap();if(S.fuel<1)S.fuel=1;homePos();P.vx=P.vy=0;toast('Beacon used. Cargo lost.','#fc8');ach();save()},
 reset(){if(confirm('Delete your save and start over?')){try{localStorage.removeItem(KEY)}catch(e){}started=false;S=null;titleScreen()}}};
function openBuilding(k,tab){
 if(k==='market'){let rows='',tot=0;for(let i=0;i<NORE;i++)if(S.cargo[i]){const o=ORES[i],g=S.cargo[i]*o.v;tot+=g;rows+='<div class="row"><div class="t"><b style="color:'+o.c+'">'+o.n+'</b> x'+S.cargo[i]+'<small>'+o.r+' - '+money(o.v)+' each</small></div><button class="btn" onclick="A.sell('+i+')">Sell '+money(g)+'</button></div>'}
  $o('<h2>Sell Market</h2><div class="sub">Cargo '+cargoN()+'/'+cargoCap()+' &nbsp; Money '+money(S.money)+'</div>'+(rows||'<div class="how">Your cargo hold is empty. Go mine some ore!</div>')+(tot?'<button class="btn" onclick="A.sellAll()">Sell All ('+money(tot)+')</button>':'')+'<button class="btn dim" onclick="A.resume()">Close</button>')}
 else if(k==='dock'){const f=S.fuel,fc=fuelCap(),miss=fc-f;$o('<h2>Fuel and Oxygen Dock</h2><div class="sub">Money '+money(S.money)+'</div><div class="row"><div class="t"><b>Fuel</b> '+f.toFixed(2)+' / '+fc+'<small>'+money(FUELPRICE)+' per unit. Mining costs 0.01 per block, flying 0.02 per block.</small></div></div>'+
  '<button class="btn" '+(miss<=0||S.money<FUELPRICE?'disabled':'')+' onclick="A.fuel(1)">Buy 1 fuel ('+money(FUELPRICE)+')</button><button class="btn" '+(miss<=0||S.money<Math.ceil(miss*FUELPRICE)?'disabled':'')+' onclick="A.fuel(999)">Fill tank ('+money(Math.ceil(miss*FUELPRICE))+')</button>'+
  '<div class="row"><div class="t"><b>Oxygen</b> '+Math.ceil(S.o2)+' / '+o2Cap()+' s<small>Refills for free while you are docked at the station.</small></div></div><button class="btn dim" onclick="A.resume()">Close</button>')}
 else if(k==='repair'){const need=Math.ceil(hpMax()-S.hp);$o('<h2>Repair Bay</h2><div class="sub">Money '+money(S.money)+'</div><div class="row"><div class="t"><b>Hull</b> '+Math.ceil(S.hp)+' / '+hpMax()+'<small>$1 per point of damage</small></div></div><button class="btn" '+(need<=0||S.money<need?'disabled':'')+' onclick="A.repair()">Repair all ('+money(need)+')</button><button class="btn dim" onclick="A.resume()">Close</button>')}
 else if(k==='lab'){let rows='';const eff=['Power x'+power().toFixed(1),'Fuel '+fuelCap()+', O2 '+o2Cap()+'s','Cargo '+cargoCap(),'Hull '+hpMax(),'Light radius '+lightR().toFixed(1),'Thrust '+thrustA()+', speed '+spdMax(),scanR()?'Scan radius '+scanR().toFixed(0)+' blocks':'Not installed'];
  UPS.forEach((u,i)=>{const lv=S.up[i],mx=lv>=MAXLV;rows+='<div class="row"><div class="t"><b>'+u[0]+'</b> <span class="pips">'+'#'.repeat(lv)+'.'.repeat(MAXLV-lv)+'</span><small>'+u[1]+' - now: '+eff[i]+'</small></div><button class="btn" '+(mx||S.money<upCost(i)?'disabled':'')+' onclick="A.up('+i+')">'+(mx?'MAX':money(upCost(i)))+'</button></div>'});
  $o('<h2>Upgrade Lab</h2><div class="sub">Money '+money(S.money)+'</div>'+rows+'<button class="btn dim" onclick="A.resume()">Close</button>')}
 else if(k==='trophy'){tab=tab||'c';let b='<div class="tabs"><button class="btn '+(tab==='c'?'':'dim')+'" onclick="A.tab(\'c\')">Collection '+cnt()+'/100</button><button class="btn '+(tab==='a'?'':'dim')+'" onclick="A.tab(\'a\')">Achievements '+Object.keys(S.ach).length+'/'+ACH.length+'</button></div>';
  if(tab==='c'){b+='<div class="coll">';for(let i=0;i<NORE;i++){const o=ORES[i],f=S.coll[i]>0;b+='<div style="opacity:'+(f?1:.4)+'"><i style="background:'+(f?o.c:'#333')+'"></i>'+(f?o.n+'<br>x'+S.coll[i]:'???')+'</div>'}b+='</div>'}
  else{b+='<div class="ach">'+ACH.map((a,i)=>'<div class="'+(S.ach[i]?'on':'')+'"><b>'+a[0]+'</b>'+a[1]+'</div>').join('')+'</div>'}
  $o('<h2>Trophy Wall</h2>'+b+'<button class="btn dim" onclick="A.resume()">Close</button>')}}
function openPause(){if(!started)return;paused=true;$o('<h2>Paused</h2><div class="sub">Money '+money(S.money)+' - Materials '+cnt()+'/100</div><button class="btn" onclick="A.unpause()">Resume</button><button class="btn dim" onclick="toggleMute();openPause()">Sound: '+(S.mute?'Off':'On')+'</button><button class="btn dim" onclick="A.beacon2()">Emergency beacon (go home, lose cargo)</button><button class="btn dim" onclick="A.reset()">Delete save</button>')}
A.unpause=()=>{paused=false;closeOv()};A.beacon2=()=>{paused=false;A.beacon()};
function togglePause(){if(!started)return;if(ov){if(paused)A.unpause();else closeOv()}else{paused=true;$o('<h2>Paused</h2><button class="btn" onclick="A.unpause()">Resume</button>')}}
function toggleMap(){showMap=!showMap;try{localStorage.setItem('sip_asteroid-miner_map',showMap?'1':'0')}catch(e){}toast(showMap?'Map on':'Map off','#9ff')}
function toggleMute(){S.mute=!S.mute;if(master)master.gain.value=S.mute?0:.5;save()}
function endingScreen(){save();setTimeout(()=>{$o('<h1>YOU DID IT!</h1><div class="sub">You reached the glowing core!</div><div class="how">You tunneled through all six asteroids and found the heart of the belt, a star-bright crystal! The station crew cheers on the radio.<br><br>Blocks mined: '+S.st.blocks+'<br>Materials found: '+cnt()+'/100<br>Money earned: '+money(S.st.earned)+'<br>Play time: '+Math.round(S.st.time/60)+' min</div><button class="btn" onclick="A.resume()">Keep exploring</button>');ach()},300)}
/* ===== input ===== */
const KM={ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',ArrowUp:'u',w:'u',W:'u',' ':'u',ArrowDown:'d',s:'d',S:'d'};
addEventListener('keydown',e=>{if(KM[e.key]){e.preventDefault();keys[KM[e.key]]=1;return}
 if(e.key==='e'||e.key==='E'||e.key==='Enter'){if(!ov)eHit=true;return}
 if(e.key==='p'||e.key==='P'){togglePause();return}if(e.key==='n'||e.key==='N'){if(S&&started)toggleMap();return}if(e.key==='m'||e.key==='M'){if(S)toggleMute();return}
 if(e.key==='Escape'&&started){if(ov)(paused?A.unpause():closeOv());else openPause()}});
addEventListener('keyup',e=>{if(KM[e.key])keys[KM[e.key]]=0});
addEventListener('blur',()=>{keys.l=keys.r=keys.u=keys.d=0;if(started&&!ov)openPause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
addEventListener('beforeunload',save);
if('ontouchstart' in window||navigator.maxTouchPoints>0)document.body.classList.add('touch');
document.querySelectorAll('#touch button').forEach(b=>{const k=b.dataset.k;const on=e=>{e.preventDefault();audioInit();if(k==='e'){if(!ov)eHit=true}else if(k==='p')togglePause();else if(k==='n'){if(S&&started)toggleMap()}else if(k!=='n')keys[k]=1};const off=e=>{e.preventDefault();if(k!=='e'&&k!=='p'&&k!=='n')keys[k]=0};
 b.addEventListener('touchstart',on,{passive:false});b.addEventListener('touchend',off,{passive:false});b.addEventListener('touchcancel',off,{passive:false});b.addEventListener('mousedown',on);b.addEventListener('mouseup',off);b.addEventListener('mouseleave',off)});
cv.addEventListener('pointerdown',e=>{audioInit();for(const b of hudBtns)if(e.clientX>=b.x&&e.clientX<=b.x+b.w&&e.clientY>=b.y&&e.clientY<=b.y+b.h){b.fn();return}});
/* ===== loop ===== */
let last=0;function loop(t){const dt=Math.min(.05,(t-last)/1000||.016);last=t;step(dt);draw();requestAnimationFrame(loop)}
resize();titleScreen();requestAnimationFrame(loop);
window.G={get S(){return S},P,grid,inside,keys,step,draw,gen,startGame,save,loadSave,A,ORES,breakTile,cam,get storm(){return storm},get bugs(){return bugs},get gases(){return gases},get fallers(){return fallers},get meteors(){return meteors},hurt,die,interact,openBuilding,endingScreen,solidAt,homePos,hazards,ach,ACH,cnt,get ov(){return ov},ctx};
</script></body></html>
