<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05060f;overflow:hidden;font-family:system-ui,Segoe UI,Arial,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(3,4,14,.8);z-index:5;padding:10px;overflow:auto}
.card{background:linear-gradient(#1d2347,#121733);border:3px solid #4fd8ff;border-radius:16px;padding:18px 22px;max-width:660px;width:100%;max-height:96vh;overflow:auto;box-shadow:0 8px 40px #000a}
h1{margin:0 0 4px;font-size:42px;color:#7fe6ff;text-shadow:3px 3px 0 #1b4a8a;letter-spacing:2px;text-align:center}
h2{margin:0 0 8px;color:#7fe6ff;text-align:center}
.sub{text-align:center;color:#9fb4e0;margin-bottom:12px;font-size:14px}
.btn{display:block;width:100%;margin:8px 0;padding:11px;font-size:18px;font-weight:700;background:#4fd8ff;color:#06203a;border:0;border-radius:10px;cursor:pointer;box-shadow:0 4px 0 #1f86a8}
.btn:hover{background:#8ae9ff}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1f86a8}
.btn.dim{background:#55608a;color:#e6e9ff;box-shadow:0 4px 0 #333a5c}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.how{font-size:14px;line-height:1.5;color:#d3dcff;background:#00000040;padding:8px 12px;border-radius:8px}
.row{display:flex;gap:10px;align-items:center;background:#00000040;border-radius:10px;padding:8px 10px;margin:6px 0}
.row .t{flex:1}.row b{color:#ffe08a}.row small{color:#9fb0d8;display:block}
.row .btn{width:auto;margin:0;padding:8px 12px;font-size:15px;min-width:92px}
.pips{letter-spacing:2px;color:#4fd8ff;font-size:12px}
.ach{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ach div{background:#00000040;border-radius:8px;padding:6px 8px;font-size:13px;opacity:.45}
.ach div.on{opacity:1;background:#1f5a4a}
.ach b{display:block;color:#ffe08a}
.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:5px}
.coll div{background:#00000040;border-radius:8px;padding:4px;font-size:11px;text-align:center;min-height:50px}
.coll i{display:block;width:16px;height:16px;border-radius:4px;margin:0 auto 2px}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs .btn{margin:0;padding:6px;font-size:15px}
#touch{display:none;position:fixed;inset:0;pointer-events:none;z-index:3}
body.touch #touch{display:block}
#touch button{position:absolute;pointer-events:auto;width:64px;height:64px;border-radius:50%;border:3px solid #fff8;background:#0006;color:#fff;font-size:20px;font-weight:700;touch-action:none}
#touch button:active{background:#4fd8ff99}
@media (max-width:640px){h1{font-size:32px}}
