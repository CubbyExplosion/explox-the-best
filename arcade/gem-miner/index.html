<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#120d0a;overflow:hidden;font-family:system-ui,Segoe UI,Arial,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,6,4,.78);z-index:5;padding:10px;overflow:auto}
.card{background:linear-gradient(#3a2a1e,#2a1d14);border:3px solid #ffb300;border-radius:16px;padding:18px 22px;max-width:640px;width:100%;max-height:96vh;overflow:auto;box-shadow:0 8px 40px #000a}
h1{margin:0 0 4px;font-size:44px;color:#ffc933;text-shadow:3px 3px 0 #7a3f00;letter-spacing:2px;text-align:center}
h2{margin:0 0 8px;color:#ffc933;text-align:center}
.sub{text-align:center;color:#cbb08a;margin-bottom:12px;font-size:14px}
.btn{display:block;width:100%;margin:8px 0;padding:11px;font-size:18px;font-weight:700;background:#ffb300;color:#3a1e00;border:0;border-radius:10px;cursor:pointer;box-shadow:0 4px 0 #a86c00}
.btn:hover{background:#ffc933}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a86c00}
.btn.dim{background:#6b5a48;color:#ddd;box-shadow:0 4px 0 #3d3226}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.how{font-size:14px;line-height:1.5;color:#e8d8bd;background:#00000033;padding:8px 12px;border-radius:8px}
.row{display:flex;gap:10px;align-items:center;background:#00000033;border-radius:10px;padding:8px 10px;margin:6px 0}
.row .t{flex:1}.row b{color:#ffd966}.row small{color:#bfae92;display:block}
.row .btn{width:auto;margin:0;padding:8px 12px;font-size:15px;min-width:92px}
.pips{letter-spacing:2px;color:#ffb300;font-size:12px}
.ach{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ach div{background:#00000033;border-radius:8px;padding:6px 8px;font-size:13px;opacity:.45}
.ach div.on{opacity:1;background:#3b5a1f}
.ach b{display:block;color:#ffd966}
#touch{display:none;position:fixed;inset:0;pointer-events:none;z-index:3}
body.touch #touch{display:block}
#touch button{position:absolute;pointer-events:auto;width:64px;height:64px;border-radius:50%;border:3px solid #fff8;background:#0006;color:#fff;font-size:20px;font-weight:700;touch-action:none}
#touch button:active{background:#ffb30099}
@media (max-width:640px){h1{font-size:34px}}
</style></head><body>

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ri=(a,b)=>a+Math.floor(rng()*(b-a+1));
const idx=(x,y)=>y*W+x;
function tileAt(x,y){if(x<0||x>=W||y>=H)return BEDROCK;if(y<0)return A;return tiles[y*W+x]}
function solid(x,y){const t=tileAt(x,y);return t!==A&&t!==LAVA}
function layerIdx(d){for(let i=0;i<LAYERS.length;i++)if(d<LAYERS[i][2])return i;return LAYERS.length-1}
function layerTile(y){const d=y-SURF;return d<60?DIRT:d<130?CLAY:d<220?STONE:d<300?DEEP:d<350?LAVAROCK:CRYSTAL}

/* ===== generation ===== */
function gen(sd){
 seed=sd;rng=mulberry(sd);tiles=new Uint8Array(W*H);seen=new Uint8Array(W*H);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  let t;
  if(y<SURF)t=A;else if(x===0||x===W-1||y===H-1)t=BEDROCK;else t=layerTile(y+Math.floor((rng()-.5)*7));
  tiles[idx(x,y)]=t}
 const carve=(cx,cy,rx,ry,lava)=>{for(let y=Math.floor(cy-ry-1);y<=cy+ry+1;y++)for(let x=Math.floor(cx-rx-1);x<=cx+rx+1;x++){
  if(x<1||x>=W-1||y<SURF+3||y>=CORE_Y-2)continue;
  const dx=(x-cx)/rx,dy=(y-cy)/ry;if(dx*dx+dy*dy<1+(rng()-.5)*.5){tiles[idx(x,y)]=(lava&&y>cy+ry*.1)?LAVA:A}}};
 for(let i=0;i<95;i++)carve(ri(4,W-5),ri(SURF+8,385),ri(2,6),ri(1,3),false);
 for(let i=0;i<26;i++)carve(ri(6,W-7),ri(352,390),ri(5,10),ri(2,4),false);
 for(let i=0;i<18;i++){const cy=ri(SURF+300,SURF+345);carve(ri(5,W-6),cy,ri(3,7),ri(2,3),true)}
 for(let i=0;i<30;i++){const cx=ri(3,W-4),cy=ri(SURF+300,SURF+345);for(let k=0;k<8;k++){const x=cx+ri(-2,2),y=cy+ri(-1,1);if(tiles[idx(x,y)]>=1&&tiles[idx(x,y)]<=6)tiles[idx(x,y)]=LAVA}}
 // ores
 ORES.forEach((o,oi)=>{for(let v=0;v<o.vn;v++){let x=ri(2,W-3),y=SURF+ri(o.mn,o.mx);const n=ri(2,o.sz);
  for(let k=0;k<n;k++){if(x>0&&x<W-1&&y>SURF+2&&y<CORE_Y-1){const t=tiles[idx(x,y)];if(t>=1&&t<=6)tiles[idx(x,y)]=ORE0+oi}x+=ri(-1,1);y+=ri(-1,1)}}});
 // boulders & gas
 for(let y=SURF+8;y<CORE_Y-1;y++)for(let x=1;x<W-1;x++){const t=tiles[idx(x,y)];if(t<1||t>6)continue;
  const r=rng();if(r<.011){if(y+1<H&&tiles[idx(x,y+1)]!==A&&tiles[idx(x,y+1)]!==LAVA)tiles[idx(x,y)]=BOULDER}
  else if(r<.0165&&y>SURF+22)tiles[idx(x,y)]=GAS}
 // core chamber
 for(let y=CORE_Y;y<H-1;y++)for(let x=1;x<W-1;x++){const dx=x-40,inside=Math.abs(dx)<=18-(y-CORE_Y)*0.8&&y<H-1;tiles[idx(x,y)]=inside?A:BEDROCK}
 for(let x=1;x<W-1;x++)if(tiles[idx(x,CORE_Y-1)]===A||tiles[idx(x,CORE_Y-1)]===LAVA)tiles[idx(x,CORE_Y-1)]=CRYSTAL;
 // critters
 crits=[];const floors=[];
 for(let y=SURF+10;y<CORE_Y-1;y++)for(let x=1;x<W-1;x++)if(tiles[idx(x,y)]===A&&solid(x,y+1)&&tiles[idx(x,y+1)]!==BOULDER&&tileAt(x,y-1)===A)floors.push([x,y]);
 for(let i=0;i<150&&floors.length;i++){const f=floors[Math.floor(rng()*floors.length)],d=f[1]-SURF;
  let t;if(d<140)t=0;else if(d<220)t=rng()<.5?1:2;else if(d<290)t=rng()<.5?1:2;else if(d<350)t=rng()<.6?3:2;else t=rng()<.6?4:2;
  if(d<80&&rng()<.4)continue;
  crits.push(mkCrit(t,(f[0]+.5)*TS,(f[1]+.5)*TS))}
}
function mkCrit(t,x,y){return{t,x,y,hp:CRIT[t].hp,dir:rng()<.5?-1:1,vy:0,ph:rng()*6,cd:0}}

function b64(u){let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)}
function unb64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function save(){

 try{localStorage.setItem(KEY,JSON.stringify({v:1,seed,P:{x:P.x,y:P.y,fuel:P.fuel,hull:P.hull,cargo:P.cargo,coins:P.coins,tnt:P.tnt,face:P.face},UPLV,S,ach,
  crit:crits.map(c=>[c.t,Math.round(c.x),Math.round(c.y),c.hp,c.dir]),tiles:b64(tiles),seen:b64(seen),muted}))}catch(e){}}
function hasSave(){try{return !!localStorage.getItem(KEY)}catch(e){return false}}
function load(){
 try{const raw=localStorage.getItem(KEY);if(!raw)return false;const d=JSON.parse(raw);
  const t=unb64(d.tiles),s=unb64(d.seen);if(t.length!==W*H||s.length!==W*H)return false;
  tiles=t;seen=s;seed=d.seed;P=freshPlayer();Object.assign(P,d.P);UPLV=Object.assign({drill:0,fuel:0,cargo:0,hull:0,radar:0,jet:0,tnt:0},d.UPLV);
  S=Object.assign(freshStats(),d.S);ach=d.ach||{};muted=!!d.muted;resetFx();
  crits=(d.crit||[]).map(a=>{const c=mkCrit(a[0],a[1],a[2]);c.hp=a[3];c.dir=a[4];return c});
  while(P.cargo.length<ORES.length)P.cargo.push(0);if(P.cargo.length>ORES.length)P.cargo.length=ORES.length;while(S.got.length<ORES.length)S.got.push(0);
  lastSeenTx=-1;return true}catch(e){return false}}

function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});return AC}
function tone(f,d,type,vol,slide,delay){const a=ac();if(!a||muted)return;try{const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+d);g.gain.setValueAtTime(vol||.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function noise(d,vol,fr,delay){const a=ac();if(!a||muted)return;try{const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=fr||1200;const g=a.createGain();g.gain.value=vol||.1;s.connect(f);f.connect(g);g.connect(a.destination);s.start(a.currentTime+(delay||0))}catch(e){}}

/* ===== input ===== */
const kb={},tc={};
const KM={KeyA:'l',ArrowLeft:'l',KeyD:'r',ArrowRight:'r',KeyW:'u',ArrowUp:'u',KeyS:'d',ArrowDown:'d'};
const inp=k=>kb[k]||tc[k];
function pressAction(k){
 if(k==='e'){if(state==='play'&&!modal)interact();else if(modal)closeModal()}
 else if(k==='t'){if(state==='play'&&!modal)throwTnt()}
 else if(k==='p'){togglePause()}
}
addEventListener('keydown',e=>{
 ac();const k=KM[e.code];
 if(k){kb[k]=true;e.preventDefault();return}
 if(e.repeat)return;
 if(e.code==='KeyE'||e.code==='Enter'){if(state==='play'){e.preventDefault();pressAction('e')}}
 else if(e.code==='Space'){e.preventDefault();pressAction('t')}
 else if(e.code==='KeyP'||e.code==='Escape'){if(modal)closeModal();else if(state==='play'||state==='pause')togglePause()}
 else if(e.code==='KeyM'){muted=!muted;toast(muted?'Sound off':'Sound on')}
 else if(e.code==='KeyR'){if(state==='play'&&!modal)rescue()}
 else if(e.code==='KeyT'){if(state==='play'&&!modal)showAch()}
});
addEventListener('keyup',e=>{const k=KM[e.code];if(k)kb[k]=false});
addEventListener('blur',()=>{for(const k in kb)kb[k]=false;if(state==='play'&&!modal)togglePause()});
document.querySelectorAll('#touch button').forEach(b=>{const k=b.dataset.k;
 const dn=e=>{e.preventDefault();ac();document.body.classList.add('touch');if('lrud'.includes(k))tc[k]=true;else pressAction(k)};
 const up=e=>{e.preventDefault();if('lrud'.includes(k))tc[k]=false};
 b.addEventListener('pointerdown',dn);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up)});
if(matchMedia('(pointer:coarse)').matches||'ontouchstart' in window)document.body.classList.add('touch');

/* ===== fx helpers ===== */
function toast(t){toasts.push({t,life:2.6});if(toasts.length>4)toasts.shift()}
function ftext(x,y,t,c){texts.push({x,y,t,c:c||'#fff',life:1.2})}
function burst(x,y,col,n,sp,life,g){for(let i=0;i<n&&parts.length<500;i++){const a=Math.random()*6.283,s=Math.random()*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-sp*.3,life:life*(.5+Math.random()*.5),max:life,c:col,s:2+Math.random()*3,g:g===undefined?500:g})}}
function colorOfTile(t,y){if(t>=ORE0)return ORES[t-ORE0].c;if(t===GAS)return'#8be36a';if(t===BOULDER)return'#8a8a8a';return BASECOL[t]||BASECOL[layerTile(y)]}
function unlock(id){if(ach[id])return;ach[id]=1;const a=ACH.find(x=>x[0]===id);toast('Achievement: '+a[1]);sfx.ach();save()}
function checkAch(){
 const d=S.maxDepth;
 if(S.dug>=1)unlock('first_dig');if(S.sales>=1)unlock('first_sale');
 if(d>=50)unlock('d50');if(d>=100)unlock('d100');if(d>=200)unlock('d200');if(d>=300)unlock('d300');
 if(S.finished)unlock('core');
 if(S.earned>=1000)unlock('e1k');if(S.earned>=10000)unlock('e10k');if(S.earned>=50000)unlock('e50k');
 if(S.ores>=100)unlock('o100');if(S.ores>=500)unlock('o500');
 if(S.got.slice(5,12).some(x=>x))unlock('gem');if(S.got.every(x=>x))unlock('all100');if(S.got.filter(x=>x).length>=50)unlock('ore50');if(S.got[9])unlock('dia');if(S.got[10])unlock('star');
 if(S.ups>=5)unlock('up5');if(UPS.some(u=>lv(u.id)>=u.costs.length))unlock('maxup');
 if(S.booms>=1)unlock('boom');if(S.kills>=10)unlock('crit10');if(S.deaths>=1)unlock('oops')}

/* ===== player actions ===== */
function hurt(amt,cont){
 if(P.dead||state!=='play')return;
 if(!cont){if(P.inv>0)return;P.inv=.8;P.flash=.3;sfx.hurt();shake=Math.max(shake,5)}
 amt*=1-.05*lv('hull');P.hull-=amt;
 if(cont&&Math.random()<.2)burst(P.x,P.y,'#ff8a2a',1,60,.5,-100);
 if(P.hull<=0)die()}
function die(){
 P.hull=0;P.dead=true;P.deadT=2.4;S.deaths++;sfx.die();shake=12;
 burst(P.x,P.y,'#ffc400',40,260,1.2);burst(P.x,P.y,'#555',30,200,1.2);
 P.cargo.fill(0);P.dig=null;toast('Rig wrecked! Cargo lost.');unlock('oops')}
function respawn(){
 P.coins=Math.floor(P.coins*.9);P.x=40*TS;P.y=SURF*TS-HH-1;P.vx=P.vy=0;P.dead=false;P.hull=cap('hull');P.fuel=Math.max(P.fuel,cap('fuel')*.5);P.inv=2;P.cave=0;
 toast('Repair crew towed you home (-10% coins).');save()}
function rescue(){
 if(depthM()<2){toast('You are already home.');return}
 P.cargo.fill(0);P.x=40*TS;P.y=SURF*TS-HH-1;P.vx=P.vy=0;P.fuel=Math.max(P.fuel,cap('fuel')*.25);P.dig=null;
 toast('Emergency tow! Cargo was lost.');sfx.hit();save()}
function addOre(i){
 if(cargoN()>=cap('cargo')){ftext(P.x,P.y-24,'CARGO FULL!','#ff6b6b');return false}
 P.cargo[i]++;S.ores++;S.got[i]=1;ftext(P.x,P.y-24,'+'+ORES[i].n,ORES[i].c);sfx.collect();return true}
function gasBurst(tx,ty){
 gas.push({x:(tx+.5)*TS,y:(ty+.5)*TS,life:3.2});
 for(let i=0;i<24;i++)parts.push({x:(tx+.5)*TS,y:(ty+.5)*TS,vx:(Math.random()-.5)*90,vy:(Math.random()-.5)*90-20,life:2,max:2,c:'#9ae85a',s:6+Math.random()*6,g:-20});
 const d=Math.hypot(P.x-(tx+.5)*TS,P.y-(ty+.5)*TS);if(d<60){hurt(14);toast('Gas pocket! Back away!')}}
function startFall(tx,ty){if(tileAt(tx,ty)!==BOULDER)return;tiles[idx(tx,ty)]=A;rocks.push({x:(tx+.5)*TS,y:(ty+.5)*TS,vy:0,tile:true,t:.35})}
function clearTile(tx,ty,fromTnt){
 const t=tileAt(tx,ty);if(t===A||t===BEDROCK)return false;
 tiles[idx(tx,ty)]=A;
 if(t>=ORE0)addOre(t-ORE0);
 else if(t===GAS&&!fromTnt)gasBurst(tx,ty);
 burst((tx+.5)*TS,(ty+.5)*TS,colorOfTile(t,ty),fromTnt?6:5,120,.6);
 if(!fromTnt){S.dug++;if(tileAt(tx,ty-1)===BOULDER)startFall(tx,ty-1);
  if(ty-SURF>100&&Math.random()<.006&&P.cave<=0){P.cave=1.2;sfx.rumble();toast('Rumble... cave-in!')}}
 return true}
function dropRocks(){
 const tx=Math.floor(P.x/TS);let cy=Math.floor(P.y/TS);
 for(let k=0;k<8&&!solid(tx,cy-1);k++)cy--;
 for(let dx=-1;dx<=1;dx++){const x=tx+dx;if(!solid(x,cy)&&Math.random()<.85)rocks.push({x:(x+.5)*TS,y:cy*TS+10,vy:0,tile:false,t:0})}}
function throwTnt(){
 if(lv('tnt')<1){toast('Buy the Dynamite upgrade first!');return}
 if(P.tnt<=0){toast('No dynamite! Buy some at the shop.');return}
 if(P.dead)return;P.tnt--;tnts.push({x:P.x,y:P.y-4,vx:P.face*90+P.vx*.3,vy:-140,f:1.3});sfx.tick()}
function explode(x,y){
 const r=UPD('tnt').vals[lv('tnt')],cx=Math.floor(x/TS),cy=Math.floor(y/TS),R=Math.ceil(r)+1,cleared=[];
 S.booms++;sfx.boom();shake=14;
 for(let ty=cy-R;ty<=cy+R;ty++)for(let tx=cx-R;tx<=cx+R;tx++){
  if(Math.hypot(tx-cx,ty-cy)>r)continue;const t=tileAt(tx,ty);
  if(t===BEDROCK||t===A||ty<SURF)continue;
  if(t===LAVA){tiles[idx(tx,ty)]=A;continue}
  clearTile(tx,ty,true);cleared.push([tx,ty])}
 cleared.forEach(c=>{if(tileAt(c[0],c[1]-1)===BOULDER)startFall(c[0],c[1]-1)});
 burst(x,y,'#ffb300',50,320,.9);burst(x,y,'#ff4a1c',30,260,.8);burst(x,y,'#444',25,200,1);
 const d=Math.hypot(P.x-x,P.y-y);if(d<(r+.6)*TS)hurt(28*(1-d/((r+.6)*TS)*.6));
 crits=crits.filter(c=>{if(Math.hypot(c.x-x,c.y-y)<(r+.6)*TS){killCrit(c);return false}return true})}
function killCrit(c){S.kills++;const v=6+c.t*8;P.coins+=v;S.earned+=v;ftext(c.x,c.y-10,'+'+v+' '+CRIT[c.t].n,'#ffe066');burst(c.x,c.y,CRIT[c.t].c,14,140,.7);sfx.hit()}

 if(a==='buy'){const u=UPD(v),l=lv(v);if(l<u.costs.length&&P.coins>=u.costs[l]){P.coins-=u.costs[l];UPLV[v]=l+1;S.ups++;sfx.buy();

/* ===== update ===== */
function boxHit(x,y){
 const x0=Math.floor((x-HW)/TS),x1=Math.floor((x+HW-.01)/TS),y0=Math.floor((y-HH)/TS),y1=Math.floor((y+HH-.01)/TS);
 for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(solid(tx,ty))return true;return false}
function moveP(dx,dy){
 let hx=0,hy=0;const n=Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))/1.5)||1,sx=dx/n,sy=dy/n;
 for(let i=0;i<n;i++){
  if(sx){P.x+=sx;if(boxHit(P.x,P.y)){P.x-=sx;hx=sx>0?1:-1;P.vx=0}}
  if(sy){P.y+=sy;if(boxHit(P.x,P.y)){P.y-=sy;hy=sy>0?1:-1}}}
 return[hx,hy]}
function updatePlayer(dt){
 const L=inp('l'),R=inp('r'),U=inp('u'),D=inp('d'),fuelOk=P.fuel>0,jl=lv('jet');
 let ax=0;if(fuelOk){if(L)ax--;if(R)ax++}
 if(ax)P.face=ax;
 P.vx+=(ax*150-P.vx)*Math.min(1,dt*(P.onGround?14:6));
 P.thrust=false;
 if(U&&fuelOk){P.vy-=(1500+jl*200)*dt;P.thrust=true;
  if(Math.random()<dt*14){parts.push({x:P.x+(Math.random()-.5)*8,y:P.y+HH,vx:(Math.random()-.5)*30,vy:120+Math.random()*60,life:.35,max:.35,c:Math.random()<.5?'#ffb300':'#ff5a1c',s:3,g:0})}
  sfxT-=dt;if(sfxT<=0){sfx.jet();sfxT=.12}}
 P.vy+=GRAV*dt;
 const maxUp=130+jl*35;if(P.vy<-maxUp)P.vy=-maxUp;if(P.vy>560)P.vy=560;
 const pre=P.vy,px0=P.x,py0=P.y,r=moveP(P.vx*dt,P.vy*dt);
 if(P.thrust)P.fuel-=.02*Math.hypot(P.x-px0,P.y-py0)/TS;   // 0.02 fuel for every block you fly
 if(r[1]){if(r[1]===1&&pre>430){hurt((pre-430)*.09);sfx.land();burst(P.x,P.y+HH,'#aa8866',8,100,.4)}else if(r[1]===1&&pre>200)sfx.land();P.vy=0}
 P.onGround=boxHit(P.x,P.y+1.5);
 // digging
 let tg=null;
 if(fuelOk){
  if(D&&!L&&!R){const ty=Math.floor((P.y+HH+2)/TS),tx=Math.floor(P.x/TS);if(P.onGround&&solid(tx,ty)){tg=[tx,ty];P.digDir=[0,1];P.x+=(((tx+.5)*TS)-P.x)*Math.min(1,dt*10)}}
  else if(ax){const tx=Math.floor((P.x+ax*(HW+2))/TS),ty=Math.floor((P.y+HH-6)/TS);if(solid(tx,ty)){tg=[tx,ty];P.digDir=[ax,0]}}
  else if(U&&!D){const ty=Math.floor((P.y-HH-2)/TS),tx=Math.floor(P.x/TS);if(solid(tx,ty)&&P.vy>-30){tg=[tx,ty];P.digDir=[0,-1];P.x+=(((tx+.5)*TS)-P.x)*Math.min(1,dt*10)}}}
 if(tg){
  const t=tileAt(tg[0],tg[1]);
  if(t===BEDROCK){P.dig=null;if(Math.random()<dt*3){burst(P.x+P.digDir[0]*16,P.y+P.digDir[1]*16,'#999',1,60,.3)}}
  else{
   const need=(HARD[t>=ORE0?layerTile(tg[1]):t]+(t>=ORE0?ORES[t-ORE0].h:0))*.33/UPD('drill').vals[lv('drill')];
   if(!P.dig||P.dig.x!==tg[0]||P.dig.y!==tg[1])P.dig={x:tg[0],y:tg[1],t:0,need,s:0};
   P.dig.t+=dt;P.dig.s-=dt;
   if(P.dig.s<=0){sfx.dig();P.dig.s=.14;burst((tg[0]+.5)*TS,(tg[1]+.5)*TS,colorOfTile(t,tg[1]),2,90,.4);shake=Math.max(shake,1.2)}
   if(P.dig.t>=P.dig.need){clearTile(tg[0],tg[1]);P.dig=null;P.fuel=Math.max(0,P.fuel-.01)}}}
