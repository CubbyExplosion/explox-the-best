<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0e3550;--ac:#ffc83d;--pn:#16445f;--tx:#f2fbff}
body[data-theme="1"]{--bg:#4a2040;--ac:#ff9a5a;--pn:#6a3050}body[data-theme="2"]{--bg:#0e4a3a;--ac:#9affc0;--pn:#1a6a50}body[data-theme="3"]{--bg:#0a0a24;--ac:#b0a0ff;--pn:#1a1a48}body[data-theme="4"]{--bg:#5a1a30;--ac:#ff8ab0;--pn:#7a2a48}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,Segoe UI,Arial,sans-serif;color:var(--tx);user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hide{display:none!important}
#hud{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;padding:8px 10px;background:linear-gradient(#0008,#0000);flex-wrap:wrap;pointer-events:none}
#hud>*{pointer-events:auto}
#coins{background:var(--pn);padding:6px 12px;border-radius:14px;font-weight:700;color:var(--ac);border:2px solid var(--ac)}
#coins:before{content:"\25CF  ";}
#clock{background:#0007;padding:6px 10px;border-radius:12px;font-size:14px}
#goal{background:#0009;padding:6px 10px;border-radius:12px;font-size:14px;border:1px solid var(--ac);max-width:min(520px,95vw)}
#ttl{font-size:12px;opacity:.85}
.b{background:var(--pn);color:var(--tx);border:2px solid #fff3;border-radius:12px;padding:8px 12px;font:600 14px system-ui;cursor:pointer;margin:2px;transition:transform .12s,background .12s}
.b:hover:not(:disabled){transform:translateY(-2px) scale(1.04);background:#fff2;border-color:var(--ac)}
.b:active:not(:disabled){transform:scale(.94)}.b:disabled{opacity:.4;cursor:default}
.b.on{background:var(--ac);color:#321}.b.warn{background:#a33}
.bar{position:fixed;left:0;right:0;bottom:0;padding:8px;display:flex;flex-wrap:wrap;justify-content:center;gap:2px;background:linear-gradient(#0000,#000a)}
#panel{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:20;animation:fade .2s}
#pbox{background:var(--pn);width:min(960px,96vw);max-height:92vh;border-radius:18px;border:3px solid var(--ac);display:flex;flex-direction:column;animation:pop .25s}
#phead{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-size:20px;font-weight:800;border-bottom:2px solid #fff2}
#pbody{padding:12px 16px;overflow:auto}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}@keyframes fade{from{opacity:0}to{opacity:1}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}.grid.small{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.card{background:#0003;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px;border:2px solid transparent}.card.sel{border-color:var(--ac)}.card.unk{opacity:.5}.card.got{border-color:#6fd08c}.card.tiny{padding:6px;font-size:13px;cursor:pointer}
.card small,.row small{opacity:.8;font-size:12px}.tip{color:#aef}.q{background:#0004;padding:6px;border-radius:8px;font-size:13px}
.rar{padding:1px 6px;border-radius:8px;color:#123;font-size:11px;font-weight:700}
.row{display:flex;gap:6px;align-items:center;padding:4px 0;border-bottom:1px solid #fff1}.row>span:first-child{flex:1}.up{color:#6fd08c}.dn{color:#ff8a8a}
.hearts{color:#ff6b9a;letter-spacing:1px;font-size:12px}.tabs{margin-bottom:8px}
li.done{color:#6fd08c}
#toast{position:fixed;top:92px;left:50%;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.tst{background:#000c;border:2px solid var(--ac);padding:8px 14px;border-radius:12px;font-weight:600;animation:tin .35s;transition:opacity .5s;max-width:92vw;text-align:center}.tst.out{opacity:0}
@keyframes tin{from{transform:translateY(-20px) scale(.8);opacity:0}to{transform:none;opacity:1}}
#resbox{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--pn);border:3px solid var(--ac);border-radius:18px;padding:14px 20px;text-align:center;z-index:15;max-width:min(440px,94vw);animation:pop .3s}
#resbox h2{margin:4px 0}.big{font-size:22px;font-weight:800;color:var(--ac)}.new{color:#6fd08c;margin:0 4px}.fact{font-size:13px;opacity:.9}.rbtns .b{min-width:100px}
#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:10;text-align:center}
#title h1{font-size:clamp(40px,9vw,88px);margin:0;color:#fff;text-shadow:0 4px 0 #0a3a5a,0 0 30px #7cf;animation:bob 2.5s ease-in-out infinite}
#title .sip{letter-spacing:4px;font-weight:700;color:var(--ac);animation:bob 3s ease-in-out infinite .5s}
#title .b{font-size:20px;padding:12px 30px;animation:slide .6s backwards}
@keyframes bob{50%{transform:translateY(-10px) rotate(-1deg)}}@keyframes slide{from{transform:translateY(40px);opacity:0}}
.end{font-size:17px;line-height:1.5}
@media(max-width:640px){#hud{font-size:12px}.b{padding:7px 9px;font-size:13px}}
</style></head><body data-theme="0" data-mode="title">

function timeStep(dt){G.hour+=dt*24/340;const h0=Math.floor(G.hour);if(G.hour>=24)newDay();if(Math.floor(G.hour)!==G._lh){G._lh=Math.floor(G.hour);stallTick();if(G.hour>=9&&G.hour<9.2&&G.wx==='sun'&&G.day%5==0&&Math.random()<.5)secret('rainbow');}}

function legendOK(f,o){if(o&&o.test)return true;if(f.id===LL_ID)return G.lh>=5&&LEGS.every(i=>i===LL_ID||G.log[i]);const l=o.loc,all=FISH.filter(x=>x.locs.includes(l)&&x.rar<4);return all.filter(x=>G.log[x.id]).length>=Math.ceil(all.length*.6);}
function pool(loc,o){const night=isNight(o.hour),out=[];for(const f of FISH){if(!f.locs.includes(loc))continue;if(f.time==='d'&&night)continue;if(f.time==='n'&&!night)continue;if(f.seas!=='*'&&!f.seas.includes(SL[o.seas]))continue;o.loc=loc;if(f.rar===4&&!legendOK(f,o))continue;out.push(f);}return out;}
const rod=()=>RODS[G.rod],rodUp=()=>G.rods[G.rod]||0;
function baitObj(){return G.bait>=0&&(G.baits[G.bait]||0)>0?BAITS[G.bait]:null;}
function luck(){const b=baitObj();let L=G.rod*.05+rodUp()*.04+(b?b.rb:0)+G.boat*.04;if(isNight()&&G.lh>=2)L+=.12;if(G.wx==='storm')L+=.15;if(isFest())L+=.1;if(G.chal&&G.chal.m===2)L+=.4;return L;}
function weights(list,o){const b=baitObj(),L=luck(),w=[];for(const f of list){let x=f.id===LL_ID?30:[100,42,16,5,5][f.rar];if(f.rar>0)x*=1+L*f.rar;if(b){if(b.tg[f.tag])x*=b.tg[f.tag];if(b.tg.n&&isNight())x*=1.2;}
const wt=o.wx==='rain'||o.wx==='storm'||o.wx==='snow';if(f.wx==='R')x*=wt?2.2:.6;else if(f.wx==='C')x*=wt?.5:1.6;
if(G&&G.chal&&G.chal.m===1&&f.cm>40)x*=.2;
w.push(x);}return w;}
function rollCatch(){const night=isNight();
if(Math.random()<.1){const junkP=.55;const it=ITEMS.filter(i=>junkP>Math.random()?i.kind==='j':i.kind==='t');const w=it.map(i=>i.kind==='j'?1:60/Math.sqrt(i.val));const r=rndw(it,w);return{k:'item',it:r};}
const list=pool(G.loc,{hour:G.hour,seas:season(),wx:G.wx});if(!list.length)return{k:'item',it:ITEMS[0]};
let w=weights(list,{wx:G.wx});
if(G.tut<3){const e=list.filter(f=>f.rar===0&&f.cm<=40);if(e.length){return{k:'fish',f:pick(e)};}}
return{k:'fish',f:rndw(list,w)};}
function rndw(l,w){let s=0;w.forEach(x=>s+=x);let r=Math.random()*s;for(let i=0;i<l.length;i++){r-=w[i];if(r<=0)return l[i];}return l[l.length-1];}
function makeInst(f){let q=Math.pow(Math.random(),1.5);q=Math.min(1,q+G.rod*.012+rodUp()*.02);if(G.chal&&G.chal.m===1)q*=.4;const cm=Math.round(f.cm*(.3+.7*q)*10)/10;const kg=Math.max(.005,+(f.kg*Math.pow(cm/f.cm,3)).toPrecision(3));const gold=Math.random()<.03+(G.hat===10?0:0);return{id:f.id,cm,kg,g:gold?1:0};}
const wt=kg=>kg<1?Math.round(kg*1000)+' g':(kg>=100?Math.round(kg):+kg.toFixed(1))+' kg';
const cmS=cm=>cm>=100?(cm/100).toFixed(2)+' m':cm+' cm';
// ---------- prices ----------
function mmult(id,day){day=day||G.day;let m=.75+.6*hrand(id*131+day*7919);return m;}
function baseVal(i){const f=FISH[i.id];const sf=i.cm/f.cm;let v=BASEP[f.rar]*(.6+sf)*(1+Math.log10(1+f.kg)*.15);if(i.g)v*=4;if(G.chal){if(G.chal.m===1)v*=2;if(G.chal.m===3)v*=1.5;if(G.chal.m===4)v*=1.3;}return Math.max(1,Math.round(v));}
function sellVal(i){let m=mmult(i.id)*(isFest()?1.2:1);const hm=G.friends[2]||0;m*=1+hm*.01;return Math.max(1,Math.round(baseVal(i)*m));}
function addCoins(n){G.coins+=n;G.st.earned+=n;}
// ---------- cast / fishing state machine ----------
let fs='idle',ft=0,hooked=null,Rl=null,bobX=0,bobY=0,castT=0,lastRes=null,bonusG=null,cmb=0;
function curWait(){const b=baitObj();let t=rnd(3,8)/(b?b.bs:.8);if(G.tut<3)t=rnd(1.2,2.4);if(G.wx==='fog'&&G.lh>=4)t*=.8;if(G.chal&&G.chal.m===5)t*=.4;if(G.chal&&G.chal.m===2)t*=1.4;if(isNight()&&G.lh>=1)t*=.9;if(G.wx==='rain')t*=.85;t/= (1+G.boat*.05);return t;}
function doCast(){if(fs!=='idle'||mode!=='fish')return;
if(G.contest&&G.contest.left<=0){endContest();return;}
const b=baitObj();if(G.bait>=0&&b)G.baits[G.bait]--;
G.st.casts++;G.st.seasons[season()]=1;if(G.contest)G.contest.left--;
fs='cast';ft=0;bobX=W*rnd(.45,.75);bobY=H*rnd(.58,.75);sfx('cast');FX.squash=.6;
if(Math.random()<.025&&G.tut>=3)silly();
if(G.tut===0)G.tut=1;}
function silly(){const e=pick([
()=>{toast('A seagull stole your sandwich! Squawk!');sfx('silly');floater('SQUAWK!',W*.7,H*.3,'#fff',30);},
()=>{toast('A frog in a tiny crown waves hello and leaves a coin.');addCoins(15);floater('+15',W*.5,H*.5,'#ffc83d');sfx('coin');},

()=>{toast('Cloud shaped like a fish spotted. Good omen.');}]);e();}
function updateFish(dt){
if(fs==='cast'){ft+=dt;if(ft>.55){fs='wait';ft=0;castT=curWait();sfx('splash');part(bobX,bobY,18,['#cfefff','#fff'],{up:200,g:700});}}
else if(fs==='wait'){ft+=dt;if(ft>=castT){hooked=rollCatch();fs='bite';ft=0;sfx('bite');shake(5);floater('!',bobX,bobY-40,'#ff5','40');part(bobX,bobY,10,'#fff',{up:200});}}
else if(fs==='bite'){ft+=dt;if(ft>DIFF[G.diff].win){fs='idle';cmb=0;G.streak=0;G.st.misses++;toast('It got away... try again!');}}
else if(fs==='reel'){stepReel(dt);}
else if(fs==='result'){}
}
function pressMain(){if(fs==='idle')doCast();else if(fs==='wait'){fs='idle';cmb=0;}else if(fs==='bite')hook();}
function hook(){if(fs!=='bite')return;sfx('click');if(hooked.k==='item'){fs='idle';gotItem(hooked.it);return;}
startReel(hooked.f);}
// ---------- reel ----------
function behSpeed(f){return{c:.5,d:.9,v:.8,j:.85,f:1.1}[f.beh];}
function startReel(f){const D=DIFF[G.diff],inst=makeInst(f);const sf=inst.cm/f.cm;let dif=.55+f.rar*.1+sf*.15;if(G.tut<3)dif*=.6;
let zh=D.zone*(1+G.rod*.025+rodUp()*.03);if(G.tut<3)zh+=.1;zh=clamp(zh,.2,.7);
let st=D.strain/(1+G.rod*.03+rodUp()*.03);if(G.wx==='storm'&&G.lh<3)st*=1.15;
Rl={f,inst,dif,y:.5,tgt:.5,tt:0,vy:0,z:.5,zv:0,zh,prog:.3,strain:0,t:0,tl:D.time,st,ph:0,jump:0,maxStrain:0,out:0,gain:D.gain/(1+f.rar*.12),loss:D.loss*dif,spd:D.spd*dif*(G.chal&&G.chal.m===0?.75:1)*(G.chal&&G.chal.m===5?1.15:1)};
fs='reel';ft=0;hold=false;sfx('splash');shake(8);slowmo(.25,.4);part(bobX,bobY,22,['#fff','#aef'],{up:250});}
let hold=false,reelTick=0;
function stepReel(dt){const R=Rl;R.t+=dt;R.tt-=dt;R.ph+=dt;
// fish
const sp=R.spd;
switch(R.f.beh){
case'c':if(R.tt<=0){R.tgt=clamp(R.y+rnd(-.3,.3),.08,.92);R.tt=rnd(1.2,2.6);}R.y+=(R.tgt-R.y)*Math.min(1,dt*1.5*sp);break;
case'd':if(R.tt<=0){R.tgt=rnd(.08,.92);R.tt=rnd(.9,1.8);}R.y+=clamp(R.tgt-R.y,-sp*1.3*dt,sp*1.3*dt);break;
case'v':if(R.tt<=0){R.tgt=Math.random()<.3?rnd(.5,.9):rnd(.05,.25);R.tt=rnd(1.2,2.4);}R.y+=clamp(R.tgt-R.y,-sp*.9*dt,sp*.9*dt);break;
case'j':if(R.jump>0){R.jump-=dt;R.y+=(.95-R.y)*Math.min(1,dt*9);if(R.jump<=0){R.tgt=rnd(.2,.5);}}else{if(R.tt<=0){if(Math.random()<.55){R.jump=.5;R.tt=rnd(2,3.5);}else{R.tgt=rnd(.1,.7);R.tt=rnd(1,2);}}R.y+=clamp(R.tgt-R.y,-sp*dt,sp*dt);}break;
case'f':if(R.tt<=0){R.tgt=rnd(.08,.92);R.tt=rnd(.6,1.3);}R.y+=clamp(R.tgt-R.y,-sp*1.1*dt,sp*1.1*dt);R.y+=Math.sin(R.ph*7)*.12*dt*sp;break;}
R.y=clamp(R.y,.04,.96);
// zone
const a=hold?3.4:-2.8;R.zv+=a*dt;R.zv*=Math.pow(.25,dt);R.zv=clamp(R.zv,-1.3,1.3);R.z+=R.zv*dt;const lo=R.zh/2,hi=1-R.zh/2;if(R.z<lo){R.z=lo;R.zv=Math.max(0,R.zv);}if(R.z>hi){R.z=hi;R.zv=Math.min(0,R.zv);}
const inn=Math.abs(R.y-R.z)<=R.zh/2+.015;
if(inn){R.prog+=R.gain*dt*(1+cmb*.02);R.strain=Math.max(0,R.strain-.35*dt);R.out=0;}else{R.prog-=R.loss*dt;R.strain+=.2*R.st*R.dif*dt*1.6;R.out+=dt;}
R.maxStrain=Math.max(R.maxStrain,R.strain);R.inn=inn;
reelTick-=dt;if(inn&&reelTick<=0){reelTick=.18;sfx('reel');}
if(R.prog>=1)finishCatch(R);else if(R.strain>=1||R.prog<=0&&R.t>3){loseFish('The line snapped! No worries, try again.');}else if(R.t>R.tl){loseFish('The fish wiggled free! Try again.');}
if(R.strain>.7&&Math.random()<.2)shake(2);}
function loseFish(m){fs='idle';G.streak=0;cmb=0;G.st.misses++;toast(m);sfx('snap');shake(10);part(bobX,bobY,10,'#fff',{up:100});if(G.tut<3)G.tut=Math.max(G.tut,2);Rl=null;}
function finishCatch(R){const f=R.f,i=R.inst;fs='result';cmb++;G.streak=cmb;G.st.bestStreak=Math.max(G.st.bestStreak,cmb);G.st.catches++;
if(R.maxStrain<.05)G.st.perfect++;
if(isNight())G.st.night++;if(G.wx==='storm')G.st.storm++;
const first=!G.log[f.id];let rec=false;const L=G.log[f.id]||(G.log[f.id]={n:0,cm:0,kg:0,loc:G.loc,day:G.day,gold:0});L.n++;
if(i.cm>L.cm){if(!first)rec=true;L.cm=i.cm;L.kg=i.kg;if(rec)G.st.records++;}
if(i.g){G.st.golden++;L.gold++;secret('gold');unlockHat(10);}
if(f.rar===4)G.st.legs++;
lastRes={f,i,first,rec,val:sellVal(i)};
if(G.contest&&G.contest.loc===G.loc){G.contest.score+=i.kg;}
// quests
G.quests.forEach(q=>{if(q.type==='catch'&&q.loc===G.loc)q.prog++;if(q.type==='tag'&&q.tag===f.tag)q.prog++;});
if(G.chal){G.chal.left--;if(G.chal.left<=0){const rw=200+60*G.st.challenges*0+100;G.chal.done=true;}}
// juice
const big=f.rar>=3||first&&f.rar>=2||i.g;
sfx(big?'big':'catch',Math.min(10,cmb));
shake(big?16:6);part(W*.5,H*.5,big?70:30,i.g?['#ffc83d','#fff','#ffe']:[RARC[f.rar],'#fff'],{up:300});
if(big)slowmo(.9,.25);
floater(cmb>1?'x'+cmb+' streak!':'Nice!',W*.5,H*.4,'#ffe',cmb>1?32:26);
if(first)floater('NEW!',W*.5,H*.3,'#6fd08c',36);
if(i.g){toast('GOLDEN FISH! Worth 4x!','#ffc83d');sfx('gold');}
if(Math.random()<.02){const b=Math.round(20+Math.random()*60);addCoins(b);toast('Lucky moment! Bonus +'+b+' coins!','#ffc83d');floater('+'+b,W*.5,H*.2,'#ffc83d',32);sfx('gold');}
if(f.name==='Common Carp'&&Math.random()<.1)secret('pizza');
if(G.st.catches>=25)unlockHat(5);if(G.st.catches>=100)unlockHat(11);if(G.st.night>=10)unlockHat(12);
if(G.tut<3){G.tut=Math.min(3,G.tut+1);if(G.tut===3){G.tutDone=true;addCoins(50);G.baits[0]=(G.baits[0]||0)+10;toast('First reward! +50 coins and 10 worms!','#6fd08c');}}
if(f.id===LL_ID){G.ended=true;setTimeout(showEnding,1500);}
checkAch();Rl=null;
if(G.chal&&G.chal.done){finishChal();}
save();}
function gotItem(it){G.items[it.id]=(G.items[it.id]||0)+1;if(it.kind==='j')G.st.junk++;else G.st.treasures++;lastRes={it,first:G.items[it.id]===1};fs='result';
sfx(it.kind==='t'?'big':'silly');shake(it.kind==='t'?10:3);part(W*.5,H*.5,it.kind==='t'?40:12,it.kind==='t'?['#ffc83d','#fff']:'#8a8',{up:260});
if(it.name==='Old Boot')secret('boot');if(it.name==='Lost Sock')secret('sock');if(it.name==='Brass Spyglass')secret('glass');
if(it.kind==='t'&&Math.random()<.5){setTimeout(()=>{if(mode==='fish')startBonus();},100);}
checkAch();save();}

function resultAct(a){if(!lastRes)return;const L=lastRes;
if(L.it){if(a==='sell'){const v=Math.round(L.it.val*(isFest()?1.2:1));addCoins(v);G.items[L.it.id]--;floater('+'+v,W*.5,H*.5,'#ffc83d',30);sfx('coin');}closeResult();return;}
const i=L.i;

else if(a==='sell'){const v=sellVal(i);addCoins(v);G.st.sold++;floater('+'+v,W*.5,H*.5,'#ffc83d',34);part(W*.5,H*.5,14,'#ffc83d',{up:200});sfx('coin',cmb);}
else if(a==='free'){const f=FISH[i.id];const v=Math.round(baseVal(i)*.5+5);addCoins(v);G.st.released++;floater('Free! +'+v,W*.5,H*.5,'#6fd08c',30);part(W*.5,H*.5,25,['#6fd08c','#fff'],{up:260});sfx('big');
if(Math.random()<.25){const b=Math.floor(Math.random()*4);G.baits[b]=(G.baits[b]||0)+3;toast('The fish left you a gift: 3 '+BAITS[b].name+'!');}
if(G.st.released>=25&&!G.skins.includes(5)){G.skins.push(5);toast('Unlocked rod skin: Bubblegum!');}}
if(G.contest&&G.contest.loc===G.loc&&G.contest.left<=0){closeResult();endContest();return;}
closeResult();checkAch();save();}
function closeResult(){lastRes=null;fs='idle';if(G.tut===3&&!G.tutDone2){G.tutDone2=true;}}
function stallTick(){if(!G.stall.length)return;const pct=G.stallPct/100;const p=clamp(.28*(1+(1-pct)*2.2),.02,.6);const keep=[];let tot=0;for(const s of G.stall){if(Math.random()<p){const v=Math.round(sellVal(s)*pct*1.15);tot+=v;G.st.sold++;}else keep.push(s);}if(tot){G.stall=keep;addCoins(tot);toast('Stall sold fish for '+tot+' coins!');sfx('coin');}}
// ---------- quests ----------
function questFor(v){const seed=G.day*37+v.id*11;const r=hrand(seed);const unl=LOCS.filter(l=>G.maps[l.id]);const loc=unl[Math.floor(hrand(seed+1)*unl.length)];const rm=Math.max(1,Math.min(...[3,Object.keys(G.maps).length]));
if(r<.4){const cand=FISH.filter(f=>f.rar<=1+Math.floor(unl.length/3)&&f.rar<4&&f.locs.some(l=>G.maps[l]));const f=cand[Math.floor(hrand(seed+2)*cand.length)];const n=1+Math.floor(hrand(seed+3)*2);return{vid:v.id,type:'bring',fid:f.id,n,prog:0,reward:Math.round(n*BASEP[f.rar]*2.5+30),text:'Bring me '+n+' '+f.name+(n>1?'s':'')+' please!'};}
if(r<.75){const n=3+Math.floor(hrand(seed+4)*4);return{vid:v.id,type:'catch',loc:loc.id,n,prog:0,reward:n*25+loc.i*30,text:'Catch '+n+' fish at '+loc.name+'.'};}
const tg={p:'predator',s:'small schooling',b:'bottom-dwelling',c:'shellfish',x:'strange'};const t=['p','s','b'][Math.floor(hrand(seed+5)*3)];const n=2+Math.floor(hrand(seed+6)*3);return{vid:v.id,type:'tag',tag:t,n,prog:0,reward:n*35+20,text:'Catch '+n+' '+tg[t]+' fish.'};}
function questDone(q){if(q.type==='bring')return(G.cooler.filter(i=>i.id===q.fid).length)>=q.n;return q.prog>=q.n;}
function completeQuest(idx){const q=G.quests[idx];if(!q||!questDone(q))return;if(q.type==='bring'){let c=q.n;G.cooler=G.cooler.filter(i=>{if(i.id===q.fid&&c>0){c--;return false;}return true;});}
addCoins(q.reward);G.friends[q.vid]=Math.min(10,(G.friends[q.vid]||0)+1);G.st.quests++;G.quests.splice(idx,1);G.qd=(G.qd||{});G.qd[q.vid]=G.day;toast('Quest complete! +'+q.reward+' coins and a heart.','#ff8ad8');sfx('big');part(W/2,H/2,40,['#ff8ad8','#fff','#ffc83d'],{up:200});checkAch();save();}
function tipFor(v){const hearts=G.friends[v.id]||0;const un=FISH.filter(f=>!G.log[f.id]&&f.rar<4&&f.locs.some(l=>G.maps[l]));if(!un.length)return pick(v.lines);const f=un[Math.floor(hrand(G.day*9+v.id)*un.length)];const ss=f.seas==='*'?'all year':f.seas.split('').map(c=>SEAS[SL.indexOf(c)]).join(' and ');
let s='I hear '+f.name+' bites ';s+=f.time==='d'?'by day':f.time==='n'?'at night':'any time';if(hearts>=3)s+=', in '+ss;if(hearts>=6)s+=', around '+f.locs.map(l=>LOCI[l].name).join(' or ');return s+'.';}
// ---------- contest ----------
function startContest(){if(!isContestDay()||G.cdone===G.day||isNight()){return false;}const l=LOCS.filter(x=>G.maps[x.id]&&(!x.boat||G.boat>=x.boat));const loc=l[Math.floor(hrand(G.day)*l.length)];const lv=Object.keys(G.maps).length;G.contest={day:G.day,loc:loc.id,left:12,score:0,rivals:[['Marlow',.6],['Pip',.35],['Nell',.45]].map(a=>[a[0],+(a[1]*(2+lv*1.5)*(.7+hrand(G.day*3+a[0].length)*.7)).toFixed(1)])};G.st.contests++;G.loc=loc.id;checkAch();return true;}
function endContest(){const c=G.contest;if(!c)return;G.contest=null;G.cdone=G.day;const all=[['You',c.score]].concat(c.rivals).sort((a,b)=>b[1]-a[1]);const rank=all.findIndex(a=>a[0]==='You')+1;const pz=[300,150,60,20][rank-1]*(1+Object.keys(G.maps).length*.4);addCoins(Math.round(pz));if(rank===1){G.st.wins++;sfx('big');shake(14);part(W/2,H/2,80,['#ffc83d','#fff','#ff8ad8'],{up:300});}
contRes={rank,all,prize:Math.round(pz),score:c.score};openPanel('contres');checkAch();save();}

function finishChal(){const m=G.chal.m;G.chal=null;G.st.challenges++;const r=250+Object.keys(G.maps).length*60;addCoins(r);toast('Challenge complete! +'+r+' coins!','#ffc83d');sfx('big');part(W/2,H/2,80,['#ffc83d','#fff','#ff8ad8'],{up:300});unlockTheme(2);}

const lerp=(a,b,t)=>a+(b-a)*t;
function hexc(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function mix(a,b,t){const x=hexc(a),y=hexc(b);return`rgb(${Math.round(lerp(x[0],y[0],t))},${Math.round(lerp(x[1],y[1],t))},${Math.round(lerp(x[2],y[2],t))})`;}
const SKY=[[0,'#0a1030','#1a2a5c'],[5,'#1c2a60','#ff9a6b'],[7,'#6fb8f0','#ffe0b0'],[12,'#4aa8ee','#bfe6fa'],[17,'#6fb0e8','#ffe0b0'],[19,'#e0705a','#ffc080'],[21,'#101a48','#2a3a78'],[24,'#0a1030','#1a2a5c']];

function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath();}
function fishSpriteC(c,x,y,len,f,dir,t,gold,sil){c.save();c.translate(x,y);c.scale(dir,1);const h=(f.id*47+13)%360;let col=sil?'#0b1d3a':`hsl(${h},62%,${f.rar>=4?62:55}%)`,col2=sil?'#0b1d3a':`hsl(${(h+35)%360},55%,38%)`;if(gold&&!sil){col='#ffd34d';col2='#c48a00';}
if(f.rar>=4&&!sil){c.shadowColor='#ffd34d';c.shadowBlur=18;}
const w=Math.sin(t*6+f.id)*.15;
if(f.tag==='c'){const s=len/2;c.fillStyle=col;c.beginPath();c.ellipse(0,0,s*.7,s*.5,0,0,7);c.fill();c.strokeStyle=col2;c.lineWidth=Math.max(1.5,s*.12);for(let i=-1;i<=1;i+=1){c.beginPath();c.moveTo(i*s*.3,s*.4);c.lineTo(i*s*.5,s*.9);c.moveTo(i*s*.3,-s*.4);c.lineTo(i*s*.5,-s*.9);c.stroke();}c.fillStyle=col2;c.beginPath();c.arc(s*.8,-s*.5,s*.3,0,7);c.arc(s*.8,s*.5,s*.3,0,7);c.fill();}
else if(f.tag==='x'){const s=len/2,k=f.id%3;if(k===0){c.fillStyle=col;c.beginPath();c.arc(0,0,s*.7,Math.PI,0);c.fill();c.strokeStyle=col2;c.lineWidth=Math.max(1.5,s*.1);for(let i=-3;i<=3;i++){c.beginPath();c.moveTo(i*s*.2,0);c.quadraticCurveTo(i*s*.2+Math.sin(t*4+i)*s*.2,s*.5,i*s*.2,s*.9);c.stroke();}}else if(k===1){c.fillStyle=col;c.beginPath();c.moveTo(s,0);c.quadraticCurveTo(0,-s*.9,-s*.8,0);c.quadraticCurveTo(0,s*.9,s,0);c.fill();c.strokeStyle=col2;c.lineWidth=2;c.beginPath();c.moveTo(-s*.8,0);c.lineTo(-s*1.3,Math.sin(t*5)*s*.3);c.stroke();}else{c.fillStyle=col;c.beginPath();c.ellipse(0,0,s*.8,s*.5,0,0,7);c.fill();c.fillStyle=col2;c.beginPath();c.ellipse(0,-s*.05,s*.55,s*.32,0,0,7);c.fill();c.fillStyle=col;c.beginPath();c.arc(s*.85,0,s*.22,0,7);c.fill();}}
else{const s=len/2,ry=s*(f.tag==='b'?.45:f.tag==='p'?.3:.4);c.fillStyle=col2;c.beginPath();c.moveTo(-s*.8,0);c.lineTo(-s*1.2,-ry*1.1+w*s*.6);c.lineTo(-s*1.2,ry*1.1+w*s*.6);c.fill();c.beginPath();c.moveTo(-s*.2,-ry*.8);c.lineTo(s*.1,-ry*1.5);c.lineTo(s*.4,-ry*.8);c.fill();c.fillStyle=col;c.beginPath();c.ellipse(0,0,s,ry,0,0,7);c.fill();if(!sil){c.fillStyle='rgba(255,255,255,.35)';c.beginPath();c.ellipse(0,ry*.35,s*.8,ry*.4,0,0,7);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(s*.6,-ry*.2,ry*.28,0,7);c.fill();c.fillStyle='#111';c.beginPath();c.arc(s*.64,-ry*.2,ry*.14,0,7);c.fill();}}
c.restore();c.shadowBlur=0;}
function fishSprite(c,x,y,len,f,dir,t,gold,sil){if(REAL&&c===cx)return fishSpriteReal(c,x,y,len,f,dir,t,gold,sil);return fishSpriteC(c,x,y,len,f,dir,t,gold,sil);}
function drawHat(c,x,y,hid,s){c.save();c.translate(x,y);c.scale(s,s);switch(hid){case 1:c.fillStyle='#f6d37a';c.beginPath();c.ellipse(0,0,16,4,0,0,7);c.fill();c.fillRect(-8,-8,16,8);break;case 2:c.fillStyle='#222';c.beginPath();c.moveTo(-14,0);c.lineTo(0,-12);c.lineTo(14,0);c.fill();c.fillStyle='#fff';c.fillRect(-2,-8,4,3);break;case 3:c.fillStyle='#5b3a9e';c.beginPath();c.moveTo(-12,0);c.lineTo(2,-22);c.lineTo(12,0);c.fill();c.fillStyle='#ffd34d';c.fillRect(-12,-3,24,3);break;case 4:c.fillStyle='#ffc83d';c.beginPath();c.moveTo(-10,0);c.lineTo(-10,-10);c.lineTo(-5,-5);c.lineTo(0,-12);c.lineTo(5,-5);c.lineTo(10,-10);c.lineTo(10,0);c.fill();break;case 5:c.fillStyle='#fff';c.fillRect(-9,-8,18,8);c.beginPath();c.arc(0,-10,9,0,7);c.fill();break;case 6:c.fillStyle='#ffe14d';c.beginPath();c.ellipse(0,-5,8,6,0,0,7);c.fill();c.fillStyle='#f80';c.fillRect(5,-6,5,3);break;case 7:c.fillStyle='#555';c.beginPath();c.moveTo(-9,0);c.lineTo(-9,-11);c.lineTo(-3,-5);c.lineTo(3,-5);c.lineTo(9,-11);c.lineTo(9,0);c.fill();break;case 8:c.fillStyle='#ff6bb5';c.beginPath();c.moveTo(-8,0);c.lineTo(0,-20);c.lineTo(8,0);c.fill();c.fillStyle='#ffe14d';c.beginPath();c.arc(0,-20,3,0,7);c.fill();break;case 9:c.fillStyle='#fff';c.fillRect(-10,-6,20,6);c.fillStyle='#235';c.fillRect(-10,-2,20,2);break;case 10:c.strokeStyle='#ffe14d';c.lineWidth=3;c.beginPath();c.ellipse(0,-10,10,3,0,0,7);c.stroke();break;case 11:c.fillStyle='#4aa9d8';c.beginPath();c.ellipse(0,-5,12,6,0,0,7);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(6,-6,2,0,7);c.fill();break;case 12:c.fillStyle='#3a3a8a';c.beginPath();c.arc(0,0,10,Math.PI,0);c.fill();break;case 13:c.fillStyle='#111';c.fillRect(-9,-14,18,14);c.fillRect(-14,-1,28,3);break;}c.restore();}

case'p':cx.fillStyle=sh('#5fa05a');cx.beginPath();cx.moveTo(0,hy);for(let x=0;x<=W;x+=20)cx.lineTo(x,hy-30-Math.sin(x*.01)*18);cx.lineTo(W,hy);cx.fill();for(let i=0;i<6;i++){tree(W*(.08+i*.17),hy-20,sh('#2e7d3a'));}break;

case'h':cx.fillStyle=sh('#b8a07a');cx.fillRect(0,hy-6,W,10);for(let i=0;i<4;i++){const x=W*(.5+i*.13);cx.fillStyle=sh(['#c44','#48c','#ca4','#4a8'][i]);cx.fillRect(x,hy-60,50,54);cx.fillStyle=sh('#654');cx.beginPath();cx.moveTo(x-5,hy-60);cx.lineTo(x+25,hy-85);cx.lineTo(x+55,hy-60);cx.fill();}cx.fillStyle=sh('#fff');cx.fillRect(W*.4,hy-40,6,34);cx.beginPath();cx.moveTo(W*.4+6,hy-40);cx.lineTo(W*.4+40,hy-12);cx.lineTo(W*.4+6,hy-12);cx.fill();break;

case'i':cx.fillStyle=sh('#e8f2fa');cx.beginPath();cx.moveTo(0,hy);for(let x=0;x<=W;x+=30)cx.lineTo(x,hy-50-Math.abs(Math.sin(x*.01))*80);cx.lineTo(W,hy);cx.fill();break;

function waterGrad(y0,loc){const L=LOCI[loc],dl=Math.max(.35,daylight());const g=cx.createLinearGradient(0,y0,0,H);g.addColorStop(0,mix(L.w1,'#0a1030',(1-dl)*.6));g.addColorStop(1,mix(L.w2,'#050a20',(1-dl)*.5));cx.fillStyle=g;cx.fillRect(0,y0,W,H-y0);
