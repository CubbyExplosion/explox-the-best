<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0e3550;--ac:#ffc83d;--pn:#16445f;--tx:#f2fbff}
body[data-theme="1"]{--bg:#4a2040;--ac:#ff9a5a;--pn:#6a3050}body[data-theme="2"]{--bg:#0e4a3a;--ac:#9affc0;--pn:#1a6a50}body[data-theme="3"]{--bg:#0a0a24;--ac:#b0a0ff;--pn:#1a1a48}body[data-theme="4"]{--bg:#5a1a30;--ac:#ff8ab0;--pn:#7a2a48}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,Segoe UI,Arial,sans-serif;color:var(--tx);user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hide{display:none!important}
#hud{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;padding:8px 10px;background:linear-gradient(#0008,#0000);flex-wrap:wrap;pointer-events:none}
#hud>*{pointer-events:auto}
#coins{background:var(--pn);padding:6px 12px;border-radius:14px;font-weight:700;color:var(--ac);border:2px solid var(--ac)}
#coins:before{content:"\25CF  ";}
#clock{background:#0007;padding:6px 10px;border-radius:12px;font-size:14px}
#goal{background:#0009;padding:6px 10px;border-radius:12px;font-size:14px;border:1px solid var(--ac);max-width:min(520px,95vw)}
#ttl{font-size:12px;opacity:.85}
.b{background:var(--pn);color:var(--tx);border:2px solid #fff3;border-radius:12px;padding:8px 12px;font:600 14px system-ui;cursor:pointer;margin:2px;transition:transform .12s,background .12s}
.b:hover:not(:disabled){transform:translateY(-2px) scale(1.04);background:#fff2;border-color:var(--ac)}
.b:active:not(:disabled){transform:scale(.94)}.b:disabled{opacity:.4;cursor:default}
.b.on{background:var(--ac);color:#321}.b.warn{background:#a33}
.bar{position:fixed;left:0;right:0;bottom:0;padding:8px;display:flex;flex-wrap:wrap;justify-content:center;gap:2px;background:linear-gradient(#0000,#000a)}
#panel{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:20;animation:fade .2s}
#pbox{background:var(--pn);width:min(960px,96vw);max-height:92vh;border-radius:18px;border:3px solid var(--ac);display:flex;flex-direction:column;animation:pop .25s}
#phead{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-size:20px;font-weight:800;border-bottom:2px solid #fff2}
#pbody{padding:12px 16px;overflow:auto}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}@keyframes fade{from{opacity:0}to{opacity:1}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}.grid.small{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.card{background:#0003;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px;border:2px solid transparent}.card.sel{border-color:var(--ac)}.card.unk{opacity:.5}.card.got{border-color:#6fd08c}.card.tiny{padding:6px;font-size:13px;cursor:pointer}
.card small,.row small{opacity:.8;font-size:12px}.tip{color:#aef}.q{background:#0004;padding:6px;border-radius:8px;font-size:13px}
.rar{padding:1px 6px;border-radius:8px;color:#123;font-size:11px;font-weight:700}
.row{display:flex;gap:6px;align-items:center;padding:4px 0;border-bottom:1px solid #fff1}.row>span:first-child{flex:1}.up{color:#6fd08c}.dn{color:#ff8a8a}
.hearts{color:#ff6b9a;letter-spacing:1px;font-size:12px}.tabs{margin-bottom:8px}
li.done{color:#6fd08c}
#toast{position:fixed;top:92px;left:50%;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.tst{background:#000c;border:2px solid var(--ac);padding:8px 14px;border-radius:12px;font-weight:600;animation:tin .35s;transition:opacity .5s;max-width:92vw;text-align:center}.tst.out{opacity:0}
@keyframes tin{from{transform:translateY(-20px) scale(.8);opacity:0}to{transform:none;opacity:1}}
#resbox{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--pn);border:3px solid var(--ac);border-radius:18px;padding:14px 20px;text-align:center;z-index:15;max-width:min(440px,94vw);animation:pop .3s}
#resbox h2{margin:4px 0}.big{font-size:22px;font-weight:800;color:var(--ac)}.new{color:#6fd08c;margin:0 4px}.fact{font-size:13px;opacity:.9}.rbtns .b{min-width:100px}
#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:10;text-align:center}
#title h1{font-size:clamp(40px,9vw,88px);margin:0;color:#fff;text-shadow:0 4px 0 #0a3a5a,0 0 30px #7cf;animation:bob 2.5s ease-in-out infinite}
#title .sip{letter-spacing:4px;font-weight:700;color:var(--ac);animation:bob 3s ease-in-out infinite .5s}
#title .b{font-size:20px;padding:12px 30px;animation:slide .6s backwards}
@keyframes bob{50%{transform:translateY(-10px) rotate(-1deg)}}@keyframes slide{from{transform:translateY(40px);opacity:0}}
.end{font-size:17px;line-height:1.5}
@media(max-width:640px){#hud{font-size:12px}.b{padding:7px 9px;font-size:13px}}
</style></head><body data-theme="0" data-mode="title">

function timeStep(dt){G.hour+=dt*24/340;const h0=Math.floor(G.hour);if(G.hour>=24)newDay();if(Math.floor(G.hour)!==G._lh){G._lh=Math.floor(G.hour);stallTick();if(G.hour>=9&&G.hour<9.2&&G.wx==='sun'&&G.day%5==0&&Math.random()<.5)secret('rainbow');}}

function legendOK(f,o){if(o&&o.test)return true;if(f.id===LL_ID)return G.lh>=5&&LEGS.every(i=>i===LL_ID||G.log[i]);const l=o.loc,all=FISH.filter(x=>x.locs.includes(l)&&x.rar<4);return all.filter(x=>G.log[x.id]).length>=Math.ceil(all.length*.6);}
function pool(loc,o){const night=isNight(o.hour),out=[];for(const f of FISH){if(!f.locs.includes(loc))continue;if(f.time==='d'&&night)continue;if(f.time==='n'&&!night)continue;if(f.seas!=='*'&&!f.seas.includes(SL[o.seas]))continue;o.loc=loc;if(f.rar===4&&!legendOK(f,o))continue;out.push(f);}return out;}
const rod=()=>RODS[G.rod],rodUp=()=>G.rods[G.rod]||0;
function baitObj(){return G.bait>=0&&(G.baits[G.bait]||0)>0?BAITS[G.bait]:null;}
function luck(){const b=baitObj();let L=G.rod*.05+rodUp()*.04+(b?b.rb:0)+G.boat*.04;if(isNight()&&G.lh>=2)L+=.12;if(G.wx==='storm')L+=.15;if(isFest())L+=.1;if(G.chal&&G.chal.m===2)L+=.4;return L;}
function weights(list,o){const b=baitObj(),L=luck(),w=[];for(const f of list){let x=f.id===LL_ID?30:[100,42,16,5,5][f.rar];if(f.rar>0)x*=1+L*f.rar;if(b){if(b.tg[f.tag])x*=b.tg[f.tag];if(b.tg.n&&isNight())x*=1.2;}
const wt=o.wx==='rain'||o.wx==='storm'||o.wx==='snow';if(f.wx==='R')x*=wt?2.2:.6;else if(f.wx==='C')x*=wt?.5:1.6;
if(G&&G.chal&&G.chal.m===1&&f.cm>40)x*=.2;
w.push(x);}return w;}
function rollCatch(){const night=isNight();
if(Math.random()<.1){const junkP=.55;const it=ITEMS.filter(i=>junkP>Math.random()?i.kind==='j':i.kind==='t');const w=it.map(i=>i.kind==='j'?1:60/Math.sqrt(i.val));const r=rndw(it,w);return{k:'item',it:r};}
const list=pool(G.loc,{hour:G.hour,seas:season(),wx:G.wx});if(!list.length)return{k:'item',it:ITEMS[0]};
let w=weights(list,{wx:G.wx});
if(G.tut<3){const e=list.filter(f=>f.rar===0&&f.cm<=40);if(e.length){return{k:'fish',f:pick(e)};}}
return{k:'fish',f:rndw(list,w)};}
function rndw(l,w){let s=0;w.forEach(x=>s+=x);let r=Math.random()*s;for(let i=0;i<l.length;i++){r-=w[i];if(r<=0)return l[i];}return l[l.length-1];}
function makeInst(f){let q=Math.pow(Math.random(),1.5);q=Math.min(1,q+G.rod*.012+rodUp()*.02);if(G.chal&&G.chal.m===1)q*=.4;const cm=Math.round(f.cm*(.3+.7*q)*10)/10;const kg=Math.max(.005,+(f.kg*Math.pow(cm/f.cm,3)).toPrecision(3));const gold=Math.random()<.03+(G.hat===10?0:0);return{id:f.id,cm,kg,g:gold?1:0};}
const wt=kg=>kg<1?Math.round(kg*1000)+' g':(kg>=100?Math.round(kg):+kg.toFixed(1))+' kg';
const cmS=cm=>cm>=100?(cm/100).toFixed(2)+' m':cm+' cm';
// ---------- prices ----------
function mmult(id,day){day=day||G.day;let m=.75+.6*hrand(id*131+day*7919);return m;}
function baseVal(i){const f=FISH[i.id];const sf=i.cm/f.cm;let v=BASEP[f.rar]*(.6+sf)*(1+Math.log10(1+f.kg)*.15);if(i.g)v*=4;if(G.chal){if(G.chal.m===1)v*=2;if(G.chal.m===3)v*=1.5;if(G.chal.m===4)v*=1.3;}return Math.max(1,Math.round(v));}
function sellVal(i){let m=mmult(i.id)*(isFest()?1.2:1);const hm=G.friends[2]||0;m*=1+hm*.01;return Math.max(1,Math.round(baseVal(i)*m));}
function addCoins(n){G.coins+=n;G.st.earned+=n;}
// ---------- cast / fishing state machine ----------
let fs='idle',ft=0,hooked=null,Rl=null,bobX=0,bobY=0,castT=0,lastRes=null,bonusG=null,cmb=0;
function curWait(){const b=baitObj();let t=rnd(3,8)/(b?b.bs:.8);if(G.tut<3)t=rnd(1.2,2.4);if(G.wx==='fog'&&G.lh>=4)t*=.8;if(G.chal&&G.chal.m===5)t*=.4;if(G.chal&&G.chal.m===2)t*=1.4;if(isNight()&&G.lh>=1)t*=.9;if(G.wx==='rain')t*=.85;t/= (1+G.boat*.05);return t;}
function doCast(){if(fs!=='idle'||mode!=='fish')return;
if(G.contest&&G.contest.left<=0){endContest();return;}
const b=baitObj();if(G.bait>=0&&b)G.baits[G.bait]--;
G.st.casts++;G.st.seasons[season()]=1;if(G.contest)G.contest.left--;
fs='cast';ft=0;bobX=W*rnd(.45,.75);bobY=H*rnd(.58,.75);sfx('cast');FX.squash=.6;
if(Math.random()<.025&&G.tut>=3)silly();
if(G.tut===0)G.tut=1;}
function silly(){const e=pick([
()=>{toast('A seagull stole your sandwich! Squawk!');sfx('silly');floater('SQUAWK!',W*.7,H*.3,'#fff',30);},
()=>{toast('A frog in a tiny crown waves hello and leaves a coin.');addCoins(15);floater('+15',W*.5,H*.5,'#ffc83d');sfx('coin');},

()=>{toast('Cloud shaped like a fish spotted. Good omen.');}]);e();}
function updateFish(dt){
if(fs==='cast'){ft+=dt;if(ft>.55){fs='wait';ft=0;castT=curWait();sfx('splash');part(bobX,bobY,18,['#cfefff','#fff'],{up:200,g:700});}}
else if(fs==='wait'){ft+=dt;if(ft>=castT){hooked=rollCatch();fs='bite';ft=0;sfx('bite');shake(5);floater('!',bobX,bobY-40,'#ff5','40');part(bobX,bobY,10,'#fff',{up:200});}}
else if(fs==='bite'){ft+=dt;if(ft>DIFF[G.diff].win){fs='idle';cmb=0;G.streak=0;G.st.misses++;toast('It got away... try again!');}}
else if(fs==='reel'){stepReel(dt);}
else if(fs==='result'){}
}
function pressMain(){if(fs==='idle')doCast();else if(fs==='wait'){fs='idle';cmb=0;}else if(fs==='bite')hook();}
function hook(){if(fs!=='bite')return;sfx('click');if(hooked.k==='item'){fs='idle';gotItem(hooked.it);return;}
startReel(hooked.f);}
// ---------- reel ----------
function behSpeed(f){return{c:.5,d:.9,v:.8,j:.85,f:1.1}[f.beh];}
function startReel(f){const D=DIFF[G.diff],inst=makeInst(f);const sf=inst.cm/f.cm;let dif=.55+f.rar*.1+sf*.15;if(G.tut<3)dif*=.6;
let zh=D.zone*(1+G.rod*.025+rodUp()*.03);if(G.tut<3)zh+=.1;zh=clamp(zh,.2,.7);
let st=D.strain/(1+G.rod*.03+rodUp()*.03);if(G.wx==='storm'&&G.lh<3)st*=1.15;
Rl={f,inst,dif,y:.5,tgt:.5,tt:0,vy:0,z:.5,zv:0,zh,prog:.3,strain:0,t:0,tl:D.time,st,ph:0,jump:0,maxStrain:0,out:0,gain:D.gain/(1+f.rar*.12),loss:D.loss*dif,spd:D.spd*dif*(G.chal&&G.chal.m===0?.75:1)*(G.chal&&G.chal.m===5?1.15:1)};
fs='reel';ft=0;hold=false;sfx('splash');shake(8);slowmo(.25,.4);part(bobX,bobY,22,['#fff','#aef'],{up:250});}
let hold=false,reelTick=0;
function stepReel(dt){const R=Rl;R.t+=dt;R.tt-=dt;R.ph+=dt;
// fish
const sp=R.spd;
switch(R.f.beh){
case'c':if(R.tt<=0){R.tgt=clamp(R.y+rnd(-.3,.3),.08,.92);R.tt=rnd(1.2,2.6);}R.y+=(R.tgt-R.y)*Math.min(1,dt*1.5*sp);break;
case'd':if(R.tt<=0){R.tgt=rnd(.08,.92);R.tt=rnd(.9,1.8);}R.y+=clamp(R.tgt-R.y,-sp*1.3*dt,sp*1.3*dt);break;
case'v':if(R.tt<=0){R.tgt=Math.random()<.3?rnd(.5,.9):rnd(.05,.25);R.tt=rnd(1.2,2.4);}R.y+=clamp(R.tgt-R.y,-sp*.9*dt,sp*.9*dt);break;
case'j':if(R.jump>0){R.jump-=dt;R.y+=(.95-R.y)*Math.min(1,dt*9);if(R.jump<=0){R.tgt=rnd(.2,.5);}}else{if(R.tt<=0){if(Math.random()<.55){R.jump=.5;R.tt=rnd(2,3.5);}else{R.tgt=rnd(.1,.7);R.tt=rnd(1,2);}}R.y+=clamp(R.tgt-R.y,-sp*dt,sp*dt);}break;
case'f':if(R.tt<=0){R.tgt=rnd(.08,.92);R.tt=rnd(.6,1.3);}R.y+=clamp(R.tgt-R.y,-sp*1.1*dt,sp*1.1*dt);R.y+=Math.sin(R.ph*7)*.12*dt*sp;break;}
R.y=clamp(R.y,.04,.96);
// zone
const a=hold?3.4:-2.8;R.zv+=a*dt;R.zv*=Math.pow(.25,dt);R.zv=clamp(R.zv,-1.3,1.3);R.z+=R.zv*dt;const lo=R.zh/2,hi=1-R.zh/2;if(R.z<lo){R.z=lo;R.zv=Math.max(0,R.zv);}if(R.z>hi){R.z=hi;R.zv=Math.min(0,R.zv);}
const inn=Math.abs(R.y-R.z)<=R.zh/2+.015;
if(inn){R.prog+=R.gain*dt*(1+cmb*.02);R.strain=Math.max(0,R.strain-.35*dt);R.out=0;}else{R.prog-=R.loss*dt;R.strain+=.2*R.st*R.dif*dt*1.6;R.out+=dt;}
R.maxStrain=Math.max(R.maxStrain,R.strain);R.inn=inn;
reelTick-=dt;if(inn&&reelTick<=0){reelTick=.18;sfx('reel');}
if(R.prog>=1)finishCatch(R);else if(R.strain>=1||R.prog<=0&&R.t>3){loseFish('The line snapped! No worries, try again.');}else if(R.t>R.tl){loseFish('The fish wiggled free! Try again.');}
if(R.strain>.7&&Math.random()<.2)shake(2);}
function loseFish(m){fs='idle';G.streak=0;cmb=0;G.st.misses++;toast(m);sfx('snap');shake(10);part(bobX,bobY,10,'#fff',{up:100});if(G.tut<3)G.tut=Math.max(G.tut,2);Rl=null;}
function finishCatch(R){const f=R.f,i=R.inst;fs='result';cmb++;G.streak=cmb;G.st.bestStreak=Math.max(G.st.bestStreak,cmb);G.st.catches++;
if(R.maxStrain<.05)G.st.perfect++;
if(isNight())G.st.night++;if(G.wx==='storm')G.st.storm++;
const first=!G.log[f.id];let rec=false;const L=G.log[f.id]||(G.log[f.id]={n:0,cm:0,kg:0,loc:G.loc,day:G.day,gold:0});L.n++;
if(i.cm>L.cm){if(!first)rec=true;L.cm=i.cm;L.kg=i.kg;if(rec)G.st.records++;}
if(i.g){G.st.golden++;L.gold++;secret('gold');unlockHat(10);}
if(f.rar===4)G.st.legs++;
lastRes={f,i,first,rec,val:sellVal(i)};
if(G.contest&&G.contest.loc===G.loc){G.contest.score+=i.kg;}
// quests
G.quests.forEach(q=>{if(q.type==='catch'&&q.loc===G.loc)q.prog++;if(q.type==='tag'&&q.tag===f.tag)q.prog++;});
if(G.chal){G.chal.left--;if(G.chal.left<=0){const rw=200+60*G.st.challenges*0+100;G.chal.done=true;}}
// juice
const big=f.rar>=3||first&&f.rar>=2||i.g;
sfx(big?'big':'catch',Math.min(10,cmb));
shake(big?16:6);part(W*.5,H*.5,big?70:30,i.g?['#ffc83d','#fff','#ffe']:[RARC[f.rar],'#fff'],{up:300});
if(big)slowmo(.9,.25);
floater(cmb>1?'x'+cmb+' streak!':'Nice!',W*.5,H*.4,'#ffe',cmb>1?32:26);
if(first)floater('NEW!',W*.5,H*.3,'#6fd08c',36);
if(i.g){toast('GOLDEN FISH! Worth 4x!','#ffc83d');sfx('gold');}
if(Math.random()<.02){const b=Math.round(20+Math.random()*60);addCoins(b);toast('Lucky moment! Bonus +'+b+' coins!','#ffc83d');floater('+'+b,W*.5,H*.2,'#ffc83d',32);sfx('gold');}
if(f.name==='Common Carp'&&Math.random()<.1)secret('pizza');
if(G.st.catches>=25)unlockHat(5);if(G.st.catches>=100)unlockHat(11);if(G.st.night>=10)unlockHat(12);
if(G.tut<3){G.tut=Math.min(3,G.tut+1);if(G.tut===3){G.tutDone=true;addCoins(50);G.baits[0]=(G.baits[0]||0)+10;toast('First reward! +50 coins and 10 worms!','#6fd08c');}}
if(f.id===LL_ID){G.ended=true;setTimeout(showEnding,1500);}
checkAch();Rl=null;
if(G.chal&&G.chal.done){finishChal();}
save();}
function gotItem(it){G.items[it.id]=(G.items[it.id]||0)+1;if(it.kind==='j')G.st.junk++;else G.st.treasures++;lastRes={it,first:G.items[it.id]===1};fs='result';
sfx(it.kind==='t'?'big':'silly');shake(it.kind==='t'?10:3);part(W*.5,H*.5,it.kind==='t'?40:12,it.kind==='t'?['#ffc83d','#fff']:'#8a8',{up:260});
if(it.name==='Old Boot')secret('boot');if(it.name==='Lost Sock')secret('sock');if(it.name==='Brass Spyglass')secret('glass');
if(it.kind==='t'&&Math.random()<.5){setTimeout(()=>{if(mode==='fish')startBonus();},100);}
checkAch();save();}

function resultAct(a){if(!lastRes)return;const L=lastRes;
if(L.it){if(a==='sell'){const v=Math.round(L.it.val*(isFest()?1.2:1));addCoins(v);G.items[L.it.id]--;floater('+'+v,W*.5,H*.5,'#ffc83d',30);sfx('coin');}closeResult();return;}
const i=L.i;

else if(a==='sell'){const v=sellVal(i);addCoins(v);G.st.sold++;floater('+'+v,W*.5,H*.5,'#ffc83d',34);part(W*.5,H*.5,14,'#ffc83d',{up:200});sfx('coin',cmb);}
else if(a==='free'){const f=FISH[i.id];const v=Math.round(baseVal(i)*.5+5);addCoins(v);G.st.released++;floater('Free! +'+v,W*.5,H*.5,'#6fd08c',30);part(W*.5,H*.5,25,['#6fd08c','#fff'],{up:260});sfx('big');
if(Math.random()<.25){const b=Math.floor(Math.random()*4);G.baits[b]=(G.baits[b]||0)+3;toast('The fish left you a gift: 3 '+BAITS[b].name+'!');}
if(G.st.released>=25&&!G.skins.includes(5)){G.skins.push(5);toast('Unlocked rod skin: Bubblegum!');}}
if(G.contest&&G.contest.loc===G.loc&&G.contest.left<=0){closeResult();endContest();return;}
closeResult();checkAch();save();}
function closeResult(){lastRes=null;fs='idle';if(G.tut===3&&!G.tutDone2){G.tutDone2=true;}}
function stallTick(){if(!G.stall.length)return;const pct=G.stallPct/100;const p=clamp(.28*(1+(1-pct)*2.2),.02,.6);const keep=[];let tot=0;for(const s of G.stall){if(Math.random()<p){const v=Math.round(sellVal(s)*pct*1.15);tot+=v;G.st.sold++;}else keep.push(s);}if(tot){G.stall=keep;addCoins(tot);toast('Stall sold fish for '+tot+' coins!');sfx('coin');}}
// ---------- quests ----------
function questFor(v){const seed=G.day*37+v.id*11;const r=hrand(seed);const unl=LOCS.filter(l=>G.maps[l.id]);const loc=unl[Math.floor(hrand(seed+1)*unl.length)];const rm=Math.max(1,Math.min(...[3,Object.keys(G.maps).length]));
if(r<.4){const cand=FISH.filter(f=>f.rar<=1+Math.floor(unl.length/3)&&f.rar<4&&f.locs.some(l=>G.maps[l]));const f=cand[Math.floor(hrand(seed+2)*cand.length)];const n=1+Math.floor(hrand(seed+3)*2);return{vid:v.id,type:'bring',fid:f.id,n,prog:0,reward:Math.round(n*BASEP[f.rar]*2.5+30),text:'Bring me '+n+' '+f.name+(n>1?'s':'')+' please!'};}
if(r<.75){const n=3+Math.floor(hrand(seed+4)*4);return{vid:v.id,type:'catch',loc:loc.id,n,prog:0,reward:n*25+loc.i*30,text:'Catch '+n+' fish at '+loc.name+'.'};}
const tg={p:'predator',s:'small schooling',b:'bottom-dwelling',c:'shellfish',x:'strange'};const t=['p','s','b'][Math.floor(hrand(seed+5)*3)];const n=2+Math.floor(hrand(seed+6)*3);return{vid:v.id,type:'tag',tag:t,n,prog:0,reward:n*35+20,text:'Catch '+n+' '+tg[t]+' fish.'};}
function questDone(q){if(q.type==='bring')return(G.cooler.filter(i=>i.id===q.fid).length)>=q.n;return q.prog>=q.n;}
function completeQuest(idx){const q=G.quests[idx];if(!q||!questDone(q))return;if(q.type==='bring'){let c=q.n;G.cooler=G.cooler.filter(i=>{if(i.id===q.fid&&c>0){c--;return false;}return true;});}
addCoins(q.reward);G.friends[q.vid]=Math.min(10,(G.friends[q.vid]||0)+1);G.st.quests++;G.quests.splice(idx,1);G.qd=(G.qd||{});G.qd[q.vid]=G.day;toast('Quest complete! +'+q.reward+' coins and a heart.','#ff8ad8');sfx('big');part(W/2,H/2,40,['#ff8ad8','#fff','#ffc83d'],{up:200});checkAch();save();}
function tipFor(v){const hearts=G.friends[v.id]||0;const un=FISH.filter(f=>!G.log[f.id]&&f.rar<4&&f.locs.some(l=>G.maps[l]));if(!un.length)return pick(v.lines);const f=un[Math.floor(hrand(G.day*9+v.id)*un.length)];const ss=f.seas==='*'?'all year':f.seas.split('').map(c=>SEAS[SL.indexOf(c)]).join(' and ');
let s='I hear '+f.name+' bites ';s+=f.time==='d'?'by day':f.time==='n'?'at night':'any time';if(hearts>=3)s+=', in '+ss;if(hearts>=6)s+=', around '+f.locs.map(l=>LOCI[l].name).join(' or ');return s+'.';}
// ---------- contest ----------
function startContest(){if(!isContestDay()||G.cdone===G.day||isNight()){return false;}const l=LOCS.filter(x=>G.maps[x.id]&&(!x.boat||G.boat>=x.boat));const loc=l[Math.floor(hrand(G.day)*l.length)];const lv=Object.keys(G.maps).length;G.contest={day:G.day,loc:loc.id,left:12,score:0,rivals:[['Marlow',.6],['Pip',.35],['Nell',.45]].map(a=>[a[0],+(a[1]*(2+lv*1.5)*(.7+hrand(G.day*3+a[0].length)*.7)).toFixed(1)])};G.st.contests++;G.loc=loc.id;checkAch();return true;}
function endContest(){const c=G.contest;if(!c)return;G.contest=null;G.cdone=G.day;const all=[['You',c.score]].concat(c.rivals).sort((a,b)=>b[1]-a[1]);const rank=all.findIndex(a=>a[0]==='You')+1;const pz=[300,150,60,20][rank-1]*(1+Object.keys(G.maps).length*.4);addCoins(Math.round(pz));if(rank===1){G.st.wins++;sfx('big');shake(14);part(W/2,H/2,80,['#ffc83d','#fff','#ff8ad8'],{up:300});}
contRes={rank,all,prize:Math.round(pz),score:c.score};openPanel('contres');checkAch();save();}

function finishChal(){const m=G.chal.m;G.chal=null;G.st.challenges++;const r=250+Object.keys(G.maps).length*60;addCoins(r);toast('Challenge complete! +'+r+' coins!','#ffc83d');sfx('big');part(W/2,H/2,80,['#ffc83d','#fff','#ff8ad8'],{up:300});unlockTheme(2);}

const lerp=(a,b,t)=>a+(b-a)*t;
function hexc(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function mix(a,b,t){const x=hexc(a),y=hexc(b);return`rgb(${Math.round(lerp(x[0],y[0],t))},${Math.round(lerp(x[1],y[1],t))},${Math.round(lerp(x[2],y[2],t))})`;}
const SKY=[[0,'#0a1030','#1a2a5c'],[5,'#1c2a60','#ff9a6b'],[7,'#6fb8f0','#ffe0b0'],[12,'#4aa8ee','#bfe6fa'],[17,'#6fb0e8','#ffe0b0'],[19,'#e0705a','#ffc080'],[21,'#101a48','#2a3a78'],[24,'#0a1030','#1a2a5c']];
function skyAt(h,tint){let i=0;while(i<SKY.length-2&&h>=SKY[i+1][0])i++;const a=SKY[i],b=SKY[i+1],t=clamp((h-a[0])/(b[0]-a[0]),0,1);return[mix(a[1],b[1],t),mix(a[2],b[2],t)];}

if(night||G.hour>18){cx.fillStyle='#fff';for(let i=0;i<60;i++){const x=hrand(i)*W,y=hrand(i+99)*top*.8;cx.globalAlpha=(night?.9:.3)*(.5+.5*Math.sin(tick*2+i));cx.fillRect(x,y,2,2);}cx.globalAlpha=1;}
const p=clamp((G.hour-5)/15,0,1);const sx=lerp(W*.1,W*.9,p),sy=top*.85-Math.sin(p*Math.PI)*top*.7;

// clouds
const cc=G.wx==='sun'?3:G.wx==='fog'?4:7;for(let i=0;i<cc;i++){const x=((i*W/cc+tick*8*(.4+i%3*.2))%(W+240))-120,y=top*(.15+(i*37%50)/100);cx.fillStyle=G.wx==='storm'?'rgba(70,75,95,.9)':G.wx==='sun'?'rgba(255,255,255,.8)':'rgba(235,240,248,.85)';if(isNight())cx.fillStyle='rgba(80,90,130,.7)';cx.beginPath();cx.ellipse(x,y,60,20,0,0,7);cx.ellipse(x+30,y-12,40,20,0,0,7);cx.ellipse(x-30,y-6,35,16,0,0,7);cx.fill();if(i===0){CLOUD.x=x;CLOUD.y=y;}}}

function drawWeather(){if(G.wx==='rain'||G.wx==='storm'){cx.strokeStyle='rgba(180,210,255,.6)';cx.lineWidth=1.5;cx.beginPath();const n=G.wx==='storm'?140:80;for(let i=0;i<n;i++){const x=(hrand(i)*W+tick*60)%W,y=((hrand(i+50)*H+tick*700)%H);cx.moveTo(x,y);cx.lineTo(x-4,y+14);}cx.stroke();if(G.wx==='storm'&&Math.sin(tick*.8)>.995){cx.fillStyle='rgba(255,255,255,.5)';cx.fillRect(0,0,W,H);}}
else if(G.wx==='snow'){cx.fillStyle='#fff';for(let i=0;i<70;i++){const x=(hrand(i)*W+Math.sin(tick+i)*20+W)%W,y=((hrand(i+50)*H+tick*60)%H);cx.beginPath();cx.arc(x,y,2.5,0,7);cx.fill();}}

function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath();}
function fishSprite(c,x,y,len,f,dir,t,gold,sil){c.save();c.translate(x,y);c.scale(dir,1);const h=(f.id*47+13)%360;let col=sil?'#0b1d3a':`hsl(${h},62%,${f.rar>=4?62:55}%)`,col2=sil?'#0b1d3a':`hsl(${(h+35)%360},55%,38%)`;if(gold&&!sil){col='#ffd34d';col2='#c48a00';}
if(f.rar>=4&&!sil){c.shadowColor='#ffd34d';c.shadowBlur=18;}
const w=Math.sin(t*6+f.id)*.15;
if(f.tag==='c'){const s=len/2;c.fillStyle=col;c.beginPath();c.ellipse(0,0,s*.7,s*.5,0,0,7);c.fill();c.strokeStyle=col2;c.lineWidth=Math.max(1.5,s*.12);for(let i=-1;i<=1;i+=1){c.beginPath();c.moveTo(i*s*.3,s*.4);c.lineTo(i*s*.5,s*.9);c.moveTo(i*s*.3,-s*.4);c.lineTo(i*s*.5,-s*.9);c.stroke();}c.fillStyle=col2;c.beginPath();c.arc(s*.8,-s*.5,s*.3,0,7);c.arc(s*.8,s*.5,s*.3,0,7);c.fill();}
else if(f.tag==='x'){const s=len/2,k=f.id%3;if(k===0){c.fillStyle=col;c.beginPath();c.arc(0,0,s*.7,Math.PI,0);c.fill();c.strokeStyle=col2;c.lineWidth=Math.max(1.5,s*.1);for(let i=-3;i<=3;i++){c.beginPath();c.moveTo(i*s*.2,0);c.quadraticCurveTo(i*s*.2+Math.sin(t*4+i)*s*.2,s*.5,i*s*.2,s*.9);c.stroke();}}else if(k===1){c.fillStyle=col;c.beginPath();c.moveTo(s,0);c.quadraticCurveTo(0,-s*.9,-s*.8,0);c.quadraticCurveTo(0,s*.9,s,0);c.fill();c.strokeStyle=col2;c.lineWidth=2;c.beginPath();c.moveTo(-s*.8,0);c.lineTo(-s*1.3,Math.sin(t*5)*s*.3);c.stroke();}else{c.fillStyle=col;c.beginPath();c.ellipse(0,0,s*.8,s*.5,0,0,7);c.fill();c.fillStyle=col2;c.beginPath();c.ellipse(0,-s*.05,s*.55,s*.32,0,0,7);c.fill();c.fillStyle=col;c.beginPath();c.arc(s*.85,0,s*.22,0,7);c.fill();}}
else{const s=len/2,ry=s*(f.tag==='b'?.45:f.tag==='p'?.3:.4);c.fillStyle=col2;c.beginPath();c.moveTo(-s*.8,0);c.lineTo(-s*1.2,-ry*1.1+w*s*.6);c.lineTo(-s*1.2,ry*1.1+w*s*.6);c.fill();c.beginPath();c.moveTo(-s*.2,-ry*.8);c.lineTo(s*.1,-ry*1.5);c.lineTo(s*.4,-ry*.8);c.fill();c.fillStyle=col;c.beginPath();c.ellipse(0,0,s,ry,0,0,7);c.fill();if(!sil){c.fillStyle='rgba(255,255,255,.35)';c.beginPath();c.ellipse(0,ry*.35,s*.8,ry*.4,0,0,7);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(s*.6,-ry*.2,ry*.28,0,7);c.fill();c.fillStyle='#111';c.beginPath();c.arc(s*.64,-ry*.2,ry*.14,0,7);c.fill();}}
c.restore();c.shadowBlur=0;}
function drawHat(c,x,y,hid,s){c.save();c.translate(x,y);c.scale(s,s);switch(hid){case 1:c.fillStyle='#f6d37a';c.beginPath();c.ellipse(0,0,16,4,0,0,7);c.fill();c.fillRect(-8,-8,16,8);break;case 2:c.fillStyle='#222';c.beginPath();c.moveTo(-14,0);c.lineTo(0,-12);c.lineTo(14,0);c.fill();c.fillStyle='#fff';c.fillRect(-2,-8,4,3);break;case 3:c.fillStyle='#5b3a9e';c.beginPath();c.moveTo(-12,0);c.lineTo(2,-22);c.lineTo(12,0);c.fill();c.fillStyle='#ffd34d';c.fillRect(-12,-3,24,3);break;case 4:c.fillStyle='#ffc83d';c.beginPath();c.moveTo(-10,0);c.lineTo(-10,-10);c.lineTo(-5,-5);c.lineTo(0,-12);c.lineTo(5,-5);c.lineTo(10,-10);c.lineTo(10,0);c.fill();break;case 5:c.fillStyle='#fff';c.fillRect(-9,-8,18,8);c.beginPath();c.arc(0,-10,9,0,7);c.fill();break;case 6:c.fillStyle='#ffe14d';c.beginPath();c.ellipse(0,-5,8,6,0,0,7);c.fill();c.fillStyle='#f80';c.fillRect(5,-6,5,3);break;case 7:c.fillStyle='#555';c.beginPath();c.moveTo(-9,0);c.lineTo(-9,-11);c.lineTo(-3,-5);c.lineTo(3,-5);c.lineTo(9,-11);c.lineTo(9,0);c.fill();break;case 8:c.fillStyle='#ff6bb5';c.beginPath();c.moveTo(-8,0);c.lineTo(0,-20);c.lineTo(8,0);c.fill();c.fillStyle='#ffe14d';c.beginPath();c.arc(0,-20,3,0,7);c.fill();break;case 9:c.fillStyle='#fff';c.fillRect(-10,-6,20,6);c.fillStyle='#235';c.fillRect(-10,-2,20,2);break;case 10:c.strokeStyle='#ffe14d';c.lineWidth=3;c.beginPath();c.ellipse(0,-10,10,3,0,0,7);c.stroke();break;case 11:c.fillStyle='#4aa9d8';c.beginPath();c.ellipse(0,-5,12,6,0,0,7);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(6,-6,2,0,7);c.fill();break;case 12:c.fillStyle='#3a3a8a';c.beginPath();c.arc(0,0,10,Math.PI,0);c.fill();break;case 13:c.fillStyle='#111';c.fillRect(-9,-14,18,14);c.fillRect(-14,-1,28,3);break;}c.restore();}

function drawRod(x,y){const sk=G.skin;const grad=['#7a5230','#ff7aa8','#ffd34d','#fff','#7cf','#ff9ad8'][sk];cx.strokeStyle=sk===3?`hsl(${tick*120%360},80%,60%)`:grad;cx.lineWidth=4;cx.lineCap='round';cx.beginPath();cx.moveTo(x+6,y-30);const tp=rodTip(x,y);const bend=fs==='reel'?clamp(Rl.strain,0,1)*14+(Rl.inn?0:6):0;cx.quadraticCurveTo(x+40,y-80,tp.x,tp.y+bend);cx.stroke();if(sk===4&&isNight()){cx.shadowColor='#7cf';cx.shadowBlur=12;cx.stroke();cx.shadowBlur=0;}return{x:tp.x,y:tp.y+bend};}

function backdrop(loc,hy){const dl=daylight();const sh=(c)=>mix(c,'#0a1030',(1-dl)*.65);
switch(loc){
case'p':cx.fillStyle=sh('#5fa05a');cx.beginPath();cx.moveTo(0,hy);for(let x=0;x<=W;x+=20)cx.lineTo(x,hy-30-Math.sin(x*.01)*18);cx.lineTo(W,hy);cx.fill();for(let i=0;i<6;i++){tree(W*(.08+i*.17),hy-20,sh('#2e7d3a'));}break;
case'r':cx.fillStyle=sh('#7a8f6a');cx.beginPath();cx.moveTo(0,hy);for(let x=0;x<=W;x+=20)cx.lineTo(x,hy-60-Math.sin(x*.006)*40);cx.lineTo(W,hy);cx.fill();for(let i=0;i<9;i++)tree(W*(.03+i*.115),hy-10,sh('#2a6a34'));break;
case'l':cx.fillStyle=sh('#7d8aa0');cx.beginPath();cx.moveTo(0,hy);cx.lineTo(W*.15,hy-120);cx.lineTo(W*.3,hy-60);cx.lineTo(W*.5,hy-160);cx.lineTo(W*.7,hy-70);cx.lineTo(W*.85,hy-130);cx.lineTo(W,hy);cx.fill();cx.fillStyle=sh('#fff');cx.beginPath();cx.moveTo(W*.5,hy-160);cx.lineTo(W*.46,hy-120);cx.lineTo(W*.54,hy-120);cx.fill();break;
case'h':cx.fillStyle=sh('#b8a07a');cx.fillRect(0,hy-6,W,10);for(let i=0;i<4;i++){const x=W*(.5+i*.13);cx.fillStyle=sh(['#c44','#48c','#ca4','#4a8'][i]);cx.fillRect(x,hy-60,50,54);cx.fillStyle=sh('#654');cx.beginPath();cx.moveTo(x-5,hy-60);cx.lineTo(x+25,hy-85);cx.lineTo(x+55,hy-60);cx.fill();}cx.fillStyle=sh('#fff');cx.fillRect(W*.4,hy-40,6,34);cx.beginPath();cx.moveTo(W*.4+6,hy-40);cx.lineTo(W*.4+40,hy-12);cx.lineTo(W*.4+6,hy-12);cx.fill();break;
case'c':cx.fillStyle=sh('#e8d8a0');cx.beginPath();cx.ellipse(W*.8,hy+4,W*.18,18,0,Math.PI,0);cx.fill();cx.fillStyle=sh('#6a4a2a');cx.fillRect(W*.8-4,hy-70,8,70);cx.fillStyle=sh('#2e9a4a');for(let i=0;i<5;i++){cx.beginPath();cx.ellipse(W*.8+Math.cos(i*1.3)*30,hy-70+Math.sin(i*1.3)*8,30,7,i*.6,0,7);cx.fill();}break;
case'o':cx.fillStyle=sh('#8aa0b8');for(let i=0;i<3;i++){cx.beginPath();cx.ellipse(W*(.2+i*.3),hy+4,50,6,0,Math.PI,0);cx.fill();}break;
case'i':cx.fillStyle=sh('#e8f2fa');cx.beginPath();cx.moveTo(0,hy);for(let x=0;x<=W;x+=30)cx.lineTo(x,hy-50-Math.abs(Math.sin(x*.01))*80);cx.lineTo(W,hy);cx.fill();break;
case'v':cx.fillStyle='#14102a';cx.fillRect(0,0,W,hy);cx.fillStyle='#241c44';for(let i=0;i<14;i++){const x=i*W/13;cx.beginPath();cx.moveTo(x-20,0);cx.lineTo(x,40+hrand(i)*100);cx.lineTo(x+20,0);cx.fill();}for(let i=0;i<10;i++){cx.fillStyle=`hsla(${(i*50+tick*20)%360},80%,65%,${.5+.3*Math.sin(tick*2+i)})`;const x=hrand(i+7)*W,y=hy-20-hrand(i+9)*80;cx.beginPath();cx.moveTo(x,y);cx.lineTo(x+7,y+18);cx.lineTo(x-7,y+18);cx.fill();}break;}}
function tree(x,y,c){cx.fillStyle='#5a3a1a';cx.fillRect(x-4,y-14,8,16);cx.fillStyle=c;cx.beginPath();cx.arc(x,y-28,22,0,7);cx.fill();}
function waterGrad(y0,loc){const L=LOCI[loc],dl=Math.max(.35,daylight());const g=cx.createLinearGradient(0,y0,0,H);g.addColorStop(0,mix(L.w1,'#0a1030',(1-dl)*.6));g.addColorStop(1,mix(L.w2,'#050a20',(1-dl)*.5));cx.fillStyle=g;cx.fillRect(0,y0,W,H-y0);
cx.strokeStyle='rgba(255,255,255,.2)';cx.lineWidth=2;for(let r=0;r<7;r++){const y=y0+12+r*r*5+r*8;cx.beginPath();for(let x=0;x<=W;x+=14)cx.lineTo(x,y+Math.sin(x*.02+tick*(1+r*.2)+r)*(2+r*.6));cx.stroke();}}

function ambient(loc,y0,dt){const list=FISH.filter(f=>f.locs.includes(loc)&&f.rar<4);if(AMB.length<7&&list.length&&Math.random()<.02)AMB.push({f:pick(list),x:Math.random()<.5?-60:W+60,y:y0+rnd(60,H-y0-30),v:rnd(20,60),loc});

cx.fillStyle='#ffe14d';cx.beginPath();cx.ellipse(DUCK.x,DUCK.y,13,9,0,0,7);cx.arc(DUCK.x+8,DUCK.y-9,6,0,7);cx.fill();cx.fillStyle='#f80';cx.fillRect(DUCK.x+12,DUCK.y-10,6,3);}

case'shop':t='Tackle Shop';h=tabs('shop',[['rods','Rods'],['baits','Baits'],['boats','Boats'],['extras','Extras']]);
if(tab.shop==='rods')h+=`<div class="grid">`+RODS.map(r=>{const own=G.rods[r.id]!==undefined,up=G.rods[r.id]||0;const ucost=Math.round(Math.max(40,r.cost)*.45*(up+1));return`<div class="card ${G.rod===r.id?'sel':''}"><b>${r.name}</b><small>Zone +${(r.id*2.5+up*3).toFixed(1)}%  Luck +${r.id*5+up*4}%  Upgrades ${up}/3</small>${own?(G.rod===r.id?'<i>Equipped</i>':btn('equip:'+r.id,'Equip')):btn('buyrod:'+r.id,'Buy '+fmt(r.cost),'',G.coins<r.cost)}${own&&up<3?btn('uprod:'+r.id,'Upgrade '+fmt(ucost),'',G.coins<ucost):''}</div>`;}).join('')+`</div>`;
else if(tab.shop==='baits')h+=`<p>Bait is used once per cast. Pick one to equip.</p><div class="grid">`+BAITS.map(b=>`<div class="card ${G.bait===b.id?'sel':''}"><b>${b.name}</b> <small>Have ${G.baits[b.id]||0}</small><small>${b.d}</small>${btn('buybait:'+b.id,'Buy 10 for '+fmt(b.cost*10),'',G.coins<b.cost*10)}${btn('eqbait:'+b.id,G.bait===b.id?'Equipped':'Use','',(G.baits[b.id]||0)<1)}</div>`).join('')+`</div>`;
else if(tab.shop==='boats')h+=`<p>Boats let you reach far waters and add luck.</p><div class="grid">`+BOATS.map(b=>`<div class="card"><b>${b.name}</b><small>Luck +${b.id*4}%, faster bites</small>${G.boat>=b.id?'<i>Owned</i>':btn('buyboat:'+b.id,'Buy '+fmt(b.cost),'',G.coins<b.cost||G.boat<b.id-1)}</div>`).join('')+`</div>`;
else{const cu=COOLER[G.coolerLv+1],tu=TANK[G.tankLv+1],su=STALL[G.stallLv+1];h+=`<div class="grid"><div class="card"><b>Cooler</b><small>Holds ${COOLER[G.coolerLv][0]} fish</small>${cu?btn('upcool','Upgrade to '+cu[0]+' for '+fmt(cu[1]),'',G.coins<cu[1]):'<i>Max</i>'}</div><div class="card"><b>Aquarium tank</b><small>Holds ${TANK[G.tankLv][0]} fish</small>${tu?btn('uptank','Upgrade to '+tu[0]+' for '+fmt(tu[1]),'',G.coins<tu[1]):'<i>Max</i>'}</div><div class="card"><b>Stall slots</b><small>${STALL[G.stallLv][0]} slots</small>${su?btn('upstall','Upgrade to '+su[0]+' for '+fmt(su[1]),'',G.coins<su[1]):'<i>Max</i>'}</div>`+DECOR.map(d=>`<div class="card"><b>${d.name}</b><small>Aquarium decoration</small>${G.decor.includes(d.id)?btn('tdecor:'+d.id,G.decorOn[d.id]===false?'Show':'Hide'):btn('buydecor:'+d.id,'Buy '+fmt(d.cost),'',G.coins<d.cost)}</div>`).join('')+`</div>`;}
break;
case'market':t='Fish Market';{const day=G.day;h=`<p>Prices change every day and differ for each fish. ${isFest()?'<b>Festival: +20%!</b>':''} Cooler: ${G.cooler.length}/${COOLER[G.coolerLv][0]}</p>`;
h+=btn('sellall','Sell everything in the cooler')+btn('sellitems','Sell treasures and junk')+`<div class="list">`+(G.cooler.length?G.cooler.map((i,k)=>{const f=FISH[i.id],m=mmult(i.id);return`<div class="row"><span>${i.g?'<b style="color:#ffc83d">Golden</b> ':''}${f.name} ${rarTag(f.rar)} <small>${cmS(i.cm)}, ${wt(i.kg)}</small></span><span class="${m>1?'up':'dn'}">${m>1?'▲':'▼'} ${fmt(sellVal(i))}</span>${btn('sell:'+k,'Sell')}${btn('tostall:'+k,'To stall','',G.stall.length>=STALL[G.stallLv][0])}${btn('totank:'+k,'Tank','',G.tank.length>=TANK[G.tankLv][0])}</div>`;}).join(''):'<p>Your cooler is empty. Go fishing!</p>')+`</div>`;
h+=`<h3>Your fish stall (${G.stall.length}/${STALL[G.stallLv][0]})</h3><p>Set your price: <b>${G.stallPct}%</b> of market value. Lower sells faster. <input type="range" min="60" max="140" step="5" value="${G.stallPct}" data-r="stall"></p><div class="list">`+G.stall.map((i,k)=>`<div class="row"><span>${FISH[i.id].name} <small>${cmS(i.cm)}</small></span><span>${fmt(sellVal(i)*G.stallPct/100*1.15)}</span>${btn('unstall:'+k,'Take back')}</div>`).join('')+`</div>`;}break;
case'vill':t='Village Square';h=`<p>Befriend villagers: finish quests and give gifts of fish they like. Hearts unlock better tips.</p><div class="grid">`+VILL.map(v=>{const hr=G.friends[v.id]||0;const qi=G.quests.findIndex(q=>q.vid===v.id);const done=G.qd&&G.qd[v.id]===G.day;let q=null;if(qi<0&&!done)q=questFor(v);const gifted=G.gift&&G.gift[v.id]===G.day;
return`<div class="card"><b>${v.name}</b> <small>${v.role}</small><div class="hearts">${'♥'.repeat(hr)}${'♡'.repeat(10-hr)}</div><small>"${pick2(v.lines,v.id)}"</small><small class="tip">${tipFor(v)}</small>${qi>=0?`<div class="q">${G.quests[qi].text} ${G.quests[qi].type==='bring'?'':'('+G.quests[qi].prog+'/'+G.quests[qi].n+')'} <small>Reward ${G.quests[qi].reward}</small>${btn('qdone:'+qi,'Turn in','',!questDone(G.quests[qi]))}</div>`:q?`<div class="q">${q.text} <small>Reward ${q.reward}</small>${btn('qacc:'+v.id,'Accept','',G.quests.length>=3)}</div>`:'<small>No new quest today.</small>'}${btn('gift:'+v.id,'Give a fish','',gifted||!G.cooler.length)}</div>`;}).join('')+`</div>`;break;
case'lh':t='Lighthouse';h=`<p>Level ${G.lh}/5</p><ol>`+LHDESC.map((d,i)=>`<li class="${G.lh>i?'done':''}">${d}</li>`).join('')+`</ol>`+(G.lh<5?btn('uplh','Repair/Upgrade for '+fmt(LHCOST[G.lh]),'',G.coins<LHCOST[G.lh]):'<p><b>The lighthouse shines brightly!</b></p>');break;
case'map':t='Map - where to fish?';h=`<div class="grid">`+LOCS.map(l=>{const own=G.maps[l.id],boatOk=G.boat>=l.boat;return`<div class="card ${G.loc===l.id?'sel':''}" style="border-left:8px solid ${l.w1}"><b>${l.name}</b><small>${l.d}</small>${l.boat?`<small>Needs ${BOATS[l.boat-1].name}</small>`:''}${own?btn('goto:'+l.id,boatOk?'Fish here':'Need boat','',!boatOk):btn('buymap:'+l.id,'Buy map '+fmt(l.cost),'',G.coins<l.cost)}</div>`;}).join('')+`</div>`;break;
case'log':t='Fishing Log ('+cnt(G)+'/150)';h=tabs('log',[['all','All'],...LOCS.map(l=>[l.id,l.name.split(' ')[0]]),['items','Items']]);
if(selFish>=0){const f=FISH[selFish],L=G.log[selFish];h+=`<div class="detail">${btn('selfish:-1','Back')}<h3>${L?f.name:'???'} ${rarTag(f.rar)}</h3>${L?`<p>${f.fact}</p><p>Biggest: ${cmS(L.cm)} / ${wt(L.kg)} (species max about ${cmS(f.cm)}). Caught ${L.n} time(s)${L.gold?', '+L.gold+' golden':''}.</p><p>Lives in: ${f.locs.map(l=>LOCI[l].name).join(', ')}. Bites: ${f.time==='d'?'daytime':f.time==='n'?'night':'any time'}, ${f.seas==='*'?'all seasons':f.seas.split('').map(c=>SEAS[SL.indexOf(c)]).join(', ')}.</p>`:`<p>Not caught yet. Keep fishing!</p><p>Rarity: ${RARN[f.rar]}</p>`}</div>`;}
else if(tab.log==='items'){h+=`<div class="grid">`+ITEMS.map(i=>`<div class="card"><b>${G.items[i.id]!==undefined?i.name:'???'}</b><small>${G.items[i.id]!==undefined?i.desc+' (x'+G.items[i.id]+')':'Not found yet'}</small></div>`).join('')+`</div>`;}
else{const list=FISH.filter(f=>tab.log==='all'||f.locs.includes(tab.log));h+=`<div class="grid small">`+list.map(f=>{const L=G.log[f.id];return`<div class="card tiny ${L?'':'unk'}" data-a="selfish:${f.id}" style="border-top:4px solid ${RARC[f.rar]}">${L?f.name:'???'}<small>${L?cmS(L.cm):RARN[f.rar]}</small></div>`;}).join('')+`</div>`;}break;
case'ach':t='Achievements ('+Object.keys(G.ach).length+'/'+ACH.length+')';h=`<div class="grid small">`+ACH.map(a=>`<div class="card tiny ${G.ach[a.id]?'got':'unk'}"><b>${a.n}</b><small>${a.d}</small></div>`).join('')+`</div>`;break;
case'wd':t='Collection and Wardrobe';h=tabs('wd',[['hats','Hats'],['skins','Rod skins'],['themes','Themes'],['titles','Titles'],['trophies','Trophies'],['secrets','Secrets']]);
if(tab.wd==='hats')h+=`<div class="grid small">`+HATS.map(x=>`<div class="card tiny ${G.hats.includes(x.id)?'':'unk'} ${G.hat===x.id?'sel':''}"><b>${x.name}</b>${G.hats.includes(x.id)?btn('hat:'+x.id,G.hat===x.id?'Wearing':'Wear'):x.how==='shop'?btn('buyhat:'+x.id,'Buy '+fmt(x.cost),'',G.coins<x.cost):'<small>'+x.how+'</small>'}</div>`).join('')+`</div>`;
else if(tab.wd==='skins')h+=`<div class="grid small">`+ROD_SKINS.map(x=>`<div class="card tiny ${G.skins.includes(x.id)?'':'unk'} ${G.skin===x.id?'sel':''}"><b>${x.name}</b>${G.skins.includes(x.id)?btn('skin:'+x.id,G.skin===x.id?'Using':'Use'):x.how==='shop'?btn('buyskin:'+x.id,'Buy '+fmt(x.cost),'',G.coins<x.cost):'<small>'+x.how+'</small>'}</div>`).join('')+`</div>`;
else if(tab.wd==='themes')h+=`<div class="grid small">`+THEMES.map(x=>`<div class="card tiny ${G.theme===x.id?'sel':''}"><b>${x.name}</b>${G.themes.includes(x.id)?btn('theme:'+x.id,G.theme===x.id?'Using':'Use'):x.id===2?'<small>Win a challenge run</small>':btn('buytheme:'+x.id,'Buy '+fmt(x.cost),'',G.coins<x.cost)}</div>`).join('')+`</div>`;
else if(tab.wd==='titles'){const ts=titlesUnlocked();h+=`<p>Your title: <b>${ts[Math.min(G.titleSel===undefined?ts.length-1:G.titleSel,ts.length-1)]}</b></p><div class="grid small">`+TITLES.map((x,i)=>`<div class="card tiny ${i<ts.length?'':'unk'}"><b>${x}</b>${i<ts.length?btn('title:'+i,'Use'):''}</div>`).join('')+`</div>`;}
else if(tab.wd==='trophies')h+=`<div class="grid small">`+LEGS.map(i=>`<div class="card tiny ${G.log[i]?'got':'unk'}"><b>${G.log[i]?FISH[i].name:'???'}</b><small>Legendary trophy</small></div>`).join('')+ACH.filter(a=>/^m[a-z]$/.test(a.id)).map(a=>`<div class="card tiny ${G.ach[a.id]?'got':'unk'}"><b>${a.n}</b></div>`).join('')+`</div>`;
else h+=`<p>${Object.keys(G.secrets).length}/${Object.keys(SECRETS).length} found. Hints are hidden!</p><div class="grid small">`+Object.keys(SECRETS).map(k=>`<div class="card tiny ${G.secrets[k]?'got':'unk'}"><b>${G.secrets[k]?SECRETS[k]:'? ? ?'}</b></div>`).join('')+`</div>`;break;
case'chal':t='Challenge Runs';h=`<p>Pick a twist! Catch 10 fish under a special rule for a big reward and a secret theme. Only one at a time.</p>`+(G.chal?`<p><b>Active:</b> ${MUTS[G.chal.m][0]}, ${G.chal.left} catches left.</p>`+btn('chalstop','Give up (no penalty)'):'')+`<div class="grid">`+MUTS.map((m,i)=>`<div class="card"><b>${m[0]}</b><small>${m[1]}</small>${btn('chal:'+i,'Start','',!!G.chal)}</div>`).join('')+`</div>`;break;
case'contest':t='Fishing Contest';h=isContestDay()?(G.cdone===G.day?'<p>You already competed today. Great job!</p>':isNight()?'<p>The contest runs during the day. Come back after sunrise.</p>':`<p>Today is contest day! You get 12 casts at a random lake. Heaviest total catch wins. Rivals: ${'Marlow, Pip and Nell'}.</p>`+btn('startcont','Enter the contest')):`<p>Contests happen every 7th day. Next one: day ${Math.ceil(G.day/7)*7}.</p>`;break;
case'contres':t='Contest Results';h=`<p>You came in <b>#${contRes.rank}</b> with ${contRes.score.toFixed(1)} kg and won ${contRes.prize} coins!</p><ol>`+contRes.all.map(a=>`<li>${a[0]}: ${(+a[1]).toFixed(1)} kg</li>`).join('')+`</ol>`+btn('close','Great!');break;
case'ending':t='The Lake Legend!';h=`<div class="end"><p>The great silver fish rises under the lighthouse beam. The whole village gathers at the shore as it glides past, calm and shining. Then, with a gentle splash, it dives home.</p><p>You are now the Lake Legend of the village. Thank you for playing!</p><p>Keep playing to finish your book, fill the aquarium and find every secret.</p></div>`+btn('close','Keep Playing');break;
case'settings':t='Settings';h=`<p>Difficulty:</p>`+['easy','normal','hard'].map(d=>btn('diff:'+d,d[0].toUpperCase()+d.slice(1),G.diff===d?'on':'')).join('')+`<p>Easy gives a wide green zone and lots of time. Hard is still friendly.</p><p>Sound: ${btn('mute',G.mute?'Muted':'On')} Minimap: ${btn('mini',G.mini?'On':'Off')}</p><p>${btn('save','Save now')} ${btn('reset','Erase save','warn')}</p>`;break;
case'pause':t='Paused';h=btn('close','Resume')+btn('settings','Settings')+btn('title','Main menu');break;
case'help':t='How to Play';h=`<ul><li>Click / Space: cast. When the bobber shows <b>!</b>, press again to hook.</li><li>Reel: hold mouse / touch / Space / Up to raise the green zone, release to lower it. Keep the fish inside!</li><li>N = minimap, M = mute, P = pause, S = skip night.</li><li>Keep fish, add them to the aquarium, sell them, or release them for a bonus and kindness.</li><li>Befriend villagers, repair the lighthouse and catch the Lake Legend!</li></ul>`+btn('close','Got it');break;}
PT.textContent=t;PB.innerHTML=h;}
function pick2(l,s){return l[(G.day+s)%l.length];}
function titlesUnlocked(){const c=cnt(G),r=[TITLES[0]];if(c>=5)r.push(TITLES[1]);if(c>=15)r.push(TITLES[2]);if(c>=30)r.push(TITLES[3]);if(c>=50)r.push(TITLES[4]);if(c>=75)r.push(TITLES[5]);if(c>=100)r.push(TITLES[6]);if(c>=125)r.push(TITLES[7]);if(c>=145)r.push(TITLES[8]);if(G.st.legs>=3)r.push(TITLES[9]);if(G.log[LL_ID])r.push(TITLES[10]);return r;}
function giftFish(vid){const v=VILL[vid];let k=G.cooler.findIndex(i=>FISH[i.id].tag===v.fav);const fav=k>=0;if(k<0)k=0;G.cooler.splice(k,1);G.gift=G.gift||{};G.gift[vid]=G.day;G.friends[vid]=Math.min(10,(G.friends[vid]||0)+(fav?1:.5));toast(fav?v.name+' loves it! A whole heart!':v.name+' says thanks!','#ff8ad8');part(W/2,H/2,20,['#ff8ad8','#fff'],{up:200});sfx('big');}
// ---------- actions ----------
function act(a){const p=a.split(':'),n=p[0],x=p[1];sfx('click');
switch(n){
case'close':closePanel();break;case'tab':tab[x]=p[2];renderPanel();return;case'selfish':selFish=+x;renderPanel();return;
case'buyrod':{const r=RODS[x];if(G.coins>=r.cost){G.coins-=r.cost;G.rods[x]=0;G.rod=+x;sfx('big');shake(6);}break;}
case'equip':G.rod=+x;break;
case'uprod':{const r=RODS[x],u=G.rods[x]||0,c=Math.round(Math.max(40,r.cost)*.45*(u+1));if(u<3&&G.coins>=c){G.coins-=c;G.rods[x]=u+1;sfx('big');}break;}
case'buybait':{const b=BAITS[x];if(G.coins>=b.cost*10){G.coins-=b.cost*10;G.baits[x]=(G.baits[x]||0)+10;if(G.bait<0||!(G.baits[G.bait]>0))G.bait=+x;}break;}
case'eqbait':G.bait=+x;break;
case'buyboat':{const b=BOATS[x-1];if(G.coins>=b.cost&&G.boat===b.id-1){G.coins-=b.cost;G.boat=b.id;sfx('big');shake(8);}break;}
case'upcool':{const c=COOLER[G.coolerLv+1];if(c&&G.coins>=c[1]){G.coins-=c[1];G.coolerLv++;}break;}
case'uptank':{const c=TANK[G.tankLv+1];if(c&&G.coins>=c[1]){G.coins-=c[1];G.tankLv++;}break;}
case'upstall':{const c=STALL[G.stallLv+1];if(c&&G.coins>=c[1]){G.coins-=c[1];G.stallLv++;}break;}
case'buydecor':{const d=DECOR[x];if(G.coins>=d.cost&&!G.decor.includes(+x)){G.coins-=d.cost;G.decor.push(+x);}break;}
case'tdecor':G.decorOn[x]=G.decorOn[x]===false;break;
case'sell':{const i=G.cooler[x];if(i){const v=sellVal(i);G.cooler.splice(x,1);addCoins(v);G.st.sold++;sfx('coin',Math.min(10,G.st.sold%8));floater('+'+v,W/2,H/2,'#ffc83d');}break;}
case'sellall':{let t=0,k=0;G.cooler.forEach(i=>{t+=sellVal(i);k++;});G.cooler=[];addCoins(t);G.st.sold+=k;if(k){toast('Sold '+k+' fish for '+fmt(t)+' coins!');sfx('big');part(W/2,H/2,40,'#ffc83d',{up:300});}break;}
case'sellitems':{let t=0;ITEMS.forEach(i=>{const c=G.items[i.id]||0;t+=c*i.val;G.items[i.id]=Math.min(c,G.items[i.id]>0?G.items[i.id]:0);});ITEMS.forEach(i=>{if(G.items[i.id]>0)G.items[i.id]=0;});addCoins(t);if(t){toast('Sold items for '+fmt(t)+' coins');sfx('big');}break;}
case'tostall':{if(G.stall.length<STALL[G.stallLv][0]){G.stall.push(G.cooler.splice(x,1)[0]);}break;}
case'unstall':if(G.cooler.length<COOLER[G.coolerLv][0])G.cooler.push(G.stall.splice(x,1)[0]);break;
case'totank':{if(G.tank.length<TANK[G.tankLv][0]){const i=G.cooler.splice(x,1)[0];G.tank.push({id:i.id,cm:i.cm,kg:i.kg,g:i.g,h:.8,x:Math.random(),y:Math.random()});G.st.tanked++;}break;}
case'qacc':{const v=VILL[x];if(G.quests.length<3&&!G.quests.some(q=>q.vid===v.id)){G.quests.push(questFor(v));sfx('ach');}break;}
case'qdone':completeQuest(+x);break;
case'gift':giftFish(+x);break;
case'uplh':{if(G.lh<5&&G.coins>=LHCOST[G.lh]){G.coins-=LHCOST[G.lh];G.lh++;sfx('big');shake(10);part(W/2,H/3,50,['#ffe17a','#fff'],{up:300});}break;}
case'goto':{if(G.boat>=LOCI[x].boat){G.loc=x;closePanel();setMode('fish');return;}break;}
case'buymap':{const l=LOCI[x];if(G.coins>=l.cost){G.coins-=l.cost;G.maps[x]=1;sfx('big');shake(8);toast('New map: '+l.name+'!');}break;}
case'startcont':if(startContest()){closePanel();setMode('fish');toast('Contest started at '+LOCI[G.loc].name+'!');return;}break;
case'chal':startChal(+x);break;case'chalstop':G.chal=null;break;
case'hat':G.hat=+x;break;case'buyhat':{const h=HATS[x];if(G.coins>=h.cost){G.coins-=h.cost;unlockHat(+x);G.hat=+x;}break;}
case'skin':G.skin=+x;break;case'buyskin':{const s=ROD_SKINS[x];if(G.coins>=s.cost){G.coins-=s.cost;G.skins.push(+x);G.skin=+x;}break;}
case'theme':G.theme=+x;applyTheme();break;case'buytheme':{const s=THEMES[x];if(G.coins>=s.cost){G.coins-=s.cost;G.themes.push(+x);G.theme=+x;applyTheme();}break;}
case'title':if(x===undefined){save();setMode('title');closePanel();return;}G.titleSel=+x;break;
case'diff':G.diff=x;break;case'mute':G.mute=!G.mute;break;case'mini':G.mini=!G.mini;break;case'save':save();toast('Saved!');break;
case'reset':if(!G.rc){G.rc=1;toast('Press Erase save again to confirm');return;}try{localStorage.removeItem(SAVEKEY);}catch(e){}G=null;closePanel();setMode('title');return;
case'settings':openPanel('settings');return;
}
checkAch();save();renderPanel();updateHud();}
$('#pbody').addEventListener('input',e=>{if(e.target.dataset.r==='stall'){G.stallPct=+e.target.value;renderPanel();}});
document.body.addEventListener('click',e=>{initAudio();const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a;
if(a.startsWith('panel:')){openPanel(a.slice(6));return;}
switch(a){case'newgame':newGameFlow();return;case'continue':contGame();return;case'title':break;case'pausebtn':togglePause();return;case'minibtn':G.mini=!G.mini;return;case'mutebtn':G.mute=!G.mute;updateHud();return;case'skip':if(!skipNight())toast('It is not night time.');return;case'tovillage':setMode('village');return;case'tohouse':setMode('house');return;case'feed':feed();return;case'cast':pressMain();return;case'baitcycle':cycleBait();return;
case'res_keep':resultAct('keep');return;case'res_tank':resultAct('tank');return;case'res_sell':resultAct('sell');return;case'res_free':resultAct('free');return;case'hat':break;case'dpick':{document.querySelectorAll('#diffs .b').forEach(x=>x.classList.toggle('on',x===b));return;}case'helpbtn':openPanel('help');return;}
act(a);});
function feed(){if(G.coins<2){toast('Fish food costs 2 coins.');return;}G.coins-=2;G.st.fed++;const T=tankRect();for(let i=0;i<8;i++)foodList.push({x:T.x+T.w*(.2+Math.random()*.6),y:T.y+10+Math.random()*20});G.tank.forEach(t=>t.h=Math.min(1,t.h+.1));sfx('pop',2);checkAch();updateHud();}

if(mode==='house'){const T=tankRect();let hit=-1;G.tank.forEach((t,i)=>{if(Math.hypot((t.px||0)-x,(t.py||0)-y)<40)hit=i;});tankSel=hit;if(hit>=0){sfx('pop',2);part(x,y,6,'#fff',{up:60,g:100});}else if(x>T.x&&x<T.x+T.w&&y>T.y&&y<T.y+T.h){foodList.push({x,y});}
return;}
if(mode==='fish'){if(bonusG){bonusClick(x,y);return;}
if(fs==='result')return;
if(Math.hypot(x-SUN.x,y-SUN.y)<34){tickle('sun');return;}if(Math.hypot(x-MOON.x,y-MOON.y)<30){secret('moon');part(MOON.x,MOON.y,12,'#ffe',{});return;}if(Math.hypot(x-CLOUD.x,y-CLOUD.y)<50){CLOUD.n=(CLOUD.n||0)+1;if(CLOUD.n>=5){secret('cloud');CLOUD.n=0;}return;}
if(G.loc==='p'&&Math.hypot(x-DUCK.x,y-DUCK.y)<26){sfx('duck');unlockHat(6);secret('duck');floater('Quack!',DUCK.x,DUCK.y-20,'#ffe14d',24);return;}
if(GULL.on&&Math.hypot(x-GULL.x,y-GULL.y)<40){GULL.on=false;secret('gull');floater('Squawk!',GULL.x,GULL.y,'#fff',24);return;}
if(y>H*.45&&(fs==='idle')){WCL=(WCL||0)+1;if(WCL>=20){secret('bubbles');WCL=0;}}
if(fs==='reel'){hold=true;}else pressMain();}});
let WCL=0;function tickle(){secret('sun');floater('Hehe!',SUN.x,SUN.y+40,'#ffe14d',24);}
window.addEventListener('pointerup',()=>{hold=false;});window.addEventListener('pointercancel',()=>{hold=false;});
window.addEventListener('keydown',e=>{initAudio();
if(mode==='title'){nameBuf=(nameBuf+e.key).slice(-4);if(nameBuf.toLowerCase()==='fish'&&G){}}
if(G){if(e.key===KON[konami]){konami++;if(konami>=KON.length){konami=0;if(G){secret('konami');addCoins(100);}}}else konami=(e.key===KON[0])?1:0;}
if(!G)return;
if(e.key==='p'||e.key==='P'||e.key==='Escape'){if(panel&&panel!=='pause'){closePanel();return;}togglePause();return;}

if(mode==='fish'&&(e.key===' '||e.key==='ArrowUp'||e.key==='w'||e.key==='Enter')){e.preventDefault();if(e.repeat)return;if(fs==='reel')hold=true;else if(fs!=='result')pressMain();}
if(mode==='fish'&&fs==='result'){const m={'1':'keep','2':'tank','3':'sell','4':'free'}[e.key];if(m)resultAct(m);}
});

// ---------- loop ----------
function update(dt){tick+=dt;
FX.shake*=Math.pow(.01,dt);if(FX.shake<.3)FX.shake=0;FX.squash*=Math.pow(.02,dt);FX.flash=Math.max(0,FX.flash-dt*2.5);
if(FX.slowT>0){FX.slowT-=dt;if(FX.slowT<=0)FX.slow=1;}
if(!G||mode==='title'){updateMusic(dt);return;}
const rdt=dt;dt=dt*FX.slow;
const run=!paused&&!panel;
if(run){if(mode!=='house'||true)timeStep(dt);if(mode==='fish'){updateFish(dt);if(fs==='result'&&lastRes&&!$('#resbox').dataset.s){}}
if(mode==='fish'&&fs==='result'&&!showResDone){showRes();showResDone=true;}
if(mode==='fish'&&fs!=='result')showResDone=false;
tAuto+=rdt;if(tAuto>15){tAuto=0;save();}}
if(mode==='fish'&&fs!=='result')$('#resbox').classList.add('hide');
hudT-=rdt;if(hudT<=0){hudT=.25;updateHud();}
updateMusic(rdt);}
let showResDone=false,tAuto=0,hudT=0;
let last=performance.now();
function draw(dt){cx.setTransform(DPR,0,0,DPR,0,0);cx.clearRect(0,0,W,H);cx.save();if(FX.shake>0)cx.translate(rnd(-FX.shake,FX.shake),rnd(-FX.shake,FX.shake));
if(!G||mode==='title')drawTitle(dt);else if(mode==='village')drawVillage(dt);else if(mode==='fish')drawFishScene(dt);else drawTank(dt);
drawFX(dt);cx.restore();
if(FX.flash>0){cx.fillStyle=`rgba(255,255,255,${FX.flash*.5})`;cx.fillRect(0,0,W,H);}
if(FX.slow<1){cx.fillStyle='rgba(120,170,255,.12)';cx.fillRect(0,0,W,H);}}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused)update(dt);draw(dt);requestAnimationFrame(frame);}
function step(dt,n){for(let i=0;i<(n||1);i++){update(dt);}}
