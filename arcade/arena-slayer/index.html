<title>Arena Slayer - S.I.P. Arcade</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1d2a1f;font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;color:#fff;user-select:none;touch-action:none}
canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%}
#ui{position:fixed;inset:0;display:none;background:rgba(10,20,14,.72);overflow:auto;padding:8px;z-index:20;touch-action:pan-y}
.panel{background:linear-gradient(#3b5a43,#27402e);border:4px solid #8be07a;border-radius:22px;padding:16px 20px;max-width:96vw;margin:auto;text-align:center;box-shadow:0 8px 0 #14261a,0 14px 30px rgba(0,0,0,.5)}
.panel.wide{width:min(1020px,96vw)}
h1{margin:0;font-size:clamp(30px,7vw,60px);color:#ffe45e;text-shadow:0 4px 0 #b3541e,0 7px 0 #14261a;letter-spacing:2px}
h2{margin:4px 0 8px;color:#ffe45e;font-size:clamp(22px,4vw,32px)}
h3{margin:8px 0 4px;color:#b9f5ae;font-size:18px}
.sip{font-size:13px;letter-spacing:4px;color:#b9f5ae;margin-bottom:4px}
button{font:inherit;font-weight:bold;font-size:19px;color:#fff;background:#ff7b3a;border:0;border-radius:14px;padding:10px 22px;margin:5px;cursor:pointer;box-shadow:0 5px 0 #a73f12}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #a73f12}
button.g{background:#3fb86a;box-shadow:0 5px 0 #1d7a41}
button.b{background:#4a8fe0;box-shadow:0 5px 0 #25508f}
button.sm{font-size:14px;padding:6px 12px;margin:3px;border-radius:10px;box-shadow:0 3px 0 #a73f12}
button.g.sm{box-shadow:0 3px 0 #1d7a41}button.b.sm{box-shadow:0 3px 0 #25508f}
button:disabled{background:#6b6b6b;box-shadow:0 5px 0 #3a3a3a;cursor:default;opacity:.85}
button.sm:disabled{box-shadow:0 3px 0 #3a3a3a}
.cards{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.card{width:176px;background:#1f3326;border:3px solid #8be07a;border-radius:16px;padding:10px 8px;cursor:pointer;text-align:center;position:relative}
.card:hover{background:#2c4a36;transform:translateY(-3px)}
.card.sel{border-color:#ffe45e;background:#34563f}
.card.lock{opacity:.5;cursor:default}.card.gl{opacity:.92}.card.lock:hover{transform:none;background:#1f3326}
.card .ic{font-size:40px;line-height:1.1}.card .nm{font-weight:bold;font-size:17px;color:#ffe45e}
.card .ds{font-size:13px;color:#cfe9c8;margin-top:4px;min-height:34px}
.card .lv{font-size:13px;color:#8be07a;font-weight:bold}
.card.evo{border-color:#ff9bf0;background:#4a2a52}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#1f3326;border-radius:12px;padding:6px 12px;margin:5px 0;text-align:left}
.small{font-size:14px;color:#cfe9c8}.tiny{font-size:12px;color:#b6d3ae}
.gold{color:#ffd23f;font-weight:bold}
.stat{font-size:18px;margin:4px 0}
.tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:4px 0 8px}
.tab{background:#1f3326;border:3px solid #4c7a56;border-radius:12px;padding:5px 12px;font-size:15px;font-weight:bold;cursor:pointer;color:#fff;box-shadow:none;margin:0}
.tab.on{background:#ffe45e;color:#222;border-color:#ffe45e}
.nodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;text-align:left}
.node{background:#1f3326;border:2px solid #4c7a56;border-radius:12px;padding:7px 9px;font-size:14px}
.node.lk{opacity:.45}.node.mx{border-color:#ffd23f}
.node b{color:#ffe45e}
.cells{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.cell{width:104px;background:#1f3326;border:2px solid #4c7a56;border-radius:12px;padding:6px 3px;font-size:12px;text-align:center;min-height:100px}
.cell .ic{font-size:34px;height:44px;line-height:44px}
.cell.un .ic{filter:brightness(0) opacity(.55)}
.cell canvas{position:static;width:56px;height:56px}
.ach{display:flex;gap:10px;align-items:center;background:#1f3326;border-radius:12px;padding:6px 10px;margin:5px 0;text-align:left;border:2px solid #34503b}
.ach.done{border-color:#ffd23f;background:#33482f}
.ach .ai{font-size:28px;width:38px;text-align:center}
.srow{display:flex;justify-content:space-between;gap:12px;padding:3px 8px;border-bottom:1px solid #345a3e;font-size:15px;text-align:left}
input[type=range]{width:200px;accent-color:#ffe45e}
textarea{width:100%;height:96px;background:#142219;color:#dff;border:3px solid #4c7a56;border-radius:10px;font:12px monospace;padding:6px;user-select:text;resize:none}
input[type=text]{background:#142219;color:#fff;border:3px solid #4c7a56;border-radius:10px;font:bold 18px inherit;padding:6px 10px;width:150px;user-select:text}
.tg{cursor:pointer}
.bar{height:10px;background:#142219;border-radius:6px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:#8be07a}
.focus{outline:5px solid #fff;outline-offset:2px}
.pill{display:inline-block;background:#142219;border-radius:10px;padding:2px 8px;margin:2px;font-size:13px}
.warn{color:#ffb4b4}
.good{color:#9dff9d}
#toasts{position:fixed;top:10px;right:10px;z-index:30;display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:min(320px,70vw)}
.toast{background:#27402e;border:3px solid #ffe45e;border-radius:12px;padding:7px 12px;font-weight:bold;font-size:14px;box-shadow:0 4px 10px rgba(0,0,0,.4);animation:tin .3s}

function baseLv(d,l){
 const s=Object.assign({},d.base);let nd=0,nD=0;
 for(let i=0;i<l-1;i++){const c=d.up[i];
  if(c==='d')nd++;else if(c==='D')nD++;
  else if(c==='n')s.n=(s.n||1)+1;
  else if(c==='a'){if(s.area!=null)s.area*=1.22;else if(s.r!=null)s.r*=1.2;}
  else if(c==='c'){if(s.cd!=null)s.cd*=.85;else if(s.tick!=null)s.tick*=.85;}
  else if(c==='p')s.pierce=(s.pierce||0)+1;
  else if(c==='s'){if(s.spd!=null)s.spd*=1.15;else if(s.rot!=null)s.rot*=1.15;}
  else if(c==='l'){for(const k of['l','pool','life','dur'])if(s[k]!=null){s[k]*=1.2;break;}}
  else if(c==='b')s.bounce=(s.bounce||0)+2;
  else if(c==='j')s.jumps=(s.jumps||0)+1;}
 s.dmg*=1+.3*nd+.5*nD;
 return s;
}
function upText(id,lv){const d=WEAPONS[id];return UPTXT[d.up[lv-2]]||'';}

 s.hw=Object.keys(save.winHeroes).length;
 s.dw=Object.keys(save.disc.w).length;s.dp=Object.keys(save.disc.p).length;s.de=Object.keys(save.disc.e).length;s.db=Object.keys(save.disc.b).length;s.devo=Object.keys(save.disc.v).length;
 s.spent=save.spent;s.metaCount=Object.values(save.meta).reduce((a,b)=>a+b,0);
 s.flawless=save.st.flawless;s.chal=save.st.chal;s.chalSeeds=Object.keys(save.chal).filter(k=>save.chal[k].win).length;s.endless=save.st.endless;
 s.r=r?{lv:r.maxLv,kills:r.kills,time:r.time,wc:weapons.length,pc:Object.keys(pass).length,
  maxw:weapons.some(w=>w.lv>=8||w.evo!=null),maxp:PIDS.some(id=>(pass[id]||0)>=PASSIVES[id].max),gold:r.gold,solo:!!r.soloWin,revived:r.revived}
  :{lv:0,kills:0,time:0,wc:0,pc:0,maxw:false,maxp:false,gold:0,solo:false,revived:false};

 const mult=S.rew*G.cu.rew*(1+.1*ML('gold')+.04*ML('brave')*G.curse)*(G.mods.swarm?1.25:1)*(G.chal?1.5:1);

 save.gold+=earn;save.earned+=earn;save.runs++;save.st.kills+=G.kills;save.st.time+=G.time;save.st.levels+=G.lv;
 if(kind==='dead')save.st.deaths++;

 const sb=save.stageBest[G.stage]||(save.stageBest[G.stage]={time:0,kills:0,endless:0,lv:0});

/* ---------- level-up choices ---------- */
let choices=[];
function evoReady(w){if(w.evo!=null||w.lv<8)return -1;const ei=EVO_BY_W[w.id];if(ei==null)return -1;return (pass[EVOS[ei].p]||0)>0?ei:-1;}
function makeChoices(){
 const wmax=6+ML('slot'),pmax=6+ML('slot');const out=[];
 for(const w of weapons){const ei=evoReady(w);if(ei>=0)out.push({k:'e',id:w.id,ei});}
 const owned=[],fresh=[];
 for(const w of weapons)if(w.evo==null&&w.lv<8)owned.push({k:'w',id:w.id,lv:w.lv+1,wt:3});
 if(weapons.length<wmax)for(const id of WIDS)if(weaponUnlocked(id)&&!weapons.some(w=>w.id===id))fresh.push({k:'w',id,lv:1,wt:weapons.length>=4?1:1.6});
 const np=Object.keys(pass).length;
 for(const id of PIDS){if(!passiveUnlocked(id))continue;const o=pass[id]||0;
  if(o>0){if(o<PASSIVES[id].max)owned.push({k:'p',id,lv:o+1,wt:2.5});}
  else if(np<pmax)fresh.push({k:'p',id,lv:1,wt:np>=4?1:1.6});}
 const ok=c=>!G.banned[c.k+c.id];
 const own=owned.filter(ok),fr=fresh.filter(ok);
 const want=3+ML('pick4');
 const draw=(arr)=>{let tot=0;for(const c of arr)tot+=c.wt;let r=RN()*tot,idx=0;for(;idx<arr.length-1;idx++){r-=arr[idx].wt;if(r<=0)break;}return arr.splice(idx,1)[0];};
 if(own.length&&out.length<want)out.push(draw(own));
 const rest=own.concat(fr);
 while(out.length<want&&rest.length)out.push(draw(rest));
 const fb=G.mods.nosnack?['gold','gold','gold','gold']:['heal','gold','heal','gold'];
 let q=0;while(out.length<want)out.push({k:'f',id:fb[q++%4]});
 return out.slice(0,want);
}
function evolveWeapon(w,ei){
 w.evo=ei;w.s=wstat(w);G.evos++;save.st.evos++;discover('v',ei);
 fxs.push({k:'ring',x:P.x,y:P.y,r:220,t:.8,m:.8,c:'#ff9bf0',follow:true});burst(P.x,P.y,'#ff9bf0',24,260,true);addShake(8);
 banner('EVOLVED! '+EVOS[ei].n,3.5);snd('evo');checkAch();
}
function applyChoice(c){
 if(c.k==='w'){const w=weapons.find(x=>x.id===c.id);if(w){w.lv=c.lv;w.s=wstat(w);}else{addWeapon(c.id);G.solo=false;}}
 else if(c.k==='p'){pass[c.id]=c.lv;discover('p',c.id,'New item discovered: '+PASSIVES[c.id].n);if(c.id==='compass')G.rerolls++;recalc();}
 else if(c.k==='e'){const w=weapons.find(x=>x.id===c.id);if(w)evolveWeapon(w,c.ei);}
 else if(c.id==='heal')P.hp=Math.min(P.mhp,P.hp+P.mhp*.4);
 else G.gold+=25;
 G.dirty=true;
}
function cardInfo(c){
 let ic,nm,ds,lv,tag='',cls='';
 if(c.k==='w'){const w=WEAPONS[c.id];ic=w.ic;nm=w.n;ds=c.lv===1?w.d:upText(c.id,c.lv);lv=c.lv===1?'NEW!':'Lv '+(c.lv-1)+' → '+c.lv+(c.lv===8?' MAX':'');
  const ei=EVO_BY_W[c.id];if(ei!=null&&(c.lv>=7||ML('hint')||save.disc.v[ei]))tag='★ Evolves with '+PASSIVES[EVOS[ei].p].ic+' '+PASSIVES[EVOS[ei].p].n;}
 else if(c.k==='p'){const p=PASSIVES[c.id];ic=p.ic;nm=p.n;ds=p.d;lv=c.lv===1?'NEW!':'Lv '+(c.lv-1)+' → '+c.lv;
  const owned=weapons.find(w=>w.evo==null&&EVO_BY_W[w.id]!=null&&EVOS[EVO_BY_W[w.id]].p===c.id);if(owned)tag='★ Evolves your '+WEAPONS[owned.id].n+' (Lv '+owned.lv+'/8)';}
 else if(c.k==='e'){const e=EVOS[c.ei];ic=e.ic;nm='EVOLVE: '+e.n;ds=e.d;lv='★ Super powerful! ★';cls=' evo';}
 else if(c.id==='heal'){ic='\u{1F34E}';nm='Snack Time';ds='Heal 40% health.';lv='';}
 else{ic='\u{1FA99}';nm='Coin Pouch';ds='+25 gold for this run.';lv='';}
 return{ic,nm,ds,lv,tag,cls};
}
function chestOpen(){
 G.chests++;save.st.chests++;const res=[];let evolved=false;
 for(const w of weapons){const ei=evoReady(w);if(ei>=0){const nm=EVOS[ei].n;evolveWeapon(w,ei);res.push('EVOLVED into '+EVOS[ei].ic+' '+nm+'!');evolved=true;break;}}
 if(!evolved){const cnt=1+P.st.chest;
  for(let i=0;i<cnt;i++){const cs=makeChoices().filter(c=>c.k!=='f');if(!cs.length)break;const c=cs[ri(cs.length)];const ci=cardInfo(c);applyChoice(c);res.push(ci.ic+' '+ci.nm+(ci.lv?' ('+ci.lv+')':''));}}

 if(!G.mods.nosnack){P.hp=Math.min(P.mhp,P.hp+P.mhp*.2);}
 checkAch();return res;
}

 else if(collTab==='p')for(const id of PIDS){const p=PASSIVES[id],d=!!save.disc.p[id];total++;if(d)found++;
  let hint='';if(!d){if(p.lock&&!passiveUnlocked(id)){const a=achFor('p',id);hint=a?'\u{1F512} '+esc(a.n):'';}else hint='Not found yet';}
  h+='<div class="cell'+(d?'':' un')+'"><div class="ic">'+p.ic+'</div><b>'+(d?p.n:'???')+'</b><div class="tiny">'+(d?esc(p.d):hint)+'</div></div>';}
 else if(collTab==='v')EVOS.forEach((e,i)=>{const d=!!save.disc.v[i];total++;if(d)found++;

 else if(collTab==='e')ET.forEach((e,i)=>{const d=!!save.disc.e[i];total++;if(d)found++;
  h+='<div class="cell"><canvas width="112" height="112" data-e="'+i+'"></canvas><b>'+(d?e.n:'???')+'</b><div class="tiny">'+(d?(e.el?'Elite - ':'')+STAGES[e.st].n:'Not found yet')+'</div></div>';});

/* ---------- challenge ---------- */
function chalCfg(text){
 const key=chalKey(text);const r=mulberry32(hashStr(key));
 const stages=STAGES.map((_,i)=>i).filter(i=>i===0||save.stageWon[i-1]);
 const chars=CHARS.map((_,i)=>i).filter(charUnlocked);
 const stage=stages[(r()*stages.length)|0],ch=chars[(r()*chars.length)|0],curse=(r()*(save.curseMax+1))|0;
 const pool=MODS.map(m=>m.id);const mods=[];const nm=r()<.3?3:2;while(mods.length<nm)mods.push(pool.splice((r()*pool.length)|0,1)[0]);
 return{stage,ch,curse,mods,seed:hashStr(key),seedText:key,chal:true,endless:false};
}
function rollSeed(){return String(1+Math.floor(Math.random()*99999));}

 let h='<div class="panel"><h2>Challenge Run</h2><div class="small">Every seed is the same game every time. Try a seed again to beat your own time. No timers, no expiry!</div>'+
  '<div style="margin:8px 0">Seed: <input type="text" id="seedin" maxlength="24" value="'+esc(cfg.seedText)+'"> <button class="sm b" data-a="chalset">Use</button><button class="sm" data-a="chalroll">\u{1F3B2} New seed</button></div>'+

/* ---------- click handling ---------- */
ui.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;uiAct(b.dataset.a,b.dataset.v);});
function uiAct(a,v){
 initAudio();if(AC&&!mus.on)musicStart(G&&state!=='title'?G.stage:6);
 switch(a){
 case'play':snd('ui');setupScreen();break;
 case'stage':snd('ui');save.sel.stage=+v;setupScreen(true);break;
 case'hero':snd('ui');save.sel.ch=+v;setupScreen(true);break;
 case'curse':snd('ui');save.sel.curse=+v;setupScreen(true);break;
 case'mode':snd('ui');save.sel.endless=v==='1';setupScreen(true);break;
 case'unlockc':{const c=CHARS[+v];if(c.u.t==='gold'&&save.gold>=c.u.g&&!save.unl.c[+v]){save.gold-=c.u.g;save.spent+=c.u.g;save.unl.c[+v]=1;persist();snd('coin');toast(c.n+' joined your team!');checkAch();setupScreen(true);}break;}
 case'start':{snd('ui');const s=save.sel;startRun({stage:s.stage,ch:s.ch,curse:s.curse,endless:s.endless&&!!save.stageWon[s.stage]});break;}
 case'retry':snd('ui');if(G&&G.chal){startRun(G.cfg);}else{const s=save.sel;startRun({stage:G.stage,ch:G.ch,curse:G.curse,endless:G.cfg.endless});}break;
 case'title':snd('ui');titleScreen();break;
 case'shop':snd('ui');shopScreen();break;
 case'tab':snd('ui');shopTab=v;shopScreen(true);break;
 case'buy':{const m=METAS.find(x=>x.id===v);if(m&&canBuy(m)){const c=costOf(m);save.gold-=c;save.spent+=c;save.meta[m.id]=ML(m.id)+1;persist();snd('coin');checkAch();shopScreen(true);}break;}
 case'respec':{let refund=0;for(const m of METAS)for(let l=0;l<ML(m.id);l++)refund+=Math.round(m.base*(1+l*.9));
  if(refund>0){save.gold+=refund;save.spent=Math.max(0,save.spent-refund);save.meta={};persist();snd('coin');toast('Refunded '+refund+' gold. Spend it again!');}shopScreen(true);break;}
 case'coll':snd('ui');collectionScreen();break;
 case'ctab':snd('ui');collTab=v;collectionScreen(true);break;
 case'ach':snd('ui');achScreen();break;
 case'stats':snd('ui');statsScreen();break;
 case'chal':snd('ui');chalScreen();break;
 case'chalroll':chalText=rollSeed();chalScreen();break;
 case'chalset':{const el=$('seedin');chalText=chalKey(el?el.value:'')||rollSeed();chalScreen();break;}
 case'chalstart':{const el=$('seedin');if(el&&chalKey(el.value)!==chalKey(chalText))chalText=chalKey(el.value);startRun(chalCfg(chalText));break;}

const joyEnd=e=>{if(e.pointerId===joy.id){joy.a=false;joy.x=joy.y=0;joy.id=-1;}};

// gamepad
const padPrev={};let padNavT=0;
function pollPad(dt){
 let g=null;try{const gps=navigator.getGamepads?navigator.getGamepads():[];for(const p of gps){if(p&&p.connected){g=p;break;}}}catch(e){}
 if(!g){pad.on=false;pad.x=pad.y=0;return;}
 const B=i=>!!(g.buttons[i]&&g.buttons[i].pressed);
 const edge=i=>{const n=B(i),w=padPrev[i];padPrev[i]=n;return n&&!w;};
 let x=g.axes[0]||0,y=g.axes[1]||0;if(Math.hypot(x,y)<.22)x=y=0;
 if(B(14))x=-1;if(B(15))x=1;if(B(12))y=-1;if(B(13))y=1;
 pad.x=x;pad.y=y;pad.on=!!(x||y);
 if(x||y||B(0)||B(1)||B(9)){noteInput();}
 const start=edge(9),a=edge(0),bb=edge(1);
 // navigation edges
 const nav=(dir)=>{const k='n'+dir;const on=dir==='l'?x<-.5:dir==='r'?x>.5:dir==='u'?y<-.5:y>.5;const w=padPrev[k];padPrev[k]=on;return on&&!w;};
 const nl=nav('l'),nr=nav('r'),nu=nav('u'),nd=nav('d');
 if(state==='play'){if(start)pauseScreen();return;}
 if(state==='pause'&&start){if(ui.querySelector('[data-a="optsback"]'))uiAct('optsback');else resumeRun();return;}
 if(state==='title'&&!ui.innerHTML)return;
 if(ui.style.display!=='flex')return;
 if(nl||nr||nu||nd||a||bb)padUsed=true;
 const f=focusables();if(!f.length)return;
 if(nr||nd){uiFocus=(uiFocus+1)%f.length;applyFocus();}
 if(nl||nu){uiFocus=(uiFocus-1+f.length)%f.length;applyFocus();}
 if(a){const el=f[clamp(uiFocus,0,f.length-1)];if(el)el.click();}
 if(bb){const bk=ui.querySelector('[data-back]');if(bk)bk.click();}
}

/* ---------- break reminder (gentle, never blocks play) ---------- */
const sit={active:0,next:3600,idleCut:300};
function showBreak(){const el=$('brk');if(el.style.display==='block')return;
 el.innerHTML='\u{1F4A7} You have been playing a while. Time to stretch and drink some water!<br><button class="b" id="brkok">OK, thanks!</button><button id="brk20">Remind me later</button>';
 el.style.display='block';
 $('brkok').onclick=()=>{el.style.display='none';sit.next=sit.active+1800;};
 $('brk20').onclick=()=>{el.style.display='none';sit.next=sit.active+1200;};
}
setInterval(()=>{
 const idle=(Date.now()-lastInput)/1000;
 if(document.hidden||idle>sit.idleCut){ // a real break resets the sitting
  if(document.hidden||idle>sit.idleCut){sit.hid=(sit.hid||0)+1;if(sit.hid>=sit.idleCut){sit.active=0;sit.next=3600;sit.hid=0;}}
  return;}
 sit.hid=0;sit.active++;
 if(sit.active>=sit.next)showBreak();
},1000);
setInterval(()=>{persist();},20000);

const WORLD={play:1,pause:1,levelup:1,chest:1,victory:1,dead:1};
function loop(now){
 requestAnimationFrame(loop);
 let dt=(now-last)/1000;last=now;if(dt>.05)dt=.05;if(dt<0)dt=0;
 fpsN++;fpsT+=dt;if(fpsT>=1){fpsShow=fpsN;fpsN=0;fpsT=0;}
 try{
  pollPad(dt);
  if(state==='play'&&!FREEZE){update(dt);}
  else if(!WORLD[state])tnow+=dt;
  if(G&&WORLD[state])render();else renderTitle();
 }catch(err){console.error(err);}
}
