<style>
html,body{margin:0;height:100%;background:#05060d;overflow:hidden;font-family:"Trebuchet MS",Verdana,sans-serif;font-weight:800;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:960px;height:540px;overflow:hidden;background:#000}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ov.on{display:flex}
#title{background:linear-gradient(180deg,rgba(5,8,30,.55),rgba(5,8,30,.82))}
h1{margin:0;font-size:3.6em;letter-spacing:.04em;font-style:italic;color:#ffd53b;text-shadow:0 .06em 0 #e2561a,0 .12em 0 #8a2a0a,0 .2em .3em rgba(0,0,0,.6);line-height:1}
.sub{font-size:.95em;letter-spacing:.35em;color:#9fe3ff;margin:.2em 0 .7em}
.row{display:flex;gap:.6em;justify-content:center;margin:.25em 0}
.card{width:9.2em;padding:.4em .4em .5em;border-radius:.7em;background:rgba(255,255,255,.1);border:.14em solid rgba(255,255,255,.25);cursor:pointer;font-size:.8em;transition:transform .1s}
.card:hover{transform:translateY(-2px)}
.card.sel{border-color:#ffd53b;background:rgba(255,213,59,.2);box-shadow:0 0 .8em rgba(255,213,59,.5)}
.card canvas{display:block;margin:0 auto .2em;width:100%;height:auto;border-radius:.4em}
.card small{display:block;font-weight:600;opacity:.8;font-size:.78em}
.bar{height:.4em;background:rgba(255,255,255,.2);border-radius:.3em;margin:.18em .3em;position:relative;text-align:left}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:.3em;background:#6ef07a}
.lbl{font-size:.7em;opacity:.8;letter-spacing:.2em;margin:.5em 0 .1em}
.btn{font:inherit;font-size:1.25em;padding:.4em 1.4em;margin:.3em;border:0;border-radius:.6em;background:linear-gradient(#ffe35a,#ff9d1c);color:#4a1d00;cursor:pointer;box-shadow:0 .2em 0 #a8500b,0 .4em .6em rgba(0,0,0,.4);font-weight:900}
.btn:active{transform:translateY(.1em)}
.btn.alt{background:linear-gradient(#8fd8ff,#3c8dff);color:#00233f;box-shadow:0 .2em 0 #1a4c9a,0 .4em .6em rgba(0,0,0,.4)}
.hint{font-size:.72em;opacity:.8;margin-top:.5em;font-weight:600}
#pause,#res{background:rgba(5,8,30,.8)}
#pause h2,#res h2{margin:.1em 0;font-size:2.4em;color:#ffd53b;text-shadow:0 .08em 0 #8a2a0a}
#podium{display:flex;align-items:flex-end;justify-content:center;gap:.5em;margin:.2em 0}
.pod{width:8em;text-align:center;font-size:.8em}
.pod canvas{width:7em;height:auto;display:block;margin:0 auto}
.pod .blk{border-radius:.4em .4em 0 0;font-size:2em;padding:.1em 0;color:#222}
#tbl{font-size:.75em;font-weight:700;margin:.3em 0;border-collapse:collapse;min-width:20em}
#tbl td{padding:.12em .7em;text-align:left}
#tbl tr.me{background:rgba(255,213,59,.35);color:#fff}
#touch{display:none}
.tb{position:absolute;display:none;border:.15em solid rgba(255,255,255,.55);background:rgba(255,255,255,.18);border-radius:1.2em;color:#fff;font-size:1.3em;align-items:center;justify-content:center;touch-action:none}
.tb.p{background:rgba(255,213,59,.55)}
.touch[data-s=race] .tb,.touch[data-s=count] .tb{display:flex}
#bL{left:3%;bottom:5%;width:15%;height:22%}#bR{left:20%;bottom:5%;width:15%;height:22%}
#bGas{right:3%;bottom:5%;width:20%;height:26%;background:rgba(90,230,110,.35)}
#bDrift{right:25%;bottom:5%;width:14%;height:20%}#bItem{right:3%;bottom:34%;width:14%;height:20%}
#pbtn{position:absolute;right:1.5%;top:13%;width:3.2em;height:3.2em;border-radius:50%;border:.12em solid rgba(255,255,255,.6);background:rgba(0,0,0,.35);color:#fff;font:inherit;font-size:.9em;display:none;cursor:pointer}
#stage[data-s=race] #pbtn,#stage[data-s=count] #pbtn{display:block}
</style></head><body>
<div id="wrap"><div id="stage" data-s="title">
<canvas id="c" width="960" height="540"></canvas>
<div class="ov on" id="title">
 <h1>TURBO KART</h1><div class="sub">S.I.P. ARCADE</div>
 <div class="lbl">CHOOSE YOUR TRACK</div><div class="row" id="trk"></div>
 <div class="lbl">CHOOSE YOUR KART</div><div class="row" id="krt"></div>
 <button class="btn" id="go">START RACE</button>
 <div class="hint">Arrows / WASD steer + gas &nbsp;|&nbsp; SHIFT or Z drift &nbsp;|&nbsp; SPACE or X use item &nbsp;|&nbsp; P pause &nbsp;|&nbsp; M sound</div>
</div>
<div class="ov" id="pause"><h2>PAUSED</h2>
 <button class="btn" id="bRes">RESUME</button><button class="btn alt" id="bRst">RESTART</button><button class="btn alt" id="bQuit">MENU</button>
 <button class="btn alt" id="bGfx" style="font-size:.85em;padding:.25em 1em"></button></div>
<div class="ov" id="res"><h2 id="rt">RESULTS</h2><div id="podium"></div><table id="tbl"></table><div id="rnote" class="hint"></div>
 <div class="row"><button class="btn" id="bRetry">RETRY</button><button class="btn alt" id="bMenu">MENU</button></div></div>
<button id="pbtn">II</button>
<div id="touch"><div class="tb" id="bL">&#9664;</div><div class="tb" id="bR">&#9654;</div><div class="tb" id="bGas">GAS</div><div class="tb" id="bDrift">DRIFT</div><div class="tb" id="bItem">ITEM</div></div>
</div></div>
<script>

/* ---------- track build ---------- */
function lastY(){return segs.length?segs[segs.length-1].p2.y:0}
function addSeg(curve,y){var n=segs.length;
 segs.push({index:n,p1:{x:0,y:lastY(),z:n*SEG},p2:{x:0,y:y,z:(n+1)*SEG},curve:curve,spr:[],boxes:[],dyn:[],band:Math.floor(n/RUMBLE)%2,clip:0})}
function eIO(a,b,p){return a+(b-a)*((-Math.cos(p*Math.PI)/2)+.5)}
function eIn(a,b,p){return a+(b-a)*p*p}
function addRoad(e,h,l,c,hy){var sy=lastY(),ey=sy+hy*SEG,tot=e+h+l,n;
 for(n=0;n<e;n++)addSeg(eIn(0,c,n/e),eIO(sy,ey,(n+1)/tot));
 for(n=0;n<h;n++)addSeg(c,eIO(sy,ey,(e+n+1)/tot));
 for(n=0;n<l;n++)addSeg(eIO(c,0,n/l),eIO(sy,ey,(e+h+n+1)/tot))}
function buildTrack(i){
 tr=TRACKS[i];pal=tr.pal;segs=[];oils=[];shells=[];
 var r=tr.road,k;
 for(k=0;k<r.length;k++){var len=Math.round(r[k][0]*tr.scale),e=Math.round(len*.25),h=Math.round(len*.5);addRoad(e,h,len-e-h,r[k][1],r[k][2])}
 var ly=lastY();addRoad(50,40,60,0,-ly/SEG);
 segs[segs.length-1].p2.y=0;
 N=segs.length;L=N*SEG;
 scenery();makeBgs();
 var g=ctx.createLinearGradient(0,0,0,HY);g.addColorStop(0,pal.skyT);g.addColorStop(1,pal.skyB);skyGrad=g;
}

/* ---------- scenery ---------- */
function scenery(){
 var R=rngf(tr.seed),th=tr.theme,i,s,side,r,o;
 // item boxes
 for(i=120;i<N-80;i+=Math.round(N/11)){for(var b=-1;b<=1;b++){segs[i].boxes.push({o:b*0.5,on:true,t:0})}}
 for(i=4;i<N;i++){s=segs[i];
  if(Math.abs(s.curve)>=3.4&&i%4===0){s.spr.push({t:'chev',o:s.curve>0?-1.3:1.3,d:s.curve>0?1:-1,k:1})}
  if(i%2)continue;
  for(side=-1;side<=1;side+=2){r=R();o=side*(1.35+R()*3.4);
   if(th==='meadow'){
    if(r<.22)s.spr.push({t:'tree',o:o,k:.8+R()*.6,v:R()});
    else if(r<.34)s.spr.push({t:'pine',o:o,k:.8+R()*.6,v:R()});
    else if(r<.44)s.spr.push({t:'bush',o:side*(1.25+R()*1.2),k:.7+R()*.6,v:R()});
    else if(r<.52)s.spr.push({t:'flower',o:side*(1.25+R()*2.5),k:1,v:R()});
    else if(r<.535)s.spr.push({t:'house',o:side*(2.6+R()*2),k:1,v:R()});
   }else if(th==='desert'){
    if(r<.2)s.spr.push({t:'cactus',o:o,k:.8+R()*.7,v:R()});
    else if(r<.28)s.spr.push({t:'rock',o:side*(1.3+R()*2.5),k:.6+R()*.9,v:R()});
    else if(r<.32)s.spr.push({t:'palm',o:o,k:.9+R()*.4,v:R()});
    else if(r<.37)s.spr.push({t:'dbush',o:o,k:.8,v:R()});
    else if(r<.395)s.spr.push({t:'mesa',o:side*(5+R()*6),k:1+R()*1.2,v:R()});
   }else if(th==='snow'){
    if(r<.3)s.spr.push({t:'pine',o:o,k:.9+R()*.7,v:R(),snow:1});
    else if(r<.37)s.spr.push({t:'icerock',o:o,k:.7+R()*.8,v:R()});

    else if(r<.43)s.spr.push({t:'candy',o:side*(1.2+R()*.3),k:1,v:R()});
   }else{
    if(r<.2)s.spr.push({t:'bldg',o:side*(2.2+R()*3),k:.8+R()*.8,v:R(),h:R()});
    else if(r<.24)s.spr.push({t:'nsign',o:side*(1.4+R()*1.5),k:1,v:R()});
   }
  }
  if(th==='neon'&&i%8===0){s.spr.push({t:'lamp',o:-1.18,k:1,v:0});s.spr.push({t:'lamp',o:1.18,k:1,v:1})}
 }
 segs[1].spr.push({t:'arch',o:0,k:1});
}

   if(cl<syr){ctx.save();ctx.beginPath();ctx.rect(-300,0,W+600,Math.max(0,cl));ctx.clip()}
   if(o.kind==='k'){var kk=o.k;kk.wr=((kk.wr||0)+spfOf(kk)*.2)%1;if(kk.ph===undefined)kk.ph=Math.random()*6.28;
    drawKartR(ctx,sxr+uu*kk.x*ROADW,syr,uu,{body:kk.body,acc:kk.acc,helm:kk.helm,lean:kk.st*.06,spin:kk.spinA,flame:kk.flame,t:clock,sp:spfOf(kk),ph:kk.ph,wr:kk.wr,air:kk.hop>0,bo:kk.boost>0})}
   else if(o.kind==='o')drawOilR(sxr+uu*o.o.x*ROADW,syr,uu);
   else drawShellR(sxr+uu*o.s.x*ROADW,syr,uu,o.s);
   if(cl<syr)ctx.restore()}
  ctx.globalAlpha=1}
 // motion blur (zoom streak) before the player's kart
 if(GQ===2){var mb=bst?.22:clamp((spf-.82)*1.1,0,.14);
  if(mb>.01){ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=mb;var z=1.035;ctx.drawImage(cv,W/2-W/2*z,HY-HY*z,W*z,H*z);ctx.restore()}}
 // player
 var py=playerScreenY()+(player.hop>0?-Math.sin(player.hop/.25*Math.PI)*22:0)+(Math.abs(player.x)>1&&player.speed>2500?Math.sin(clock*70)*3:0);
 tgt.wr=((tgt.wr||0)+spfOf(tgt)*.2)%1;if(tgt.ph===undefined)tgt.ph=Math.random()*6.28;
 drawKartR(ctx,W/2,py,CAMD/PZ*W/2,{body:tgt.body,acc:tgt.acc,helm:tgt.helm,lean:tgt.st*.07+(tgt.drift?tgt.dd*.1:0),spin:tgt.spinA,flame:tgt.flame,t:clock,sp:spfOf(tgt),ph:tgt.ph,wr:tgt.wr,air:tgt.hop>0,bo:tgt.boost>0,hopl:0});
 // particles (soft sprites: sparks glow, smoke and dust billow)
 for(i=0;i<parts.length;i++){var pp=parts[i],lf=clamp(pp.life/pp.m,0,1),pim=soft(pp.c),rr;
  if(pp.f===3){rr=pp.s*(1.6+(1-lf)*2.8);ctx.globalAlpha=lf*.3}
  else if(pp.f===2||pp.s>=8){rr=pp.s*(1.5+(1-lf)*1.3);ctx.globalAlpha=lf*.5}
  else{rr=pp.s*2.8*(.5+lf*.5);ctx.globalAlpha=lf;ctx.globalCompositeOperation='lighter'}
  ctx.drawImage(pim,pp.x-rr,pp.y-rr,rr*2,rr*2);ctx.globalCompositeOperation='source-over'}
 ctx.globalAlpha=1;
 // speed lines
 if(state!=='title'){
  if(GQ===2&&(bst||spf>1)){var na=bst?26:12;ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
   for(i=0;i<na;i++){var a=Math.random()*6.2832,r1=170+Math.random()*120,r2=r1+90+Math.random()*190,cA=Math.cos(a),sA=Math.sin(a),x1=W/2+cA*r1*1.6,y1=H*.45+sA*r1,x2=W/2+cA*r2*1.6,y2=H*.45+sA*r2;
    var gl=ctx.createLinearGradient(x1,y1,x2,y2);gl.addColorStop(0,'rgba(255,255,255,0)');gl.addColorStop(1,'rgba(255,255,255,'+(.15+Math.random()*.25)+')');ctx.strokeStyle=gl;ctx.lineWidth=1+Math.random()*2.2;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
   ctx.globalCompositeOperation='source-over'}
  else if(bst&&lite){ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;ctx.beginPath();for(i=0;i<22;i++){var a2=Math.random()*6.28,q1=200+Math.random()*100,q2=q1+80+Math.random()*120;ctx.moveTo(W/2+Math.cos(a2)*q1*1.6,H*.45+Math.sin(a2)*q1);ctx.lineTo(W/2+Math.cos(a2)*q2*1.6,H*.45+Math.sin(a2)*q2)}ctx.stroke()}}
 if(th==='snow')drawSnowR(tgt);
 lensFlare();
 ctx.restore();
 postFx(tgt,spf,bst);
 if(state==='title')return;
 hud(tgt)}
function spfOf(k){return clamp(k.speed/MAXSPD,0,1.3)}
function render(){if(GQ===0)renderC();else renderR()}

var gfxPref=null;
function gfxLabel(){var b=$('bGfx');if(b)b.textContent='Graphics: '+(GQ===0?'Classic':GQ===1?'Realistic (lite)':'Realistic')}
function setGfx(q,save){GQ=q;if(save){try{localStorage.setItem('sip_turbo-kart_gfx',q?'real':'classic')}catch(e){}}gfxLabel();slowT=0;emaDt=1/60}
function toggleGfx(){setGfx(GQ?0:2,true);if(state==='race'||state==='count'||state==='finish')toast('Graphics: '+(GQ?'Realistic':'Classic'),'#fff',1.2)}
var slowT=0,emaDt=1/60,lastTs=0,noAuto=false;
function perfWatch(ts){
 var d=(ts-lastTs)/1000;lastTs=ts;if(!(d>0)||d>.25||paused||document.hidden||noAuto||GQ!==2){if(d>.25)slowT=0;return}
 emaDt=emaDt*.9+d*.1;
 if(emaDt>1/40){slowT+=d;if(slowT>=3){setGfx(1,false);console.log('Graphics set to Realistic (lite) for speed')}}else slowT=Math.max(0,slowT-d)}

/* ---------- main loop ---------- */
var last=0,acc=0;
function frame(ts){
 requestAnimationFrame(frame);perfWatch(ts);
 var dt=Math.min(.1,(ts-last)/1000||0);last=ts;
 if(!paused){acc+=dt;var c=0;while(acc>=1/60&&c<6){try{update(1/60)}catch(e){console.error(e);acc=0;break}acc-=1/60;c++}if(c>=6)acc=0}
 try{render();audioFrame()}catch(e){console.error(e)}
}
function fit(){var w=innerWidth,h=innerHeight,sw=w,sh=w*9/16;if(sh>h){sh=h;sw=h*16/9}stage.style.width=sw+'px';stage.style.height=sh+'px';stage.style.fontSize=(sh/540*16)+'px'}
addEventListener('resize',fit);fit();
gfxLabel();buildCards();setupRace(true);
requestAnimationFrame(frame);
window.TK={setQ:function(q){setGfx(q,false)},q:function(){return GQ},noAuto:function(v){noAuto=v},render:render,step:function(n,dt){for(var i=0;i<n;i++)update(dt||1/60)},get:function(){return{state:state,karts:karts,player:player,raceTime:raceTime,L:L,N:N,segs:segs}},start:function(t,k){selTrack=t;selKart=k;startGame()},setKeys:function(o){K=o},press:function(){itemReq=true},setAuto:function(v){player.auto=v},res:function(){return state},pause:setPause};
})();
