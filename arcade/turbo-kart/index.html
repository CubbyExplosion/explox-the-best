<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<style>
html,body{margin:0;height:100%;background:#05060d;overflow:hidden;font-family:"Trebuchet MS",Verdana,sans-serif;font-weight:800;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}

.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ov.on{display:flex}

.sub{font-size:.95em;letter-spacing:.35em;color:#9fe3ff;margin:.2em 0 .7em}
.row{display:flex;gap:.6em;justify-content:center;margin:.25em 0}
.card{width:9.2em;padding:.4em .4em .5em;border-radius:.7em;background:rgba(255,255,255,.1);border:.14em solid rgba(255,255,255,.25);cursor:pointer;font-size:.8em;transition:transform .1s}
.card:hover{transform:translateY(-2px)}
.card.sel{border-color:#ffd53b;background:rgba(255,213,59,.2);box-shadow:0 0 .8em rgba(255,213,59,.5)}
.card canvas{display:block;margin:0 auto .2em;width:100%;height:auto;border-radius:.4em}

.bar{height:.4em;background:rgba(255,255,255,.2);border-radius:.3em;margin:.18em .3em;position:relative;text-align:left}

.lbl{font-size:.7em;opacity:.8;letter-spacing:.2em;margin:.5em 0 .1em}
.btn{font:inherit;font-size:1.25em;padding:.4em 1.4em;margin:.3em;border:0;border-radius:.6em;background:linear-gradient(#ffe35a,#ff9d1c);color:#4a1d00;cursor:pointer;box-shadow:0 .2em 0 #a8500b,0 .4em .6em rgba(0,0,0,.4);font-weight:900}

.pod .blk{border-radius:.4em .4em 0 0;font-size:2em;padding:.1em 0;color:#222}
#tbl{font-size:.75em;font-weight:700;margin:.3em 0;border-collapse:collapse;min-width:20em}

#tbl tr.me{background:rgba(255,213,59,.35);color:#fff}

.tb{position:absolute;display:none;border:.15em solid rgba(255,255,255,.55);background:rgba(255,255,255,.18);border-radius:1.2em;color:#fff;font-size:1.3em;align-items:center;justify-content:center;touch-action:none}

#bL{left:3%;bottom:5%;width:15%;height:22%}#bR{left:20%;bottom:5%;width:15%;height:22%}
#bGas{right:3%;bottom:5%;width:20%;height:26%;background:rgba(90,230,110,.35)}
#bDrift{right:25%;bottom:5%;width:14%;height:20%}#bItem{right:3%;bottom:34%;width:14%;height:20%}

#stage[data-s=race] #pbtn,#stage[data-s=count] #pbtn{display:block}
</style></head><body>
<div id="wrap"><div id="stage" data-s="title">
<canvas id="c" width="960" height="540"></canvas>
<div class="ov on" id="title">
 <h1>TURBO KART</h1><div class="sub">S.I.P. ARCADE</div>
 <div class="lbl">CHOOSE YOUR TRACK</div><div class="row" id="trk"></div>
 <div class="lbl">CHOOSE YOUR KART</div><div class="row" id="krt"></div>
 <button class="btn" id="go">START RACE</button>
 <div class="hint">Arrows / WASD steer + gas &nbsp;|&nbsp; SHIFT or Z drift &nbsp;|&nbsp; SPACE or X use item &nbsp;|&nbsp; P pause &nbsp;|&nbsp; M sound</div>
</div>

 <button class="btn" id="bRes">RESUME</button><button class="btn alt" id="bRst">RESTART</button><button class="btn alt" id="bQuit">MENU</button></div>

 <div class="row"><button class="btn" id="bRetry">RETRY</button><button class="btn alt" id="bMenu">MENU</button></div></div>
<button id="pbtn">II</button>
<div id="touch"><div class="tb" id="bL">&#9664;</div><div class="tb" id="bR">&#9654;</div><div class="tb" id="bGas">GAS</div><div class="tb" id="bDrift">DRIFT</div><div class="tb" id="bItem">ITEM</div></div>
</div></div>
<script>
(function(){
'use strict';
var W=960,H=540,HY=Math.round(H*0.4);
var SEG=200,ROADW=2000,CAMH=900,CAMD=0.84,PZ=800,DRAW=150,RUMBLE=3,LAPS=3,NAI=7;
var MAXSPD=12000,CENT=0.27;
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),stage=document.getElementById('stage');
function $(i){return document.getElementById(i)}
function clamp(v,a,b){return v<a?a:v>b?b:v}
function lerp(a,b,t){return a+(b-a)*t}
function rngf(seed){var s=seed>>>0;return function(){s=(s+0x6D2B79F5)>>>0;var t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}

/* ---------- data ---------- */
var KARTS=[
 {name:'Rocket',body:'#ff3b3b',acc:'#ffffff',helm:'#ffffff',top:1.0,accel:1.0,handle:1.0,grip:1.0,off:1.0,d:'Balanced all-rounder'},
 {name:'Bumble',body:'#ffcf2e',acc:'#222222',helm:'#222222',top:1.07,accel:0.8,handle:0.85,grip:0.9,off:1.0,d:'Fast but heavy to steer'},
 {name:'Pogo',body:'#3be07a',acc:'#ffffff',helm:'#ffef5a',top:0.94,accel:1.25,handle:1.2,grip:1.12,off:1.0,d:'Quick and nimble'},
 {name:'Tank',body:'#3b8bff',acc:'#ffd53b',helm:'#ff8a2b',top:0.98,accel:1.1,handle:0.95,grip:1.3,off:0.55,d:'Stable, shrugs off grass'}];
var AIS=[['Zippy','#ff7bd5','#ffffff','#ffffff'],['Bolt','#9b5cff','#ffe14a','#ffe14a'],['Mochi','#ffffff','#ff6b6b','#ff6b6b'],['Rex','#ff8a2b','#222','#222'],['Pip','#2ee6d6','#fff','#fff'],['Nova','#c9ff3a','#2a2a2a','#2a2a2a'],['Dot','#7a8cff','#ffffff','#ffffff']];
var TRACKS=[
 {id:'meadow',name:'Sunny Meadow',desc:'Rolling hills',theme:'meadow',seed:11,scale:2.4,
  pal:{skyT:'#4aa8ff',skyB:'#cfeeff',gL:'#58c04a',gD:'#4cae41',rL:'#7a7a84',rD:'#70707a',ruA:'#e03a3a',ruB:'#ffffff',lane:'#ffffff',fog:'#cfeeff'},
  road:[[30,0,0],[50,2,12],[40,0,18],[60,-3,-8],[50,0,22],[70,3,-18],[40,0,0],[80,-4,26],[50,2,-14],[60,0,16],[70,4,-26],[50,-2,8],[90,0,20],[70,-3,-18],[50,3,0],[80,0,14],[60,-4,-12],[50,2,0],[70,0,-10]]},
 {id:'desert',name:'Dusty Canyon',desc:'Big hills, wide bends',theme:'desert',seed:22,scale:2.6,
  pal:{skyT:'#ff9e4a',skyB:'#ffe9b8',gL:'#e8c27a',gD:'#dcb468',rL:'#6e665e',rD:'#645d56',ruA:'#e8641c',ruB:'#fff3dc',lane:'#fff0c0',fog:'#ffe9b8'},
  road:[[30,0,0],[60,2,30],[50,0,40],[80,-2,-20],[60,0,30],[100,3,-50],[50,0,10],[70,-4,40],[60,4,-30],[90,0,50],[60,-2,-40],[80,3,20],[50,-3,-30],[70,0,25],[60,2,-35],[50,0,0]]},
 {id:'snow',name:'Frosty Peaks',desc:'Twisty and cold',theme:'snow',seed:33,scale:3.6,
  pal:{skyT:'#7fb6e8',skyB:'#eaf5ff',gL:'#f6faff',gD:'#e0ebf7',rL:'#8c98a8',rD:'#828ea0',ruA:'#e03a3a',ruB:'#ffffff',lane:'#ffffff',fog:'#eaf5ff'},
  road:[[30,0,0],[40,4,8],[30,-4,-4],[40,5,10],[30,-3,0],[50,0,15],[40,-5,-12],[40,4,6],[30,0,-6],[50,-4,14],[40,3,-10],[30,-5,0],[50,5,12],[40,0,-14],[40,-3,6],[50,4,-8],[40,-4,0],[30,0,0]]},
 {id:'neon',name:'Neon City',desc:'Fast and sharp',theme:'neon',seed:44,scale:3.2,
  pal:{skyT:'#0b0626',skyB:'#7a1d9c',gL:'#150b34',gD:'#1d1046',rL:'#2c2c44',rD:'#262640',ruA:'#ff2fb4',ruB:'#25e8ff',lane:'#25e8ff',fog:'#5a1580'},
  road:[[30,0,0],[50,5,0],[40,0,10],[50,-5,-6],[30,0,0],[60,4,15],[40,-4,-10],[50,0,0],[50,5,5],[40,-5,-5],[60,0,20],[40,3,-15],[50,-5,0],[40,5,6],[30,0,-6],[50,-4,0],[40,0,12],[50,4,-12],[30,0,0]]}];

/* ---------- state ---------- */
var segs=[],N=0,L=0,tr=TRACKS[0],pal=tr.pal;
var selTrack=0,selKart=0;
var state='title',paused=false,muted=false;
var karts=[],player=null,oils=[],shells=[],parts=[],touched=[],bgs=[],skyOff=0,skyGrad=null;
var raceTime=0,countT=0,finT=-1,msgs=[],clock=0,shake=0,startPress=null,gasHeld=false,snow=[];
var best=loadBest();
var itemReq=false,K={},T={};

function loadBest(){try{var o=JSON.parse(localStorage.getItem('sip_turbo-kart_best'));return(o&&typeof o==='object')?o:{}}catch(e){return{}}}
function saveBest(){try{localStorage.setItem('sip_turbo-kart_best',JSON.stringify(best))}catch(e){}}
function fmt(t){if(!isFinite(t)||t==null)return'--:--.--';var m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(2)}
function ord(n){return['1st','2nd','3rd','4th','5th','6th','7th','8th'][n]||(n+1)+'th'}

/* ---------- track build ---------- */
function lastY(){return segs.length?segs[segs.length-1].p2.y:0}
function addSeg(curve,y){var n=segs.length;
 segs.push({index:n,p1:{x:0,y:lastY(),z:n*SEG},p2:{x:0,y:y,z:(n+1)*SEG},curve:curve,spr:[],boxes:[],dyn:[],band:Math.floor(n/RUMBLE)%2,clip:0})}
function eIO(a,b,p){return a+(b-a)*((-Math.cos(p*Math.PI)/2)+.5)}
function eIn(a,b,p){return a+(b-a)*p*p}
function addRoad(e,h,l,c,hy){var sy=lastY(),ey=sy+hy*SEG,tot=e+h+l,n;
 for(n=0;n<e;n++)addSeg(eIn(0,c,n/e),eIO(sy,ey,(n+1)/tot));
 for(n=0;n<h;n++)addSeg(c,eIO(sy,ey,(e+n+1)/tot));
 for(n=0;n<l;n++)addSeg(eIO(c,0,n/l),eIO(sy,ey,(e+h+n+1)/tot))}
function buildTrack(i){
 tr=TRACKS[i];pal=tr.pal;segs=[];oils=[];shells=[];
 var r=tr.road,k;
 for(k=0;k<r.length;k++){var len=Math.round(r[k][0]*tr.scale),e=Math.round(len*.25),h=Math.round(len*.5);addRoad(e,h,len-e-h,r[k][1],r[k][2])}
 var ly=lastY();addRoad(50,40,60,0,-ly/SEG);
 segs[segs.length-1].p2.y=0;
 N=segs.length;L=N*SEG;
 scenery();makeBgs();
 var g=ctx.createLinearGradient(0,0,0,HY);g.addColorStop(0,pal.skyT);g.addColorStop(1,pal.skyB);skyGrad=g;
}
function segAt(z){return segs[Math.floor(((z%L)+L)%L/SEG)%N]}

/* ---------- scenery ---------- */
function scenery(){
 var R=rngf(tr.seed),th=tr.theme,i,s,side,r,o;
 // item boxes
 for(i=120;i<N-80;i+=Math.round(N/11)){for(var b=-1;b<=1;b++){segs[i].boxes.push({o:b*0.5,on:true,t:0})}}
 for(i=4;i<N;i++){s=segs[i];
  if(Math.abs(s.curve)>=3.4&&i%4===0){s.spr.push({t:'chev',o:s.curve>0?-1.3:1.3,d:s.curve>0?1:-1,k:1})}
  if(i%2)continue;
  for(side=-1;side<=1;side+=2){r=R();o=side*(1.35+R()*3.4);
   if(th==='meadow'){
    if(r<.22)s.spr.push({t:'tree',o:o,k:.8+R()*.6,v:R()});
    else if(r<.34)s.spr.push({t:'pine',o:o,k:.8+R()*.6,v:R()});
    else if(r<.44)s.spr.push({t:'bush',o:side*(1.25+R()*1.2),k:.7+R()*.6,v:R()});
    else if(r<.52)s.spr.push({t:'flower',o:side*(1.25+R()*2.5),k:1,v:R()});
    else if(r<.535)s.spr.push({t:'house',o:side*(2.6+R()*2),k:1,v:R()});
   }else if(th==='desert'){
    if(r<.2)s.spr.push({t:'cactus',o:o,k:.8+R()*.7,v:R()});
    else if(r<.28)s.spr.push({t:'rock',o:side*(1.3+R()*2.5),k:.6+R()*.9,v:R()});
    else if(r<.32)s.spr.push({t:'palm',o:o,k:.9+R()*.4,v:R()});
    else if(r<.37)s.spr.push({t:'dbush',o:o,k:.8,v:R()});
    else if(r<.395)s.spr.push({t:'mesa',o:side*(5+R()*6),k:1+R()*1.2,v:R()});
   }else if(th==='snow'){
    if(r<.3)s.spr.push({t:'pine',o:o,k:.9+R()*.7,v:R(),snow:1});
    else if(r<.37)s.spr.push({t:'icerock',o:o,k:.7+R()*.8,v:R()});
    else if(r<.395)s.spr.push({t:'snowman',o:side*(1.3+R()*1.5),k:1,v:R()});
    else if(r<.405)s.spr.push({t:'igloo',o:side*(2.5+R()*2),k:1,v:R()});
    else if(r<.43)s.spr.push({t:'candy',o:side*(1.2+R()*.3),k:1,v:R()});
   }else{
    if(r<.2)s.spr.push({t:'bldg',o:side*(2.2+R()*3),k:.8+R()*.8,v:R(),h:R()});
    else if(r<.24)s.spr.push({t:'nsign',o:side*(1.4+R()*1.5),k:1,v:R()});
   }
  }
  if(th==='neon'&&i%8===0){s.spr.push({t:'lamp',o:-1.18,k:1,v:0});s.spr.push({t:'lamp',o:1.18,k:1,v:1})}
 }
 segs[1].spr.push({t:'arch',o:0,k:1});
}

/* ---------- procedural sprites (world units, y up = negative) ---------- */
function circ(c,x,y,r,col){c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,6.2832);c.fill()}
function rect(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(x,y,w,h)}
function poly(c,pts,col){c.fillStyle=col;c.beginPath();c.moveTo(pts[0],pts[1]);for(var i=2;i<pts.length;i+=2)c.lineTo(pts[i],pts[i+1]);c.closePath();c.fill()}
function rrect(c,x,y,w,h,r,col){c.fillStyle=col;c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();c.fill()}
var SPR={
 tree:function(c,s){rect(c,-60,-460,120,460,'#6b4423');var a=s.v>.5?['#2f8f3a','#3aa84a','#52c25e']:['#2b7d36','#37963f','#49b251'];
  circ(c,-170,-640,330,a[0]);circ(c,170,-660,330,a[0]);circ(c,0,-1000,400,a[1]);circ(c,-80,-1130,230,a[2])},
 pine:function(c,s){rect(c,-50,-300,100,300,'#5a3a1c');var g=s.snow?'#2a6a46':'#1f7a3a';
  poly(c,[0,-1900,420,-1100,-420,-1100],g);poly(c,[0,-1500,520,-600,-520,-600],g);poly(c,[0,-1100,620,-250,-620,-250],g);
  if(s.snow){poly(c,[0,-1900,170,-1620,-170,-1620],'#fff');poly(c,[0,-1500,210,-1230,-210,-1230],'#fff');poly(c,[0,-1100,250,-840,-250,-840],'#fff')}},
 bush:function(c,s){circ(c,-130,-130,150,'#2f9a3a');circ(c,100,-120,160,'#3aaf48');circ(c,0,-200,150,'#46bf55');if(s.v>.6){circ(c,-60,-210,26,'#ff6b8a');circ(c,70,-180,26,'#ffe14a')}},
 flower:function(c,s){var cols=['#ff6b8a','#ffe14a','#fff','#b58cff'];for(var i=0;i<5;i++){var x=-240+i*120,y=-30-(i%2)*40;rect(c,x-6,y,12,60,'#2f9a3a');circ(c,x,y,40,cols[(i+Math.floor(s.v*4))%4]);circ(c,x,y,14,'#fff6a0')}},
 house:function(c,s){rect(c,-400,-600,800,600,s.v>.5?'#f4e3c1':'#f2b8a0');poly(c,[-470,-600,0,-1100,470,-600],'#b8452e');rect(c,-90,-330,180,330,'#6b4423');rect(c,-310,-460,150,150,'#9fdcff');rect(c,160,-460,150,150,'#9fdcff');rect(c,250,-1000,90,300,'#8a5a3a')},
 cactus:function(c,s){var g='#3f9a45',d='#2f7d37';rrect(c,-70,-1000,140,1000,70,g);rect(c,-30,-1000,24,1000,d);
  rrect(c,-290,-640,240,100,50,g);rrect(c,-290,-820,100,260,50,g);rrect(c,50,-520,240,100,50,g);rrect(c,190,-720,100,300,50,g);if(s.v>.5)circ(c,0,-1020,32,'#ff6b8a')},
 rock:function(c,s){poly(c,[-300,0,-220,-260,-40,-380,170,-300,300,0],'#9a8672');poly(c,[-40,-380,170,-300,300,0,40,0],'#7d6c5a')},
 palm:function(c,s){poly(c,[-50,0,50,0,30,-1000,-20,-1000],'#8a5a3a');var g='#2f9a3a';for(var i=-2;i<=2;i++){poly(c,[0,-1000,i*220,-1150+Math.abs(i)*90,i*300,-960+Math.abs(i)*120,i*120,-1010],g)}circ(c,0,-1000,50,'#6b4423')},
 dbush:function(c,s){c.strokeStyle='#8a6a3a';c.lineWidth=26;for(var i=-3;i<=3;i++){c.beginPath();c.moveTo(0,0);c.lineTo(i*60,-220-Math.abs(i)*-18);c.stroke()}},
 mesa:function(c,s){poly(c,[-900,0,-700,-700,-520,-900,520,-900,720,-700,900,0],'#c4592b');poly(c,[-520,-900,520,-900,720,-700,-700,-700],'#d9774a');rect(c,-840,-300,1700,50,'#a8461f');rect(c,-780,-500,1560,40,'#ad4a22')},
 icerock:function(c,s){poly(c,[-300,0,-250,-300,-80,-520,60,-380,200,-560,300,-200,320,0],'#bfe4ff');poly(c,[60,-380,200,-560,300,-200,320,0,100,0],'#8fc8f2')},
 snowman:function(c,s){circ(c,0,-170,190,'#fff');circ(c,0,-470,140,'#fff');circ(c,0,-710,100,'#fff');circ(c,-35,-730,13,'#222');circ(c,35,-730,13,'#222');poly(c,[0,-700,120,-685,0,-670],'#ff8a2b');rect(c,-110,-800,220,34,'#222');rect(c,-70,-900,140,110,'#222');rect(c,-150,-540,300,30,'#e03a3a')},
 igloo:function(c,s){c.fillStyle='#eaf6ff';c.beginPath();c.arc(0,0,500,Math.PI,0);c.fill();c.fillStyle='#bcd8ee';c.fillRect(-500,-10,1000,10);rrect(c,-110,-260,220,260,90,'#40607e');c.strokeStyle='#bcd8ee';c.lineWidth=14;c.beginPath();c.arc(0,0,350,Math.PI,0);c.stroke()},

  for(i=0;i<seg.dyn.length;i++){o=seg.dyn[i];var pc=(o.z%SEG)/SEG,sc=lerp(p1.sc,p2.sc,pc),sxr=lerp(p1.sx,p2.sx,pc),syr=lerp(p1.sy,p2.sy,pc),uu=sc*W/2;
   ctx.globalAlpha=fade;
   if(o.kind==='k'){var kk=o.k,xx=sxr+uu*kk.x*ROADW;(function(kk,xx,syr,uu){clipDraw(seg.clip,function(){drawKart(ctx,xx,syr,uu,{body:kk.body,acc:kk.acc,helm:kk.helm,lean:kk.st*.06,spin:kk.spinA,flame:kk.flame,t:clock})})})(kk,xx,syr,uu)}
   else if(o.kind==='o'){var ox=sxr+uu*o.o.x*ROADW;(function(ox,syr,uu){clipDraw(seg.clip,function(){drawOil(ox,syr,uu)})})(ox,syr,uu)}
   else{var shx=sxr+uu*o.s.x*ROADW;(function(shx,syr,uu,sh){clipDraw(seg.clip,function(){drawShell(shx,syr,uu,sh)})})(shx,syr,uu,o.s)}}
  ctx.globalAlpha=1}
 // player
 var py=playerScreenY()+(player.hop>0?-Math.sin(player.hop/.25*Math.PI)*22:0)+(Math.abs(player.x)>1&&player.speed>2500?Math.sin(clock*70)*3:0);
 if(state!=='title'||true){var pk=tgt;drawKart(ctx,W/2,py,CAMD/PZ*W/2,{body:pk.body,acc:pk.acc,helm:pk.helm,lean:pk.st*.07+(pk.drift?pk.dd*.1:0),spin:pk.spinA,flame:pk.flame,t:clock})}
 // particles
 for(i=0;i<parts.length;i++){var pp=parts[i];ctx.globalAlpha=clamp(pp.life/pp.m,0,1);ctx.fillStyle=pp.c;ctx.beginPath();ctx.arc(pp.x,pp.y,pp.s*(.5+pp.life/pp.m*.5),0,6.3);ctx.fill()}
 ctx.globalAlpha=1;
 // speed lines
 if(tgt.boost>0&&state!=='title'){ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;ctx.beginPath();for(i=0;i<22;i++){var a=Math.random()*6.28,r1=200+Math.random()*100,r2=r1+80+Math.random()*120;ctx.moveTo(W/2+Math.cos(a)*r1*1.6,H*.45+Math.sin(a)*r1);ctx.lineTo(W/2+Math.cos(a)*r2*1.6,H*.45+Math.sin(a)*r2)}ctx.stroke()}
 // snow overlay
 if(tr.theme==='snow'){drawSnow(tgt)}
 ctx.restore();
 if(state==='title')return;
 hud(tgt)}
function hexA(h,a){var r=parseInt(h.substr(1,2),16),g=parseInt(h.substr(3,2),16),b=parseInt(h.substr(5,2),16);return'rgba('+r+','+g+','+b+','+a+')'}
function clipDraw(cy,fn){ctx.save();ctx.beginPath();ctx.rect(0,0,W,Math.max(0,cy));ctx.clip();fn();ctx.restore()}
function drawBox(x,y,u,o){var bob=Math.sin(clock*3+o.o*5)*40;ctx.save();ctx.translate(x,y);ctx.scale(u,u);ctx.translate(0,-330+bob);ctx.rotate(Math.sin(clock*2+o.o)*.12);
 var h=(clock*180+o.o*100)%360;rrect(ctx,-170,-170,340,340,60,'hsl('+h+',85%,58%)');ctx.strokeStyle='#fff';ctx.lineWidth=22;ctx.strokeRect(-150,-150,300,300);
 ctx.fillStyle='#fff';ctx.font='900 260px Arial';ctx.textAlign='center';ctx.fillText('?',0,92);ctx.restore()}
function drawOil(x,y,u){ctx.save();ctx.translate(x,y);ctx.scale(u,u);ctx.fillStyle='#14101a';ctx.beginPath();ctx.ellipse(0,-20,280,70,0,0,6.3);ctx.fill();ctx.fillStyle='rgba(120,90,200,.55)';ctx.beginPath();ctx.ellipse(-60,-28,120,25,0,0,6.3);ctx.fill();ctx.fillStyle='rgba(60,200,160,.45)';ctx.beginPath();ctx.ellipse(80,-14,80,16,0,0,6.3);ctx.fill();ctx.restore()}
function drawShell(x,y,u,sh){ctx.save();ctx.translate(x,y);ctx.scale(u,u);var b=Math.abs(Math.sin(sh.t*10))*80;ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(0,-8,130,30,0,0,6.3);ctx.fill();ctx.translate(0,-140-b);ctx.rotate(sh.t*8);
 circ(ctx,0,0,130,'#e8302a');ctx.fillStyle='#fff';ctx.fillRect(-130,-22,260,44);for(var i=0;i<5;i++)circ(ctx,-100+i*50,-70+Math.abs(i-2)*10,16,'#fff');circ(ctx,-45,-5,22,'#222');circ(ctx,45,-5,22,'#222');ctx.restore()}
function drawSnow(t){if(!snow.length){for(var i=0;i<90;i++)snow.push({x:Math.random()*W,y:Math.random()*H,v:40+Math.random()*60,s:1+Math.random()*2})}
 ctx.fillStyle='rgba(255,255,255,.85)';for(var j=0;j<snow.length;j++){var f=snow[j];f.y+=f.v*(1/60);f.x+=Math.sin(clock+j)*.4-(t.speed/MAXSPD)*.3;if(f.y>H){f.y=-4;f.x=Math.random()*W}if(f.x<0)f.x=W;ctx.fillRect(f.x,f.y,f.s,f.s)}}

/* ---------- HUD ---------- */
function txt(s,x,y,size,col,al,st){ctx.font='900 '+size+'px "Trebuchet MS",Arial';ctx.textAlign=al||'left';ctx.lineJoin='round';ctx.lineWidth=size/6;ctx.strokeStyle=st||'rgba(0,0,0,.7)';ctx.strokeText(s,x,y);ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y)}
function icon(type,x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 if(type==='boost'){circ(ctx,0,0,20,'#2a86ff');poly(ctx,[3,-17,-10,3,-1,3,-5,17,10,-4,1,-4],'#ffe14a')}
 else if(type==='oil'){circ(ctx,0,0,20,'#3a2a5a');ctx.fillStyle='#0c0a12';ctx.beginPath();ctx.ellipse(0,3,15,9,0,0,6.3);ctx.fill();circ(ctx,-4,-6,5,'#0c0a12');circ(ctx,6,-8,3,'#0c0a12')}
 else if(type==='shell'){circ(ctx,0,0,20,'#e8302a');ctx.fillStyle='#fff';ctx.fillRect(-20,-4,40,8);circ(ctx,-7,0,4,'#222');circ(ctx,7,0,4,'#222')}
 ctx.restore()}
function hud(p){
 var order=rankKarts();var pos=p.rank;
 txt(String(pos+1),24,78,76,'#ffd53b','left');txt(ord(pos).replace(/^\d+/,'')+' / 8',74+(pos>=9?0:0),52,22,'#fff','left');
 txt('LAP '+clamp(p.lap,1,LAPS)+'/'+LAPS,24,108,24,'#fff','left');
 var rt=Math.max(0,raceTime);txt(fmt(rt),W/2,34,26,'#fff','center');
 var bl=best[tr.id]&&best[tr.id].lap;txt('BEST '+fmt(bl),W/2,58,16,'#9fe3ff','center');
 // item box
 ctx.fillStyle='rgba(0,0,0,.45)';ctx.beginPath();ctx.arc(W-48,48,36,0,6.3);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.stroke();
 if(p.roll>0){icon(['boost','oil','shell'][Math.floor(clock*14)%3],W-48,48,1.3)}else if(p.item){icon(p.item,W-48,48,1.5)}else txt('ITEM',W-48,54,15,'#ccc','center');
 if(p.item&&!p.auto)txt('SPACE',W-48,100,14,'#fff','center');
 // speed
 var kmh=Math.round(p.speed/MAXSPD*150);txt(kmh+'',W-24,H-24,40,p.boost>0?'#ffcf3a':'#fff','right');txt('km/h',W-24,H-60,14,'#ccc','right');
 var sp=clamp(p.speed/(MAXSPD*1.32),0,1);ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(W-210,H-52,150,10);ctx.fillStyle=p.boost>0?'#ffcf3a':'#6ef07a';ctx.fillRect(W-210,H-52,150*sp,10);
 // drift meter
 if(p.drift){var m=clamp(p.dT/1.8,0,1);ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(W/2-80,H-30,160,12);ctx.fillStyle=p.dT>1.8?'#ff9d1c':p.dT>.9?'#6fd3ff':'#fff';ctx.fillRect(W/2-80,H-30,160*m,12)}
 // progress strip
 var bx=W/2-140,by=H-70;ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(bx,by,280,6);
 karts.forEach(function(k){var f=clamp(((k.d%L)+L)%L/L,0,1);if(k.fin)f=1;circ(ctx,bx+280*f,by+3,k.p?7:5,k.p?'#ffd53b':k.body);});
 // messages
 var yy=150;msgs.forEach(function(m){ctx.globalAlpha=clamp(m.life/.3,0,1);var s=1+Math.max(0,(m.max-m.life)<.15?(.15-(m.max-m.life))*3:0);txt(m.t,W/2,yy,44*s,m.c,'center');yy+=48});ctx.globalAlpha=1;
 if(state==='count'){var n=Math.ceil(countT);if(n>=1&&n<=3){var fr=countT-Math.floor(countT);txt(String(n),W/2,H*.42,150*(0.8+fr*.3),n===1?'#ffd53b':n===2?'#ff9d1c':'#ff4d4d','center')}
  if(startPress===null)txt('Press gas in the last second for a rocket start!',W/2,H*.55,18,'#fff','center')}
 if(state==='finish')txt('FINISH!',W/2,H*.35,90,'#ffd53b','center')}

/* ---------- main loop ---------- */
var last=0,acc=0;
function frame(ts){
 requestAnimationFrame(frame);
 var dt=Math.min(.1,(ts-last)/1000||0);last=ts;
 if(!paused){acc+=dt;var c=0;while(acc>=1/60&&c<6){try{update(1/60)}catch(e){console.error(e);acc=0;break}acc-=1/60;c++}if(c>=6)acc=0}
 try{render();audioFrame()}catch(e){console.error(e)}
}
function fit(){var w=innerWidth,h=innerHeight,sw=w,sh=w*9/16;if(sh>h){sh=h;sw=h*16/9}stage.style.width=sw+'px';stage.style.height=sh+'px';stage.style.fontSize=(sh/540*16)+'px'}
addEventListener('resize',fit);fit();
buildCards();setupRace(true);
requestAnimationFrame(frame);
window.TK={step:function(n,dt){for(var i=0;i<n;i++)update(dt||1/60)},get:function(){return{state:state,karts:karts,player:player,raceTime:raceTime,L:L,N:N,segs:segs}},start:function(t,k){selTrack=t;selKart=k;startGame()},setKeys:function(o){K=o},press:function(){itemReq=true},setAuto:function(v){player.auto=v},res:function(){return state},pause:setPause};
})();
</script></body></html>
