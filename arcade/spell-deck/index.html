<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Spell Deck - S.I.P. Arcade</title>
<style>
:root{--u:min(1vw,1.78vh);--c1:#8fd3ff;--c2:#c8f0a8;--ba:#4a6fe0;--bb:#2a3fa0;--tm:1;--ink:#2b2350;--pan:#fff8e8;--acc:#ff7a45}
@media (orientation:portrait){:root{--u:min(1.75vw,1.25vh)}.hud .goal{order:9;flex-basis:100%}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:manipulation}
body{background:linear-gradient(180deg,var(--c1),var(--c2));font-size:calc(var(--u)*1.5)}
#app{position:fixed;inset:0;overflow:hidden}
#scr{position:absolute;inset:0;display:flex;flex-direction:column}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:50}
#modal{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(30,20,60,.55)}
#modal.on{display:flex}
#toast{position:absolute;top:calc(var(--u)*5);left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:#fff;border:3px solid var(--ink);border-radius:30px;padding:6px 16px;font-weight:bold;box-shadow:0 4px 0 rgba(0,0,0,.25);animation:tin .35s cubic-bezier(.2,1.6,.4,1)}
.toast.gold{background:#ffe27a}.toast.sec{background:#d6b8ff}
@keyframes tin{from{transform:translateY(-30px) scale(.5);opacity:0}}
button{font:inherit;color:var(--ink);cursor:pointer}
.btn{background:#fff;border:calc(var(--u)*.3) solid var(--ink);border-radius:calc(var(--u)*1.2);padding:calc(var(--u)*.8) calc(var(--u)*2);font-weight:bold;font-size:calc(var(--u)*1.8);box-shadow:0 calc(var(--u)*.45) 0 rgba(0,0,0,.28);transition:transform .12s cubic-bezier(.3,1.8,.5,1)}
.btn:hover{transform:translateY(-2px) scale(1.06) rotate(-1deg)}.btn:active{transform:translateY(3px) scale(.96);box-shadow:none}
.btn.pri{background:linear-gradient(#ffd24a,#ff9f2e)}.btn.go{background:linear-gradient(#9df07a,#4ec24a)}.btn.bad{background:#ffb3b3}.btn.sm{font-size:calc(var(--u)*1.4);padding:calc(var(--u)*.5) calc(var(--u)*1.2)}
.btn[disabled]{opacity:.45;filter:grayscale(.6);pointer-events:none}
.center{margin:auto;text-align:center}
.panel{background:var(--pan);border:calc(var(--u)*.3) solid var(--ink);border-radius:calc(var(--u)*1.6);padding:calc(var(--u)*1.6);box-shadow:0 calc(var(--u)*.5) 0 rgba(0,0,0,.25)}
h1,h2,h3{margin:.2em 0}
/* title */
.title{align-items:center;justify-content:center;gap:calc(var(--u)*1.2);text-align:center;position:relative;overflow:hidden}
.logo{font-size:calc(var(--u)*9);font-weight:900;letter-spacing:1px;color:#fff;-webkit-text-stroke:calc(var(--u)*.35) var(--ink);paint-order:stroke fill;text-shadow:0 calc(var(--u)*.8) 0 rgba(0,0,0,.3);animation:bob 2.4s ease-in-out infinite;cursor:pointer;line-height:1}
.logo.sq{animation:squash .4s}
@keyframes squash{30%{transform:scale(1.25,.7)}60%{transform:scale(.85,1.2)}}
@keyframes bob{50%{transform:translateY(calc(var(--u)*-1)) rotate(1.5deg)}}
.sipl{font-size:calc(var(--u)*2.2);font-weight:bold;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:2px 16px;cursor:pointer}
.menu{display:grid;gap:calc(var(--u)*.9);grid-template-columns:1fr 1fr;width:min(90vw,calc(var(--u)*50))}
.menu .btn:first-child{grid-column:1/3}
.fcard{position:absolute;font-size:calc(var(--u)*6);opacity:.35;animation:fl 9s linear infinite;pointer-events:none}
@keyframes fl{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-30vh) rotate(360deg)}}
.hero{font-size:calc(var(--u)*10);animation:bob 3s ease-in-out infinite;position:relative;cursor:pointer}
.hero .hat{position:absolute;top:-.45em;left:50%;transform:translateX(-50%);font-size:.55em}
.zzz{position:absolute;right:-.5em;top:-.3em;font-size:.35em;animation:bob 1.5s infinite}
/* top hud */
.hud{display:flex;align-items:center;gap:calc(var(--u)*1);padding:calc(var(--u)*.6) calc(var(--u)*1.2);background:rgba(255,248,232,.92);border-bottom:calc(var(--u)*.3) solid var(--ink);flex-wrap:wrap;z-index:5}
.hud .chip{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:1px 10px;font-weight:bold;white-space:nowrap}
.hud .goal{flex:1;min-width:calc(var(--u)*14);font-size:calc(var(--u)*1.35);background:#fff3b0;border:3px dashed var(--ink);border-radius:14px;padding:2px 10px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.relics{display:flex;gap:2px;flex-wrap:wrap;max-width:calc(var(--u)*45)}
.rel{font-size:calc(var(--u)*2.4);cursor:help;position:relative;transition:transform .15s}.rel:hover{transform:scale(1.4) rotate(8deg);z-index:9}
.pots{display:flex;gap:4px}
.pot{width:calc(var(--u)*3.6);height:calc(var(--u)*3.6);border:3px dashed #888;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*2.4);background:rgba(255,255,255,.6);cursor:pointer}
.pot.full{border:3px solid var(--ink);background:#fff;animation:bob 2s infinite}
.ibtn{background:#fff;border:3px solid var(--ink);border-radius:50%;width:calc(var(--u)*3.8);height:calc(var(--u)*3.8);font-size:calc(var(--u)*2);padding:0}
/* map */
.mapwrap{flex:1;overflow:auto;position:relative;padding:calc(var(--u)*2) 0}
.map{position:relative;width:min(94vw,calc(var(--u)*70));margin:0 auto;display:flex;flex-direction:column;gap:calc(var(--u)*4.5)}

function tone(f,t0,dur,type,vol,f2,dest){ const a=audio(); if(!a)return; try{ const o=a.createOscillator(),g=a.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t0); if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t0+dur);
 g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol||0.1,t0+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur); o.connect(g); g.connect(dest||MG); o.start(t0); o.stop(t0+dur+0.05);}catch(e){} }
function noise(t0,dur,vol,fc){ const a=audio(); if(!a)return; try{ const n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0); for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n); const s=a.createBufferSource(); s.buffer=b; const g=a.createGain(); g.gain.value=vol||0.15; const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=fc||2000; s.connect(f);f.connect(g);g.connect(MG); s.start(t0);}catch(e){} }
function sfx(n,p){ if(!M.snd.sfx||window.FAST)return; const a=audio(); if(!a)return; const t=a.currentTime; p=p||0; const m=Math.pow(2,p/12);

function act(a,ev){
 sfx('click');
 switch(a){
  case 'continue':{ const r=loadRun(); if(!r){ui.toast('No saved run found.');return;} R=r; B=null; ui.renderPhase(); break; }
  case 'new':SU=null;showSetup();break;
  case 'title':closeModal();R=null;B=null;showTitle();break;
  case 'start':{ lsDel(KS); const s=SU; startRun(s); SU=null; if(R.mode==='endless'){ startEndless(); } else go('map'); break; }
  case 'collection':collectionScreen('cards');break; case 'ach':achScreen();break; case 'secrets':secretsScreen();break; case 'stats':statsScreen();break; case 'wardrobe':wardrobeScreen();break;
  case 'help':helpModal();break; case 'settings':settingsModal();break;
  case 'closemodal':closeModal();break;
  case 'deck':deckModal('Your deck',R.deck);break;
  case 'pause':pauseModal();break;
  case 'tsfx':case 'tsfx2':M.snd.sfx=M.snd.sfx?0:1;saveMeta();a==='tsfx'?pauseModal():settingsModal();break;
  case 'tmus':case 'tmus2':M.snd.mus=M.snd.mus?0:1;saveMeta();a==='tmus'?pauseModal():settingsModal();break;
  case 'erase':if(confirm('Erase ALL progress? This cannot be undone.')){lsDel(KM);lsDel(KS);location.reload();}break;
  case 'quit':saveRun();closeModal();R=null;B=null;showTitle();break;
  case 'abandon':if(confirm('Give up this run?')){closeModal();B=B&&(B.over=true,B);endRun(false);}break;
  case 'end':endTurn();break;
  case 'drawp':{ if(B){ bump('drawp',10,'draw10'); deckModal('Draw pile (shuffled order hidden)',B.draw);} break; }
  case 'discp':if(B)deckModal('Discard pile',B.disc);break;
  case 'skipcard':R.pend.done.card=1;saveRun();showReward();break;
  case 'rewarddone':{ const rw=R.pend; const wasBoss=rw.kind==='b'; if(R.mode==='endless'){ nodeDone(); } else if(wasBoss){ advanceAct(); } else nodeDone(); break; }
  case 'leave':afterNode();break;
  case 'shopremove':pickCard('Remove which card?',c=>true,c=>{R.gold-=R.pend.remove.price;R.pend.remove.used=1;R.removed=(R.removed|0)+1;R.deck.splice(R.deck.indexOf(c),1);stAdd('rem');checkAch();sfx('poof');saveRun();showShop();});break;
  case 'rest':{ const heal=Math.round(R.mhp*(R.diff==='easy'?.45:.3))+relicV('healRest'); healAmt(Math.round(heal*(relicV('noRest')?.5:1))); stAdd('rest'); checkAch(); ui.burst(innerWidth/2,innerHeight/2,['💤','✨','💖'],10,160); afterNode(); break; }
  case 'smith':pickCard('Upgrade which card?',canUp,c=>{c.u=1;stAdd('upg');stAdd('rest');checkAch();sfx('ach');afterNode();});break;
  case 'retire':endRun(false);break;
  case 'treasuredone':afterNode();break;
  case 'evdone':afterNode();break;
 }
}
// pointer-driven card dragging
document.addEventListener('pointerdown',function(ev){ const c=ev.target.closest&&ev.target.closest('.hand .card'); if(!c||!B||B.phase!=='player')return; audio(); music.start(); ui.dragStart(ev,c); });
document.addEventListener('pointermove',function(ev){ const d=ui.drag; if(!d)return; const dx=ev.clientX-d.sx,dy=ev.clientY-d.sy; if(!d.moved&&Math.hypot(dx,dy)>10){ d.moved=true; const r=d.el.getBoundingClientRect(); d.w=r.width; d.h=r.height; d.el.classList.add('dragging'); d.el.style.width=r.width+'px'; d.el.style.height=r.height+'px'; }
 if(d.moved){ d.el.style.left=(ev.clientX-d.w/2)+'px'; d.el.style.top=(ev.clientY-d.h/2)+'px'; const ti=overEnemy(ev.clientX,ev.clientY); document.querySelectorAll('.en').forEach(e=>e.classList.toggle('tgt',ti!=null&&+e.dataset.i===ti)); } });
document.addEventListener('pointerup',function(ev){ const d=ui.drag; if(!d)return; ui.drag=null; document.querySelectorAll('.en.tgt').forEach(e=>e.classList.remove('tgt'));
 if(!B||B.over){return;} if(!d.moved){ clickCard(d.i); return; }
 const def=cardDef(B.hand[d.i]); const ti=overEnemy(ev.clientX,ev.clientY); const handTop=document.getElementById('hand').getBoundingClientRect().top;
 if(needsTarget(def)){ if(ti!=null){ playWithTarget(d.i,ti); return; } if(foes().length===1&&ev.clientY<handTop-10){ playWithTarget(d.i,null); return; } }
 else if(ev.clientY<handTop-10||ti!=null){ playWithTarget(d.i,null); return; }
 sfx('err'); renderBattle(); });
document.addEventListener('pointercancel',function(){ if(ui.drag){ui.drag=null; if(B)renderBattle();} });
let typed='';
document.addEventListener('keydown',function(ev){
 audio(); music.start(); const k=ev.key;
 if(document.getElementById('modal').classList.contains('on')){ if(k==='Escape')closeModal(); return; }
 if(!R){ konami.push(k.length===1?k.toLowerCase():k); if(konami.length>10)konami.shift(); if(konami.join()===konSeq.join()){ konami=[]; if(secret('konami')){ M.unl.hatcrown=1; } ui.confetti(); ui.toast('🎮 Cheat code accepted! Hooray!','gold'); } }
 if(k==='m'||k==='M'){ M.snd.sfx=M.snd.sfx?0:1; M.snd.mus=M.snd.sfx; saveMeta(); ui.toast(M.snd.sfx?'🔊 Sound on':'🔇 Sound off'); tick.mute=(tick.mute||0)+1; if(tick.mute>=5)secret('pressm'); return; }
 if(!R||R.phase!=='battle'||!B||B.over)return;
 if((k==='p'||k==='P')){ pauseModal(); return; }
 if(k==='e'||k==='E'){ endTurn(); return; }
 if(/^[1-9]$/.test(k)){ const i=+k-1; if(B.phase==='player'&&B.hand[i]){ if(canPlay(i)){ sfx('flip'); playWithTarget(i,null); } else sfx('err'); } return; }
 if(k==='ArrowRight'||k==='ArrowLeft'){ const f=foes(); if(!f.length)return; let idx=f.indexOf(B.en[B.sel]); idx=(idx+(k==='ArrowRight'?1:-1)+f.length)%f.length; B.sel=B.en.indexOf(f[idx]); renderBattle(); return; }
 if(k==='Escape'){ ui.selCard=null; ui.potSel=null; renderBattle(); return; }
 if(k.length===1){ typed=(typed+k.toLowerCase()).slice(-4); if(typed==='bonk'){ typed=''; if(secret('bonk')){} ui.shake(12); sfx('bighit'); foes().forEach(e=>{ const el=enEl(e); if(el)el.animate([{transform:'translateY(0)'},{transform:'translateY(-40px) rotate(10deg)'},{transform:'none'}],{duration:400}); }); ui.toast('BONK!'); } }
});
