<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Explox Character - 3D Model</title>
<style>
:root{--bg:#10152e;--text:#eef2ff;--accent:#ffcd30}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px system-ui,"Segoe UI",sans-serif;overflow:hidden;user-select:none}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column}
#top{padding:10px 14px;text-align:center}
#top h1{margin:0;font-size:18px}#top .m{font-size:12px;color:#9fb0ff}
canvas{flex:1;width:100%;display:block;touch-action:none;cursor:grab}
#bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px}
button{background:var(--accent);color:#1a1a1a;border:0;border-radius:10px;padding:10px 16px;font-weight:800;cursor:pointer}
button.alt{background:#2e7bd6;color:#fff}
</style></head><body>
<div id="wrap">
 <div id="top"><h1>🙂 My Explox Character</h1><div class="m">Drag to spin · pinch/scroll to zoom</div></div>
 <canvas id="cv"></canvas>
 <div id="bar">
  <button id="spin">⏸ Pause spin</button>
  <button class="alt" id="dl">⬇ Download 3D model (STL)</button>
 </div>
</div>
<script>
const cv=document.getElementById('cv'),cx=cv.getContext('2d');
// ---- build the blocky character as colored boxes (y up) ----
// box: [cx,cy,cz, w,h,d, color]
const DARK='#14141c', DARK2='#20202c', SKIN='#f0c9b0', SKIN2='#e6bca2', BRIM='#d8d8e4', RED='#d8352e', WHITE='#f4f4f8', SHIRT='#e8e8ee', BLOOD='#b02a22', EYE='#1a1a1a';
const boxes=[];
function B(x,y,z,w,h,d,c){boxes.push([x,y,z,w,h,d,c]);}
// legs
B(-0.55,0.9,0, 0.8,1.8,0.85, DARK);
B( 0.55,0.9,0, 0.8,1.8,0.85, DARK);
// torso (dark jacket)
B(0,3.0,0, 2.1,2.4,1.1, DARK2);
// shirt panel on front (t-shirt showing between jacket)
B(0,3.0,0.56, 1.1,1.9,0.12, SHIRT);
// red splatter accents on the shirt (cartoon pattern)
B(-0.2,3.2,0.63,0.3,0.3,0.06,BLOOD); B(0.15,2.9,0.63,0.26,0.4,0.06,BLOOD); B(0.0,3.45,0.63,0.22,0.22,0.06,BLOOD); B(-0.3,2.7,0.63,0.2,0.2,0.06,BLOOD);
// arms
B(-1.35,3.0,0, 0.65,2.3,0.85, DARK);
B( 1.35,3.0,0, 0.65,2.3,0.85, DARK);
// hands
B(-1.35,1.8,0, 0.6,0.5,0.8, SKIN);
B( 1.35,1.8,0, 0.6,0.5,0.8, SKIN);
// head
B(0,5.35,0, 1.9,1.7,1.65, SKIN);
// light brim / hairline band across the forehead top
B(0,6.15,0, 2.0,0.4,1.7, BRIM);
// ---- SMILEY FACE on the front (z+) ----
const fz=0.86; // head front surface
B(-0.42,5.45,fz, 0.3,0.34,0.14, EYE); // left eye
B( 0.42,5.45,fz, 0.3,0.34,0.14, EYE); // right eye
// smile (arc of small blocks)
[[-0.5,4.95],[-0.28,4.82],[0,4.78],[0.28,4.82],[0.5,4.95]].forEach(p=>B(p[0],p[1],fz,0.24,0.2,0.13,EYE));
// ---- party hat (red cone) ----
const HAT={cx:0,cy:6.35,cz:0, r:0.95, h:1.7, seg:16, col:RED};
// ---- 3D render ----
let yaw=Math.PI,pitch=-0.05,zoom=1,spin=true,W,H;
function resize(){W=cv.width=cv.clientWidth*devicePixelRatio;H=cv.height=cv.clientHeight*devicePixelRatio;}
addEventListener('resize',resize);resize();
function rot(p){let[x,y,z]=p;let co=Math.cos(yaw),si=Math.sin(yaw);let x1=x*co+z*si,z1=-x*si+z*co;let cp=Math.cos(pitch),sp=Math.sin(pitch);let y1=y*cp-z1*sp,z2=y*sp+z1*cp;return[x1,y1,z2];}
function proj(p){const f=560*zoom*devicePixelRatio;const d=12;const s=f/(d+p[2]);return[W/2+p[0]*s, H/2 - (p[1]-3.1)*s, p[2]];}
function shade(c,f){const r=parseInt(c.slice(1,3),16),g=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16);const k=Math.max(0,Math.min(1,f));return'rgb('+(r*k|0)+','+(g*k|0)+','+(b*k|0)+')';}
function faces(){
 const F=[];
 const lp=[0.4,0.9,0.5];const ll=Math.hypot(...lp);
 // box faces
 for(const bx of boxes){const[Cx,Cy,Cz,w,h,d,col]=bx;const hx=w/2,hy=h/2,hz=d/2;
  const v=[[Cx-hx,Cy-hy,Cz-hz],[Cx+hx,Cy-hy,Cz-hz],[Cx+hx,Cy+hy,Cz-hz],[Cx-hx,Cy+hy,Cz-hz],[Cx-hx,Cy-hy,Cz+hz],[Cx+hx,Cy-hy,Cz+hz],[Cx+hx,Cy+hy,Cz+hz],[Cx-hx,Cy+hy,Cz+hz]];
  const fc=[[0,1,2,3,[0,0,-1]],[5,4,7,6,[0,0,1]],[4,0,3,7,[-1,0,0]],[1,5,6,2,[1,0,0]],[3,2,6,7,[0,1,0]],[4,5,1,0,[0,-1,0]]];
  for(const f of fc){const n=f[4];const li=(n[0]*lp[0]+n[1]*lp[1]+n[2]*lp[2])/ll;const lit=0.55+0.45*Math.max(0,li);
   F.push({pts:[v[f[0]],v[f[1]],v[f[2]],v[f[3]]],col,lit});}
 }
 // cone (hat): side triangles + base
 const{cx:hcx,cy:hcy,cz:hcz,r,h,seg,col}=HAT;const apex=[hcx,hcy+h,hcz];
 for(let i=0;i<seg;i++){const a0=i/seg*2*Math.PI,a1=(i+1)/seg*2*Math.PI;
  const p0=[hcx+Math.cos(a0)*r,hcy,hcz+Math.sin(a0)*r],p1=[hcx+Math.cos(a1)*r,hcy,hcz+Math.sin(a1)*r];
  const mid=[(Math.cos(a0)+Math.cos(a1))/2,0.5,(Math.sin(a0)+Math.sin(a1))/2];const ml=Math.hypot(...mid);
  const li=(mid[0]*lp[0]+mid[1]*lp[1]+mid[2]*lp[2])/(ml*ll);const lit=0.5+0.5*Math.max(0,li);
  F.push({pts:[apex,p0,p1],col,lit});}
 return F;
}
function draw(){
 cx.clearRect(0,0,W,H);
 const F=faces().map(f=>{const r=f.pts.map(rot);const pr=r.map(proj);const z=r.reduce((s,p)=>s+p[2],0)/r.length;return{pr,z,col:f.col,lit:f.lit};});
 F.sort((a,b)=>b.z-a.z);
 for(const f of F){cx.beginPath();cx.moveTo(f.pr[0][0],f.pr[0][1]);for(let i=1;i<f.pr.length;i++)cx.lineTo(f.pr[i][0],f.pr[i][1]);cx.closePath();cx.fillStyle=shade(f.col,f.lit);cx.fill();}
}
function loop(){if(spin)yaw+=0.012;draw();requestAnimationFrame(loop);}
loop();
// drag + zoom
let drag=false,lx,ly;
cv.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;spin=false;document.getElementById('spin').textContent='▶ Spin';cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-lx)*0.01;pitch=Math.max(-1.2,Math.min(1.2,pitch+(e.clientY-ly)*0.01));lx=e.clientX;ly=e.clientY;});
cv.addEventListener('pointerup',()=>drag=false);
cv.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(0.4,Math.min(3,zoom*(e.deltaY<0?1.1:0.9)));},{passive:false});
document.getElementById('spin').onclick=function(){spin=!spin;this.textContent=spin?'⏸ Pause spin':'▶ Spin';};
// ---- STL export (binary) ----
function buildSTL(){
 const tris=[];
 function quad(a,b,c,d){tri(a,b,c);tri(a,c,d);}
 function tri(a,b,c){const u=[b[0]-a[0],b[1]-a[1],b[2]-a[2]],v=[c[0]-a[0],c[1]-a[1],c[2]-a[2]];let n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]];const l=Math.hypot(...n)||1;n=[n[0]/l,n[1]/l,n[2]/l];tris.push([n,a,b,c]);}
 for(const bx of boxes){const[Cx,Cy,Cz,w,h,d]=bx;const hx=w/2,hy=h/2,hz=d/2;
  const v=[[Cx-hx,Cy-hy,Cz-hz],[Cx+hx,Cy-hy,Cz-hz],[Cx+hx,Cy+hy,Cz-hz],[Cx-hx,Cy+hy,Cz-hz],[Cx-hx,Cy-hy,Cz+hz],[Cx+hx,Cy-hy,Cz+hz],[Cx+hx,Cy+hy,Cz+hz],[Cx-hx,Cy+hy,Cz+hz]];
  quad(v[0],v[3],v[2],v[1]);quad(v[4],v[5],v[6],v[7]);quad(v[0],v[4],v[7],v[3]);quad(v[1],v[2],v[6],v[5]);quad(v[3],v[7],v[6],v[2]);quad(v[0],v[1],v[5],v[4]);
 }
 const{cx:hcx,cy:hcy,cz:hcz,r,h,seg}=HAT;const apex=[hcx,hcy+h,hcz];const cpts=[];
 for(let i=0;i<seg;i++){const a=i/seg*2*Math.PI;cpts.push([hcx+Math.cos(a)*r,hcy,hcz+Math.sin(a)*r]);}
 for(let i=0;i<seg;i++){const p0=cpts[i],p1=cpts[(i+1)%seg];tri(apex,p0,p1);tri([hcx,hcy,hcz],p1,p0);}
 // binary STL
 const buf=new ArrayBuffer(84+tris.length*50);const dv=new DataView(buf);let o=84;dv.setUint32(80,tris.length,true);
 for(const t of tris){const[n,a,b,c]=t;const put=(p)=>{dv.setFloat32(o,p[0],true);dv.setFloat32(o+4,p[1],true);dv.setFloat32(o+8,p[2],true);o+=12;};put(n);put(a);put(b);put(c);dv.setUint16(o,0,true);o+=2;}
 return new Blob([buf],{type:'model/stl'});
}
document.getElementById('dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(buildSTL());a.download='my-explox-character.stl';a.click();};
</script></body></html>
